name: Temporary PASS KEY 1-C-3 cache bump

on:
  push:
    branches:
      - agent/passkey-1c3-member-admin

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passkey-1c3-member-admin
      - name: Bump admin RPC cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [Path('admin/index.html'), Path('m/admin/index.html')]
          old = 'kinojo-supabase-rpc.js?cache=2026081702'
          new = 'kinojo-supabase-rpc.js?cache=2026081703'
          for path in targets:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one old cache key, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html m/admin/index.html
          git diff --cached --check
          git commit -m 'PASS KEY 1-C-3: bump admin RPC cache'
          git push origin HEAD:agent/passkey-1c3-member-admin
