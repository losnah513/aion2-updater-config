<body class="kinojo-page-ranking">
<main class="ranking-wrap">
  <section class="ranking-hero">
    <div>
      <p class="ranking-kicker">KINOJO LEGION RANKING</p>
      <h1>레기온 전체 순위</h1>
      <p>서버가 계산한 PVE / PVP 순위를 좌우로 비교합니다. 웹은 계산하지 않고 결과만 표시합니다.</p>
    </div>
    <a class="kinojo-btn ranking-hof-link" href="../hof/">명예의 전당</a>
  </section>

  <section class="ranking-toolbar" aria-label="순위 검색 및 필터">
    <div class="ranking-mobile-filter-head"><span>검색 · 필터</span><button class="kinojo-btn secondary" id="rankingFilterToggleBtn" type="button" aria-expanded="false">필터</button></div>
    <div class="ranking-search-box">
      <label for="rankingSearch">캐릭터 검색</label>
      <input id="rankingSearch" class="kinojo-input" type="search" placeholder="캐릭터명 / 본캐명 / 서버 검색" autocomplete="off"/>
    </div>
    <div class="ranking-filter-box">
      <span class="ranking-filter-title">직업</span>
      <div class="ranking-class-tabs" id="rankingClassTabs"></div>
    </div>
    <div class="ranking-action-box">
      <label class="ranking-toggle"><input id="rankingIncludeSubs" type="checkbox"/> <span>부캐 포함</span></label>
      <button class="kinojo-btn" id="rankingSearchBtn" type="button">조회</button>
      <button class="kinojo-btn secondary" id="rankingResetBtn" type="button">초기화</button>
    </div>
  </section>

  <section class="ranking-status" id="rankingStatus">데이터 준비 중...</section>

  <section class="ranking-board" id="rankingBoard" aria-live="polite">
    <div class="ranking-loading"><span class="kinojo-spinner"><span></span></span><span>레기온 전체 순위를 불러오는 중...</span></div>
  </section>

  <section class="ranking-pager" aria-label="페이지 이동">
    <button class="kinojo-btn secondary" id="rankingPrevBtn" type="button">이전</button>
    <span id="rankingPageInfo">1 / 1</span>
    <button class="kinojo-btn secondary" id="rankingNextBtn" type="button">다음</button>
  </section>

  <footer class="footer common-footer"><div class="footer-links"><a href="../pages/about.html">사이트 소개</a><a href="../pages/terms.html">이용약관</a><a href="../pages/privacy.html">개인정보처리방침</a></div><div class="footer-powered">Powered by AION2 · 깡 레기온 지원</div></footer>
