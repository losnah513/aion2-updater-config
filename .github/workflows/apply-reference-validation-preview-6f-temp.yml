name: Apply Reference Validation Preview 6-F Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-reference-validation-preview-6f-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Patch validation and preview only
        shell: python
        run: |
          from pathlib import Path
          p=Path('ui/kinojo-common-ui.js')
          s=p.read_text()
          s=s.replace("const kinojoMyReferencePickerState={characterId:0,activeSlot:'',filesBySlot:Object.create(null)};","const kinojoMyReferencePickerState={characterId:0,activeSlot:'',filesBySlot:Object.create(null),previewUrlsBySlot:Object.create(null)};")
          old="""      const status=button.querySelector('[data-reference-file-status]');\n      if(status)status.textContent=file?'파일 선택됨':'이미지 선택';"""
          new="""      let preview=button.querySelector('[data-reference-preview]');\n      const previewUrl=String(kinojoMyReferencePickerState.previewUrlsBySlot[slot]||'');\n      if(previewUrl){\n        if(!preview){\n          preview=document.createElement('img');\n          preview.setAttribute('data-reference-preview','');\n          preview.className='kinojo-my-info-reference-preview-image';\n          button.prepend(preview);\n        }\n        preview.src=previewUrl;\n        preview.alt=slot+' 참고 이미지 로컬 미리보기';\n        preview.hidden=false;\n      }else if(preview){\n        preview.removeAttribute('src');\n        preview.hidden=true;\n      }\n      const status=button.querySelector('[data-reference-file-status]');\n      if(status)status.textContent=file?(String(file.type||'').replace('image/','').toUpperCase()+' · '+myInfoProfileFileSize_(file.size)):'이미지 선택';"""
          if old not in s: raise SystemExit('render target missing')
          s=s.replace(old,new,1)
          old="""    kinojoMyReferencePickerState.activeSlot='';\n    kinojoMyReferencePickerState.filesBySlot=Object.create(null);"""
          new="""    kinojoMyReferencePickerState.activeSlot='';\n    Object.values(kinojoMyReferencePickerState.previewUrlsBySlot||{}).forEach(url=>{\n      if(url){try{URL.revokeObjectURL(url);}catch(_err){}}\n    });\n    kinojoMyReferencePickerState.filesBySlot=Object.create(null);\n    kinojoMyReferencePickerState.previewUrlsBySlot=Object.create(null);"""
          if old not in s: raise SystemExit('reset target missing')
          s=s.replace(old,new,1)
          old="""    kinojoMyReferencePickerState.filesBySlot[slot]=file;\n    renderMyInfoReferencePicker_();\n    const name=String(file.name||'선택한 파일').slice(0,80);\n    setMyInfoReferenceStatus_(slot+' · '+name+' 파일을 선택했습니다. 파일 검증과 미리보기는 다음 단계에서 적용됩니다.','ready');\n    return true;"""
          new="""    const mime=String(file.type||'').trim().toLowerCase();\n    if(!KINOJO_PROFILE_IMAGE_MIME_TYPES.has(mime)){\n      setMyInfoReferenceStatus_(slot+' · JPEG, PNG, WebP 이미지만 선택할 수 있습니다.','error');\n      return false;\n    }\n    if(!Number.isFinite(file.size)||file.size<1||file.size>KINOJO_PROFILE_IMAGE_MAX_BYTES){\n      setMyInfoReferenceStatus_(slot+' · 참고 이미지는 5MB 이하만 선택할 수 있습니다.','error');\n      return false;\n    }\n    const oldUrl=String(kinojoMyReferencePickerState.previewUrlsBySlot[slot]||'');\n    if(oldUrl){try{URL.revokeObjectURL(oldUrl);}catch(_err){}}\n    const previewUrl=URL.createObjectURL(file);\n    kinojoMyReferencePickerState.filesBySlot[slot]=file;\n    kinojoMyReferencePickerState.previewUrlsBySlot[slot]=previewUrl;\n    renderMyInfoReferencePicker_();\n    const name=String(file.name||'선택한 파일').slice(0,80);\n    setMyInfoReferenceStatus_(slot+' · '+name+' · '+mime.replace('image/','').toUpperCase()+' · '+myInfoProfileFileSize_(file.size)+' 미리보기를 확인해 주세요.','preview');\n    return true;"""
          if old not in s: raise SystemExit('handle target missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('ui/kinojo-my-info.css')
          s=p.read_text()
          anchor=".kinojo-my-info-reference-slot.is-drag-over b,.kinojo-my-info-reference-slot.is-drag-over small{color:#1d4ed8}\n"
          extra="""/* 20260820_16: 6-F reference-image local validation/preview */\n.kinojo-my-info-reference-preview-image{width:100%;height:92px;display:block;object-fit:cover;border:1px solid rgba(122,146,180,.18);border-radius:8px;background:#eef2f7;margin-bottom:4px}\n.kinojo-my-info-reference-slot:has(.kinojo-my-info-reference-preview-image:not([hidden])){align-content:start}\n.kinojo-my-info-reference-status[data-state=\"error\"]{background:#fff1f2;color:#be123c}\n.kinojo-my-info-reference-status[data-state=\"preview\"]{background:#f0fdf4;color:#15803d}\n"""
          if anchor not in s: raise SystemExit('css anchor missing')
          s=s.replace(anchor,anchor+extra,1)
          p.write_text(s)
      - name: Static scope check
        shell: bash
        run: |
          grep -q "previewUrlsBySlot" ui/kinojo-common-ui.js
          grep -q "URL.createObjectURL(file)" ui/kinojo-common-ui.js
          grep -q "참고 이미지는 5MB 이하" ui/kinojo-common-ui.js
          grep -q "kinojo-my-info-reference-preview-image" ui/kinojo-my-info.css
          ! grep -q "reference-upload-prepare" <(git diff HEAD -- ui/kinojo-common-ui.js ui/kinojo-my-info.css)
          git diff --check
      - name: Commit product change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/kinojo-common-ui.js ui/kinojo-my-info.css
          git commit -m "Validate and preview reference images"
          git push origin HEAD:main
