name: Verify Character Refresh Stability
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/character-identity-recovery/**'
      - 'supabase/functions/character-refresh-worker/**'
      - 'supabase/functions/character-detail-refresh/**'
      - 'supabase/functions/lookup-list-*/**'
      - 'supabase/migrations/*character*.sql'
      - 'supabase/rollbacks/*character*.sql'
      - 'scripts/verify-character-refresh-stage2.cjs'
      - 'apps-script/list-master/**'
      - 'admin/**'
      - 'm/admin/**'
      - 'core/kinojo-supabase-features.js'
      - 'tests/**'
      - '.github/workflows/verify-character-refresh-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test runtime
        run: npm install --prefix .codex-test-runtime --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.8 playwright@1.62.1
      - name: Install browser
        run: .codex-test-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Run offline contracts and browser fixtures
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.codex-test-runtime/node_modules/playwright
        run: node scripts/verify-character-refresh-stage2.cjs --browser
      - name: Verify canonical release manifest
        run: node tests/character-refresh-release-manifest.test.cjs
