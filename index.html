<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="KINOJO INFO">
<meta property="og:description" content="키노조 정보 허브 - 성역 파티 확인과 명예의 전당">
<meta property="og:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-banner-v2.png?v=26060301">
<title>KINOJO INFO</title>
<style>
:root{
  --text:#263444;
  --muted:#667085;
  --line:#e5e7eb;
  --blue:#2563eb;
  --card-radius:2px;
  --button-radius:3px;
  --shadow:none;
}
*{
  box-sizing:border-box}
html,body{
  margin:0;
  min-height:100vh}
body{
  font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:var(--text);
  background:#fff}
body.drawer-open{
  overflow:hidden}
.wrap{
  width:min(1080px,100%);
  margin:0 auto;
  padding:18px 14px 40px}
.hero{
  padding:16px 8px 14px;
  text-align:center}
.eyebrow{
  display:inline-flex;
  gap:7px;
  align-items:center;
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:7px 12px;
  color:#475467;
  font-size:12px;
  font-weight:900;
  box-shadow:none}
.info-logo-slot{
  width:100%;
  min-height:86px;
  margin:12px auto 5px;
  display:flex;
  align-items:center;
  justify-content:center}
.info-logo-placeholder{
  width:min(520px,92%);
  height:86px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed #cfd6df;
  border-radius:var(--card-radius);
  background:#fff;
  color:#98a2b3;
  font-size:14px;
  font-weight:1000;
  letter-spacing:.08em;
  box-shadow:none}
.info-logo-img{
  display:block;
  max-width:min(520px,92%);
  max-height:86px;
  object-fit:contain}
.subtitle{
  margin:0 auto;
  color:var(--muted);
  font-size:15px;
  line-height:1.55;
  max-width:560px}
.hall-banner{
  display:block;
  width:60%;
  margin:14px auto 0;
  border-radius:var(--card-radius);
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:none;
  background:#fff;
  text-decoration:none;
  color:inherit;
  transition:.18s ease}
.hall-banner:hover{
  transform:translateY(-2px) scale(1.005);
  filter:brightness(1.04)}
.hall-banner img{
  display:block;
  width:100%;
  height:auto}
.sanctuary-row{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:16px;
  align-items:stretch;
  overflow:visible;
  padding-top:18px}
.card{
  position:relative;
  display:block;
  aspect-ratio:4/3;
  padding:18px;
  border:1px solid var(--line);
  border-radius:var(--card-radius);
  background:#fff;
  box-shadow:none;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
  transition:transform .38s cubic-bezier(.16,1,.3,1),border-color .28s ease,filter .28s ease}
.card.disabled{
  opacity:.72;
  cursor:not-allowed}
.icon{
  font-size:36px;
  margin-bottom:9px}
.card-title{
  font-size:23px;
  font-weight:1000;
  letter-spacing:-.6px}
.card-sub{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
  line-height:1.45}
.badge{
  position:absolute;
  right:14px;
  top:14px;
  z-index:8;
  border-radius:999px;
  padding:6px 10px;
  font-size:11px;
  font-weight:1000;
  background:rgba(255,255,255,.74);
  color:#d7caff;
  border:1px solid rgba(215,190,255,.42);
  backdrop-filter:blur(6px)}
.rudra-card{
  padding:0;
  isolation:isolate;
  cursor:pointer;
  border-color:rgba(137,118,178,.35);
  background:#070a12;
  color:#fff;
  overflow:visible;
  transform-origin:left bottom;
  z-index:2}
.rudra-card .badge{
  display:none}
.rudra-card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(180deg,rgba(8,10,18,0) 34%,rgba(8,8,14,.78) 72%,rgba(4,4,8,.96) 100%);
  z-index:6;
  pointer-events:none;
  clip-path:inset(0 round 2px)}
.rudra-card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  border:1px solid rgba(255,255,255,.18);
  z-index:11;
  pointer-events:none;
  transition:.28s ease;
  clip-path:inset(0 round 2px)}
.rudra-layer{
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  transition:opacity .34s ease,transform .42s cubic-bezier(.16,1,.3,1),filter .42s cubic-bezier(.16,1,.3,1)}
.rudra-bg{
  z-index:1;
  background:url("hall-of-fame/assets/sanctuary/rudra/rudra-bg.png") center/cover no-repeat;
  filter:brightness(.64) saturate(.88);
  opacity:1;
  clip-path:inset(0 round 2px)}
.rudra-boss{
  z-index:5;
  inset:0;
  background:url("hall-of-fame/assets/sanctuary/rudra/rudra-boss.png") center 34%/86% auto no-repeat;
  opacity:.78;
  filter:brightness(.74) saturate(.9) drop-shadow(0 10px 18px rgba(0,0,0,.42));
  transform:translate(0,0) scale(1);
  transform-origin:42% 82%}
.rudra-lightning-main{
  z-index:8;
  background:url("hall-of-fame/assets/sanctuary/rudra/rudra-lightning.png") 56% 25%/64% auto no-repeat;
  opacity:0;
  transform:rotate(-8deg) scale(1.08);
  mix-blend-mode:screen;
  filter:drop-shadow(0 0 18px rgba(184,110,255,.9))}
.rudra-lightning-right{
  z-index:9;
  background:url("hall-of-fame/assets/sanctuary/rudra/rudra-lightning-right.png") 76% 20%/72% auto no-repeat;
  opacity:0;
  transform:rotate(12deg) scale(1.18);
  mix-blend-mode:screen;
  filter:drop-shadow(0 0 14px rgba(180,98,255,.74))}
.rudra-content{
  position:absolute;
  left:16px;
  right:14px;
  bottom:13px;
  z-index:12;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:end;
  text-shadow:0 2px 12px rgba(0,0,0,.72)}
.rudra-title{
  font-size:24px;
  font-weight:1000;
  letter-spacing:-.8px;
  line-height:1;
  color:#fff}
.rudra-sub{
  margin-top:7px;
  font-size:14px;
  font-weight:900;
  color:rgba(255,255,255,.88)}
.rudra-enter{
  width:32px;
  height:32px;
  border-radius:var(--button-radius);
  display:grid;
  place-items:center;
  border:1px solid rgba(230,214,255,.52);
  background:rgba(20,14,38,.42);
  font-size:24px;
  color:#f5eaff;
  transition:.28s ease}
.rudra-card:hover,.rudra-card:focus-visible,.rudra-card:active{
  z-index:20;
  border-color:rgba(168,85,247,.62);
  box-shadow:none}
.rudra-card:hover::after,.rudra-card:focus-visible::after,.rudra-card:active::after{
  box-shadow:0 0 26px rgba(176,95,255,.74),inset 0 0 24px rgba(176,95,255,.25);
  border-color:rgba(216,190,255,.78)}
.rudra-card:hover .rudra-bg,.rudra-card:focus-visible .rudra-bg,.rudra-card:active .rudra-bg{
  filter:brightness(1.58) saturate(1.06) blur(.6px);
  transform:scale(1.025)}
.rudra-card:hover .rudra-boss,.rudra-card:focus-visible .rudra-boss,.rudra-card:active .rudra-boss{
  opacity:1;
  transform:translate(34px,-42px) scale(1.38);
  filter:brightness(1.13) saturate(1.14) drop-shadow(0 0 20px rgba(168,85,247,.62)) drop-shadow(0 22px 30px rgba(0,0,0,.5))}
.rudra-card:hover .rudra-lightning-main,.rudra-card:focus-visible .rudra-lightning-main,.rudra-card:active .rudra-lightning-main{
  animation:rudraStrikeMain .95s steps(2,end) infinite}
.rudra-card:hover .rudra-lightning-right,.rudra-card:focus-visible .rudra-lightning-right,.rudra-card:active .rudra-lightning-right{
  animation:rudraStrikeRight 1.24s steps(2,end) infinite}
.rudra-card:hover + .card,.rudra-card:focus-visible + .card,.rudra-card:active + .card{
  transform:translateX(14px)}
.rudra-card:hover + .card + .card,.rudra-card:focus-visible + .card + .card,.rudra-card:active + .card + .card{
  transform:translateX(8px)}
@keyframes rudraStrikeMain{
0%,16%,100%{
  opacity:0;
  filter:drop-shadow(0 0 0 rgba(204,142,255,0))}
18%,22%{
  opacity:.95;
  filter:drop-shadow(0 0 24px rgba(216,180,254,.98))}
28%,54%{
  opacity:.08}
58%,63%{
  opacity:.62;
  filter:drop-shadow(0 0 18px rgba(168,85,247,.82))}
}
@keyframes rudraStrikeRight{
0%,36%,100%{
  opacity:0}
38%,41%{
  opacity:.48;
  filter:drop-shadow(0 0 18px rgba(216,180,254,.88)) blur(.2px)}
46%,72%{
  opacity:.06}
76%,79%{
  opacity:.36}
}
.footer{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  margin-top:24px}
.footer button{
  appearance:none;
  border:0;
  background:transparent;
  color:#667085;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  padding:4px 2px;
  font-family:inherit;
  border-radius:var(--button-radius)}
.footer button:hover{
  color:var(--blue)}
.info-drawer-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px)}
.info-drawer-overlay.is-open{
  display:block}
.info-drawer{
  position:fixed;
  z-index:1001;
  left:0;
  top:0;
  width:min(460px,92vw);
  height:100dvh;
  background:#fff;
  border-right:1px solid var(--line);
  box-shadow:none;
  transform:translateX(-104%);
  transition:transform .28s ease;
  display:flex;
  flex-direction:column}
.info-drawer.is-open{
  transform:translateX(0)}
.info-drawer-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line)}
.info-drawer-title{
  margin:0;
  font-size:20px;
  font-weight:1000;
  letter-spacing:-.4px}
.info-drawer-close{
  appearance:none;
  border:1px solid var(--line);
  background:#fff;
  color:#475467;
  width:38px;
  height:38px;
  border-radius:var(--button-radius);
  cursor:pointer;
  font-size:22px;
  line-height:1}
.info-drawer-body{
  padding:18px;
  overflow:auto;
  line-height:1.7;
  color:#344054;
  font-size:14px}
.info-drawer-body h3{
  margin:18px 0 8px;
  font-size:16px}
.info-drawer-body h3:first-child{
  margin-top:0}
.info-drawer-body p{
  margin:0 0 12px}
.info-drawer-body ul{
  margin:0 0 12px;
  padding-left:19px}
.info-drawer-body li{
  margin:4px 0}
.construction-notice{
  position:fixed;
  inset:0;
  z-index:10040;
  display:grid;
  place-items:center;
  padding:18px;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:.28s ease}
.construction-notice.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto}
.construction-card{
  position:relative;
  width:min(360px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--card-radius);
  box-shadow:none;
  padding:22px 20px 18px;
  text-align:center}
.construction-kicker{
  color:#667085;
  font-size:12px;
  font-weight:1000;
  margin-bottom:8px}
.construction-card h2{
  margin:0;
  color:#263444;
  font-size:20px;
  letter-spacing:-.5px}
.construction-card p{
  margin:10px 0 16px;
  color:#667085;
  font-size:13px;
  line-height:1.45}
.construction-close{
  position:absolute;
  top:10px;
  right:10px;
  width:30px;
  height:30px;
  border:1px solid var(--line);
  background:#fff;
  color:#64748b;
  border-radius:var(--button-radius);
  cursor:pointer;
  font-size:18px;
  font-weight:1000}
.construction-ok{
  height:38px;
  min-width:96px;
  border:1px solid #d8ecd0;
  background:#f1f8ed;
  color:#2f6f3a;
  border-radius:var(--button-radius);
  font-weight:1000;
  cursor:pointer}
@media(max-width:900px){
.hall-banner{
  width:100%}
.sanctuary-row{
  grid-template-columns:1fr;
  padding-top:12px}
.rudra-card:hover + .card,.rudra-card:hover + .card + .card{
  transform:none}
.rudra-card:hover .rudra-boss,.rudra-card:focus-visible .rudra-boss,.rudra-card:active .rudra-boss{
  transform:translate(18px,-28px) scale(1.22)}
}
@media(max-width:720px){
.wrap{
  padding:12px 10px 32px}
.info-logo-slot{
  min-height:72px;
  margin-top:10px}
.info-logo-placeholder{
  height:72px;
  font-size:12px}
.info-logo-img{
  max-height:72px}
.card-title{
  font-size:21px}
.rudra-title{
  font-size:21px}
.rudra-sub{
  font-size:13px}
.rudra-boss{
  background-size:92% auto}
.rudra-lightning-main{
  background-size:56% auto}
.rudra-lightning-right{
  background-size:60% auto}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
  transition:none!important;
  animation:none!important}
}
/* KINOJO main visual-contract restore patch */
body,.card,.eyebrow,.hall-banner,.info-logo-placeholder,.info-drawer,.construction-card{
  background:#fff!important;
  box-shadow:none!important;
}
.card,.hall-banner,.info-logo-placeholder,.construction-card,.info-drawer-close,.construction-close,.construction-ok{
  border-radius:2px!important;
}
.card:hover:not(.disabled){
  transform:translateY(-2px);
  border-color:#cfd6df;
}
.rudra-card{
  clip-path:inset(0 -72px -1px 0 round 2px);
  overflow:visible!important;
}
.rudra-card::before,.rudra-card::after,.rudra-bg{
  clip-path:inset(0 0 0 0 round 2px)!important;
}
.rudra-card:hover::after,.rudra-card:focus-visible::after,.rudra-card:active::after{
  box-shadow:none!important;
}
.rudra-boss{
  background-position:46% 42%!important;
  background-size:92% auto!important;
  transform-origin:20% 100%!important;
  clip-path:inset(0 0 0 0 round 2px);
}
.rudra-card:hover .rudra-boss,.rudra-card:focus-visible .rudra-boss,.rudra-card:active .rudra-boss{
  transform:translate(58px,-66px) scale(1.72)!important;
  filter:brightness(1.16) saturate(1.18) drop-shadow(0 0 18px rgba(168,85,247,.42))!important;
}
.rudra-card:hover + .card,.rudra-card:focus-visible + .card,.rudra-card:active + .card{
  transform:translateX(18px)!important;
}
.rudra-card:hover + .card + .card,.rudra-card:focus-visible + .card + .card,.rudra-card:active + .card + .card{
  transform:translateX(10px)!important;
}
@media(max-width:900px){
  .rudra-card:hover .rudra-boss,.rudra-card:focus-visible .rudra-boss,.rudra-card:active .rudra-boss{
    transform:translate(34px,-42px) scale(1.36)!important;
  }
}


/* 260603 Rudra visibility correction: bigger, but clipped on left/bottom */
.rudra-card{
  overflow:hidden!important;
  clip-path:none!important;
}
.rudra-card .rudra-boss{
  background-position:58% 32%!important;
  background-size:92% auto!important;
  transform-origin:22% 90%!important;
  clip-path:inset(0 0 0 0 round 2px)!important;
}
.rudra-card:hover .rudra-boss,
.rudra-card:focus-visible .rudra-boss,
.rudra-card:active .rudra-boss{
  opacity:1!important;
  background-size:126% auto!important;
  background-position:78% 12%!important;
  transform:translate(20px,-34px) scale(1.08)!important;
}
.rudra-card:hover .rudra-lightning-main,
.rudra-card:focus-visible .rudra-lightning-main,
.rudra-card:active .rudra-lightning-main,
.rudra-card:hover .rudra-lightning-right,
.rudra-card:focus-visible .rudra-lightning-right,
.rudra-card:active .rudra-lightning-right{
  clip-path:inset(0 0 0 0 round 2px)!important;
}

</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">✨ AION2 · KINOJO PORTAL</div>
    <div class="info-logo-slot" aria-label="KINOJO INFO 로고 영역">
      <!-- 실제 로고 이미지가 준비되면 아래 placeholder를 img로 교체하세요.
      <img class="info-logo-img" src="assets/kinojo-info-logo.png" alt="KINOJO INFO">
      -->
      <div class="info-logo-placeholder">KINOJO INFO LOGO IMAGE</div>
    </div>
    <p class="subtitle">성역 파티 확인, 레기온 기록, 명예의 전당으로 이어지는 키노조 정보 허브입니다.</p>
    <a class="hall-banner" href="hall-of-fame/" aria-label="Hall of Fame 열기"><img src="hall-of-fame/assets/hall-banner-v2.png?v=26060301" alt="Kinojo Hall of Fame"></a>
  </section>
  <section class="sanctuary-row" aria-label="성역 파티 확인">
    <div class="card rudra-card" role="button" tabindex="0" aria-label="성역 1 루드라팟 파티 확인" data-construction="1성역 루드라팟">
      <span class="badge">준비중</span>
      <span class="rudra-layer rudra-bg" aria-hidden="true"></span>
      <span class="rudra-layer rudra-lightning-main" aria-hidden="true"></span>
      <span class="rudra-layer rudra-lightning-right" aria-hidden="true"></span>
      <span class="rudra-layer rudra-boss" aria-hidden="true"></span>
      <div class="rudra-content">
        <div>
          <div class="rudra-title">성역 1</div>
          <div class="rudra-sub">파티 확인</div>
        </div>
        <div class="rudra-enter">›</div>
      </div>
    </div>
    <div class="card disabled" role="button" aria-disabled="true"><span class="badge">준비중</span><div class="icon">⚔️</div><div class="card-title">성역 2</div><div class="card-sub">바고트팟 파티 확인</div></div>
    <div class="card disabled" role="button" aria-disabled="true"><span class="badge">준비중</span><div class="icon">🔮</div><div class="card-title">성역 3</div><div class="card-sub">칼드릭스팟 파티 확인</div></div>
  </section>
  <footer class="footer">
    <button type="button" data-drawer="about">사이트 소개</button>
    <button type="button" data-drawer="terms">이용약관</button>
    <button type="button" data-drawer="privacy">개인정보처리방침</button>
    <button type="button" data-drawer="contact">문의하기</button>
  </footer>
</main>

<div class="construction-notice" id="constructionNotice" aria-hidden="true">
  <div class="construction-card" role="dialog" aria-modal="false" aria-labelledby="constructionTitle">
    <button class="construction-close" id="constructionCloseBtn" type="button" aria-label="닫기">×</button>
    <div class="construction-kicker">KINOJO INFO</div>
    <h2 id="constructionTitle">페이지 인테리어 공사중입니다~</h2>
    <p id="constructionMessage">1성역 루드라팟 페이지는 인테리어 공사중입니다. 조금만 기다려 주세요.</p>
    <button class="construction-ok" id="constructionOkBtn" type="button">확인</button>
  </div>
</div>

<div class="info-drawer-overlay" data-drawer-close></div>
<aside class="info-drawer" aria-hidden="true" aria-labelledby="drawerTitle"><div class="info-drawer-head"><h2 class="info-drawer-title" id="drawerTitle">사이트 소개</h2><button type="button" class="info-drawer-close" data-drawer-close aria-label="닫기">×</button></div><div class="info-drawer-body" id="drawerBody"></div></aside>
<script>
const drawerContents={about:{title:"사이트 소개",html:`<h3>KINOJO INFO</h3><p>키노조 인포는 AION2 키노조 관련 정보를 한곳에서 확인하기 위한 정보 허브입니다.</p><p>성역 파티 확인, 레기온 기록, 명예의 전당 등 필요한 기능을 순차적으로 제공합니다.</p>`},terms:{title:"이용약관",html:`<h3>이용 안내</h3><p>본 사이트는 키노조 관련 정보를 편리하게 확인하기 위한 비공식 정보 페이지입니다.</p><ul><li>사이트 정보의 무단 변조 또는 악의적 사용을 금지합니다.</li><li>표시되는 데이터는 참고용이며 최종 판단은 이용자 본인에게 있습니다.</li><li>서비스 구조는 사전 안내 없이 변경될 수 있습니다.</li></ul>`},privacy:{title:"개인정보처리방침",html:`<h3>개인정보 처리 안내</h3><p>본 사이트는 기본적인 정보 확인 기능을 중심으로 운영되며, 불필요한 개인정보 수집을 지양합니다.</p><ul><li>입력 정보는 사이트 운영 및 문의 확인 목적에 한해 사용됩니다.</li><li>불필요한 민감정보 입력은 권장하지 않습니다.</li><li>정책은 기능 추가에 따라 갱신될 수 있습니다.</li></ul>`},contact:{title:"문의하기",html:`<h3>문의 안내</h3><p>오류 제보, 기능 제안, 데이터 수정 요청이 있다면 운영자에게 전달해주세요.</p><p>문의 기능은 추후 사이트 내부 기능으로 정리될 예정입니다.</p>`}};
const drawer=document.querySelector('.info-drawer');const overlay=document.querySelector('.info-drawer-overlay');const drawerTitle=document.querySelector('#drawerTitle');const drawerBody=document.querySelector('#drawerBody');function openDrawer(type){const c=drawerContents[type]||drawerContents.about;drawerTitle.textContent=c.title;drawerBody.innerHTML=c.html;document.body.classList.add('drawer-open');overlay.classList.add('is-open');drawer.classList.add('is-open');drawer.setAttribute('aria-hidden','false')}function closeDrawer(){document.body.classList.remove('drawer-open');overlay.classList.remove('is-open');drawer.classList.remove('is-open');drawer.setAttribute('aria-hidden','true')}document.querySelectorAll('[data-drawer]').forEach(btn=>btn.addEventListener('click',()=>openDrawer(btn.dataset.drawer)));document.querySelectorAll('[data-drawer-close]').forEach(btn=>btn.addEventListener('click',closeDrawer));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeConstructionNotice();}});
function openConstructionNotice(label){
  const notice=document.getElementById('constructionNotice');
  const message=document.getElementById('constructionMessage');
  if(message)message.textContent=(label?label+' 페이지는 ':'페이지는 ')+'인테리어 공사중입니다. 조금만 기다려 주세요.';
  if(notice){notice.classList.add('open');notice.setAttribute('aria-hidden','false')}
}
function closeConstructionNotice(){
  const notice=document.getElementById('constructionNotice');
  if(notice){notice.classList.remove('open');notice.setAttribute('aria-hidden','true')}
}
document.querySelectorAll('[data-construction]').forEach(el=>{
  el.addEventListener('click',e=>{e.preventDefault();openConstructionNotice(el.dataset.construction||'')});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openConstructionNotice(el.dataset.construction||'')}});
});
document.getElementById('constructionCloseBtn')?.addEventListener('click',closeConstructionNotice);
document.getElementById('constructionOkBtn')?.addEventListener('click',closeConstructionNotice);
document.getElementById('constructionNotice')?.addEventListener('click',e=>{if(e.target.id==='constructionNotice')closeConstructionNotice()});

</script>
</body>
</html>
