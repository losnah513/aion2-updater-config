name: Patch admin notification interaction

on:
  push:
    branches:
      - kinojo/admin-notification-interaction-20260823

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kinojo/admin-notification-interaction-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused interaction patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge_path = Path('ui/kinojo-admin-notifications.js')
          bridge = bridge_path.read_text(encoding='utf-8')
          bridge = bridge.replace('/* KINOJO administrator request notification bridge v20260823.02 */', '/* KINOJO administrator request notification bridge v20260823.03 */', 1)

          card_css = "+'.kinojo-admin-notification-card{position:relative;box-sizing:border-box;width:min(360px,calc(100vw - 28px));aspect-ratio:4/3;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;border:1px solid rgba(255,255,255,.19);border-radius:16px;background:radial-gradient(circle at 84% 13%,rgba(82,137,227,.28),transparent 34%),linear-gradient(145deg,#08182f 0%,#123b6d 55%,#1d2d62 100%);color:#fff;text-align:left;box-shadow:0 20px 56px rgba(4,15,35,.4);opacity:0;transform:translateY(22px) scale(.985);transition:opacity .24s ease,transform .24s ease;pointer-events:auto;cursor:pointer;outline:none}'"
          card_css_new = "+'.kinojo-admin-notification-card{position:relative;box-sizing:border-box;width:min(360px,calc(100vw - 28px));aspect-ratio:4/3;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;border:1px solid rgba(255,255,255,.19);border-radius:16px;background:radial-gradient(circle at 84% 13%,rgba(82,137,227,.28),transparent 34%),linear-gradient(145deg,#08182f 0%,#123b6d 55%,#1d2d62 100%);color:#fff;text-align:left;box-shadow:0 20px 56px rgba(4,15,35,.4);opacity:0;transform:translateY(22px) scale(.985);transition:opacity .24s ease,transform .24s ease,border-color .18s ease,box-shadow .18s ease,filter .12s ease;pointer-events:auto;cursor:pointer;outline:none}'"
          if card_css not in bridge:
              raise SystemExit('card CSS anchor missing')
          bridge = bridge.replace(card_css, card_css_new, 1)

          focus_css = "      +'.kinojo-admin-notification-card:focus-visible{box-shadow:0 0 0 3px rgba(147,197,253,.58),0 20px 56px rgba(4,15,35,.4)}'\n"
          interaction_css = focus_css + "      +'.kinojo-admin-notification-card:hover{border-color:rgba(96,165,250,.82);box-shadow:0 0 0 1px rgba(96,165,250,.24),0 0 24px rgba(59,130,246,.24),0 24px 64px rgba(4,15,35,.48)}'\n      +'.kinojo-admin-notification-card.is-pressing{border-color:rgba(147,197,253,.92);box-shadow:0 0 0 1px rgba(96,165,250,.34),0 10px 28px rgba(4,15,35,.44);transform:translateY(2px) scale(.972);filter:brightness(.94);transition-duration:.08s}'\n"
          if focus_css not in bridge:
              raise SystemExit('focus CSS anchor missing')
          bridge = bridge.replace(focus_css, interaction_css, 1)

          old_open = "    const open=()=>{if(item.href)location.href=item.href;};\n"
          new_open = "    const open=()=>{\n      if(!item.href||card.dataset.navigating==='1')return;\n      card.dataset.navigating='1';card.classList.add('is-pressing');\n      if(hideTimer){clearTimeout(hideTimer);hideTimer=0;}\n      setTimeout(()=>{location.href=item.href;},110);\n    };\n"
          if old_open not in bridge:
              raise SystemExit('open handler anchor missing')
          bridge = bridge.replace(old_open, new_open, 1)
          bridge_path.write_text(bridge, encoding='utf-8')

          auth_path = Path('core/kinojo-auth-ui.js')
          auth = auth_path.read_text(encoding='utf-8')
          if auth.count('kinojo-admin-notifications.js?cache=2026082302') != 1:
              raise SystemExit('unexpected bridge cache count in auth UI')
          auth_path.write_text(auth.replace('kinojo-admin-notifications.js?cache=2026082302', 'kinojo-admin-notifications.js?cache=2026082303'), encoding='utf-8')

          html_files = [
              'home.html','m/index.html','hof/index.html','m/hof/index.html','ranking/index.html','m/ranking/index.html',
              'sanctuary/index.html','m/sanctuary/index.html','sanctuary-schedule/index.html','m/sanctuary-schedule/index.html',
              'meter/index.html','m/meter/index.html','arcana/index.html','m/arcana/index.html','legion-tree/index.html','m/legion-tree/index.html',
              'admin/index.html','m/admin/index.html'
          ]
          for name in html_files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if text.count('kinojo-auth-ui.js?cache=2026082302') != 1:
                  raise SystemExit(f'{name}: unexpected auth cache count')
              p.write_text(text.replace('kinojo-auth-ui.js?cache=2026082302', 'kinojo-auth-ui.js?cache=2026082303'), encoding='utf-8')

          contract_path = Path('tests/admin-notification-contract.test.js')
          contract = contract_path.read_text(encoding='utf-8')
          contract = contract.replace('kinojo-admin-notifications.js?cache=2026082302', 'kinojo-admin-notifications.js?cache=2026082303')
          marker = "assert.ok(bridge.includes('@media(hover:none){.kinojo-admin-notification-link-hint{display:none}}'), 'touch-only layouts must not reserve hover hint UI');\n"
          if marker not in contract:
              raise SystemExit('contract marker missing')
          extra = marker + "assert.ok(bridge.includes('.kinojo-admin-notification-card:hover{border-color:rgba(96,165,250,.82)'), 'pointer hover must add a blue border highlight');\nassert.ok(bridge.includes('.kinojo-admin-notification-card.is-pressing'), 'card activation must expose a pressed-state animation class');\nassert.ok(bridge.includes(\"card.classList.add('is-pressing')\"), 'card activation must trigger the pressed-state animation before navigation');\nassert.ok(bridge.includes('setTimeout(()=>{location.href=item.href;},110)'), 'navigation must wait briefly so the press animation is visible');\n"
          contract_path.write_text(contract.replace(marker, extra, 1), encoding='utf-8')

          shell_path = Path('tests/web-shell-auth-contract.test.js')
          shell = shell_path.read_text(encoding='utf-8')
          if 'kinojo-auth-ui.js?cache=2026082302' not in shell:
              raise SystemExit('web shell auth cache marker missing')
          shell_path.write_text(shell.replace('kinojo-auth-ui.js?cache=2026082302', 'kinojo-auth-ui.js?cache=2026082303'), encoding='utf-8')
          PY
      - name: Verify focused patch
        shell: bash
        run: |
          node --check core/kinojo-auth-ui.js
          node --check ui/kinojo-admin-notifications.js
          node tests/admin-notification-contract.test.js
          node tests/web-shell-auth-contract.test.js
          git diff --check
          test "$(grep -RIl --include='*.html' 'kinojo-auth-ui.js?cache=2026082302' home.html m hof ranking sanctuary sanctuary-schedule meter arcana legion-tree admin 2>/dev/null | wc -l)" -eq 0
      - name: Commit product patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-admin-notification-interaction.yml
          git add core/kinojo-auth-ui.js ui/kinojo-admin-notifications.js tests/admin-notification-contract.test.js tests/web-shell-auth-contract.test.js home.html m/index.html hof/index.html m/hof/index.html ranking/index.html m/ranking/index.html sanctuary/index.html m/sanctuary/index.html sanctuary-schedule/index.html m/sanctuary-schedule/index.html meter/index.html m/meter/index.html arcana/index.html m/arcana/index.html legion-tree/index.html m/legion-tree/index.html admin/index.html m/admin/index.html
          git commit -m 'Add administrator notification interaction feedback'
          git push origin HEAD:kinojo/admin-notification-interaction-20260823
