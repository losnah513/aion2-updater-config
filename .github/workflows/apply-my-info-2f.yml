name: Apply My Info 2-F

on:
  push:
    branches: [main]
    paths:
      - "ui/.my-info-2f-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply server-canonical IL and combat power display
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old,new,1)

          js_path=Path('ui/kinojo-common-ui.js')
          js=js_path.read_text(encoding='utf-8')
          js=replace_once(js,
              "link.href='/ui/kinojo-my-info.css?cache=2026081904';",
              "link.href='/ui/kinojo-my-info.css?cache=2026081905';",
              'my info css cache')
          js=replace_once(js,
              "  function renderMyInfoCharacters_(data){\n",
              "  function myInfoStatNumber_(value){\n    const number=Number(value);\n    return Number.isFinite(number)&&number>0?Math.round(number).toLocaleString('ko-KR'):'-';\n  }\n  function renderMyInfoCharacters_(data){\n",
              'stat formatter')
          old='''      const isMain=row.isMain===true;
      const kind=isMain?'본캐':'부캐';
      const classIcon=classIconFor_(row.className);
      return '<article class="kinojo-my-info-character-row '+(isMain?'is-main':'is-alt')+'" data-character-id="'+characterId+'" data-server-id="'+(Number.isFinite(serverId)?serverId:'')+'" data-character-name="'+escapeHtml(characterName)+'" aria-label="'+escapeHtml(characterName+' · '+kind)+'">'
        +(classIcon?'<img class="kinojo-my-info-character-icon" src="'+escapeHtml(classIcon)+'" alt="" aria-hidden="true">':'<span class="kinojo-my-info-character-icon is-empty" aria-hidden="true"></span>')
        +'<span class="kinojo-my-info-character-kind">'+kind+'</span>'
        +'<strong class="kinojo-my-info-character-name">'+escapeHtml(characterName||'이름 없음')+'</strong>'
        +'</article>';
'''
          new='''      const isMain=row.isMain===true;
      const kind=isMain?'본캐':'부캐';
      const classIcon=classIconFor_(row.className);
      const itemLevel=myInfoStatNumber_(row.displayItemLevel);
      const combatPower=myInfoStatNumber_(row.displayCombatPower);
      const statBasis=String(row.displayStatBasis||data.displayStatBasis||'').trim();
      const statLabel=(statBasis?statBasis+' 기준 · ':'')+'아이템 레벨 '+itemLevel+' · 전투력 '+combatPower;
      return '<article class="kinojo-my-info-character-row '+(isMain?'is-main':'is-alt')+'" data-character-id="'+characterId+'" data-server-id="'+(Number.isFinite(serverId)?serverId:'')+'" data-character-name="'+escapeHtml(characterName)+'" aria-label="'+escapeHtml(characterName+' · '+kind+' · '+statLabel)+'">'
        +(classIcon?'<img class="kinojo-my-info-character-icon" src="'+escapeHtml(classIcon)+'" alt="" aria-hidden="true">':'<span class="kinojo-my-info-character-icon is-empty" aria-hidden="true"></span>')
        +'<span class="kinojo-my-info-character-identity"><span class="kinojo-my-info-character-kind">'+kind+'</span><strong class="kinojo-my-info-character-name">'+escapeHtml(characterName||'이름 없음')+'</strong></span>'
        +'<span class="kinojo-my-info-character-stats" title="'+escapeHtml(statLabel)+'">'
          +'<span class="kinojo-my-info-character-stat is-il"><i aria-hidden="true">IL</i><b>'+itemLevel+'</b></span>'
          +'<span class="kinojo-my-info-character-stat-sep" aria-hidden="true"></span>'
          +'<span class="kinojo-my-info-character-stat is-power"><i aria-hidden="true">✦</i><b>'+combatPower+'</b></span>'
        +'</span>'
        +'</article>';
'''
          js=replace_once(js,old,new,'character stats markup')
          js_path.write_text(js,encoding='utf-8')

          css_path=Path('ui/kinojo-my-info.css')
          css=css_path.read_text(encoding='utf-8')
          css=replace_once(css,'/* KINOJO My Info panel shell v20260819.05 */','/* KINOJO My Info panel shell v20260819.06 */','css version')
          old_css='''.kinojo-my-info-character-row{min-width:0;min-height:52px;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid rgba(122,146,180,.18);border-radius:12px;background:#fff;box-sizing:border-box}
.kinojo-my-info-character-row.is-main{border-left:3px solid #2563eb;background:linear-gradient(90deg,#f7fbff,#fff 28%)}
.kinojo-my-info-character-row.is-alt{border-left:3px solid #cbd5e1}
.kinojo-my-info-character-icon{flex:0 0 34px;width:34px;height:34px;display:block;object-fit:contain;border-radius:9px;background:#f8fafc}
.kinojo-my-info-character-icon.is-empty{border:1px dashed rgba(122,146,180,.22);box-sizing:border-box}
.kinojo-my-info-character-kind{flex:0 0 auto;min-width:34px;padding:4px 7px;border-radius:999px;background:#f1f5f9;color:#64748b;text-align:center;font-size:8px;font-weight:1000;line-height:1}
.kinojo-my-info-character-row.is-main .kinojo-my-info-character-kind{background:#eaf2ff;color:#2563eb}
.kinojo-my-info-character-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#17233a;font-size:12px;font-weight:950;line-height:1.25}
'''
          new_css='''.kinojo-my-info-character-row{min-width:0;min-height:58px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:9px;padding:9px 11px;border:1px solid rgba(122,146,180,.18);border-radius:12px;background:#fff;box-sizing:border-box}
.kinojo-my-info-character-row.is-main{border-left:3px solid #2563eb;background:linear-gradient(90deg,#f7fbff,#fff 28%)}
.kinojo-my-info-character-row.is-alt{border-left:3px solid #cbd5e1}
.kinojo-my-info-character-icon{width:34px;height:34px;display:block;object-fit:contain;border-radius:9px;background:#f8fafc}
.kinojo-my-info-character-icon.is-empty{border:1px dashed rgba(122,146,180,.22);box-sizing:border-box}
.kinojo-my-info-character-identity{min-width:0;display:grid;gap:5px;align-content:center}
.kinojo-my-info-character-kind{justify-self:start;min-width:28px;padding:3px 6px;border-radius:999px;background:#f1f5f9;color:#64748b;text-align:center;font-size:7px;font-weight:1000;line-height:1}
.kinojo-my-info-character-row.is-main .kinojo-my-info-character-kind{background:#eaf2ff;color:#2563eb}
.kinojo-my-info-character-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#17233a;font-size:12px;font-weight:950;line-height:1.2}
.kinojo-my-info-character-stats{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0;font-variant-numeric:tabular-nums}
.kinojo-my-info-character-stat{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:#334155}
.kinojo-my-info-character-stat i{width:18px;height:18px;display:grid;place-items:center;border-radius:6px;font-style:normal;font-size:7px;font-weight:1000;line-height:1}
.kinojo-my-info-character-stat b{font-size:10px;font-weight:950;line-height:1}
.kinojo-my-info-character-stat.is-il i{background:#fff7ed;color:#c2410c}
.kinojo-my-info-character-stat.is-il b{color:#9a3412}
.kinojo-my-info-character-stat.is-power i{background:#eff6ff;color:#2563eb;font-size:10px}
.kinojo-my-info-character-stat.is-power b{color:#1d4ed8}
.kinojo-my-info-character-stat-sep{width:1px;height:18px;background:rgba(122,146,180,.22)}
@media(max-width:380px){
  .kinojo-my-info-character-row{grid-template-columns:32px minmax(0,1fr);gap:8px}
  .kinojo-my-info-character-icon{width:32px;height:32px}
  .kinojo-my-info-character-stats{grid-column:2;justify-content:flex-start;margin-top:-1px}
}
'''
          css=replace_once(css,old_css,new_css,'character row stats css')
          css_path.write_text(css,encoding='utf-8')
          PY

      - name: Validate 2-F contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/kinojo-common-ui.js
          grep -q 'row.displayItemLevel' ui/kinojo-common-ui.js
          grep -q 'row.displayCombatPower' ui/kinojo-common-ui.js
          ! grep -q 'row.latestPveItemLevel' ui/kinojo-common-ui.js
          ! grep -q 'row.latestPveCombatPower' ui/kinojo-common-ui.js
          grep -q 'kinojo-my-info-character-stats' ui/kinojo-my-info.css
          python3 <<'PY'
          from pathlib import Path
          css=Path('ui/kinojo-my-info.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace mismatch')
          PY
          node tests/web-shell-auth-contract.test.js
          git diff --check

      - name: Commit product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add ui/kinojo-common-ui.js ui/kinojo-my-info.css
          git commit -m "Show My Info item level and combat power"
          git push origin main
