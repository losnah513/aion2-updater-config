<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta property="og:title" content="Kinojo 명예의 전당">
<meta property="og:description" content="전투력과 성장 기록으로 선정된 최고의 모험가들">
<meta property="og:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg">
  <title>Kinojo 명예의 전당</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: rgba(13, 18, 28, .92);
      --card: rgba(30, 41, 59, .76);
      --line: rgba(125, 211, 252, .20);
      --text: #eaf6ff;
      --muted: #94a3b8;
      --cyan: #67e8f9;
      --blue: #60a5fa;
      --violet: #a78bfa;
      --pink: #f472b6;
      --gold: #facc15;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(34,211,238,.18), transparent 32%),
        radial-gradient(circle at 80% 10%, rgba(167,139,250,.18), transparent 34%),
        linear-gradient(180deg, #0f172a, var(--bg));
      color: var(--text);
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .wrap {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 20px 14px 36px;
    }

    .hero {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 18px 0 12px;
      backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(7,11,18,.94), rgba(7,11,18,.70));
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 44px);
      letter-spacing: -1px;
      line-height: 1.04;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(103,232,249,.35);
      background: rgba(15,23,42,.72);
      color: #dffbff;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .sub {
      margin: 0;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.45;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 14px;
    }

    .search, .refresh {
      border: 1px solid rgba(125,211,252,.25);
      background: rgba(15,23,42,.78);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
    }

    .refresh {
      cursor: pointer;
      font-weight: 900;
      background: linear-gradient(135deg, rgba(20,115,255,.80), rgba(124,58,237,.78));
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .section {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,.28);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: linear-gradient(90deg, rgba(38,119,173,.32), rgba(93,44,151,.18));
    }

    .section h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -.2px;
    }

    .section-note {
      color: #cbd5e1;
      font-size: 11px;
      white-space: nowrap;
    }

    .list {
      padding: 8px;
      display: grid;
      gap: 7px;
    }

    .rank-card {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(148,163,184,.14);
      border-radius: 14px;
      background: var(--card);
      min-height: 58px;
    }

    .rank {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: rgba(255,255,255,.08);
      font-weight: 1000;
      color: var(--cyan);
    }

    .rank.gold { color: #111827; background: linear-gradient(135deg, #fde68a, #facc15); }
    .rank.silver { color: #111827; background: linear-gradient(135deg, #e5e7eb, #94a3b8); }
    .rank.bronze { color: #111827; background: linear-gradient(135deg, #fdba74, #c2410c); }

    .name {
      font-size: 15px;
      font-weight: 1000;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score {
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .empty {
      color: var(--muted);
      padding: 18px 12px;
      text-align: center;
      font-size: 13px;
    }

    .full { grid-column: 1 / -1; }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .loading {
      display: grid;
      place-items: center;
      min-height: 260px;
      color: #dbeafe;
      font-weight: 900;
    }

    .error {
      border: 1px solid rgba(248,113,113,.35);
      background: rgba(127,29,29,.22);
      color: #fecaca;
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
      line-height: 1.5;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .wrap { padding: 12px 10px 28px; }
      .hero { padding-top: 12px; }
      .grid { grid-template-columns: 1fr; gap: 10px; }
      .toolbar { grid-template-columns: 1fr; }
      .refresh { width: 100%; }
      .rank-card { grid-template-columns: 36px 1fr; }
      .score { grid-column: 2; text-align: left; margin-top: -2px; }
      .section-note { display: none; }
    }
  
    .loading {
      display: grid;
      place-items: center;
      min-height: 300px;
      color: #dbeafe;
      font-weight: 900;
    }

    .kinojo-loader {
      display: grid;
      place-items: center;
      gap: 14px;
      text-align: center;
      padding: 30px 14px;
    }

    .kinojo-loader-ring {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      position: relative;
      background:
        conic-gradient(from 0deg, #67e8f9, #3b82f6, #a78bfa, #ec4899, #67e8f9);
      animation: kinojoHallSpin 1.05s linear infinite;
      box-shadow:
        0 0 18px rgba(34, 211, 238, .45),
        0 0 28px rgba(168, 85, 247, .32);
    }

    .kinojo-loader-ring::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: #070b12;
      box-shadow: inset 0 0 18px rgba(15, 23, 42, .9);
    }

    .kinojo-loader-ring::after {
      content: "🏆";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 26px;
      animation: kinojoHallCounterSpin 1.05s linear infinite;
    }

    .kinojo-loader-title {
      font-size: 15px;
      color: #eaf6ff;
      font-weight: 1000;
    }

    .kinojo-loader-sub {
      margin-top: 4px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
    }

    .kinojo-loader-dots::after {
      content: "";
      animation: kinojoDots 1.25s steps(4, end) infinite;
    }

    @keyframes kinojoHallSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes kinojoHallCounterSpin {
      to { transform: rotate(-360deg); }
    }

    @keyframes kinojoDots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
      100% { content: ""; }
    }

  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="title-row">
        <h1>🏆 Kinojo 명예의 전당</h1>
        <div class="badge" id="updatedBadge">불러오는 중</div>
      </div>
      <p class="sub">전투력, 성장 기록, 서버 분류를 기준으로 자동 집계되는 키노조 전용 랭킹 페이지입니다.</p>
      <div class="toolbar">
        <input class="search" id="searchInput" placeholder="캐릭터명 / 서버 / 부문 검색" />
        <button class="refresh" id="refreshBtn">새로고침</button>
        <button class="refresh" id="suggestBtn" type="button">새 항목 제안</button>
      </div>
    </header>

    <section class="section full" id="suggestionBox" style="display:none; margin-top:14px;">
      <div class="section-head">
        <h2>➕ 새로운 항목 제안하기</h2>
        <span class="section-note">운영자 검토 후 반영</span>
      </div>
      <div class="list">
        <input class="search" id="suggestTitle" placeholder="항목 이름 예: 성장왕, 결투왕" />
        <input class="search" id="suggestProposer" placeholder="제안자 이름 또는 캐릭터명" />
        <textarea class="search" id="suggestMemo" rows="3" placeholder="어떤 기준으로 뽑으면 좋을지 적어주세요."></textarea>
        <button class="refresh" id="submitSuggestBtn" type="button">제안 보내기</button>
      </div>
    </section>

    <div id="app" class="loading">
      <div class="kinojo-loader">
        <div class="kinojo-loader-ring"></div>
        <div>
          <div class="kinojo-loader-title">명예의 전당 데이터를 불러오는 중<span class="kinojo-loader-dots"></span></div>
          <div class="kinojo-loader-sub">전투력 · 성장 기록 · 서버 정보를 정리하고 있어요</div>
        </div>
      </div>
    </div>

    <footer class="footer">
      Kinojo Hall of Fame · 모바일 최적화 페이지
    </footer>
  </main>

  <script>
    const WEB_APP_URL = new URLSearchParams(location.search).get("api")
      || "https://script.google.com/macros/s/AKfycbztXbGEbiId1yOfa3CVmErivNVi5IUi64qxIQRf8Sm_KduCPieeAKlNRMGyYkKL5iPaYg/exec";

    const SECTION_ORDER = [
      ["pveTop", "🛡 PVE 전투력 TOP 3", "PVE 기준 상위 3명"],
      ["pvpTop", "⚔ PVP 전투력 TOP 3", "PVP 기준 상위 3명"],
      ["attendance", "📅 개근상", "1주일 이상 꾸준히 성장"],
      ["amexBlack", "💳 아맥스 블랙회원", "단기간 급상승 캐릭터"],
      ["demonFamily", "😈 같은 마족이면 가족이지", "타서버 마족 캐릭터"],
      ["partyFriend", "🤝 같은 파티면 친구지", "천족 서버 캐릭터"]
    ];

    let hallData = null;
    let keyword = "";

    const app = document.getElementById("app");
    const updatedBadge = document.getElementById("updatedBadge");
    const searchInput = document.getElementById("searchInput");
    const refreshBtn = document.getElementById("refreshBtn");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatNumber(value) {
      const n = Number(value || 0);
      if (!Number.isFinite(n)) return escapeHtml(value || "");
      return n.toLocaleString("ko-KR");
    }

    function rankClass(index) {
      if (index === 0) return "gold";
      if (index === 1) return "silver";
      if (index === 2) return "bronze";
      return "";
    }

    function matchItem(item) {
      if (!keyword) return true;
      const target = [
        item.name,
        item.server,
        item.faction,
        item.memo,
        item.category,
        item.value
      ].join(" ").toLowerCase();
      return target.includes(keyword.toLowerCase());
    }

    function card(item, index) {
      return `
        <article class="rank-card">
          <div class="rank ${rankClass(index)}">${index + 1}</div>
          <div>
            <div class="name">${escapeHtml(item.name || "-")}</div>
            <div class="meta">${escapeHtml([item.server, item.faction, item.memo].filter(Boolean).join(" · ") || item.category || "")}</div>
          </div>
          <div class="score">${escapeHtml(item.label || formatNumber(item.value))}</div>
        </article>
      `;
    }

    function section(key, title, note) {
      const list = (hallData && hallData[key] ? hallData[key] : []).filter(matchItem);
      return `
        <section class="section">
          <div class="section-head">
            <h2>${title}</h2>
            <span class="section-note">${note}</span>
          </div>
          <div class="list">
            ${list.length ? list.map(card).join("") : `<div class="empty">아직 데이터가 부족해요.</div>`}
          </div>
        </section>
      `;
    }

    function render() {
      if (!hallData) return;
      updatedBadge.textContent = hallData.updatedAt ? `업데이트 ${hallData.updatedAt}` : "업데이트 정보 없음";
      app.className = "grid";
      const recentSuggestions = (hallData.suggestions || []).length
        ? `<section class="section full">
            <div class="section-head">
              <h2>📋 최근 제안</h2>
              <span class="section-note">운영자 검토중</span>
            </div>
            <div class="list">
              ${(hallData.suggestions || []).map((item, index) => `
                <article class="rank-card">
                  <div class="rank">${index + 1}</div>
                  <div>
                    <div class="name">${escapeHtml(item.title || "-")}</div>
                    <div class="meta">${escapeHtml([item.proposer, item.memo, item.status].filter(Boolean).join(" · "))}</div>
                  </div>
                  <div class="score">${escapeHtml(item.createdAt || "")}</div>
                </article>
              `).join("")}
            </div>
          </section>`
        : "";

      app.innerHTML = SECTION_ORDER.map(([key, title, note]) => section(key, title, note)).join("") + recentSuggestions;
    }

    async function load() {
      app.className = "loading";
      app.innerHTML = `
        <div class="kinojo-loader">
          <div class="kinojo-loader-ring"></div>
          <div>
            <div class="kinojo-loader-title">명예의 전당 데이터를 불러오는 중<span class="kinojo-loader-dots"></span></div>
            <div class="kinojo-loader-sub">전투력 · 성장 기록 · 서버 정보를 정리하고 있어요</div>
          </div>
        </div>
      `;
      try {
        const url = `${WEB_APP_URL}${WEB_APP_URL.includes("?") ? "&" : "?"}action=hallOfFame&t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        const text = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 120)}`);
        hallData = JSON.parse(text);
        render();
      } catch (err) {
        app.className = "";
        app.innerHTML = `
          <div class="error">
            <strong>명예의 전당 데이터를 불러오지 못했습니다.</strong><br />
            Apps Script 배포 URL 또는 CORS 설정을 확인해 주세요.<br />
            <small>${escapeHtml(err.message || err)}</small>
          </div>
        `;
      }
    }

    searchInput.addEventListener("input", e => {
      keyword = e.target.value.trim();
      render();
    });

    refreshBtn.addEventListener("click", load);

    const suggestBtn = document.getElementById("suggestBtn");
    const suggestionBox = document.getElementById("suggestionBox");
    const submitSuggestBtn = document.getElementById("submitSuggestBtn");

    if (suggestBtn && suggestionBox) {
      suggestBtn.addEventListener("click", () => {
        suggestionBox.style.display = suggestionBox.style.display === "none" ? "block" : "none";
      });
    }

    if (submitSuggestBtn) {
      submitSuggestBtn.addEventListener("click", async () => {
        const title = document.getElementById("suggestTitle").value.trim();
        const proposer = document.getElementById("suggestProposer").value.trim();
        const memo = document.getElementById("suggestMemo").value.trim();

        if (!title) {
          alert("항목 이름을 입력해 주세요.");
          return;
        }

        submitSuggestBtn.disabled = true;
        submitSuggestBtn.textContent = "전송 중...";

        try {
          const res = await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "hallSuggestion",
              title,
              proposer,
              memo
            })
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.message || "전송 실패");
          alert("제안이 접수되었습니다.");
          document.getElementById("suggestTitle").value = "";
          document.getElementById("suggestMemo").value = "";
          await load();
        } catch (err) {
          alert("제안 전송에 실패했습니다: " + (err.message || err));
        } finally {
          submitSuggestBtn.disabled = false;
          submitSuggestBtn.textContent = "제안 보내기";
        }
      });
    }

    load();
  </script>
</body>
</html>
