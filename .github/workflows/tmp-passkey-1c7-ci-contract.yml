name: Temporary PASS KEY 1-C-7 CI contract fix

on:
  push:
    branches:
      - agent/passkey-1c7-session-only-web

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passkey-1c7-session-only-web
      - name: Preserve Meter cache contract with auth bust
        run: |
          python - <<'PY'
          from pathlib import Path
          old='meter-app.js?cache=2026081801'
          new='meter-app.js?cache=2026081502-50040&auth=2026081801'
          for name in ['meter/index.html','m/meter/index.html','tests/meter-presence-log-contract.test.js']:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'{name}: Meter cache anchor count={text.count(old)}')
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='')
          PY
          node tests/meter-presence-log-contract.test.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meter/index.html m/meter/index.html tests/meter-presence-log-contract.test.js
          git commit -m 'PASS KEY 1-C-7: preserve Meter cache contract with auth bust'
          git push origin HEAD:agent/passkey-1c7-session-only-web
