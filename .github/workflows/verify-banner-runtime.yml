name: Verify Banner Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "ui/kinojo-banner-runtime.js"
      - "tests/banner-manifest-client-contract.test.js"
      - ".github/workflows/verify-banner-runtime.yml"
  push:
    branches: [main]
    paths:
      - "ui/kinojo-banner-runtime.js"
      - "tests/banner-manifest-client-contract.test.js"
      - ".github/workflows/verify-banner-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-banner-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify Manifest client contract
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/kinojo-banner-runtime.js
          node tests/banner-manifest-client-contract.test.js

  verify-live-readback:
    if: github.event_name == 'push'
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_BASE: https://kinojo.info
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish live readback pending status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-runtime-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "kinojo/banner-runtime-live-readback",
              "description": "배너 Manifest client 운영 확인 중",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-runtime-status.json >/dev/null

      - name: Verify runtime byte readback
        shell: bash
        run: |
          set -euo pipefail
          path="ui/kinojo-banner-runtime.js"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          key="${GITHUB_SHA:0:12}-$(date -u +%s)"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --compressed \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' "$LIVE_BASE/$path?verify=$key-$attempt" -o "$tmp" \
              && cmp -s "$path" "$tmp"; then
              echo "MATCH $path"
              exit 0
            fi
            echo "WAIT $path attempt=$attempt"
            [[ "$attempt" -lt 15 ]] && sleep 20
          done
          echo "Banner runtime live readback did not converge to main source." >&2
          exit 1

      - name: Verify live Manifest ETag client flow
        shell: bash
        env:
          KINOJO_BANNER_LIVE: "1"
        run: |
          set -euo pipefail
          node tests/banner-manifest-client-contract.test.js

      - name: Publish live readback success status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-runtime-status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "kinojo/banner-runtime-live-readback",
              "description": "Manifest client 배포·GET·ETag/304 확인 완료",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-runtime-status.json >/dev/null

      - name: Publish live readback failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-runtime-status.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": "kinojo/banner-runtime-live-readback",
              "description": "Manifest client 운영 readback 실패",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-runtime-status.json >/dev/null
