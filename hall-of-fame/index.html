<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="전투력과 성장 기록으로 선정된 최고의 모험가들"><meta property="og:title" content="Kinojo 명예의 전당"><meta property="og:description" content="전투력과 성장 기록으로 선정된 최고의 모험가들"><meta property="og:type" content="website"><meta property="og:url" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/"><meta property="og:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg?v=3"><meta property="og:image:secure_url" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg?v=3"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="852"><meta property="og:image:height" content="480"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Kinojo 명예의 전당"><meta name="twitter:description" content="전투력과 성장 기록으로 선정된 최고의 모험가들"><meta name="twitter:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg?v=3"><title>Kinojo 명예의 전당</title>
<style>:root{color-scheme:dark;--bg:#070b12;--panel:rgba(13,18,28,.92);--card:rgba(30,41,59,.78);--line:rgba(125,211,252,.22);--text:#eaf6ff;--muted:#94a3b8;--cyan:#67e8f9;--gold:#facc15}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,rgba(34,211,238,.16),transparent 34%),radial-gradient(circle at 92% 4%,rgba(167,139,250,.18),transparent 34%),linear-gradient(180deg,#0f172a,var(--bg));color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{width:min(1180px,100%);margin:0 auto;padding:12px 10px 34px}.hero{min-height:158px;border:1px solid rgba(250,204,21,.20);border-radius:22px;background:linear-gradient(180deg,rgba(7,11,18,.04),rgba(7,11,18,.86)),url("https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg") center/cover no-repeat;box-shadow:0 16px 42px rgba(0,0,0,.34);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,11,18,.72),rgba(7,11,18,.20),rgba(7,11,18,.76));pointer-events:none}.hero-content{position:relative;z-index:1;width:100%}.hero-kicker{display:inline-flex;padding:5px 9px;border:1px solid rgba(103,232,249,.28);border-radius:999px;background:rgba(15,23,42,.70);color:#dffbff;font-size:11px;font-weight:900;margin-bottom:7px}h1{margin:0;font-size:clamp(24px,6vw,46px);line-height:1;letter-spacing:-1px;text-shadow:0 2px 14px rgba(0,0,0,.60)}.gold{color:var(--gold)}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:10px}.search,.btn{min-height:34px;border:1px solid rgba(125,211,252,.25);background:rgba(15,23,42,.78);color:var(--text);border-radius:10px;padding:8px 10px;font-size:13px;outline:none}.btn{cursor:pointer;font-weight:900;background:linear-gradient(135deg,rgba(20,115,255,.82),rgba(124,58,237,.80))}.updated{margin-top:8px;color:var(--muted);font-size:11px;font-weight:800}.chick-banner{margin-top:10px;display:none;border:1px solid rgba(250,204,21,.30);background:linear-gradient(135deg,rgba(250,204,21,.16),rgba(34,211,238,.08));border-radius:16px;padding:10px 12px;cursor:pointer}.chick-title{font-size:14px;font-weight:1000;color:#fff7cc}.chick-names{margin-top:4px;color:#fef3c7;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.full{grid-column:1/-1}.section{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.28)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.07);background:linear-gradient(90deg,rgba(38,119,173,.28),rgba(93,44,151,.14))}.section h2{margin:0;font-size:15px;letter-spacing:-.2px}.section-note{color:#cbd5e1;font-size:11px;white-space:nowrap}.list{padding:8px;display:grid;gap:7px}.rank-row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;min-height:44px;padding:8px;border:1px solid rgba(148,163,184,.14);border-radius:13px;background:rgba(30,41,59,.68)}.rank-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.08);font-weight:1000;font-size:15px}.rname{min-width:0;font-size:14px;font-weight:1000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rmeta{margin-top:2px;color:var(--muted);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{color:#e0f2fe;font-size:13px;font-weight:1000;white-space:nowrap;text-align:right}.review{grid-column:2/4;margin-top:-2px;color:#dbeafe;font-size:11.5px;line-height:1.35;border-left:2px solid rgba(103,232,249,.35);padding-left:7px}.tag-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:10px}.name-tag{display:grid;gap:2px;justify-content:center;align-items:center;min-width:0;padding:8px 6px;border-radius:12px;background:rgba(15,23,42,.78);border:1px solid rgba(125,211,252,.24);text-align:center;font-weight:900;font-size:12px}.tag-meta{color:var(--muted);font-size:10px;font-weight:700}.empty{padding:12px 10px;text-align:center;color:var(--muted);font-size:12px}.controls{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid rgba(255,255,255,.07)}.pill{border:1px solid rgba(125,211,252,.25);background:rgba(15,23,42,.78);color:var(--text);border-radius:999px;padding:7px 9px;font-size:12px;font-weight:900;cursor:pointer}.pill.active{background:linear-gradient(135deg,rgba(20,115,255,.82),rgba(124,58,237,.80));border-color:rgba(250,204,21,.25)}.loading{margin-top:10px;min-height:220px;display:grid;place-items:center;color:#dbeafe;font-weight:900}.loader-ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(from 0deg,#67e8f9,#3b82f6,#a78bfa,#ec4899,#67e8f9);animation:spin 1.05s linear infinite;position:relative;margin:0 auto 12px;box-shadow:0 0 18px rgba(34,211,238,.32)}.loader-ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#070b12}.loader-ring:after{content:"🏆";position:absolute;inset:0;display:grid;place-items:center;animation:counterSpin 1.05s linear infinite;font-size:21px}.error{margin-top:10px;border:1px solid rgba(248,113,113,.35);background:rgba(127,29,29,.22);color:#fecaca;border-radius:14px;padding:14px;line-height:1.5;font-size:13px}.footer{margin-top:14px;text-align:center;color:var(--muted);font-size:11px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes counterSpin{to{transform:rotate(-360deg)}}@media(max-width:760px){.wrap{padding:9px 8px 28px}.hero{min-height:145px;padding:12px;border-radius:18px}.btn{font-size:0;width:36px;padding:8px 0}#refreshBtn:before{content:"🔄";font-size:16px}#suggestBtn:before{content:"➕";font-size:16px}.grid{grid-template-columns:1fr;gap:8px}.section-head{padding:8px 10px}.section h2{font-size:14px}.section-note{display:none}}</style></head><body><main class="wrap"><section class="hero"><div class="hero-content"><div class="hero-kicker">Kinojo Analytics</div><h1>KINOJO<br><span class="gold">HALL OF FAME</span></h1><div class="toolbar"><input class="search" id="searchInput" placeholder="캐릭터명 / 서버 / 직업 검색" /><button class="btn" id="refreshBtn" type="button">새로고침</button><button class="btn" id="suggestBtn" type="button">항목제안</button></div><div class="updated" id="updatedBadge">불러오는 중</div></div></section><section class="chick-banner" id="chickBanner"><div class="chick-title" id="chickTitle">🐣 신입 병아리</div><div class="chick-names" id="chickNames"></div></section><section class="section full" id="suggestionBox" style="display:none;margin-top:10px"><div class="section-head"><h2>➕ 새로운 항목 제안하기</h2><span class="section-note">운영자 검토 후 반영</span></div><div class="list"><input class="search" id="suggestTitle" placeholder="항목 이름 예: 성장왕, 결투왕" /><input class="search" id="suggestProposer" placeholder="제안자 이름 또는 캐릭터명" /><textarea class="search" id="suggestMemo" rows="3" placeholder="어떤 기준으로 뽑으면 좋을지 적어주세요."></textarea><button class="btn" id="submitSuggestBtn" type="button">제안 보내기</button></div></section><div id="app" class="loading"><div><div class="loader-ring"></div><div>명예의 전당 데이터를 불러오는 중...</div></div></div><footer class="footer">Kinojo Hall of Fame</footer></main><script>
const WEB_APP_URL=new URLSearchParams(location.search).get("api")||"https://script.google.com/macros/s/AKfycbztXbGEbiId1yOfa3CVmErivNVi5IUi64qxIQRf8Sm_KduCPieeAKlNRMGyYkKL5iPaYg/exec";const CLASS_ORDER=["전체","검성","수호성","살성","궁성","정령성","마도성","치유성","호법성","한손검성","미분류"];let hallData=null,keyword="",overallMode="main",classMode="main",activeClass="전체";const app=document.getElementById("app"),updatedBadge=document.getElementById("updatedBadge"),searchInput=document.getElementById("searchInput");function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}function matchItem(i){if(!keyword)return true;const t=[i.name,i.serverName,i.faction,i.meta,i.className,i.review,i.category].join(" ").toLowerCase();return t.includes(keyword.toLowerCase())}function rankIcon(i){return i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}function rankRow(item,index,withReview=false){const meta=item.meta?`<div class="rmeta">${escapeHtml(item.meta)}</div>`:"";const review=withReview&&item.review?`<div class="review">💬 ${escapeHtml(item.review)}</div>`:"";return `<article class="rank-row"><div class="rank-mark">${rankIcon(index)}</div><div><div class="rname">${escapeHtml(item.name||"-")}</div>${meta}</div><div class="score">${escapeHtml(item.label||item.value||"")}</div>${review}</article>`}function tagItem(item){const meta=item.meta?`<div class="tag-meta">${escapeHtml(item.meta)}</div>`:"";return `<span class="name-tag"><span>${escapeHtml(item.name||"-")}</span>${meta}</span>`}function section(title,note,body,full=false){return `<section class="section ${full?"full":""}"><div class="section-head"><h2>${title}</h2><span class="section-note">${note||""}</span></div>${body}</section>`}function rankSection(key,title,note){const list=(hallData[key]||[]).filter(matchItem);const body=list.length?`<div class="list">${list.map((it,i)=>rankRow(it,i,false)).join("")}</div>`:`<div class="empty">아직 데이터가 부족해요.</div>`;return section(title,note,body)}function tagSection(key,title,note){const list=(hallData[key]||[]).filter(matchItem);const body=list.length?`<div class="tag-list">${list.map(tagItem).join("")}</div>`:`<div class="empty">아직 데이터가 부족해요.</div>`;return section(title,note,body)}function renderChicks(){const list=(hallData?.newChicks||[]).filter(matchItem);const box=document.getElementById("chickBanner"),title=document.getElementById("chickTitle"),names=document.getElementById("chickNames");if(!list.length){box.style.display="none";return}box.style.display="block";title.textContent=`🐣 신입 병아리 ${list.length}명 입장!`;names.textContent=list.slice(0,5).map(i=>i.name).join(" · ");box.onclick=()=>alert("🐣 신입 병아리\n\n"+list.map(i=>i.meta?`${i.name}\n${i.meta}`:i.name).join("\n\n"))}function overallSection(){const list=((overallMode==="main"?hallData.overallMain:hallData.overallAll)||[]).filter(matchItem);const controls=`<div class="controls"><button class="pill ${overallMode==="main"?"active":""}" data-overall="main">본캐 기준</button><button class="pill ${overallMode==="all"?"active":""}" data-overall="all">전체 기준</button></div>`;const body=list.length?`${controls}<div class="list">${list.map((it,i)=>rankRow(it,i,true)).join("")}</div>`:`${controls}<div class="empty">아직 데이터가 부족해요.</div>`;return section("🏅 키노조 전체 순위","AI 리뷰 연동",body,true)}function classRankingSection(){const rankings=classMode==="main"?hallData.classMain:hallData.classAll;const list=((rankings&&rankings[activeClass])||[]).filter(matchItem);const classButtons=CLASS_ORDER.filter(cls=>rankings&&rankings[cls]).map(cls=>`<button class="pill ${activeClass===cls?"active":""}" data-class="${escapeHtml(cls)}">${escapeHtml(cls)}</button>`).join("");const controls=`<div class="controls"><button class="pill ${classMode==="main"?"active":""}" data-classmode="main">본캐 기준</button><button class="pill ${classMode==="all"?"active":""}" data-classmode="all">전체 기준</button></div><div class="controls">${classButtons}</div>`;const body=list.length?`${controls}<div class="list">${list.map((it,i)=>rankRow(it,i,false)).join("")}</div>`:`${controls}<div class="empty">아직 데이터가 부족해요.</div>`;return section("⚔ 클래스별 전투력 TOP3","모바일 탭 방식",body,true)}function renderSuggestions(){const list=hallData.suggestions||[];if(!list.length)return"";const body=`<div class="list">${list.map((it,i)=>`<article class="rank-row"><div class="rank-mark">${i+1}</div><div><div class="rname">${escapeHtml(it.title||"-")}</div><div class="rmeta">${escapeHtml([it.proposer,it.memo,it.status].filter(Boolean).join(" · "))}</div></div><div class="score">${escapeHtml(it.createdAt||"")}</div></article>`).join("")}</div>`;return section("📋 최근 제안","운영자 검토중",body,true)}function render(){if(!hallData)return;updatedBadge.textContent=hallData.updatedAt?`업데이트 ${hallData.updatedAt}`:"업데이트 정보 없음";renderChicks();app.className="grid";app.innerHTML=[rankSection("pveTop","🛡 PVE 전투력 TOP3","순위 · 이름 · 전투력"),rankSection("pvpTop","⚔ PVP 전투력 TOP3","순위 · 이름 · 전투력"),overallSection(),tagSection("demonFamily","😈 같은 마족이면 가족이지","타서버 마족"),tagSection("partyFriend","🤝 같은 파티면 친구지","천족 서버"),classRankingSection(),rankSection("attendance","📅 개근상","1주일 이상 꾸준히 성장"),rankSection("amexBlack","💳 아맥스 블랙회원","단기간 급상승 캐릭터"),renderSuggestions()].join("");bindDynamicButtons()}function bindDynamicButtons(){document.querySelectorAll("[data-overall]").forEach(b=>b.onclick=()=>{overallMode=b.dataset.overall;render()});document.querySelectorAll("[data-classmode]").forEach(b=>b.onclick=()=>{classMode=b.dataset.classmode;render()});document.querySelectorAll("[data-class]").forEach(b=>b.onclick=()=>{activeClass=b.dataset.class;render()})}async function load(){app.className="loading";app.innerHTML=`<div><div class="loader-ring"></div><div>명예의 전당 데이터를 불러오는 중...</div></div>`;try{const url=`${WEB_APP_URL}${WEB_APP_URL.includes("?")?"&":"?"}action=hallOfFame&t=${Date.now()}`;const res=await fetch(url,{cache:"no-store"});const text=await res.text();if(!res.ok)throw new Error(`HTTP ${res.status}: ${text.slice(0,120)}`);hallData=JSON.parse(text);render()}catch(err){app.className="";app.innerHTML=`<div class="error"><strong>명예의 전당 데이터를 불러오지 못했습니다.</strong><br />Apps Script 배포 URL 또는 CORS 설정을 확인해 주세요.<br /><small>${escapeHtml(err.message||err)}</small></div>`}}searchInput.addEventListener("input",e=>{keyword=e.target.value.trim();render()});document.getElementById("refreshBtn").addEventListener("click",load);const suggestionBox=document.getElementById("suggestionBox");document.getElementById("suggestBtn").addEventListener("click",()=>{suggestionBox.style.display=suggestionBox.style.display==="none"?"block":"none"});document.getElementById("submitSuggestBtn").addEventListener("click",async()=>{const title=document.getElementById("suggestTitle").value.trim(),proposer=document.getElementById("suggestProposer").value.trim(),memo=document.getElementById("suggestMemo").value.trim();if(!title)return alert("항목 이름을 입력해 주세요.");const btn=document.getElementById("submitSuggestBtn");btn.disabled=true;btn.textContent="전송 중...";try{const res=await fetch(WEB_APP_URL,{method:"POST",body:JSON.stringify({action:"hallSuggestion",title,proposer,memo})});const data=await res.json();if(!data.ok)throw new Error(data.message||"전송 실패");alert("제안이 접수되었습니다.");document.getElementById("suggestTitle").value="";document.getElementById("suggestMemo").value="";await load()}catch(err){alert("제안 전송에 실패했습니다: "+(err.message||err))}finally{btn.disabled=false;btn.textContent="제안 보내기"}});load();
</script></body></html>
