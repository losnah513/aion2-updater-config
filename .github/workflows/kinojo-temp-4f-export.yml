name: KINOJO temporary 4-F source export

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  export:
    if: github.event.issue.title == 'KINOJO_MY_INFO_4F_EXPORT_20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: kinojo-my-info-4f-source
          path: ui/kinojo-common-ui.js
          if-no-files-found: error
          retention-days: 1
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kinojo-transfer
          printf '%s\n' '${{ github.run_id }}' > .kinojo-transfer/4f-run-id.txt
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add .kinojo-transfer/4f-run-id.txt
          git commit -m "Record Stage 4-F source export run"
          git push origin HEAD:main
