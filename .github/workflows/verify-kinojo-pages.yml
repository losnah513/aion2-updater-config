name: Verify KINOJO Pages

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "home.html"
      - "m/index.html"
      - "arcana/**"
      - "m/arcana/**"
      - "hall-of-fame/**"
      - "pages/**"
      - "m/pages/**"
      - "desktop/**"
      - "ranking/**"
      - "m/ranking/**"
      - "hof/**"
      - "m/hof/**"
      - "sanctuary/**"
      - "assets/images/sanctuary/**"
      - "assets/images/classes/**"
      - "assets/images/my-info/**"
      - "m/sanctuary/**"
      - "sanctuary-schedule/**"
      - "m/sanctuary-schedule/**"
      - "sanctuary-management/**"
      - "m/sanctuary-management/**"
      - "admin/**"
      - "m/admin/**"
      - "meter/**"
      - "m/meter/**"
      - "core/**"
      - "ui/**"
      - "supabase/functions/kinojo-member-profile/**"
      - "supabase/functions/kinojo-member-image-cleanup/**"
      - "supabase/migrations/*member_image_request*.sql"
      - "tests/**"
      - "launcher-content.json"
      - "CNAME"
      - ".github/workflows/verify-kinojo-pages.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "home.html"
      - "m/index.html"
      - "arcana/**"
      - "m/arcana/**"
      - "hall-of-fame/**"
      - "pages/**"
      - "m/pages/**"
      - "desktop/**"
      - "ranking/**"
      - "m/ranking/**"
      - "hof/**"
      - "m/hof/**"
      - "sanctuary/**"
      - "assets/images/sanctuary/**"
      - "assets/images/classes/**"
      - "assets/images/my-info/**"
      - "m/sanctuary/**"
      - "sanctuary-schedule/**"
      - "m/sanctuary-schedule/**"
      - "sanctuary-management/**"
      - "m/sanctuary-management/**"
      - "admin/**"
      - "m/admin/**"
      - "meter/**"
      - "m/meter/**"
      - "core/**"
      - "ui/**"
      - "supabase/functions/kinojo-member-profile/**"
      - "supabase/functions/kinojo-member-image-cleanup/**"
      - "supabase/migrations/*member_image_request*.sql"
      - "tests/**"
      - "launcher-content.json"
      - "CNAME"
      - ".github/workflows/verify-kinojo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-kinojo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR head or current commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify JavaScript syntax and modal contracts
        shell: bash
        run: |
          set -euo pipefail

          js_files=(
            "ui/kinojo-my-info-image-contract.js"
            "ui/kinojo-my-info-image-editor.js"
            "ui/kinojo-my-info-image-upload.js"
            "ui/kinojo-my-info-image-request.js"
            "ui/kinojo-my-info-batch-bootstrap.js"
            "ui/kinojo-my-info-image-preloader.js"
            "ui/kinojo-common-ui.js"
            "ui/kinojo-range-control.js"
            "ui/kinojo-admin-notifications.js"
            "ui/kinojo-character-reaction.js"
            "ui/kinojo-character-detail-refresh.js"
            "ui/kinojo-character-skill-bridge.js"
            "ui/kinojo-character-daevanion-bridge.js"
            "core/kinojo-supabase-client.js"
            "core/kinojo-supabase-rpc.js"
            "core/kinojo-supabase-features.js"
            "core/kinojo-auth-session.js"
            "core/kinojo-auth-ui.js"
            "hof/js/hall-render.js"
            "sanctuary/js/sanctuary.js"
            "sanctuary/js/sanctuary-editor.js"
            "sanctuary-schedule/js/sanctuary-schedule.js"
            "sanctuary-management/js/sanctuary-management.js"
            "sanctuary-management/js/sanctuary-management-draft.js"
            "sanctuary-management/js/sanctuary-management-support.js"
            "admin/js/admin-members.js"
            "admin/js/admin.js"
            "admin/js/admin-shared.js"
            "admin/js/admin-system.js"
            "admin/js/admin-bootstrap.js"
            "meter/js/meter-app.js"
            "ranking/js/ranking-utils.js"
            "ranking/js/ranking-data.js"
            "ranking/js/ranking-card.js"
            "ranking/js/ranking-render.js"
            "ranking/js/ranking-events.js"
            "ranking/js/ranking-app.js"
          )

          for path in "${js_files[@]}"; do
            node --check "$path"
          done
          node --check supabase/functions/kinojo-member-profile/index.ts

          node tests/web-shell-auth-contract.test.js
          node tests/hof-layout-contract.test.js
          node tests/my-info-image-contract.test.js
          node tests/my-info-guide-assets.test.js
          node tests/my-info-image-editor.test.js
          node tests/my-info-image-upload.test.js
          node tests/my-info-image-request-server-contract.test.js
          node tests/my-info-image-request-client.test.js
          node tests/my-info-image-request-ui-contract.test.js
          node tests/my-info-batch-bootstrap.test.js
          node tests/my-info-image-preloader.test.js
          node tests/my-info-panel-width.test.js
          node tests/my-info-responsive-layout.test.js
          node tests/my-info-e1-accessibility.test.js
          node tests/my-info-admin-image-layout-contract.test.js
          node tests/admin-member-image-review-contract.test.js
          node tests/admin-notification-contract.test.js
          node tests/my-info-phase2-stage3-admin-contract.test.js
          node tests/my-info-phase2-stage4-closeout-contract.test.js
          node tests/kinojo-range-control.test.js
          node tests/sanctuary-roster-quick-edit-contract.test.js
          node tests/sanctuary-waitlist-contract.test.js
          node tests/sanctuary-management-data-boundary-contract.test.js
          node tests/sanctuary-management-fixed-draft-contract.test.js
          node tests/sanctuary-management-force-roster-contract.test.js
          node tests/sanctuary-management-creator-candidates-contract.test.js
          node tests/sanctuary-management-character-search-contract.test.js
          node tests/sanctuary-management-editor-readability-contract.test.js
          node tests/sanctuary-management-transparent-icons-focus-contract.test.js
          node tests/sanctuary-management-edge-contract.test.js
          node tests/sanctuary-management-public-read-contract.test.js
          node tests/sanctuary-management-stage3-complete-contract.test.js
          node tests/sanctuary-management-participation-forces-v435-contract.test.js
          node tests/sanctuary-management-stage4-complete-contract.test.js
          node tests/sanctuary-management-stage5-complete-contract.test.js
          node tests/sanctuary-management-stage6-pilot-contract.test.js
          node tests/sanctuary-management-stage6-transition-contract.test.js
          node tests/sanctuary-management-transition-approval-stability-contract.test.js
          node tests/sanctuary-management-stage7-complete-contract.test.js
          node tests/sanctuary-management-atomic-composer-contract.test.js
          node tests/sanctuary-management-compact-info-layout-contract.test.js
          node tests/sanctuary-management-scope-subbar-contract.test.js
          node tests/sanctuary-management-roster-carousel-refresh-contract.test.js
          node tests/sanctuary-management-sanctuary-banner-connection-contract.test.js
          node tests/sanctuary-canonical-cutover-contract.test.js
          node tests/sanctuary-management-copy-contract.test.js
          node tests/admin-member-v433-browser-rpc-contract.test.js
          node tests/staged-page-contract.test.js
          node tests/meter-presence-log-contract.test.js
          node tests/ranking-ui-contract.test.js
          node tests/legacy-ranking-snapshot-guard.test.js
          node tests/home-layout-cache-guard.test.js
          node tests/home-layout-stability-contract.test.js
          node tests/home-loading-budget-contract.test.js

          python3 <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path("hof/index.html"),
              Path("m/hof/index.html"),
              Path("ranking/index.html"),
              Path("m/ranking/index.html"),
          ]
          required_assets = [
              "kinojo-character-reaction.css?cache=2026082201",
              "kinojo-character-reaction.js?cache=2026082701",
              "kinojo-character-detail-refresh.js?cache=2026082201",
              "kinojo-character-skill.css?cache=2026081001",
              "kinojo-character-daevanion.css?cache=2026081002",
              "kinojo-animations.css?cache=2026081003",
              "kinojo-character-skill-bridge.js?cache=2026083001",
              "kinojo-character-daevanion-bridge.js?cache=2026081002",
          ]
          for page in pages:
              text = page.read_text(encoding="utf-8")
              for asset in required_assets:
                  count = text.count(asset)
                  if count != 1:
                      raise SystemExit(f"{page}: {asset} include count={count}, expected=1")

          skill = Path("ui/kinojo-character-skill-bridge.js").read_text(encoding="utf-8")
          daev = Path("ui/kinojo-character-daevanion-bridge.js").read_text(encoding="utf-8")
          animations = Path("ui/kinojo-animations.css").read_text(encoding="utf-8")
          daev_css = Path("ui/kinojo-character-daevanion.css").read_text(encoding="utf-8")
          reaction = Path("ui/kinojo-character-reaction.js").read_text(encoding="utf-8")
          reaction_css = Path("ui/kinojo-character-reaction.css").read_text(encoding="utf-8")
          detail_refresh = Path("ui/kinojo-character-detail-refresh.js").read_text(encoding="utf-8")

          forbidden = {
              "skill rpc monkey patch": (skill, r"\brpc\.rpc\s*="),
              "skill bridge duplicate skill RPC": (skill, r"kinojo_character_skill_overview_"),
              "daev edge monkey patch": (daev, r"\bcore\.invokeEdgeFunction\s*="),
              "daev overview monkey patch": (daev, r"\bapi\.getLiveCharacterProfile\s*="),
          }
          for label, (text, pattern) in forbidden.items():
              if re.search(pattern, text):
                  raise SystemExit(f"Forbidden frozen-core mutation detected: {label}")

          required_tokens = {
              "skill SQL 415": (reaction, "kinojo_character_skill_overview_v415"),
              "skill Server category": (reaction, "categoryLabel"),
              "skill Server tier": (reaction, "levelBand"),
              "skill stigma": (reaction, "스티그마"),
              "skill tier class": (reaction, "is-level-30"),
              "daev SQL 307": (daev, "kinojo_character_daevanion_detail_v307"),
              "daev active nodes": (daev, "activeNodes"),
              "daev stat effects": (daev, "statEffects"),
              "daev skill effects": (daev, "skillEffects"),
              "daev board map": (daev + daev_css, "kinojo-daevanion-board-map"),
              "inner modal scroll": (animations, "kinojo-character-reaction-scroll"),
              "outer modal overflow lock": (animations, "overflow:hidden!important"),
              "modal PVE item level": (reaction, "latest_pve_item_level"),
              "modal PVP item level": (reaction, "latest_pvp_item_level"),
              "modal PVE item element": (reaction, "kinojoCharacterReactionPveItemLevel"),
              "modal PVP item element": (reaction, "kinojoCharacterReactionPvpItemLevel"),
              "official combat power icon": (reaction, "profile_power_icon_pc.png"),
              "official item level icon": (reaction, "profile_level_icon_pc.png"),
              "compact PVE/PVP layout": (reaction_css, ".kinojo-character-reaction-mode"),
              "refresh cache invalidation": (detail_refresh, "reloadOverview"),
          }
          for label, (text, token) in required_tokens.items():
              if token not in text:
                  raise SystemExit(f"Required contract missing: {label}")

          checked = pages + [
              Path("ui/kinojo-character-skill.css"),
              Path("ui/kinojo-character-daevanion.css"),
              Path("ui/kinojo-animations.css"),
              Path("ui/kinojo-character-detail-refresh.css"),
              Path("sanctuary/css/sanctuary.css"),
              Path("sanctuary-schedule/css/sanctuary-schedule.css"),
          ]
          for path in checked:
              data = path.read_bytes()
              if b"\x00" in data:
                  raise SystemExit(f"NUL byte detected: {path}")
              if path.suffix == ".css":
                  text = data.decode("utf-8")
                  if text.count("{") != text.count("}"):
                      raise SystemExit(f"CSS brace mismatch: {path}")

          class_icon_names = [
              "class_icon_assassin.png",
              "class_icon_chanter.png",
              "class_icon_cleric.png",
              "class_icon_elementalist.png",
              "class_icon_fighter.png",
              "class_icon_gladiator.png",
              "class_icon_ranger.png",
              "class_icon_sorcerer.png",
              "class_icon_templar.png",
          ]
          class_icon_dir = Path("assets/images/classes")
          original_icon_dir = class_icon_dir / "original"
          active_names = sorted(path.name for path in class_icon_dir.glob("class_icon_*.png"))
          original_names = sorted(path.name for path in original_icon_dir.glob("class_icon_*.png"))
          if active_names != class_icon_names:
              raise SystemExit(f"Active class icon set mismatch: {active_names}")
          if original_names != class_icon_names:
              raise SystemExit(f"Original class icon set mismatch: {original_names}")

          for name in class_icon_names:
              active = (class_icon_dir / name).read_bytes()
              original = (original_icon_dir / name).read_bytes()
              if active[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Invalid active class icon PNG: {name}")
              width = int.from_bytes(active[16:20], "big")
              height = int.from_bytes(active[20:24], "big")
              if (width, height) != (256, 256):
                  raise SystemExit(f"Unexpected active class icon size: {name} {width}x{height}")
              if active == original:
                  raise SystemExit(f"Active class icon was not replaced: {name}")

          meter_pages = [Path("meter/index.html"), Path("m/meter/index.html")]
          for page in meter_pages:
              text = page.read_text(encoding="utf-8")
              for token in ["meterInstallerSize", "다운로드 용량", "meter-app.js?cache=2026081502-50040", "meterLiveUsers", "meterLiveNames"]:
                  if token not in text:
                      raise SystemExit(f"{page}: Meter distribution contract missing: {token}")

          admin_pages = [Path("admin/index.html"), Path("m/admin/index.html")]
          for page in admin_pages:
              text = page.read_text(encoding="utf-8")
              for token in ["data-admin-subtab=\"downloads\"", "data-admin-subtab=\"runtime\"", "data-admin-subtab=\"statistics\"", "data-admin-subtab=\"notices\"", "data-admin-subtab=\"logs\"", "data-meter-download-enabled", "data-meter-launch-enabled", "data-meter-statistics-enabled", "kinojo-filter-switch", "meterDungeonLogRows"]:
                  if token not in text:
                      raise SystemExit(f"{page}: Meter admin contract missing: {token}")

          meter_app = Path("meter/js/meter-app.js").read_text(encoding="utf-8")
          admin_system = Path("admin/js/admin-system.js").read_text(encoding="utf-8")
          for token in ["launcherDownloadAuthorization", "renderDistribution", "미터기 포함"]:
              if token not in meter_app:
                  raise SystemExit(f"Meter WEB contract missing: {token}")
          if "desktopDownloadAuthorization" in meter_app:
              raise SystemExit("Meter WEB must authorize the Launcher, not the legacy desktop installer")
          for token in ["RANK_ALLOWLIST", "allowedLevels", "launchAllowedLevels", "combinedFileSize"]:
              if token not in admin_system:
                  raise SystemExit(f"Meter admin contract missing: {token}")

          print("KINOJO modal source contracts: PASS")
          PY

          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          global.window = { addEventListener() {} };
          global.document = {};
          vm.runInThisContext(fs.readFileSync('ui/kinojo-character-reaction.js', 'utf8'), {
            filename: 'ui/kinojo-character-reaction.js',
          });

          const candidates = window.KinojoCharacterProfileImage.candidates({ className: '수호성' });
          if (candidates.length !== 1 || candidates[0].kind !== 'class') {
            throw new Error('Character image fallback candidate contract failed');
          }
          console.log('Character image fallback candidate: PASS');
          NODE

      - name: Verify bridge startup with frozen cores
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          const rpc = async () => ({ ok: true, apiVersion: '305', skills: [] });
          const invokeEdgeFunction = async () => ({ ok: true });
          const rpcCore = Object.freeze({ rpc });
          const clientCore = Object.freeze({ invokeEdgeFunction });
          const readyCallbacks = [];

          global.window = {
            KinojoSupabaseRpcCore: rpcCore,
            KinojoSupabaseClientCore: clientCore,
          };
          global.document = {
            readyState: 'loading',
            body: {},
            addEventListener(name, callback) {
              if (name === 'DOMContentLoaded') readyCallbacks.push(callback);
            },
            getElementById() { return null; },
            contains() { return true; },
          };
          global.MutationObserver = class { observe() {} disconnect() {} };
          global.requestAnimationFrame = callback => { callback(); return 1; };

          for (const path of [
            'ui/kinojo-character-skill-bridge.js',
            'ui/kinojo-character-daevanion-bridge.js',
          ]) {
            vm.runInThisContext(fs.readFileSync(path, 'utf8'), { filename: path });
          }
          for (const callback of readyCallbacks) callback();

          if (!Object.isFrozen(window.KinojoSupabaseRpcCore)) throw new Error('RPC core freeze lost');
          if (!Object.isFrozen(window.KinojoSupabaseClientCore)) throw new Error('Client core freeze lost');
          if (window.KinojoSupabaseRpcCore.rpc !== rpc) throw new Error('RPC core method mutated');
          if (window.KinojoSupabaseClientCore.invokeEdgeFunction !== invokeEdgeFunction) throw new Error('Client core method mutated');
          console.log('Frozen core startup smoke: PASS');
          NODE

  verify-live-readback:
    if: github.event_name != 'pull_request'
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_BASE: https://kinojo.info
    steps:
      - name: Checkout deployed main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish live readback pending status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: pending
          STATUS_DESCRIPTION: KINOJO 운영 파일 동기화 확인 중
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/kinojo-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "context": "kinojo/live-readback",
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/kinojo-status.json >/dev/null

      - name: Verify custom domain and live files
        shell: bash
        run: |
          set -euo pipefail

          expected_ref="${{ github.sha }}"
          verify_key="${expected_ref:0:12}-$(date -u +%s)"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          files=(
            "index.html"
