name: Apply Character Refresh Profile Patch

on:
  push:
    branches: [agent/character-refresh-profile-321-20260817]
    paths:
      - '.kinojo-tmp/character-refresh-profile.patch.gz.b64'
      - '.github/workflows/apply-character-refresh-profile-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[profile-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/character-refresh-profile-321-20260817
          fetch-depth: 0

      - name: Apply and verify profile patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .kinojo-tmp/character-refresh-profile.patch.gz.b64 | gzip -d > /tmp/character-refresh-profile.patch
          git apply --check /tmp/character-refresh-profile.patch
          git apply /tmp/character-refresh-profile.patch
          rm -f .kinojo-tmp/character-refresh-profile.patch.gz.b64
          rmdir .kinojo-tmp 2>/dev/null || true
          rm -f .github/workflows/apply-character-refresh-profile-patch.yml

          node --check admin/js/admin.js
          node --check admin/js/admin-characters.js

          python3 <<'PY'
          from pathlib import Path
          pages = [Path('admin/index.html'), Path('m/admin/index.html')]
          ids = [
              'characterLookupPerformancePanel',
              'characterLookupPerformanceState',
              'characterLookupPerformanceTotal',
              'characterLookupPerformanceBottleneck',
              'characterLookupPerformanceOfficial',
              'characterLookupPerformanceCache',
              'characterLookupPerformanceRetry',
              'characterLookupPerformanceSheet',
              'characterLookupPerformanceIntegrity',
              'characterLookupPerformanceStages',
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for item_id in ids:
                  count = text.count(f'id="{item_id}"')
                  if count != 1:
                      raise SystemExit(f'{page}: {item_id} count={count}')
              if 'admin.js?cache=2026081701' not in text:
                  raise SystemExit(f'{page}: stale admin cache')
          source = Path('admin/js/admin-characters.js').read_text(encoding='utf-8')
          for token in [
              'performanceProfile:data?.performanceProfile||{}',
              'function renderLookupPerformance(profile)',
              'runtime_events_inferred',
              'characterLookupPerformanceIntegrity',
          ]:
              if token not in source:
                  raise SystemExit(f'admin character profile contract missing {token}')
          loader = Path('admin/js/admin.js').read_text(encoding='utf-8')
          if 'v2026081701' not in loader or "name+'?cache=2026081701'" not in loader:
              raise SystemExit('admin loader cache contract missing')
          print('Character refresh profile source contracts: PASS')
          PY

          git diff --check

      - name: Commit applied files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kinojo-automation'
          git config user.email 'kinojo-automation@users.noreply.github.com'
          git add -A
          git commit -m '[profile-patch-applied] Add character refresh performance profile UI'
          git push origin HEAD:agent/character-refresh-profile-321-20260817
