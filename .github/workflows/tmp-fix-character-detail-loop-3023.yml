name: tmp-fix-character-detail-loop-3023

on:
  push:
    branches:
      - fix/character-detail-modal-loop-3023

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-detail-modal-loop-3023
          fetch-depth: 0

      - name: Patch modal completion handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('ui/kinojo-character-detail-refresh.js')
          text = js_path.read_text(encoding='utf-8')

          replacements = [
              ("const API_VERSION = '302.1';", "const API_VERSION = '302.2';"),
              ("""    starting:false,
              lastOptions:null,
              lastTerminalJobId:'',
              modalRefreshBusy:false
            };""", """    starting:false
            };"""),
              ("""  function isTerminal(job){
              return !!job && ['completed','partial_failed','failed'].includes(String(job.status||''));
            }

          """, ""),
              ("""    renderProgress(job);

            if(isTerminal(job) && job.id && state.lastTerminalJobId!==String(job.id)){
              state.lastTerminalJobId=String(job.id);
              if(job.status==='completed' || job.status==='partial_failed') refreshOpenModal();
            }
          }
""", """    renderProgress(job);
          }
"""),
              ("""  function refreshOpenModal(){
              if(state.modalRefreshBusy || !state.lastOptions || !window.KinojoCharacterReaction) return;
              state.modalRefreshBusy=true;
              const activeTab=document.querySelector('#kinojoCharacterReactionModal [data-kinojo-character-tab].active')?.getAttribute('data-kinojo-character-tab')||'equipment';
              const options=state.lastOptions;
              try{window.KinojoCharacterReaction.close();}catch(_err){}
              try{window.dispatchEvent(new CustomEvent('kinojo:auth-changed',{detail:{source:'character-detail-refresh'}}));}catch(_err){}
              setTimeout(()=>{
                try{
                  window.KinojoCharacterReaction.open(options);
                  setTimeout(()=>document.querySelector('#kinojoCharacterReactionModal [data-kinojo-character-tab="'+activeTab+'"]')?.click(),180);
                }finally{state.modalRefreshBusy=false;}
              },80);
            }

            function setupOpenCapture(){
              const api=window.KinojoCharacterReaction;
              if(!api || api.__detailRefreshWrapped || typeof api.open!=='function') return;
              const originalOpen=api.open.bind(api);
              api.open=function(options){state.lastOptions=options||null;return originalOpen(options);};
              Object.defineProperty(api,'__detailRefreshWrapped',{value:true,configurable:false});
            }

          """, ""),
              ("""  function syncModal(){
              setupOpenCapture();setupOverviewBridge();""", """  function syncModal(){
              setupOverviewBridge();"""),
              ("""      stopPoll();state.currentKey=key;state.identity=identity;state.status=null;state.lastTerminalJobId='';
""", """      stopPoll();state.currentKey=key;state.identity=identity;state.status=null;
"""),
              ("""  const start=()=>{
              setupOpenCapture();setupOverviewBridge();syncModal();""", """  const start=()=>{
              setupOverviewBridge();syncModal();"""),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected block not found:\n' + old[:160])
              text = text.replace(old, new, 1)

          forbidden = ['refreshOpenModal', 'setupOpenCapture', 'lastTerminalJobId', 'modalRefreshBusy', 'lastOptions']
          for token in forbidden:
              if token in text:
                  raise SystemExit('forbidden token remains: ' + token)

          js_path.write_text(text, encoding='utf-8')

          pages = [
              Path('hof/index.html'), Path('m/hof/index.html'),
              Path('ranking/index.html'), Path('m/ranking/index.html'),
              Path('sanctuary/index.html'), Path('m/sanctuary/index.html'),
          ]
          old_cache = 'kinojo-character-detail-refresh.js?cache=2026080301'
          new_cache = 'kinojo-character-detail-refresh.js?cache=2026080302'
          for page in pages:
              html = page.read_text(encoding='utf-8')
              if html.count(old_cache) != 1:
                  raise SystemExit(f'cache marker mismatch: {page}')
              page.write_text(html.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

      - name: Validate fix
        shell: bash
        run: |
          node --check ui/kinojo-character-detail-refresh.js
          grep -F "const API_VERSION = '302.2';" ui/kinojo-character-detail-refresh.js
          test "$(grep -R "kinojo-character-detail-refresh.js?cache=2026080302" -l hof/index.html m/hof/index.html ranking/index.html m/ranking/index.html sanctuary/index.html m/sanctuary/index.html | wc -l)" -eq 6
          ! grep -E "refreshOpenModal|setupOpenCapture|lastTerminalJobId|modalRefreshBusy|lastOptions" ui/kinojo-character-detail-refresh.js

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-character-detail-loop-3023.yml
          git config user.name kinojo-bot
          git config user.email kinojo-bot@users.noreply.github.com
          git add ui/kinojo-character-detail-refresh.js hof/index.html m/hof/index.html ranking/index.html m/ranking/index.html sanctuary/index.html m/sanctuary/index.html .github/workflows/tmp-fix-character-detail-loop-3023.yml
          git commit -m "fix: stop character detail modal reopen loop"
          git push origin HEAD:fix/character-detail-modal-loop-3023
