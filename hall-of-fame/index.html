<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- =========================
       기본 메타 정보
  ========================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Kinojo 명예의 전당</title>
  <meta name="description" content="전투력과 성장 기록으로 선정된 최고의 모험가들" />

  <!-- =========================
       카카오톡 / SNS 미리보기
  ========================== -->
  <meta property="og:title" content="Kinojo 명예의 전당" />
  <meta property="og:description" content="전투력과 성장 기록으로 선정된 최고의 모험가들" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/" />
  <meta property="og:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg?v=3" />
  <meta property="og:image:secure_url" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg?v=3" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg?v=3" />

  <style>
    /* =========================
       디자인 변수
    ========================== */
    :root {
      color-scheme: dark;
      --bg: #07101c;
      --panel: rgba(9, 19, 33, .95);
      --panel-2: rgba(15, 23, 42, .72);
      --line: rgba(125, 211, 252, .22);
      --text: #ecf7ff;
      --muted: #9fb2c7;
      --gold: #ffd76a;
      --purple: #8b5cf6;
      --blue: #2563eb;
      --danger: #fecaca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, rgba(103, 232, 249, .12), transparent 34%),
        radial-gradient(circle at 88% 8%, rgba(139, 92, 246, .14), transparent 34%),
        linear-gradient(180deg, #081321, #030712);
      color: var(--text);
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .wrap {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px 12px 36px;
    }

    /* =========================
       상단 헤더
    ========================== */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .trophy {
      font-size: 44px;
      filter: drop-shadow(0 0 12px rgba(250, 204, 21, .22));
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: -.6px;
    }

    .subtitle {
      margin-top: 4px;
      color: #dbeafe;
      font-size: 13px;
    }

    .mode-tabs {
      display: flex;
      background: rgba(15, 23, 42, .74);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .mode-tab {
      border: 0;
      color: var(--text);
      background: transparent;
      padding: 12px 26px;
      font-weight: 900;
      cursor: pointer;
    }

    .mode-tab.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, .9), rgba(37, 99, 235, .76));
    }

    .guide {
      color: #cbd5e1;
      font-size: 13px;
    }

    /* =========================
       검색 / 버튼
    ========================== */
    .hero-tools {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search,
    .btn {
      border: 1px solid rgba(125, 211, 252, .24);
      background: rgba(15, 23, 42, .78);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
    }

    .btn {
      cursor: pointer;
      font-weight: 900;
      background: linear-gradient(135deg, rgba(37, 99, 235, .9), rgba(124, 58, 237, .82));
    }

    /* =========================
       신입 병아리 배너
    ========================== */
    .chick-banner {
      display: none;
      grid-template-columns: 78px 1fr auto;
      gap: 12px;
      align-items: center;
      background: linear-gradient(135deg, #fffaf0, #eef6ff);
      color: #0f172a;
      border-radius: 18px;
      padding: 13px 16px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .chick-icon {
      font-size: 54px;
    }

    .chick-title {
      font-size: 20px;
      font-weight: 1000;
      color: #be123c;
    }

    .chick-desc {
      margin-top: 4px;
      color: #475569;
      font-size: 13px;
    }

    .chick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .chick-tag {
      padding: 8px 14px;
      background: rgba(15, 23, 42, .06);
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 999px;
      font-weight: 900;
    }

    .chick-tag small {
      color: #64748b;
      font-weight: 700;
    }

    /* =========================
       공통 섹션
    ========================== */
    .dashboard {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 12px;
    }

    .top-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .side-stack {
      display: grid;
      gap: 12px;
    }

    .section,
    .overall {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(12, 26, 43, .95), rgba(7, 15, 27, .95));
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .26);
    }

    .section-head,
    .overall-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      background: linear-gradient(90deg, rgba(37, 99, 235, .18), rgba(124, 58, 237, .16));
    }

    .section h2,
    .overall h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-note {
      color: #cbd5e1;
      font-size: 12px;
      white-space: nowrap;
    }

    .list {
      padding: 12px;
      display: grid;
      gap: 9px;
    }

    .mini-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 42px;
    }

    .medal {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 20px;
    }

    .name {
      font-size: 15px;
      font-weight: 1000;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .score {
      font-weight: 1000;
      color: var(--gold);
      white-space: nowrap;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* =========================
       이름표 섹션
    ========================== */
    .tag-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
    }

    .name-tag {
      padding: 10px 8px;
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 12px;
      background: rgba(15, 23, 42, .56);
      text-align: center;
      font-weight: 1000;
    }

    .tag-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    /* =========================
       전체 순위 테이블
    ========================== */
    .overall {
      margin-top: 12px;
      background: rgba(7, 15, 27, .95);
    }

    .page-tools {
      display: flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .page-btn {
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, .72);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
    }

    .rank-table {
      width: 100%;
      border-collapse: collapse;
    }

    .rank-table th,
    .rank-table td {
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }

    .rank-table th {
      color: #cbd5e1;
      font-weight: 800;
    }

    .rank-table .num {
      width: 52px;
      text-align: center;
    }

    .rank-table .power {
      white-space: nowrap;
      font-weight: 900;
    }

    .reviews {
      color: #dbeafe;
      line-height: 1.45;
      font-size: 12px;
    }

    .reviews div + div {
      margin-top: 3px;
      color: #cbd5e1;
    }

    /* =========================
       클래스 순위
    ========================== */
    .classes {
      margin-top: 12px;
    }

    .class-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
    }

    .pill {
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, .7);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .pill.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, .9), rgba(37, 99, 235, .76));
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 12px;
    }

    .class-card {
      border: 1px solid rgba(148, 163, 184, .16);
      border-radius: 12px;
      background: rgba(15, 23, 42, .54);
      padding: 10px;
    }

    .class-title {
      font-weight: 1000;
      color: #fff3b0;
      margin-bottom: 8px;
    }

    /* =========================
       로딩 / 오류
    ========================== */
    .loading {
      min-height: 300px;
      display: grid;
      place-items: center;
      color: #dbeafe;
      font-weight: 900;
    }

    .loader-ring {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: conic-gradient(from 0deg, #67e8f9, #3b82f6, #a78bfa, #ec4899, #67e8f9);
      animation: spin 1.05s linear infinite;
      position: relative;
      box-shadow: 0 0 18px rgba(34, 211, 238, .32);
    }

    .loader-ring::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: var(--bg);
    }

    .loader-ring::after {
      content: "🏆";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      animation: counterSpin 1.05s linear infinite;
      font-size: 21px;
    }

    .error-box {
      margin-top: 12px;
      border: 1px solid rgba(248, 113, 113, .35);
      background: rgba(127, 29, 29, .22);
      color: var(--danger);
      border-radius: 14px;
      padding: 14px;
      line-height: 1.5;
      font-size: 13px;
    }

    .footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes counterSpin {
      to { transform: rotate(-360deg); }
    }

    /* =========================
       모바일 대응
    ========================== */
    @media (max-width: 760px) {
      .wrap {
        padding: 10px 8px 30px;
      }

      .topbar {
        grid-template-columns: 1fr auto;
      }

      .guide {
        display: none;
      }

      .trophy {
        font-size: 34px;
      }

      h1 {
        font-size: 22px;
      }

      .subtitle {
        display: none;
      }

      .mode-tab {
        padding: 9px 13px;
        font-size: 12px;
      }

      .hero-tools {
        grid-template-columns: 1fr auto auto;
      }

      .btn {
        font-size: 0;
        width: 38px;
        padding: 9px 0;
      }

      #refreshBtn::before {
        content: "🔄";
        font-size: 16px;
      }

      #suggestBtn::before {
        content: "💬";
        font-size: 16px;
      }

      .chick-banner {
        grid-template-columns: 48px 1fr;
        padding: 11px 12px;
      }

      .chick-icon {
        font-size: 40px;
      }

      .chick-title {
        font-size: 16px;
      }

      .chick-tags {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }

      .dashboard,
      .top-grid {
        grid-template-columns: 1fr;
      }

      .section h2,
      .overall h2 {
        font-size: 15px;
      }

      .rank-table th:nth-child(3),
      .rank-table td:nth-child(3),
      .rank-table th:nth-child(4),
      .rank-table td:nth-child(4) {
        display: none;
      }

      .rank-table th,
      .rank-table td {
        padding: 8px 6px;
        font-size: 12px;
      }

      .reviews {
        font-size: 11px;
      }

      .class-grid {
        grid-template-columns: 1fr;
      }

      .class-card:not(.active-mobile) {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <!-- =========================
         상단 영역
    ========================== -->
    <section class="topbar">
      <div class="brand">
        <div class="trophy">🏆</div>
        <div>
          <h1>KINOJO 명예의 전당</h1>
          <div class="subtitle">전투력과 성장 기록으로 선정된 최고의 모험가들</div>
        </div>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="main">본캐 기준</button>
        <button class="mode-tab" data-mode="all">전체 기준</button>
      </div>

      <div class="guide">ⓘ 기준 안내</div>
    </section>

    <!-- =========================
         검색 / 제안
    ========================== -->
    <section class="hero-tools">
      <input class="search" id="searchInput" placeholder="캐릭터명 / 서버 / 직업 검색" />
      <button class="btn" id="refreshBtn" type="button">새로고침</button>
      <button class="btn" id="suggestBtn" type="button">항목 제안</button>
    </section>

    <!-- =========================
         신입 병아리
    ========================== -->
    <section class="chick-banner" id="chickBanner">
      <div class="chick-icon">🐥</div>
      <div>
        <div class="chick-title" id="chickTitle">🐣 신입 병아리</div>
        <div class="chick-desc">2026년 5월 29일 이후 새로 등록된 신규 모험가</div>
      </div>
      <div class="chick-tags" id="chickTags"></div>
    </section>

    <!-- =========================
         항목 제안 폼
    ========================== -->
    <section class="section" id="suggestionBox" style="display:none; margin-bottom:12px;">
      <div class="section-head">
        <h2>➕ 새로운 항목 제안하기</h2>
        <span class="section-note">운영자 검토 후 반영</span>
      </div>
      <div class="list">
        <input class="search" id="suggestTitle" placeholder="항목 이름" />
        <input class="search" id="suggestProposer" placeholder="제안자" />
        <textarea class="search" id="suggestMemo" rows="3" placeholder="기준 설명"></textarea>
        <button class="btn" id="submitSuggestBtn" type="button">제안 보내기</button>
      </div>
    </section>

    <!-- =========================
         데이터 렌더링 영역
    ========================== -->
    <div id="app" class="loading">
      <div>
        <div class="loader-ring"></div>
        <div>명예의 전당 데이터를 불러오는 중...</div>
      </div>
    </div>

    <footer class="footer">※ 순위는 조회 데이터 기준으로 집계됩니다.</footer>
  </main>

  <script>
    /* =========================
       설정값
    ========================== */
    const WEB_APP_URL = new URLSearchParams(location.search).get("api")
      || "https://script.google.com/macros/s/AKfycbztXbGEbiId1yOfa3CVmErivNVi5IUi64qxIQRf8Sm_KduCPieeAKlNRMGyYkKL5iPaYg/exec";

    const CLASS_ORDER = [
      "검성",
      "수호성",
      "살성",
      "궁성",
      "정령성",
      "마도성",
      "치유성",
      "호법성"
    ];

    const PAGE_SIZE = 10;

    let hallData = null;
    let keyword = "";
    let mode = "main";
    let page = 1;
    let activeClass = "검성";

    const app = document.getElementById("app");

    /* =========================
       공통 유틸
    ========================== */
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function rankIcon(index) {
      if (index === 0) return "🥇";
      if (index === 1) return "🥈";
      if (index === 2) return "🥉";
      return String(index + 1);
    }

    function currentOverall() {
      return mode === "main"
        ? (hallData.overallMain || [])
        : (hallData.overallAll || []);
    }

    function currentClasses() {
      return mode === "main"
        ? (hallData.classMain || {})
        : (hallData.classAll || {});
    }

    function matchKeyword(item) {
      if (!keyword) return true;

      const text = [
        item.name,
        item.serverName,
        item.meta,
        item.className,
        item.pveReview,
        item.pvpReview
      ].join(" ").toLowerCase();

      return text.includes(keyword.toLowerCase());
    }

    /* =========================
       작은 랭킹 행
    ========================== */
    function miniRow(item, index) {
      return `
        <div class="mini-row">
          <div class="medal">${rankIcon(index)}</div>
          <div>
            <div class="name">${escapeHtml(item.name)}</div>
            ${item.meta ? `<div class="meta">${escapeHtml(item.meta)}</div>` : ""}
          </div>
          <div class="score">${escapeHtml(item.label)}</div>
        </div>
      `;
    }

    function rankBox(title, note, list) {
      const items = (list || []).filter(matchKeyword);

      return `
        <section class="section">
          <div class="section-head">
            <h2>${title}</h2>
            <span class="section-note">${note || ""}</span>
          </div>
          <div class="list">
            ${
              items.length
                ? items.map(miniRow).join("")
                : `<div class="empty">아직 데이터가 부족해요.</div>`
            }
          </div>
        </section>
      `;
    }

    /* =========================
       이름표 섹션
    ========================== */
    function tagBox(title, note, list) {
      const items = (list || []).filter(matchKeyword);

      const body = items.length
        ? items.map(item => `
            <div class="name-tag">
              ${escapeHtml(item.name)}
              ${item.meta ? `<div class="tag-meta">${escapeHtml(item.meta)}</div>` : ""}
            </div>
          `).join("")
        : `<div class="empty">아직 데이터가 부족해요.</div>`;

      return `
        <section class="section">
          <div class="section-head">
            <h2>${title}</h2>
            <span class="section-note">${note || ""}</span>
          </div>
          <div class="tag-list">${body}</div>
        </section>
      `;
    }

    /* =========================
       신입 병아리
    ========================== */
    function renderChicks() {
      const items = (hallData.newChicks || []).filter(matchKeyword);
      const banner = document.getElementById("chickBanner");
      const tags = document.getElementById("chickTags");
      const title = document.getElementById("chickTitle");

      if (!items.length) {
        banner.style.display = "none";
        return;
      }

      banner.style.display = "grid";
      title.textContent = `🐣 신입 병아리 ${items.length}명 입장!`;

      tags.innerHTML = items
        .slice(0, 3)
        .map(item => `
          <span class="chick-tag">
            ${escapeHtml(item.name)}
            ${item.meta ? `<br><small>${escapeHtml(item.meta)}</small>` : ""}
          </span>
        `)
        .join("") + `<span class="chick-tag">자세히 보기 ›</span>`;

      banner.onclick = () => {
        const message = "🐣 신입 병아리\n\n" + items
          .map(item => item.meta ? `${item.name}\n${item.meta}` : item.name)
          .join("\n\n");

        alert(message);
      };
    }

    /* =========================
       전체 순위
    ========================== */
    function overallTable() {
      const list = currentOverall().filter(matchKeyword);
      const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));

      if (page > totalPages) page = totalPages;

      const start = (page - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);

      return `
        <section class="overall">
          <div class="overall-head">
            <h2>
              🏅 키노조 전체 순위
              <small>(${mode === "main" ? "본캐 기준" : "전체 기준"})</small>
            </h2>
            <div class="page-tools">
              <span>${page} / ${totalPages} 페이지</span>
              <button class="page-btn" data-page="prev" type="button">‹</button>
              <button class="page-btn" data-page="next" type="button">›</button>
            </div>
          </div>

          <table class="rank-table">
            <thead>
              <tr>
                <th class="num">순위</th>
                <th>캐릭터명</th>
                <th>서버</th>
                <th>PVE 전투력</th>
                <th>PVP 전투력</th>
                <th>AI 리뷰</th>
              </tr>
            </thead>
            <tbody>
              ${
                slice.map((item, index) => `
                  <tr>
                    <td class="num">${start + index < 3 ? rankIcon(start + index) : start + index + 1}</td>
                    <td><strong>${escapeHtml(item.name)}</strong></td>
                    <td>${escapeHtml(item.meta || "지켈")}</td>
                    <td class="power">${escapeHtml(item.pvePowerLabel || item.label || "")}</td>
                    <td class="power">${escapeHtml(item.pvpPowerLabel || "")}</td>
                    <td class="reviews">
                      <div>⚔ ${escapeHtml(item.pveReview || "")}</div>
                      <div>🛡 ${escapeHtml(item.pvpReview || "")}</div>
                    </td>
                  </tr>
                `).join("")
              }
            </tbody>
          </table>
        </section>
      `;
    }

    /* =========================
       클래스별 순위
    ========================== */
    function classSection() {
      const rankings = currentClasses();

      const tabs = CLASS_ORDER
        .map(className => `
          <button
            class="pill ${activeClass === className ? "active" : ""}"
            data-class="${className}"
            type="button"
          >
            ${className}
          </button>
        `)
        .join("");

      const cards = CLASS_ORDER
        .map(className => {
          const list = rankings[className] || [];

          return `
            <div class="class-card ${activeClass === className ? "active-mobile" : ""}">
              <div class="class-title">${className} TOP 3</div>
              ${
                list.length
                  ? list.map(miniRow).join("")
                  : `<div class="empty">데이터 부족</div>`
              }
            </div>
          `;
        })
        .join("");

      return `
        <section class="section classes">
          <div class="section-head">
            <h2>⚔ 클래스별 전투력 TOP3</h2>
            <span class="section-note">모바일 탭 방식</span>
          </div>
          <div class="class-tabs">${tabs}</div>
          <div class="class-grid">${cards}</div>
        </section>
      `;
    }

    /* =========================
       전체 렌더링
    ========================== */
    function render() {
      if (!hallData) return;

      renderChicks();
      app.className = "";

      app.innerHTML = `
        <div class="dashboard">
          <div>
            <div class="top-grid">
              ${rankBox("⚔ PVE TOP 3", "", hallData.pveTop)}
              ${rankBox("⚔ PVP TOP 3", "", hallData.pvpTop)}
            </div>
          </div>

          <div class="side-stack">
            ${tagBox("😈 같은 마족이면 가족이지", "타서버 마족", hallData.demonFamily)}
            ${tagBox("🤝 같은 파티면 친구지", "천족 서버", hallData.partyFriend)}
          </div>
        </div>

        ${overallTable()}
        ${classSection()}
      `;

      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      document.querySelectorAll("[data-page]").forEach(button => {
        button.onclick = () => {
          const list = currentOverall().filter(matchKeyword);
          const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));

          page += button.dataset.page === "next" ? 1 : -1;
          if (page < 1) page = 1;
          if (page > totalPages) page = totalPages;

          render();
        };
      });

      document.querySelectorAll("[data-class]").forEach(button => {
        button.onclick = () => {
          activeClass = button.dataset.class;
          render();
        };
      });
    }

    /* =========================
       데이터 로드
    ========================== */
    async function load() {
      app.className = "loading";
      app.innerHTML = `
        <div>
          <div class="loader-ring"></div>
          <div>명예의 전당 데이터를 불러오는 중...</div>
        </div>
      `;

      try {
        const url = `${WEB_APP_URL}${WEB_APP_URL.includes("?") ? "&" : "?"}action=hallOfFame&t=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });
        const text = await response.text();

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${text.slice(0, 180)}`);
        }

        hallData = JSON.parse(text);
        render();
      } catch (error) {
        app.className = "";
        app.innerHTML = `
          <div class="error-box">
            <strong>명예의 전당 데이터를 불러오지 못했습니다.</strong><br>
            Apps Script 배포 상태와 웹앱 URL을 확인해 주세요.<br>
            <small>${escapeHtml(error.message || error)}</small>
          </div>
        `;
      }
    }

    /* =========================
       고정 이벤트
    ========================== */
    document.querySelectorAll("[data-mode]").forEach(button => {
      button.onclick = () => {
        mode = button.dataset.mode;
        page = 1;

        document.querySelectorAll("[data-mode]").forEach(item => {
          item.classList.toggle("active", item === button);
        });

        render();
      };
    });

    document.getElementById("searchInput").oninput = event => {
      keyword = event.target.value.trim();
      page = 1;
      render();
    };

    document.getElementById("refreshBtn").onclick = () => {
      load();
    };

    document.getElementById("suggestBtn").onclick = () => {
      const box = document.getElementById("suggestionBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    };

    document.getElementById("submitSuggestBtn").onclick = async () => {
      const title = document.getElementById("suggestTitle").value.trim();
      const proposer = document.getElementById("suggestProposer").value.trim();
      const memo = document.getElementById("suggestMemo").value.trim();

      if (!title) {
        alert("항목 이름을 입력해 주세요.");
        return;
      }

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "hallSuggestion",
            title,
            proposer,
            memo
          })
        });

        const data = await response.json();

        if (!data.ok) {
          alert(data.message || "전송 실패");
          return;
        }

        alert("제안이 접수되었습니다.");
        load();
      } catch (error) {
        alert("제안 전송에 실패했습니다: " + (error.message || error));
      }
    };

    load();
  </script>
</body>
</html>
