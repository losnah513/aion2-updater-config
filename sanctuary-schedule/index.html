<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>KINOJO INFO - 성역으로 이동 중</title>
<meta name="robots" content="noindex,follow"/>
<link rel="canonical" href="https://kinojo.info/sanctuary/"/>
<noscript><meta http-equiv="refresh" content="0;url=/sanctuary/?view=schedule"/></noscript>
<script>
(function(){
  'use strict';
  // Legacy bookmarks remain safe while the upgraded Sanctuary becomes the only product page.
  const destination=new URL('/sanctuary/',location.origin);
  const incoming=new URLSearchParams(location.search);
  incoming.forEach((value,key)=>destination.searchParams.append(key,value));
  if(!destination.searchParams.has('view'))destination.searchParams.set('view','schedule');
  destination.hash=location.hash;
  location.replace(destination.pathname+destination.search+destination.hash);
})();
</script>
</head>
<body><p><a href="/sanctuary/?view=schedule">새 성역 페이지로 이동</a></p></body>
</html>
