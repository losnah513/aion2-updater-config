name: KINOJO temporary 4-D apply

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == 'KINOJO_MY_INFO_4D_APPLY2_20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Stage 4-D patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          cat .kinojo-tmp/4d.part1 .kinojo-tmp/4d.part2 .kinojo-tmp/4d.part3 .kinojo-tmp/4d.part4 | base64 -d > /tmp/4d.patch
          git apply --check /tmp/4d.patch
          git apply /tmp/4d.patch
          node --check ui/kinojo-common-ui.js
          git diff --check
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git rm -r -f --ignore-unmatch .kinojo-tmp .github/workflows/kinojo-temp-4d.yml ui/.my-info-4d-issue-trigger ui/.my-info-4d-probe-ok ui/.my-info-4d-final-trigger ui/.my-info-4d-arm
          git add ui/kinojo-common-ui.js ui/kinojo-my-info.css
          git commit -m "Add local profile image preview in My Info"
          git push origin HEAD:main
