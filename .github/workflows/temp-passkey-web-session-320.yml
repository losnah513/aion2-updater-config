name: TEMP PASS KEY WEB session 320 cutover

on:
  push:
    branches:
      - agent/passkey-web-session-320-20260816

permissions:
  contents: write

jobs:
  apply-session-cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply and verify opaque WEB session cutover
        shell: bash
        env:
          CUTOVER_PATCH_SHA256: dab0201a7dc42c489a525459527d8bc2ca9552418109fd749c4480c7a90fd366
        run: |
          set -euo pipefail
          cat > /tmp/web-cutover.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          sed -i 's/^          //' /tmp/web-cutover.patch.gz.b64
          base64 --decode /tmp/web-cutover.patch.gz.b64 | gzip --decompress > /tmp/web-cutover.patch
          echo "$CUTOVER_PATCH_SHA256  /tmp/web-cutover.patch" | sha256sum --check -
          git apply --check /tmp/web-cutover.patch
          git apply /tmp/web-cutover.patch
          node --check core/kinojo-auth-service.js
          node --check core/kinojo-auth-session.js
          node --check core/kinojo-auth-ui.js
          node --check tests/web-shell-auth-contract.test.js
          CI=false node tests/web-shell-auth-contract.test.js

      - name: Commit generated WEB session cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md core/kinojo-auth-ui.js \
            home.html m/index.html hof/index.html m/hof/index.html ranking/index.html m/ranking/index.html \
            sanctuary/index.html m/sanctuary/index.html sanctuary-schedule/index.html m/sanctuary-schedule/index.html \
            meter/index.html m/meter/index.html arcana/index.html m/arcana/index.html admin/index.html m/admin/index.html
          git diff --cached --check
          git commit -m "Complete opaque WEB session client cutover"
          git push origin "HEAD:${GITHUB_REF_NAME}"
