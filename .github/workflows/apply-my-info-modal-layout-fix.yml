name: Apply My Info Standalone Modal Layout Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-my-info-modal-layout-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          js_path=Path('ui/kinojo-common-ui.js')
          css_path=Path('ui/kinojo-my-info.css')
          js=js_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')
          js=js.replace("    if(!loggedIn)closeMyInfoPanel();","    if(!loggedIn){closeMyInfoPanel();closeMyInfoModal();}",1)
          pat=re.compile(r'''          <button class="kinojo-my-info-menu-btn is-active" id="kinojoMyInfoMenuBtn".*?</button>\n          <section class="kinojo-my-info-view is-active" id="kinojoMyInfoProfileView".*?</section>\n''',re.S)
          repl='''          <button class="kinojo-my-info-menu-btn" id="kinojoMyInfoMenuBtn" type="button" aria-haspopup="dialog" aria-controls="kinojoMyInfoModal">\n            <span>내 정보</span><small>이미지 관리 Preview</small>\n          </button>\n'''
          js,n=pat.subn(repl,js,count=1)
          if n!=1: raise SystemExit(f'panel replace={n}')
          pat=re.compile(r'''  function activateMyInfoView_\(target\)\{.*?\n  \}\n  function openMyInfoPanel\(\)\{''',re.S)
          repl='''  function makeMyInfoModal(){
    const modal=document.createElement('section');
    modal.className='kinojo-my-info-modal';
    modal.id='kinojoMyInfoModal';
    modal.setAttribute('aria-hidden','true');
    modal.innerHTML=`
      <div class="kinojo-my-info-modal-backdrop" data-kinojo-my-info-modal-close></div>
      <div class="kinojo-my-info-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="kinojoMyInfoModalTitle" tabindex="-1">
        <button class="kinojo-my-info-modal-close" type="button" aria-label="내 정보 닫기" data-kinojo-my-info-modal-close>×</button>
        <div class="kinojo-my-info-preview-state">
          <span class="kinojo-my-info-preview-badge">PREVIEW</span>
          <strong id="kinojoMyInfoModalTitle">내 정보</strong>
          <p>프로필·캐릭터 이미지 관리 화면을 준비 중입니다.</p>
        </div>
      </div>`;
    document.body.appendChild(modal);
  }
  function openMyInfoModal(){
    const modal=q('#kinojoMyInfoModal');
    if(!modal||!window.KinojoAuth?.getSession?.())return;
    closeMyInfoPanel();
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    document.body.classList.add('kinojo-my-info-modal-open');
    const dialog=q('.kinojo-my-info-modal-dialog',modal);
    if(dialog)dialog.scrollTop=0;
    requestAnimationFrame(()=>{try{dialog?.focus({preventScroll:true});}catch(_err){dialog?.focus();}});
  }
  function closeMyInfoModal(){
    const modal=q('#kinojoMyInfoModal');
    if(modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');}
    document.body.classList.remove('kinojo-my-info-modal-open');
  }
  function openMyInfoPanel(){'''
          js,n=pat.subn(repl,js,count=1)
          if n!=1: raise SystemExit(f'activate replace={n}')
          js=js.replace("    activateMyInfoView_('profile');\n",'',1)
          old="    q('#kinojoMyInfoMenuBtn')?.addEventListener('click',e=>{e.preventDefault();activateMyInfoView_(e.currentTarget.dataset.myInfoTarget);});"
          new="    q('#kinojoMyInfoMenuBtn')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openMyInfoModal();});\n    q('#kinojoMyInfoModal')?.addEventListener('click',e=>{if(e.target instanceof Element&&e.target.closest('[data-kinojo-my-info-modal-close]')){e.preventDefault();e.stopPropagation();closeMyInfoModal();}});"
          if old not in js: raise SystemExit('bind missing')
          js=js.replace(old,new,1)
          old="    document.addEventListener('keydown',e=>{if(e.key==='Escape'){const myInfo=q('#kinojoMyInfoLayer');if(myInfo?.classList.contains('open'))return closeMyInfoPanel();const p=q('#drawerPagePanel');if(p?.classList.contains('open'))return closeDrawerPagePanel();const d=q('#sideDrawer');if(d?.classList.contains('open'))return closeSideDrawer();}});"
          new="    document.addEventListener('keydown',e=>{if(e.key==='Escape'){const modal=q('#kinojoMyInfoModal');if(modal?.classList.contains('open'))return closeMyInfoModal();const myInfo=q('#kinojoMyInfoLayer');if(myInfo?.classList.contains('open'))return closeMyInfoPanel();const p=q('#drawerPagePanel');if(p?.classList.contains('open'))return closeDrawerPagePanel();const d=q('#sideDrawer');if(d?.classList.contains('open'))return closeSideDrawer();}});"
          if old not in js: raise SystemExit('escape missing')
          js=js.replace(old,new,1)
          if "  makeMyInfoPanel();\n" not in js: raise SystemExit('init missing')
          js=js.replace("  makeMyInfoPanel();\n","  makeMyInfoPanel();\n  makeMyInfoModal();\n",1)
          js=js.replace(".admin-panel-modal';",".admin-panel-modal,.kinojo-my-info-modal';",1)
          js=js.replace("openMyInfoPanel,closeMyInfoPanel,toggleAdminMenu","openMyInfoPanel,closeMyInfoPanel,openMyInfoModal,closeMyInfoModal,toggleAdminMenu",1)
          if 'kinojoMyInfoProfileView' in js or 'activateMyInfoView_' in js: raise SystemExit('legacy JS remains')
          marker='/* 20260819_05: 1-F layout correction'
          if marker not in css: raise SystemExit('old CSS marker missing')
          css=css.replace('/* KINOJO My Info panel shell v20260819.03 */','/* KINOJO My Info panel shell v20260819.04 */',1)
          css=css[:css.index(marker)].rstrip()+'''\n\n/* 20260819_06: 1-F layout correction 2 — body-level modal */
body.kinojo-my-info-modal-open{overflow:hidden}
.kinojo-my-info-modal{position:fixed;inset:0;z-index:12000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.34);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-sizing:border-box}
.kinojo-my-info-modal.open{display:flex}
.kinojo-my-info-modal-backdrop{position:absolute;inset:0}
.kinojo-my-info-modal-dialog{position:relative;width:min(760px,calc(100vw - 36px));max-height:calc(100dvh - 32px);overflow-y:auto;padding:26px 28px 30px;border:1px solid rgba(148,163,184,.3);border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.99),rgba(248,250,252,.99));box-shadow:0 24px 64px rgba(15,23,42,.22);color:#0f172a;outline:none}
.kinojo-my-info-modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:999px;background:rgba(15,23,42,.07);color:#334155;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:5}
.kinojo-my-info-modal .kinojo-my-info-preview-state{margin:0;padding-top:18px}
@media(max-width:640px){.kinojo-my-info-modal{padding:12px}.kinojo-my-info-modal-dialog{width:min(430px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:20px;border-radius:22px}}
'''
          if css.count('{')!=css.count('}'): raise SystemExit('css braces')
          js_path.write_text(js,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY
          node --check ui/kinojo-common-ui.js
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-my-info-modal-layout-fix.yml
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add ui/kinojo-common-ui.js ui/kinojo-my-info.css .github/workflows/apply-my-info-modal-layout-fix.yml
          git commit -m "Open my info as standalone modal"
          git push origin main
