<style>
:root{--text:#263444;--muted:#667085;--line:#e5e7eb;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:#f6f7f9}.wrap{width:min(1080px,calc(100% - 24px));margin:0 auto;padding:18px 0 40px}.hero{text-align:center}.eyebrow{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;color:#475467;font-size:12px;font-weight:900}h1{margin:12px 0 5px;font-size:clamp(32px,7vw,56px);letter-spacing:-1.6px}.subtitle{margin:0 auto 14px;color:var(--muted);font-size:15px;line-height:1.55;max-width:560px}.hall-banner{display:block;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff;text-decoration:none;color:inherit;transition:.16s ease}.hall-banner:hover{transform:translateY(-1px);filter:brightness(1.03)}.hall-banner img{display:block;width:100%;height:auto}.sanctuary-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.card{position:relative;display:block;min-height:128px;padding:17px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;text-decoration:none;color:inherit}.card.disabled{opacity:.78;cursor:not-allowed}.icon img{width:36px;height:36px}.card-title{font-size:22px;font-weight:1000;letter-spacing:-.5px}.card-sub{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.45}.badge{position:absolute;right:14px;top:14px;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:1000;background:#f2f4f7;color:#667085;border:1px solid var(--line)}.footer{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:22px}.footer a{color:#667085;text-decoration:none;font-size:12px;font-weight:900}.footer a:hover{color:#2563eb}@media(max-width:720px){.wrap{width:min(100%,calc(100% - 16px));padding:12px 0 32px}.sanctuary-row{grid-template-columns:1fr;gap:10px}.card{min-height:112px;border-radius:16px;padding:16px}.card-title{font-size:21px}.hall-banner{border-radius:14px}}
</style>
