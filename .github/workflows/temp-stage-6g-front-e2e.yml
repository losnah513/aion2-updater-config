name: Temp Stage 6-G FRONT E2E Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-stage-6g-front-e2e.yml"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary FRONT object through existing duplicate-complete cleanup path
        shell: bash
        env:
          SUPABASE_URL: "https://josvoltpktvwysrasffq.supabase.co"
          PUBLISHABLE_KEY: "sb_publishable__v26JGbKRFKGbU0SseU5Iw_qwIoHUAC"
          SESSION_TOKEN: "kws_a314e1da6c07c6f6db3a4840fe66c7cd1bf2638f555823db93ff00dff43595fa412b4daa"
        run: |
          set -euo pipefail
          ENDPOINT="$SUPABASE_URL/functions/v1/kinojo-member-profile"
          HTTP=$(curl -sS -o /tmp/response.json -w '%{http_code}' "$ENDPOINT" \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"action":"reference-upload-complete","sessionToken":"'$SESSION_TOKEN'","characterId":111,"slot":"FRONT","objectPath":"characters/111/FRONT/710114f2d80643588580c079519eb12b.png","mimeType":"image/png","sizeBytes":68}')
          cat /tmp/response.json
          test "$HTTP" = "409"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/response.json'))
          assert d.get('code')=='REFERENCE_SLOT_EXISTS',d
          print('EXPECTED_DUPLICATE_COMPLETE_CLEANUP_PATH')
          PY
