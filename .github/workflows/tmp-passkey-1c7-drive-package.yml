name: Temporary PASS KEY 1-C-7 Drive package

on:
  push:
    branches:
      - agent/passkey-1c7-final-audit

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passkey-1c7-final-audit
      - name: Stage changed WEB files
        run: |
          mkdir -p /tmp/kinojo-drive-sync
          while IFS= read -r file; do
            mkdir -p "/tmp/kinojo-drive-sync/$(dirname "$file")"
            cp "$file" "/tmp/kinojo-drive-sync/$file"
          done <<'EOF'
          admin/index.html
          arcana/index.html
          core/kinojo-auth-service.js
          core/kinojo-auth-session.js
          core/kinojo-auth-ui.js
          core/kinojo-supabase-features.js
          hof/index.html
          hof/js/hall-data.js
          home.html
          m/admin/index.html
          m/arcana/index.html
          m/hof/index.html
          m/index.html
          m/meter/index.html
          m/ranking/index.html
          m/sanctuary-schedule/index.html
          m/sanctuary/index.html
          meter/index.html
          meter/js/meter-app.js
          ranking/index.html
          sanctuary-schedule/index.html
          sanctuary-schedule/js/sanctuary-schedule.js
          sanctuary/index.html
          sanctuary/js/sanctuary.js
          tests/meter-presence-log-contract.test.js
          tests/sanctuary-waitlist-contract.test.js
          tests/staged-page-contract.test.js
          tests/web-shell-auth-contract.test.js
          ui/kinojo-character-reaction.js
          ui/kinojo-common-ui.js
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: passkey-1c7-drive-sync
          path: /tmp/kinojo-drive-sync
          if-no-files-found: error
          retention-days: 1
