name: Verify Banner Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "home.html"
      - "m/index.html"
      - "ui/kinojo-banner-runtime.js"
      - "ui/kinojo-pc-banners.js"
      - "ui/kinojo-pc-banners.css"
      - "tests/banner-manifest-client-contract.test.js"
      - "tests/banner-home-first-paint-contract.test.js"
      - "tests/banner-home-main-live-e2e.js"
      - "tests/banner-admin-main-ui-contract.test.js"
      - "tests/banner-admin-chrome-e2e.html"
      - "tests/banner-pc-side-live-e2e.js"
      - "tests/banner-mobile-main-live-e2e.js"
      - "admin/js/admin.js"
      - "admin/js/admin-banner-delete.js"
      - "admin/js/admin-banner-events.js"
      - "admin/index.html"
      - "m/admin/index.html"
      - ".github/workflows/verify-banner-runtime.yml"
  push:
    branches: [main]
    paths:
      - "home.html"
      - "m/index.html"
      - "ui/kinojo-banner-runtime.js"
      - "ui/kinojo-pc-banners.js"
      - "ui/kinojo-pc-banners.css"
      - "tests/banner-manifest-client-contract.test.js"
      - "tests/banner-home-first-paint-contract.test.js"
      - "tests/banner-home-main-live-e2e.js"
      - "tests/banner-admin-main-ui-contract.test.js"
      - "tests/banner-admin-chrome-e2e.html"
      - "tests/banner-pc-side-live-e2e.js"
      - "tests/banner-mobile-main-live-e2e.js"
      - "admin/js/admin.js"
      - "admin/js/admin-banner-delete.js"
      - "admin/js/admin-banner-events.js"
      - "admin/index.html"
      - "m/admin/index.html"
      - ".github/workflows/verify-banner-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-banner-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify Manifest client contract
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/kinojo-banner-runtime.js
          node --check ui/kinojo-pc-banners.js
          node --check tests/banner-pc-side-live-e2e.js
          node --check tests/banner-mobile-main-live-e2e.js
          node --check tests/banner-home-main-live-e2e.js
          node tests/banner-manifest-client-contract.test.js
          node tests/banner-home-first-paint-contract.test.js
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const css=fs.readFileSync('ui/kinojo-pc-banners.css','utf8');
          const js=fs.readFileSync('ui/kinojo-pc-banners.js','utf8');
          const mobileFiles=[
            'm/index.html',
            'm/hof/index.html',
            'm/ranking/index.html',
            'm/legion-tree/index.html',
            'm/meter/index.html',
            'm/sanctuary/index.html',
            'm/sanctuary-schedule/index.html',
          ];
          assert.match(css,/\.kinojo-pc-banner-slot\{[\s\S]*?display:none;/);
          assert.deepEqual([...css.matchAll(/@media\s*\(min-width:(\d+)px\)/g)].map(match=>Number(match[1])),[1840]);
          assert.match(css,/@media \(min-width:1840px\)\{[\s\S]*?\.kinojo-pc-banner-slot\{[\s\S]*?display:grid;/);
          for(const file of mobileFiles){
            const html=fs.readFileSync(file,'utf8');
            assert.equal(html.includes('kinojo-pc-banners.css'),false,file+' must not load PC SIDE banner CSS');
            assert.equal(html.includes('kinojo-pc-banners.js'),false,file+' must not load PC SIDE banner JS');
            assert.equal(html.includes('data-kinojo-pc-banner'),false,file+' must not declare a static PC SIDE slot');
          }
          assert.match(css,/\.kinojo-pc-banner-slot\{[\s\S]*aspect-ratio:300\/715;[\s\S]*overflow:hidden;/);
          assert.match(css,/@media \(min-width:1840px\)\{[\s\S]*position:fixed;[\s\S]*width:300px;[\s\S]*height:715px;/);
          assert.match(css,/border-radius:4px;/);
          assert.match(css,/\.kinojo-pc-banner-media\{[\s\S]*overflow:hidden;[\s\S]*border-radius:inherit;/);
          assert.match(css,/data-kinojo-pc-banner-state="empty"[\s\S]*place-items:center;/);
          assert.match(js,/const documentTop=hostRect\.top\+window\.scrollY;/);
          assert.match(js,/const maxTop=Math\.max\(14,window\.innerHeight-height-14\);/);
          console.log('KINOJO PC SIDE fixed/ratio/overflow/corner/empty + mobile/breakpoint contract: PASS');
          NODE

      - name: Verify admin banner Chrome E2E
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/js/admin.js
          node --check admin/js/admin-banner-delete.js
          node --check admin/js/admin-banner-events.js
          node tests/banner-admin-main-ui-contract.test.js
          node tests/banner-admin-quality-contract.test.js
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo "Chrome/Chromium is required for banner admin E2E." >&2
            exit 1
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --allow-file-access-from-files \
            --virtual-time-budget=30000 --dump-dom "file://$PWD/tests/banner-admin-chrome-e2e.html#images" \
            > /tmp/banner-admin-chrome-e2e.html
          if ! grep -F 'data-e2e-result="PASS"' /tmp/banner-admin-chrome-e2e.html; then
            grep -o '<pre id="e2eResult">[^<]*' /tmp/banner-admin-chrome-e2e.html || true
            exit 1
          fi

  verify-live-readback:
    if: github.event_name == 'push'
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_BASE: https://kinojo.info
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish live readback pending status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-runtime-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "kinojo/banner-runtime-live-readback",
              "description": "배너 Manifest client 운영 확인 중",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-runtime-status.json >/dev/null

      - name: Verify banner web byte readback
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "home.html"
            "ui/kinojo-banner-runtime.js"
            "ui/kinojo-pc-banners.js"
            "ui/kinojo-pc-banners.css"
            "admin/js/admin.js"
            "admin/js/admin-banner-delete.js"
            "admin/js/admin-banner-events.js"
            "admin/index.html"
            "m/admin/index.html"
            "m/index.html"
            "m/hof/index.html"
            "m/ranking/index.html"
            "m/legion-tree/index.html"
            "m/meter/index.html"
            "m/sanctuary/index.html"
            "m/sanctuary-schedule/index.html"
          )
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          key="${GITHUB_SHA:0:12}-$(date -u +%s)"
          for attempt in $(seq 1 15); do
            mismatch=0
            for path in "${files[@]}"; do
              tmp="$tmp_dir/$(echo "$path" | tr '/' '_')"
              if curl --fail --silent --show-error --location --compressed \
                --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' "$LIVE_BASE/$path?verify=$key-$attempt" -o "$tmp" \
                && cmp -s "$path" "$tmp"; then
                echo "MATCH $path"
              else
                echo "WAIT $path attempt=$attempt"
                mismatch=1
              fi
            done
            [[ "$mismatch" -eq 0 ]] && exit 0
            [[ "$attempt" -lt 15 ]] && sleep 20
          done
          echo "Banner WEB live readback did not converge to main source." >&2
          exit 1

      - name: Verify live Manifest ETag client flow
        shell: bash
        env:
          KINOJO_BANNER_LIVE: "1"
        run: |
          set -euo pipefail
          node tests/banner-manifest-client-contract.test.js

      - name: Verify PC SIDE live Chrome layout
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo "Chrome/Chromium is required for PC SIDE live E2E." >&2
            exit 1
          fi
          npm install --no-save --no-package-lock puppeteer-core@24.16.0 >/dev/null
          CHROME_BIN="$chrome" LIVE_BASE="$LIVE_BASE" node tests/banner-pc-side-live-e2e.js
          CHROME_BIN="$chrome" LIVE_BASE="$LIVE_BASE" node tests/banner-home-main-live-e2e.js

      - name: Verify mobile MAIN live fallback
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo "Chrome/Chromium is required for mobile MAIN live E2E." >&2
            exit 1
          fi
          CHROME_BIN="$chrome" LIVE_BASE="$LIVE_BASE" node tests/banner-mobile-main-live-e2e.js

      - name: Publish live readback success status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-runtime-status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "kinojo/banner-runtime-live-readback",
              "description": "Manifest·PC SIDE·모바일 MAIN Chrome 운영 확인 완료",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-runtime-status.json >/dev/null

      - name: Publish live readback failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-runtime-status.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": "kinojo/banner-runtime-live-readback",
              "description": "Manifest/PC SIDE/모바일 MAIN 운영 readback 실패",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-runtime-status.json >/dev/null
