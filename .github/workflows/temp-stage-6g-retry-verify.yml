name: Temp Stage 6-G Retry Verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-stage-6g-retry-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify FRONT complete retry is idempotent
        shell: bash
        env:
          SUPABASE_URL: "https://josvoltpktvwysrasffq.supabase.co"
          PUBLISHABLE_KEY: "sb_publishable__v26JGbKRFKGbU0SseU5Iw_qwIoHUAC"
          SESSION_TOKEN: "kws_stage6gstage6gstage6gstage6gstage6gstage6gstage6gstage6g"
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          open('/tmp/front.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zl1sAAAAASUVORK5CYII='))
          PY
          SIZE=$(wc -c </tmp/front.png | tr -d ' ')
          ENDPOINT="$SUPABASE_URL/functions/v1/kinojo-member-profile"
          PREP=$(curl --fail-with-body -sS "$ENDPOINT" -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data "{\"action\":\"reference-upload-prepare\",\"sessionToken\":\"$SESSION_TOKEN\",\"characterId\":111,\"slot\":\"FRONT\",\"mimeType\":\"image/png\",\"sizeBytes\":$SIZE}")
          echo "$PREP" >/tmp/prep.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/prep.json')); assert d.get('ok') is True,d
          open('/tmp/u','w').write(d['upload']['uploadUrl']); open('/tmp/p','w').write(d['upload']['objectPath'])
          print('PREP_OK',d['upload']['objectPath'])
          PY
          U=$(cat /tmp/u); P=$(cat /tmp/p)
          curl --fail-with-body -sS -X PUT "$U" -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $PUBLISHABLE_KEY" -H 'x-upsert: false' -F 'cacheControl=3600' -F '=@/tmp/front.png;type=image/png' >/tmp/upload.json
          for N in 1 2; do
            HTTP=$(curl -sS -o "/tmp/c$N.json" -w '%{http_code}' "$ENDPOINT" -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data "{\"action\":\"reference-upload-complete\",\"sessionToken\":\"$SESSION_TOKEN\",\"characterId\":111,\"slot\":\"FRONT\",\"objectPath\":\"$P\",\"mimeType\":\"image/png\",\"sizeBytes\":$SIZE}")
            test "$HTTP" = "200"
            python - "$N" <<'PY'
          import json,sys
          n=sys.argv[1]; d=json.load(open('/tmp/c'+n+'.json')); assert d.get('ok') is True,d; assert d['reference']['active'] is True,d
          print('COMPLETE_'+n+'_OK',d['reference']['objectPath'])
          PY
          done
          # Controlled cleanup: mismatch declared size makes Edge delete the exact test object before returning 409.
          BAD=$((SIZE+1))
          HTTP=$(curl -sS -o /tmp/cleanup.json -w '%{http_code}' "$ENDPOINT" -H "apikey: $PUBLISHABLE_KEY" -H "Authorization: Bearer $PUBLISHABLE_KEY" -H 'Content-Type: application/json' --data "{\"action\":\"reference-upload-complete\",\"sessionToken\":\"$SESSION_TOKEN\",\"characterId\":111,\"slot\":\"FRONT\",\"objectPath\":\"$P\",\"mimeType\":\"image/png\",\"sizeBytes\":$BAD}")
          test "$HTTP" = "409"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cleanup.json')); assert d.get('code')=='REFERENCE_UPLOAD_SIZE_MISMATCH',d
          print('CLEANUP_OBJECT_DELETE_OK')
          PY
