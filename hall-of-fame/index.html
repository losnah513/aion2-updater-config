<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="KINOJO INFO">
<meta property="og:description" content="전투력과 성장 기록으로 선정된 최고의 모험가들">
<meta property="og:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-banner-v2.png?v=uiux-latest">
<title>KINOJO INFO</title>
<link rel="stylesheet" href="css/hall.css?v=uiux-latest">
</head>
<body>
<main class="wrap">
<section class="top-utility" aria-label="KINOJO INFO 상단 메뉴">
  <button class="drawer-toggle" id="drawerToggleBtn" type="button" aria-label="메뉴 열기" aria-expanded="false"><span class="drawer-plus" aria-hidden="true"></span></button>
  <div class="top-right-tools">
    <section class="visit-mini" id="visitCard">👀 방문자 통계를 불러오는 중...</section>
    <div class="admin-menu-wrap">
      <button class="admin-menu-btn" id="adminMenuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="관리자 메뉴">⋮</button>
      <section class="admin-dropdown" id="adminDropdown" aria-hidden="true">
        <div class="admin-dropdown-head">
          <strong>관리자 전용 메뉴입니다.</strong>
          <button class="admin-dropdown-close" id="adminDropdownClose" type="button" aria-label="닫기">×</button>
        </div>
        <div class="admin-login-panel" id="adminLoginPanel">
          <input class="search admin-password" id="adminPasswordInput" type="password" placeholder="비밀번호 입력">
          <button class="btn" id="adminLoginBtn" type="button">확인</button>
          <div class="admin-status" id="adminStatus"></div>
        </div>
        <div class="admin-control-panel" id="adminControlPanel" style="display:none">
          <button class="btn" id="adminMvpBtn" type="button">MVP 후보 확인</button>
          <button class="btn" id="adminVisitBtn" type="button">방문자 수 +1</button>
          <button class="btn" id="adminBoostBtn" type="button">방문자 수 +31</button>
          <button class="btn" id="adminSnapshotBtn" type="button">성장왕 스냅샷 생성</button>
        </div>
      </section>
    </div>
  </div>
</section>
<section class="banner"><img src="assets/hall-banner-v2.png?v=uiux-latest" alt="Kinojo Hall of Fame"></section>
  </div>
</section>

<section class="side-drawer" id="sideDrawer" aria-hidden="true">
  <div class="drawer-panel" role="dialog" aria-modal="false" aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <a id="drawerTitle" class="drawer-title-link" href="../">KINOJO INFO</a>
      <button class="drawer-close" id="drawerCloseBtn" type="button" aria-label="메뉴 닫기">×</button>
    </div>
    <nav class="drawer-nav" aria-label="KINOJO INFO 메뉴">
      <a href="index.html">명예의 전당</a>
      <div class="drawer-divider"></div>
      <button class="drawer-link drawer-under-construction" type="button" data-construction="1성역 루드라팟">1성역 루드라팟</button>
      <button class="drawer-link drawer-under-construction" type="button" data-construction="2성역 바코트팟">2성역 바코트팟</button>
      <button class="drawer-link drawer-under-construction" type="button" data-construction="3성역 칼드릭스팟">3성역 칼드릭스팟</button>
      <div class="drawer-divider"></div>
      <a href="../pages/about.html">사이트 소개</a>
      <a href="../pages/terms.html">이용약관</a>
      <a href="../pages/privacy.html">개인정보처리방침</a>
      <button class="drawer-action" id="drawerSuggestBtn" type="button">아이디어 제안 및 건의</button>
    </nav>
  </div>
</section>

<section class="chick-card" id="chickCard"><div class="chick-line"><div class="chick-head"><div class="chick-icon">🐥</div><div><div class="chick-title" id="chickTitle">신입 병아리</div><div class="chick-sub" id="chickSub">새로운 모험가들을 환영합니다!</div></div></div><div class="chick-tags" id="chickTags"></div></div></section>
<section class="section" id="suggestionBox" style="display:none;margin-bottom:12px"><div class="section-head"><h2>💡 아이디어 제안 및 건의</h2><span class="section-note">운영자 검토 후 반영</span></div><div class="list"><input class="search" id="suggestTitle" placeholder="항목 이름"><input class="search" id="suggestProposer" placeholder="제안자"><textarea class="search" id="suggestMemo" rows="3" placeholder="기준 설명"></textarea><div class="suggest-actions"><button class="btn" id="submitSuggestBtn">제안 보내기</button><button class="btn" id="cancelSuggestBtn" type="button">취소</button></div></div></section>
<div id="app" class="loading"><div><div class="loader-ring"></div><div id="loaderText">명예의 전당 데이터를 불러오는 중...</div></div></div>

<section class="reaction-popover" id="reactionPopover" aria-hidden="true">
  <div class="reaction-popover-head">
    <span id="reactionModalTitle">캐릭터 반응 남기기</span>
    <button id="reactionCloseBtn" class="reaction-close" type="button" aria-label="닫기">×</button>
  </div>
  <div class="reaction-popover-body">
    <div class="reaction-choice">
      <button id="reactionLikeBtn" type="button">👍 좋아요</button>
      <button id="reactionDislikeBtn" type="button">👎 싫어요</button>
    </div>
    <div class="reaction-input-row">
      <input class="reaction-comment" id="reactionComment" maxlength="20" placeholder="전하고 싶은 말을 남겨주세요">
      <button id="reactionSubmitBtn" class="send-btn" type="button" aria-label="코멘트 전달">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 11.4 20.1 3.7c.8-.4 1.6.4 1.2 1.2l-7.7 16.8c-.3.7-1.3.6-1.5-.1l-1.7-6.4-6.4-1.7c-.7-.2-.8-1.2-.1-1.5Zm7.8 2.2 1.3 4.8 5.4-11.7-11.7 5.4 4.8 1.3 3.6-3.6 1.2 1.2-3.6 3.6Z"/></svg>
      </button>
    </div>
    <div class="reaction-status" id="reactionStatus"></div>
  </div>
</section>

<footer class="footer">Powered by AION2 × KINOJO</footer>

<section class="construction-notice" id="constructionNotice" aria-hidden="true">
  <div class="construction-card" role="dialog" aria-modal="false" aria-labelledby="constructionTitle">
    <button class="construction-close" id="constructionCloseBtn" type="button" aria-label="닫기">×</button>
    <div class="construction-kicker">KINOJO INFO</div>
    <h2 id="constructionTitle">페이지 인테리어 공사중입니다~</h2>
    <p id="constructionMessage">조금만 기다려 주세요. 곧 더 깔끔한 성역팟 페이지로 열어둘게요.</p>
    <button class="construction-ok" id="constructionOkBtn" type="button">확인</button>
  </div>
</section>

</main>
<script src="js/app.js?v=uiux-latest"></script>
</body>
</html>
