        <span class="arrow-mark">‹</span><span class="arrow-label">1성역</span>
      </button>
      <button class="mobile-sanctuary-arrow mobile-sanctuary-next" id="mobileSanctuaryNext" data-sanctuary-next type="button" aria-label="다음 성역 보기">
        <span class="arrow-label">2성역</span><span class="arrow-mark">›</span>
