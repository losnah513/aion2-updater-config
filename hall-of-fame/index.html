<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="전투력과 성장 기록으로 선정된 최고의 모험가들">
  <meta property="og:title" content="Kinojo 명예의 전당">
  <meta property="og:description" content="전투력과 성장 기록으로 선정된 최고의 모험가들">
  <meta property="og:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-preview.jpg?v=3">
  <title>Kinojo 명예의 전당</title>
  <style>
    :root { color-scheme:dark; --bg:#06111f; --panel:rgba(9,19,33,.94); --line:rgba(125,211,252,.22); --text:#ecf7ff; --muted:#9fb2c7; --gold:#ffd76a; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,rgba(103,232,249,.12),transparent 34%),radial-gradient(circle at 88% 8%,rgba(139,92,246,.14),transparent 34%),linear-gradient(180deg,#081321,#030712);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    .wrap{width:min(1180px,100%);margin:0 auto;padding:14px 12px 36px} .banner{width:100%;border-radius:18px;overflow:hidden;border:1px solid rgba(250,204,21,.22);box-shadow:0 12px 28px rgba(0,0,0,.32);background:#081321;margin-bottom:12px} .banner img{width:100%;height:auto;display:block;object-fit:contain}
    .topbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:12px} .brand h1{margin:0;color:var(--gold);font-size:clamp(22px,4vw,34px);letter-spacing:-.8px} .subtitle{margin-top:4px;color:#dbeafe;font-size:13px}
    .sub-toggle{width:168px;height:48px;border-radius:999px;border:1px solid rgba(125,211,252,.28);background:rgba(15,23,42,.78);color:#cbd5e1;position:relative;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 12px rgba(0,0,0,.25)} .sub-toggle.on{background:linear-gradient(135deg,rgba(37,99,235,.92),rgba(139,92,246,.88));color:#fff} .toggle-knob{position:absolute;top:5px;left:5px;width:36px;height:36px;border-radius:50%;background:#fff;transition:.28s ease;box-shadow:0 3px 10px rgba(0,0,0,.35)} .sub-toggle.on .toggle-knob{left:125px} .toggle-text{position:absolute;inset:0;display:grid;place-items:center;font-weight:1000;font-size:13px;padding-left:28px;transition:.28s ease} .sub-toggle.on .toggle-text{padding-left:0;padding-right:28px}
    .tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px} .search,.btn{border:1px solid rgba(125,211,252,.24);background:rgba(15,23,42,.78);color:var(--text);border-radius:12px;padding:11px 12px;font-size:14px;outline:none} .btn{cursor:pointer;font-weight:900;background:linear-gradient(135deg,rgba(37,99,235,.90),rgba(124,58,237,.82));user-select:none}
    .chick-card {
      display:none; margin-bottom:12px; border-radius:18px; padding:12px 14px; color:#0f172a;
      background:
        radial-gradient(circle at 10% 18%, rgba(255,215,106,.34) 0 7px, transparent 8px),
        radial-gradient(circle at 26% 84%, rgba(251,191,36,.18) 0 5px, transparent 6px),
        radial-gradient(circle at 48% 24%, rgba(103,232,249,.16) 0 6px, transparent 7px),
        radial-gradient(circle at 70% 78%, rgba(244,114,182,.12) 0 6px, transparent 7px),
        linear-gradient(135deg, rgba(255,253,242,.98), rgba(239,247,255,.98)),
        repeating-linear-gradient(135deg, rgba(251,191,36,.10) 0 2px, transparent 2px 18px);
      box-shadow:0 12px 26px rgba(0,0,0,.20); border:1px solid rgba(255,215,106,.42);
    } .chick-head{display:flex;align-items:center;gap:12px;margin-bottom:10px} .chick-icon{font-size:46px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.12))} .chick-title{font-size:18px;font-weight:1000;color:#be123c} .chick-sub{margin-top:3px;color:#475569;font-size:13px} .chick-tags{display:flex;flex-wrap:wrap;gap:8px} .chick-tag{border:1px solid rgba(15,23,42,.14);background:rgba(255,255,255,.72);border-radius:999px;padding:8px 12px;font-weight:1000;font-size:12px;color:#0f172a;max-width:100%;overflow:hidden} .chick-more{cursor:pointer;color:#be123c;background:rgba(255,235,235,.85)}
    .visitor-card{margin-bottom:12px;border:1px solid rgba(125,211,252,.24);border-radius:16px;padding:12px 14px;background:rgba(15,23,42,.64);color:#dbeafe;line-height:1.45;font-size:13px} .visitor-card strong{color:var(--gold)} .dashboard{display:grid;grid-template-columns:1.15fr 1fr;gap:12px} .top-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .section{border:1px solid var(--line);background:linear-gradient(180deg,rgba(12,26,43,.94),rgba(7,15,27,.94));border-radius:16px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.26)} .section-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);background:linear-gradient(90deg,rgba(37,99,235,.18),rgba(124,58,237,.16))} .section h2{margin:0;font-size:18px} .section-note{color:#cbd5e1;font-size:12px}
    .list{padding:12px;display:grid;gap:9px} .mini-row{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;min-height:42px} .medal{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:20px} .name,.tag-name{font-size:15px;font-weight:1000;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis} .meta{margin-top:2px;color:var(--muted);font-size:11px} .score{font-weight:1000;color:var(--gold);white-space:nowrap} .side-stack{display:grid;gap:12px} .tag-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px} .name-tag{padding:10px 8px;border:1px solid rgba(148,163,184,.18);border-radius:12px;background:rgba(15,23,42,.56);text-align:center;font-weight:1000;min-width:0} .tag-meta{margin-top:4px;color:var(--muted);font-size:11px}
    .overall,.classes{margin-top:12px;border:1px solid var(--line);background:rgba(7,15,27,.94);border-radius:16px;overflow:hidden} .overall-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.07)} .page-tools{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px} .page-btn{border:1px solid var(--line);background:rgba(15,23,42,.72);color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer} .rank-table{width:100%;border-collapse:collapse} .rank-table th,.rank-table td{border-bottom:1px solid rgba(255,255,255,.07);padding:9px 10px;text-align:left;font-size:13px} .rank-table th{color:#cbd5e1;font-weight:800} .rank-table .num{width:52px;text-align:center} .rank-table .power{white-space:nowrap;font-weight:900} .reviews{color:#dbeafe;line-height:1.45;font-size:12px} .reviews div+div{margin-top:3px;color:#cbd5e1}
    .class-tabs{display:flex;flex-wrap:wrap;gap:7px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07)} .pill{border:1px solid var(--line);background:rgba(15,23,42,.70);color:var(--text);border-radius:10px;padding:8px 12px;font-weight:900;cursor:pointer} .pill.active{background:linear-gradient(135deg,rgba(139,92,246,.90),rgba(37,99,235,.76))} .class-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px} .class-card{border:1px solid rgba(148,163,184,.16);border-radius:12px;background:rgba(15,23,42,.54);padding:10px} .class-title{font-weight:1000;color:#fff3b0;margin-bottom:8px} .empty{padding:18px;color:var(--muted);text-align:center;font-size:13px}
    .loading{min-height:260px;display:grid;place-items:center;color:#dbeafe;font-weight:900} .loader-ring{width:58px;height:58px;border-radius:50%;margin:0 auto 12px;background:conic-gradient(from 0deg,#67e8f9,#3b82f6,#a78bfa,#ec4899,#67e8f9);animation:spin 1.05s linear infinite;position:relative} .loader-ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#07101c} .loader-ring::after{content:"🏆";position:absolute;inset:0;display:grid;place-items:center;animation:counterSpin 1.05s linear infinite;font-size:21px} @keyframes spin{to{transform:rotate(360deg)}} @keyframes counterSpin{to{transform:rotate(-360deg)}} @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }100%{transform:translateX(calc(-100% + 110px))}} .marquee{display:inline-block;min-width:100%;animation:marquee 5s linear infinite alternate}
    @media(max-width:760px){.wrap{padding:10px 8px 30px}.topbar{grid-template-columns:1fr auto}.subtitle{display:none}.sub-toggle{width:120px;height:40px}.toggle-knob{width:30px;height:30px}.sub-toggle.on .toggle-knob{left:83px}.toggle-text{font-size:11px;padding-left:20px}.sub-toggle.on .toggle-text{padding-right:20px}.tools{grid-template-columns:1fr auto auto}.btn{font-size:0;width:38px;padding:9px 0}#refreshBtn::before{content:"🔄";font-size:16px}#suggestBtn::before{content:"💬";font-size:16px}.dashboard,.top-grid{grid-template-columns:1fr}.section h2{font-size:15px}.rank-table th:nth-child(3),.rank-table td:nth-child(3),.rank-table th:nth-child(4),.rank-table td:nth-child(4){display:none}.rank-table th,.rank-table td{padding:8px 6px;font-size:12px}.class-grid{grid-template-columns:1fr}.class-card:not(.active-mobile){display:none}}
  
    .chick-line { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .chick-line .chick-head { margin-bottom:0; flex:0 0 auto; }
    .chick-line .chick-tags { justify-content:flex-end; flex:1; }
    .chick-tag .static-text { white-space:nowrap; }
    @media(max-width:760px) {
      .chick-line { align-items:flex-start; flex-direction:column; }
      .chick-line .chick-tags { justify-content:flex-start; width:100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="banner"><img src="assets/hall-banner.svg" alt="Kinojo Hall of Fame"></section>
    <section class="topbar"><div class="brand"><h1>KINOJO 명예의 전당</h1><div class="subtitle">전투력과 성장 기록으로 선정된 최고의 모험가들</div></div><button class="sub-toggle" id="subToggle"><span class="toggle-knob"></span><span class="toggle-text">부캐 포함 OFF</span></button></section>
    <section class="tools"><input class="search" id="searchInput" placeholder="캐릭터명 / 서버 / 직업 검색"><button class="btn" id="refreshBtn">새로고침</button><button class="btn" id="suggestBtn">항목 제안</button></section>
    <section class="chick-card" id="chickCard"><div class="chick-line"><div class="chick-head"><div class="chick-icon">🐥</div><div><div class="chick-title" id="chickTitle">신입 병아리</div><div class="chick-sub" id="chickSub">새로운 모험가들을 환영합니다!</div></div></div><div class="chick-tags" id="chickTags"></div></div></section>
    <section class="visitor-card" id="visitCard">👀 방문자 통계를 불러오는 중...</section>
    <section class="section" id="suggestionBox" style="display:none;margin-bottom:12px"><div class="section-head"><h2>➕ 새로운 항목 제안하기</h2><span class="section-note">운영자 검토 후 반영</span></div><div class="list"><input class="search" id="suggestTitle" placeholder="항목 이름"><input class="search" id="suggestProposer" placeholder="제안자"><textarea class="search" id="suggestMemo" rows="3" placeholder="기준 설명"></textarea><button class="btn" id="submitSuggestBtn">제안 보내기</button></div></section>
    <div id="app" class="loading"><div><div class="loader-ring"></div><div>명예의 전당 데이터를 불러오는 중...</div></div></div>
  </main>
  <script>
    const WEB_APP_URL = new URLSearchParams(location.search).get("api") || "https://script.google.com/macros/s/AKfycbztXbGEbiId1yOfa3CVmErivNVi5IUi64qxIQRf8Sm_KduCPieeAKlNRMGyYkKL5iPaYg/exec";
    const CLASS_ORDER=["검성","수호성","살성","궁성","정령성","마도성","치유성","호법성"];
    let hallData=null, keyword="", includeSubs=false, page=1, activeClass="검성", chicksExpanded=false, longPressTimer=null, longPressFired=false;
    const PAGE_SIZE=10, app=document.getElementById("app");
    function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");}
    function rankIcon(i){return i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1;}
    function currentOverall(){return includeSubs?(hallData.overallAll||[]):(hallData.overallMain||[]);}
    function currentClasses(){return includeSubs?(hallData.classAll||{}):(hallData.classMain||{});}
    function match(item){if(!keyword)return true;return [item.name,item.serverName,item.meta,item.className,item.pveReview,item.pvpReview].join(" ").toLowerCase().includes(keyword.toLowerCase());}
    function flowText(text){const t=String(text||"");return t.length>6?`<span class="marquee">${escapeHtml(t)}</span>`:escapeHtml(t);}
    function miniRow(item,i){return `<div class="mini-row"><div class="medal">${rankIcon(i)}</div><div><div class="name">${flowText(item.name)}</div>${item.meta?`<div class="meta">${escapeHtml(item.meta)}</div>`:""}</div><div class="score">${escapeHtml(item.label||"")}</div></div>`;}
    function rankBox(title,note,list){const items=(list||[]).filter(match);return `<section class="section"><div class="section-head"><h2>${title}</h2><span class="section-note">${note||""}</span></div><div class="list">${items.length?items.map(miniRow).join(""):`<div class="empty">아직 데이터가 부족해요.</div>`}</div></section>`;}
    function tagBox(title,note,list){const items=(list||[]).filter(match);return `<section class="section"><div class="section-head"><h2>${title}</h2><span class="section-note">${note||""}</span></div><div class="tag-list">${items.length?items.map(item=>`<div class="name-tag"><div class="tag-name">${flowText(item.name)}</div>${item.meta?`<div class="tag-meta">${escapeHtml(item.meta)}</div>`:""}</div>`).join(""):`<div class="empty">아직 데이터가 부족해요.</div>`}</div></section>`;}
    function chickLabel(item){const server=item.meta?`[${item.meta.replace("천족 · ","")}]`:"";const cls=item.className?` (${item.className})`:"";return `${item.name}${server}${cls}`;}]`:"";const cls=item.className?` (${item.className})`:"";return `${item.name}${server}${cls}`;}
    function renderChicks(){const items=(hallData?.newChicks||[]).filter(match);const card=document.getElementById("chickCard");if(!items.length){card.style.display="none";return;}card.style.display="block";document.getElementById("chickTitle").textContent=`🐣 신입 병아리 ${items.length}명 입장!`;document.getElementById("chickSub").textContent=items.length>=5?"새로운 모험가들이 우르르 둥지에 들어왔어요!":"새로운 모험가들을 따뜻하게 환영합니다!";const shown=chicksExpanded?items:items.slice(0,5);document.getElementById("chickTags").innerHTML=shown.map(item=>`<span class="chick-tag"><span class="static-text">${escapeHtml(chickLabel(item))}</span></span>`).join("")+(items.length>5?`<span class="chick-tag chick-more" id="chickMore">${chicksExpanded?"접기":`+${items.length-5}명 더 보기`}</span>`:"");const more=document.getElementById("chickMore");if(more)more.onclick=()=>{chicksExpanded=!chicksExpanded;renderChicks();};}
    function renderVisits(stats){const today=Number(stats?.todayVisits||0).toLocaleString("ko-KR");const total=Number(stats?.totalVisits||0).toLocaleString("ko-KR");document.getElementById("visitCard").innerHTML=`👀 오늘 <strong>${today}명</strong>의 모험가가 명예의 전당을 둘러봤어요.<br>🏛 지금까지 총 <strong>${total}번</strong>의 발걸음이 기록되었습니다.`;}
    async function fetchVisitStats(mode="stats",boost=0){try{const url=`${WEB_APP_URL}${WEB_APP_URL.includes("?")?"&":"?"}action=hallVisit&mode=${encodeURIComponent(mode)}&boost=${encodeURIComponent(boost)}&t=${Date.now()}`;const res=await fetch(url,{cache:"no-store"});const data=await res.json();if(data?.ok&&data.stats)renderVisits(data.stats);}catch(e){}}
    function recordDailyVisitOnce(){const key="kinojo_hof_visit_"+new Date().toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul"});if(localStorage.getItem(key)==="1"){fetchVisitStats();return;}localStorage.setItem(key,"1");fetchVisitStats("visit",1);}
    function overallTable(){const list=currentOverall().filter(match),totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));if(page>totalPages)page=totalPages;const start=(page-1)*PAGE_SIZE,slice=list.slice(start,start+PAGE_SIZE);return `<section class="overall"><div class="overall-head"><h2>🏅 키노조 전체 순위</h2><div class="page-tools"><span>${page} / ${totalPages}</span><button class="page-btn" data-page="prev">‹</button><button class="page-btn" data-page="next">›</button></div></div><table class="rank-table"><thead><tr><th class="num">순위</th><th>캐릭터명</th><th>서버</th><th>PVE</th><th>PVP</th><th>AI 리뷰</th></tr></thead><tbody>${slice.map((item,i)=>`<tr><td class="num">${start+i<3?rankIcon(start+i):start+i+1}</td><td><strong>${flowText(item.name)}</strong></td><td>${escapeHtml(item.meta||"지켈")}</td><td class="power">${escapeHtml(item.pvePowerLabel||item.label||"")}</td><td class="power">${escapeHtml(item.pvpPowerLabel||"")}</td><td class="reviews"><div>🐲 ${escapeHtml(item.pveReview||"")}</div><div>⚔️ ${escapeHtml(item.pvpReview||"")}</div></td></tr>`).join("")}</tbody></table></section>`;}
    function classSection(){const rankings=currentClasses();const tabs=CLASS_ORDER.map(cls=>`<button class="pill ${activeClass===cls?"active":""}" data-class="${cls}">${cls}</button>`).join("");const cards=CLASS_ORDER.map(cls=>`<div class="class-card ${activeClass===cls?"active-mobile":""}"><div class="class-title">${cls} TOP 3</div>${(rankings[cls]||[]).length?(rankings[cls]||[]).map(miniRow).join(""):`<div class="empty">데이터 부족</div>`}</div>`).join("");return `<section class="section classes"><div class="section-head"><h2>⚔ 클래스별 전투력 TOP3</h2><span class="section-note">${includeSubs?"부캐 포함":"본캐 기준"}</span></div><div class="class-tabs">${tabs}</div><div class="class-grid">${cards}</div></section>`;}
    function render(){if(!hallData)return;renderChicks();app.className="";app.innerHTML=`<div class="dashboard"><div><div class="top-grid">${rankBox("⚔ PVE TOP 3","",hallData.pveTop)}${rankBox("⚔ PVP TOP 3","",hallData.pvpTop)}</div></div><div class="side-stack">${tagBox("😈 같은 마족이면 가족이지","타서버 마족",hallData.demonFamily)}${tagBox("🤝 같은 파티면 친구지","천족 서버",hallData.partyFriend)}</div></div>${overallTable()}${classSection()}`;bindDynamic();}
    function bindDynamic(){document.querySelectorAll("[data-page]").forEach(btn=>btn.onclick=()=>{const total=Math.max(1,Math.ceil(currentOverall().filter(match).length/PAGE_SIZE));page+=btn.dataset.page==="next"?1:-1;if(page<1)page=1;if(page>total)page=total;render();});document.querySelectorAll("[data-class]").forEach(btn=>btn.onclick=()=>{activeClass=btn.dataset.class;render();});}
    async function load(){app.className="loading";app.innerHTML=`<div><div class="loader-ring"></div><div>명예의 전당 데이터를 불러오는 중...</div></div>`;try{const url=`${WEB_APP_URL}${WEB_APP_URL.includes("?")?"&":"?"}action=hallOfFame&t=${Date.now()}`;const res=await fetch(url,{cache:"no-store"});const text=await res.text();if(!res.ok)throw new Error(`HTTP ${res.status}: ${text.slice(0,180)}`);hallData=JSON.parse(text);if(hallData.visitStats)renderVisits(hallData.visitStats);render();}catch(err){app.className="";app.innerHTML=`<div class="empty">명예의 전당 데이터를 불러오지 못했습니다.<br>${escapeHtml(err.message||err)}</div>`;}}
    function boostPrompt(){const code=prompt("관리자 암호를 입력하세요.");if(!code)return;const m=String(code).trim().match(/^키노조화이팅(\d+)$/);if(!m)return alert("암호가 올바르지 않습니다.");const amount=Math.max(1,Math.min(9999,Number(m[1]||0)));fetchVisitStats("boost",amount);alert(`방문자수 +${amount} 반영 완료!`);}
    const toggle=document.getElementById("subToggle");toggle.onclick=()=>{includeSubs=!includeSubs;page=1;toggle.classList.toggle("on",includeSubs);toggle.querySelector(".toggle-text").textContent=includeSubs?"부캐 포함 ON":"부캐 포함 OFF";render();};
    document.getElementById("searchInput").oninput=e=>{keyword=e.target.value.trim();page=1;render();};document.getElementById("refreshBtn").onclick=load;
    const suggest=document.getElementById("suggestBtn");suggest.onmousedown=suggest.ontouchstart=()=>{longPressFired=false;longPressTimer=setTimeout(()=>{longPressFired=true;boostPrompt();},800);};suggest.onmouseup=suggest.onmouseleave=suggest.ontouchend=()=>{clearTimeout(longPressTimer);};suggest.onclick=()=>{if(longPressFired)return;const box=document.getElementById("suggestionBox");box.style.display=box.style.display==="none"?"block":"none";};
    document.getElementById("submitSuggestBtn").onclick=async()=>{const title=document.getElementById("suggestTitle").value.trim(),proposer=document.getElementById("suggestProposer").value.trim(),memo=document.getElementById("suggestMemo").value.trim();if(!title)return alert("항목 이름을 입력해 주세요.");const res=await fetch(WEB_APP_URL,{method:"POST",body:JSON.stringify({action:"hallSuggestion",title,proposer,memo})});const data=await res.json();if(!data.ok)return alert(data.message||"전송 실패");alert("제안이 접수되었습니다.");load();};
    recordDailyVisitOnce();load();
  </script>
</body>
</html>
