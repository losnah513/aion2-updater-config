name: Temporary PASS KEY 1-C-4 character admin

on:
  push:
    branches:
      - agent/passkey-1c4-character-admin

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passkey-1c4-character-admin
      - name: Patch character admin session routing
        run: |
          python - <<'PY'
          from pathlib import Path

          rpc = Path('core/kinojo-supabase-rpc.js')
          text = rpc.read_text(encoding='utf-8')
          marker = ' * Phase 1-C-3: SQL 324 회원관리 RPC 3개도 동일한 kws_ 세션 경계를 사용합니다.\n'
          addition = marker + ' * Phase 1-C-4: SQL 325 캐릭터 관리·신원 검토 RPC도 동일한 kws_ 세션 경계를 사용합니다.\n'
          if text.count(marker) != 1:
              raise SystemExit('RPC phase marker mismatch')
          text = text.replace(marker, addition, 1)
          anchor = "    'kinojo_admin_member_manage_264',\n"
          rpc_names = [
              'kinojo_admin_character_deactivate',
              'kinojo_admin_character_exclusion_update_v278',
              'kinojo_admin_character_mark_renamed',
              'kinojo_admin_character_restore',
              'kinojo_admin_character_search',
              'kinojo_admin_identity_reviews_v287',
          ]
          block = anchor + ''.join(f"    '{name}',\n" for name in rpc_names)
          if text.count(anchor) != 1:
              raise SystemExit('RPC whitelist anchor mismatch')
          for name in rpc_names:
              if f"'{name}'" in text:
                  raise SystemExit(f'RPC already contains {name}')
          rpc.write_text(text.replace(anchor, block, 1), encoding='utf-8', newline='')

          features = Path('core/kinojo-supabase-features.js')
          text = features.read_text(encoding='utf-8')
          marker = '  function normalizeCodeRequestRow(row){\n'
          helper = """  function currentAdminSessionCredential(){
    const account = currentAccount();
    const token = String(account && (account.token || account.sessionToken || account.session_token) || '').trim();
    if(!/^kws_[A-Za-z0-9_-]{40,80}$/.test(token)){
      const err = new Error('관리자 로그인 세션을 확인할 수 없습니다. 다시 로그인해 주세요.');
      err.kinojoAdminAuthError = true;
      throw err;
    }
    return token;
  }

"""
          if text.count(marker) != 1:
              raise SystemExit('feature helper anchor mismatch')
          if 'function currentAdminSessionCredential()' in text:
              raise SystemExit('feature helper already exists')
          text = text.replace(marker, helper + marker, 1)
          start = text.index('  async function adminCharacter(')
          try:
              end = text.index('\n  async function adminLookup(', start)
          except ValueError:
              end = text.index('\n  async function adminNotice(', start)
          segment = text[start:end]
          old = 'passKey:currentPassKey(),'
          if segment.count(old) != 3:
              raise SystemExit(f'identity edge credential count mismatch: {segment.count(old)}')
          segment = segment.replace(old, 'passKey:currentAdminSessionCredential(),')
          text = text[:start] + segment + text[end:]
          features.write_text(text, encoding='utf-8', newline='')

          for path in [Path('admin/index.html'), Path('m/admin/index.html')]:
              text = path.read_text(encoding='utf-8')
              old_rpc = 'kinojo-supabase-rpc.js?cache=2026081703'
              new_rpc = 'kinojo-supabase-rpc.js?cache=2026081704'
              old_features = 'kinojo-supabase-features.js?cache=2026081504'
              new_features = 'kinojo-supabase-features.js?cache=2026081704'
              if text.count(old_rpc) != 1 or text.count(old_features) != 1:
                  raise SystemExit(f'{path}: cache marker mismatch')
              text = text.replace(old_rpc, new_rpc, 1).replace(old_features, new_features, 1)
              path.write_text(text, encoding='utf-8', newline='')
          PY
          node --check core/kinojo-supabase-rpc.js
          node --check core/kinojo-supabase-features.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/kinojo-supabase-rpc.js core/kinojo-supabase-features.js admin/index.html m/admin/index.html
          git commit -m 'PASS KEY 1-C-4: route character admin through session token'
          git push origin HEAD:agent/passkey-1c4-character-admin
