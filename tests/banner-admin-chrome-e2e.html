    if(state.calls.includes('event-publish'))throw Error('draft save must not publish');
    const required=['event-targets','upload-prepare','upload-complete','asset-title-check','asset-list','overlay-asset-list','overlay-upload-prepare','overlay-upload-complete','event-save'];for(const action of required)if(!state.calls.includes(action))throw Error('missing browser action '+action);
    window.KinojoAdmin.getBannerEventWorkflowState('main').overlays={};
    document.querySelector('[data-banner-event-workflow="main"] [data-bew-publish]').click();
    await waitFor(()=>!document.querySelector('[data-banner-event-workflow="main"] [data-bew-result-notice]')?.hidden,'publish readback and automatic reset',12000);
    const publishedState=window.KinojoAdmin.getBannerEventWorkflowState('main');
    if(publishedState.bundleName||publishedState.selected.length||publishedState.eventGroupId)throw Error('published authoring state did not reset');
    if(document.querySelector('[data-banner-event-workflow="main"] [data-bew-scroll="1"]')?.dataset.stepState!=='current'||!document.querySelector('[data-banner-event-workflow="main"] [data-bew-reset]')?.disabled)throw Error('post-publish workflow must return to empty step 1');
    if(!document.querySelector('[data-banner-event-workflow="main"] [data-bew-result-notice]')?.textContent.includes('Chrome E2E 메인 이벤트')||!state.calls.includes('event-list'))throw Error('published event identity/readback notice missing');
    document.querySelector('#adminTopSubnav [data-admin-subtab="side"]').click();
    await waitFor(()=>!sidePanel.hidden&&sidePanel.classList.contains('active'),'side banner visual return');
    const finalAllPages=document.querySelector('[data-banner-event-workflow="side"] [data-bew-all-pages]');finalAllPages.checked=true;fire(finalAllPages,'change');
    const target=document.querySelector('#bew-side-3');window.scrollTo(0,target.getBoundingClientRect().top+window.scrollY-110);await sleep(300);
    if(getComputedStyle(document.querySelector('[data-banner-event-workflow="side"] .bew-side-order-item img')).objectFit!=='contain')throw Error('side order preview must show the complete image');
    document.querySelector('[data-banner-context="side"] [data-banner-view="events"]').click();
    await waitFor(()=>!document.querySelector('[data-banner-context="side"] [data-banner-view-panel="events"]')?.hidden&&document.querySelectorAll('[data-banner-events-admin] [data-bem-event]').length===2,'event manager list load');
    if(location.hash!=='#images/side')throw Error('event manager must retain the side context route');
    if(document.querySelector('#adminCurrentLocation')?.textContent!=='[이미지 관리] - 사이드 배너')throw Error('event manager context label mismatch');
    if(!document.querySelector('[data-banner-events-admin]')?.textContent.includes('등록 이벤트 목록'))throw Error('event manager heading missing');
    const rightFilter=document.querySelector('[data-banner-events-admin] [data-bem-slot="RIGHT"]');rightFilter.click();await sleep(30);
    if(document.querySelectorAll('[data-banner-events-admin] [data-bem-event]').length!==1||rightFilter.getAttribute('aria-pressed')!=='true')throw Error('side registered-event right-position filter missing');
    document.querySelector('[data-banner-events-admin] [data-bem-slot="ALL"]').click();
    if(document.querySelector('[data-banner-events-admin] [data-bem-playback]'))throw Error('retired per-event playback switch remains');
    const rotation=document.querySelector('[data-banner-events-admin] [data-bem-event-rotation]');
    if(!rotation||rotation.checked||rotation.disabled)throw Error('enabled ordered global event rotation state missing');
    if(!rotation.closest('.kinojo-filter-switch')?.textContent.includes('순차')||!rotation.closest('.kinojo-filter-switch')?.textContent.includes('랜덤'))throw Error('shared global rotation switch labels missing');
    rotation.checked=true;fire(rotation,'change');
    await waitFor(()=>state.calls.includes('event-rotation'),'global event rotation mutation');
    if(state.eventRotationMode!=='RANDOM_CYCLE')throw Error('random cycle rotation state missing');
    document.querySelector('[data-banner-events-admin] [data-bem-move="DOWN"]:not(:disabled)')?.click();
    await waitFor(()=>state.calls.includes('event-move'),'event manager order mutation');
    document.querySelector('[data-banner-context="side"] [data-banner-view="library"]').click();
    await waitFor(()=>!document.querySelector('[data-banner-context="side"] [data-banner-view-panel="library"]')?.hidden&&state.calls.includes('asset-library'),'image library context and load');
    if(location.hash!=='#images/side'||document.querySelector('#adminCurrentLocation')?.textContent!=='[이미지 관리] - 사이드 배너')throw Error('image library must retain the side context route');
    if(document.querySelector('[data-banner-asset-library] [data-bal-detail] .bal-detail-empty')===null)throw Error('library must start with no selected image');
    const libraryMode=document.querySelector('[data-banner-asset-library] [data-bal-mode]');libraryMode.checked=true;fire(libraryMode,'change');
    await waitFor(()=>!document.querySelector('[data-banner-asset-library] [data-bal-tag-groups]')?.hidden&&document.querySelector('[data-banner-asset-library] [data-bal-tag-filter="룩북"]'),'library hashtag grouping switch');
    document.querySelector('[data-banner-asset-library] [data-bal-tag-filter="룩북"]').click();
    if(document.querySelectorAll('[data-banner-asset-library] [data-bal-select]').length!==1)throw Error('hashtag selection filter mismatch');
    document.querySelector('[data-banner-asset-library] [data-bal-select="1"]').click();
    if(!document.querySelector('[data-banner-asset-library] [data-bal-detail]')?.textContent.includes('side-1.webp')||!document.querySelector('[data-banner-asset-library] [data-bal-detail]')?.textContent.includes('첫 이벤트'))throw Error('read-only metadata or formal event usage missing');
    if(document.querySelector('[data-banner-asset-library] [data-bal-save]')?.disabled!==true)throw Error('unchanged library detail must not save');
    if(!document.querySelector('[data-banner-asset-library] [data-bal-tag-input]')?.disabled)throw Error('five-tag limit state missing');
    document.querySelector('[data-banner-asset-library] [data-bal-tag-remove="4"]').click();
    let libraryTagInput=document.querySelector('[data-banner-asset-library] [data-bal-tag-input]');libraryTagInput.value='신규';libraryTagInput.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
    if(!document.querySelector('[data-banner-asset-library]')?.textContent.includes('#신규'))throw Error('library hashtag add missing');
    document.querySelector('[data-banner-asset-library] [data-bal-tag-move="4:up"]').click();
    const libraryTitle=document.querySelector('[data-banner-asset-library] [data-bal-title]');libraryTitle.value='사이드 두 번째';fire(libraryTitle,'input');
    await waitFor(()=>document.querySelector('[data-banner-asset-library] [data-bal-title-note]')?.classList.contains('error'),'duplicate library title state');
    const uniqueTitle=document.querySelector('[data-banner-asset-library] [data-bal-title]');uniqueTitle.value='사이드 첫 번째 수정';fire(uniqueTitle,'input');
    await waitFor(()=>document.querySelector('[data-banner-asset-library] [data-bal-title-note]')?.classList.contains('ok')&&!document.querySelector('[data-banner-asset-library] [data-bal-save]').disabled,'valid dirty library state');
    document.querySelector('[data-banner-asset-library] [data-bal-save]').click();
    await waitFor(()=>state.calls.includes('asset-update')&&document.querySelector('[data-banner-asset-library] [data-bal-status]')?.textContent.includes('최신화했습니다'),'library save and cache refresh');
    if(window.KinojoAdmin.getBannerEventWorkflowState('side').assets.find(asset=>Number(asset.assetId)===1)?.title!=='사이드 첫 번째 수정')throw Error('authoring library cache was not refreshed');
    const libraryQuery=document.querySelector('[data-banner-asset-library] [data-bal-query]');libraryQuery.value='검색결과없음';fire(libraryQuery,'input');if(!document.querySelector('[data-banner-asset-library] .bal-empty')?.textContent.includes('조건에 맞는 이미지가 없습니다'))throw Error('library empty search state missing');
    document.documentElement.dataset.e2eResult='PASS';document.querySelector('#e2eResult').textContent='PASS '+state.calls.join(' > ');
  }catch(error){document.documentElement.dataset.e2eResult='FAIL';document.querySelector('#e2eResult').textContent='FAIL '+(error?.stack||error)+`\nlocation=${document.querySelector('#adminCurrentLocation')?.textContent||''} subtab=${window.KinojoAdmin.state?.subtab||''}`;console.error(error)}
}
window.addEventListener('load',run);
</script>
</body></html>
