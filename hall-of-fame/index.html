:root{color-scheme:dark;--bg:#07101c;--panel:rgba(9,19,33,.95);--line:rgba(125,211,252,.22);--text:#ecf7ff;--muted:#9fb2c7;--gold:#ffd76a;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(103,232,249,.12),transparent 34%),radial-gradient(circle at 88% 8%,rgba(139,92,246,.14),transparent 34%),linear-gradient(180deg,#081321,#030712);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{width:min(1180px,100%);margin:0 auto;padding:14px 12px 36px}.topbar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px}.trophy{font-size:44px}h1{margin:0;color:var(--gold);font-size:clamp(24px,4vw,38px)}.subtitle{margin-top:4px;color:#dbeafe;font-size:13px}.mode-tabs{display:flex;background:rgba(15,23,42,.74);border:1px solid var(--line);border-radius:14px;overflow:hidden}.mode-tab{border:0;color:var(--text);background:transparent;padding:12px 26px;font-weight:900;cursor:pointer}.mode-tab.active{background:linear-gradient(135deg,rgba(139,92,246,.9),rgba(37,99,235,.76))}.hero-tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}.search,.btn{border:1px solid rgba(125,211,252,.24);background:rgba(15,23,42,.78);color:var(--text);border-radius:12px;padding:11px 12px;font-size:14px;outline:none}.btn{cursor:pointer;font-weight:900;background:linear-gradient(135deg,rgba(37,99,235,.9),rgba(124,58,237,.82))}.chick-banner{display:none;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;background:linear-gradient(135deg,#fffaf0,#eef6ff);color:#0f172a;border-radius:18px;padding:13px 16px;margin-bottom:14px}.chick-icon{font-size:54px}.chick-title{font-size:20px;font-weight:1000;color:#be123c}.chick-desc{margin-top:4px;color:#475569;font-size:13px}.chick-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.chick-tag{padding:8px 14px;background:rgba(15,23,42,.06);border:1px solid rgba(15,23,42,.12);border-radius:999px;font-weight:900}.dashboard{display:grid;grid-template-columns:1.15fr 1fr;gap:12px}.top-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{border:1px solid var(--line);background:linear-gradient(180deg,rgba(12,26,43,.95),rgba(7,15,27,.95));border-radius:16px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.26)}.section-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);background:linear-gradient(90deg,rgba(37,99,235,.18),rgba(124,58,237,.16))}.section h2{margin:0;font-size:18px}.section-note{color:#cbd5e1;font-size:12px}.list{padding:12px;display:grid;gap:9px}.mini-row{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;min-height:42px}.medal{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:20px}.name{font-size:15px;font-weight:1000;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.meta{margin-top:2px;color:var(--muted);font-size:11px}.score{font-weight:1000;color:var(--gold);white-space:nowrap}.side-stack{display:grid;gap:12px}.tag-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px}.name-tag{padding:10px 8px;border:1px solid rgba(148,163,184,.18);border-radius:12px;background:rgba(15,23,42,.56);text-align:center;font-weight:1000}.tag-meta{margin-top:4px;color:var(--muted);font-size:11px}.overall{margin-top:12px;border:1px solid var(--line);background:rgba(7,15,27,.95);border-radius:16px;overflow:hidden}.overall-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.07)}.page-tools{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}.page-btn{border:1px solid var(--line);background:rgba(15,23,42,.72);color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer}.rank-table{width:100%;border-collapse:collapse}.rank-table th,.rank-table td{border-bottom:1px solid rgba(255,255,255,.07);padding:9px 10px;text-align:left;font-size:13px}.rank-table th{color:#cbd5e1;font-weight:800}.rank-table .num{width:52px;text-align:center}.rank-table .power{white-space:nowrap;font-weight:900}.reviews{color:#dbeafe;line-height:1.45;font-size:12px}.reviews div+div{margin-top:3px;color:#cbd5e1}.classes{margin-top:12px}.class-tabs{display:flex;flex-wrap:wrap;gap:7px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07)}.pill{border:1px solid var(--line);background:rgba(15,23,42,.7);color:var(--text);border-radius:10px;padding:8px 12px;font-weight:900;cursor:pointer}.pill.active{background:linear-gradient(135deg,rgba(139,92,246,.9),rgba(37,99,235,.76))}.class-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px}.class-card{border:1px solid rgba(148,163,184,.16);border-radius:12px;background:rgba(15,23,42,.54);padding:10px}.class-title{font-weight:1000;color:#fff3b0;margin-bottom:8px}.empty{padding:18px;color:var(--muted);text-align:center;font-size:13px}.loading{min-height:300px;display:grid;place-items:center;color:#dbeafe;font-weight:900}.footer{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){.wrap{padding:10px 8px 30px}.topbar{grid-template-columns:1fr auto}.guide{display:none}.trophy{font-size:34px}h1{font-size:22px}.subtitle{display:none}.mode-tab{padding:9px 13px;font-size:12px}.hero-tools{grid-template-columns:1fr auto auto}.btn{font-size:0;width:38px;padding:9px 0}#refreshBtn:before{content:"🔄";font-size:16px}#suggestBtn:before{content:"💬";font-size:16px}.chick-banner{grid-template-columns:48px 1fr;padding:11px 12px}.chick-icon{font-size:40px}.chick-title{font-size:16px}.chick-tags{grid-column:1/-1;justify-content:flex-start}.dashboard,.top-grid{grid-template-columns:1fr}.section h2{font-size:15px}.rank-table th:nth-child(3),.rank-table td:nth-child(3),.rank-table th:nth-child(4),.rank-table   </style></head><body><main class="wrap"><section class="topbar"><div class="brand"><div class="trophy">🏆</div><div><h1>KINOJO 명예의 전당</h1><div class="subtitle">전투력과 성장 기록으로 선정된 최고의 모험가들</div></div></div><div class="mode-tabs"><button class="mode-tab active" data-mode="main">본캐 기준</button><button class="mode-tab" data-mode="all">전체 기준</button></div><div class="guide">ⓘ 기준 안내</div></section><section class="hero-tools"><input class="search" id="searchInput" placeholder="캐릭터명 / 서버 / 직업 검색"/><button class="btn" id="refreshBtn">새로고침</button><button class="btn" id="suggestBtn">항목 제안</button></section><section class="chick-banner" id="chickBanner"><div class="chick-icon">🐥</div><div><div class="chick-title" id="chickTitle">🐣 신입 병아리</div><div class="chick-desc">2026년 5월 29일 이후 새로 등록된 신규 모험가</div></div><div class="chick-tags" id="chickTags"></div></section><section class="section" id="suggestionBox" style="display:none;margin-bottom:12px"><div class="section-head"><h2>➕ 새로운 항목 제안하기</h2><span class="section-note">운영자 검토 후 반영</span></div><div class="list"><input class="search" id="suggestTitle" placeholder="항목 이름"/><input class="search" id="suggestProposer" placeholder="제안자"/><textarea class="search" id="suggestMemo" rows="3" placeholder="기준 설명"></textarea><button class="btn" id="submitSuggestBtn" type="button">제안 보내기</button></div></section><div id="app" class="loading"><div><div class="loader-ring"></div><div>명예의 전당 데이터를 불러오는 중...</div></div></div><footer class="footer">※ 순위는 조회 데이터 기준으로 집계됩니다.</footer></main><script>
const WEB_APP_URL=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbztXbGEbiId1yOfa3CVmErivNVi5IUi64qxIQRf8Sm_KduCPieeAKlNRMGyYkKL5iPaYg/exec';const CLASS_ORDER=['검성','수호성','살성','궁성','정령성','마도성','치유성','호법성'];let hallData=null,keyword='',mode='main',page=1,activeClass='검성';const PAGE_SIZE=10,app=document.getElementById('app');function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function rankIcon(i){return i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}function currentOverall(){return mode==='main'?(hallData.overallMain||[]):(hallData.overallAll||[])}function currentClasses(){return mode==='main'?(hallData.classMain||{}):(hallData.classAll||{})}function match(item){if(!keyword)return true;return [item.name,item.serverName,item.meta,item.className,item.pveReview,item.pvpReview].join(' ').toLowerCase().includes(keyword.toLowerCase())}function miniRow(item,i){return `<div class="mini-row"><div class="medal">${rankIcon(i)}</div><div><div class="name">${escapeHtml(item.name)}</div>${item.meta?`<div class="meta">${escapeHtml(item.meta)}</div>`:''}</div><div class="score">${escapeHtml(item.label)}</div></div>`}function rankBox(t,n,l){const items=(l||[]).filter(match);return `<section class="section"><div class="section-head"><h2>${t}</h2><span class="section-note">${n||''}</span></div><div class="list">${items.length?items.map(miniRow).join(''):'<div class="empty">아직 데이터가 부족해요.</div>'}</div></section>`}function tagBox(t,n,l){const items=(l||[]).filter(match);return `<section class="section"><div class="section-head"><h2>${t}</h2><span class="section-note">${n}</span></div><div class="tag-list">${items.length?items.map(item=>`<div class="name-tag">${escapeHtml(item.name)}${item.meta?`<div class="tag-meta">${escapeHtml(item.meta)}</div>`:''}</div>`).join(''):'<div class="empty">아직 데이터가 부족해요.</div>'}</div></section>`}function renderChicks(){const items=(hallData.newChicks||[]).filter(match),b=document.getElementById('chickBanner'),tags=document.getElementById('chickTags'),title=document.getElementById('chickTitle');if(!items.length){b.style.display='none';return}b.style.display='grid';title.textContent=`🐣 신입 병아리 ${items.length}명 입장!`;tags.innerHTML=items.slice(0,3).map(i=>`<span class="chick-tag">${escapeHtml(i.name)}${i.meta?`<br><small>${escapeHtml(i.meta)}</small>`:''}</span>`).join('')+'<span class="chick-tag">자세히 보기 ›</span>';b.onclick=()=>alert('🐣 신입 병아리

'+items.map(i=>i.meta?`${i.name}
${i.meta}`:i.name).join('

'))}function overallTable(){const list=currentOverall().filter(match),total=Math.max(1,Math.ceil(list.length/PAGE_SIZE));if(page>total)page=total;const start=(page-1)*PAGE_SIZE,slice=list.slice(start,start+PAGE_SIZE);return `<section class="overall"><div class="overall-head"><h2>🏅 키노조 전체 순위 <small>(${mode==='main'?'본캐 기준':'전체 기준'})</small></h2><div class="page-tools"><span>${page} / ${total} 페이지</span><button class="page-btn" data-page="prev">‹</button><button class="page-btn" data-page="next">›</button></div></div><table class="rank-table"><thead><tr><th class="num">순위</th><th>캐릭터명</th><th>서버</th><th>PVE 전투력</th><th>PVP 전투력</th><th>AI 리뷰</th></tr></thead><tbody>${slice.map((item,i)=>`<tr><td class="num">${start+i<3?rankIcon(start+i):start+i+1}</td><td><strong>${escapeHtml(item.name)}</strong></td><td>${escapeHtml(item.meta||'지켈')}</td><td class="power">${escapeHtml(item.pvePowerLabel||item.label||'')}</td><td class="power">${escapeHtml(item.pvpPowerLabel||'')}</td><td class="reviews"><div>⚔ ${escapeHtml(item.pveReview||'')}</div><div>🛡 ${escapeHtml(item.pvpReview||'')}</div></td></tr>`).join('')}</tbody></table></section>`}function classSection(){const r=currentClasses(),tabs=CLASS_ORDER.map(c=>`<button class="pill ${activeClass===c?'active':''}" data-class="${c}">${c}</button>`).join(''),cards=CLASS_ORDER.map(c=>`<div class="class-card ${activeClass===c?'active-mobile':''}"><div class="class-title">${c} TOP 3</div>${(r[c]||[]).length?(r[c]||[]).map(miniRow).join(''):'<div class="empty">데이터 부족</div>'}</div>`).join('');return `<section class="section classes"><div class="section-head"><h2>⚔ 클래스별 전투력 TOP3</h2><span class="section-note">모바일 탭 방식</span></div><div class="class-tabs">${tabs}</div><div class="class-grid">${cards}</div></section>`}function render(){if(!hallData)return;renderChicks();app.className='';app.innerHTML=`<div class="dashboard"><div><div class="top-grid">${rankBox('⚔ PVE TOP 3','',hallData.pveTop)}${rankBox('⚔ PVP TOP 3','',hallData.pvpTop)}</div></div><div class="side-stack">${tagBox('😈 같은 마족이면 가족이지','타서버 마족',hallData.demonFamily)}${tagBox('🤝 같은 파티면 친구지','천족 서버',hallData.partyFriend)}</div></div>${overallTable()}${classSection()}`;bind()}function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page+=b.dataset.page==='next'?1:-1;if(page<1)page=1;render()});document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{activeClass=b.dataset.class;render()})}async function load(){app.className='loading';app.textContent='명예의 전당 데이터를 불러오는 중...';const res=await fetch(`${WEB_APP_URL}${WEB_APP_URL.includes('?')?'&':'?'}action=hallOfFame&t=${Date.now()}`,{cache:'no-store'});const text=await res.text();if(!res.ok)throw new Error(text);hallData=JSON.parse(text);render()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;page=1;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('searchInput').oninput=e=>{keyword=e.target.value.trim();page=1;render()};document.getElementById('refreshBtn').onclick=()=>load().catch(e=>app.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`);document.getElementById('suggestBtn').onclick=()=>{const box=document.getElementById('suggestionBox');box.style.display=box.style.display==='none'?'block':'none'};document.getElementById('submitSuggestBtn').onclick=async()=>{const title=document.getElementById('suggestTitle').value.trim(),proposer=document.getElementById('suggestProposer').value.trim(),memo=document.getElementById('suggestMemo').value.trim();if(!title)return alert('항목 이름을 입력해 주세요.');const res=await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify({action:'hallSuggestion',title,proposer,memo})});const data=await res.json();if(!data.ok)return alert(data.message||'전송 실패');alert('제안이 접수되었습니다.');load()};load().catch(e=>app.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`);
</script></body></html>
