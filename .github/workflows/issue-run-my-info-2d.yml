name: Apply My Info 2-D

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - "ui/.my-info-2d-trigger"

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.issue.title == 'KINOJO_MY_INFO_2D_20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply real member character panel
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          js_path=Path('ui/kinojo-common-ui.js')
          js=js_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old,new,1)

          js=replace_once(
              js,
              "link.href='/ui/kinojo-my-info.css?cache=2026081902';",
              "link.href='/ui/kinojo-my-info.css?cache=2026081903';",
              'my info css cache'
          )

          js=replace_once(
              js,
              '''            <div class="kinojo-my-info-character-pending" aria-live="polite">캐릭터 연동 준비 중</div>''',
              '''            <div class="kinojo-my-info-character-list" id="kinojoMyInfoCharacterList" aria-live="polite"><div class="kinojo-my-info-character-status">캐릭터 불러오는 중</div></div>''',
              'character panel placeholder'
          )

          insertion='''
  const kinojoMyCharactersState={token:'',data:null,promise:null,retryTimer:0};
  function myInfoSessionToken_(){
    const token=String(window.KinojoAuth?.getSession?.()?.token||'').trim();
    return /^kws_[A-Za-z0-9_-]{40,80}$/.test(token)?token:'';
  }
  function setMyInfoCharacterStatus_(message,code=''){
    const host=q('#kinojoMyInfoCharacterList');
    if(!host)return;
    host.dataset.state=code||'status';
    host.innerHTML='<div class="kinojo-my-info-character-status">'+escapeHtml(message||'캐릭터 정보를 확인 중입니다.')+'</div>';
  }
  function resetMyInfoCharacters_(){
    if(kinojoMyCharactersState.retryTimer)clearTimeout(kinojoMyCharactersState.retryTimer);
    kinojoMyCharactersState.token='';
    kinojoMyCharactersState.data=null;
    kinojoMyCharactersState.promise=null;
    kinojoMyCharactersState.retryTimer=0;
    setMyInfoCharacterStatus_('캐릭터 불러오는 중','idle');
  }
  function renderMyInfoCharacters_(data){
    const host=q('#kinojoMyInfoCharacterList');
    if(!host)return;
    if(!data||data.ok!==true){
      setMyInfoCharacterStatus_('캐릭터 정보를 불러오지 못했습니다.','error');
      return;
    }
    if(data.ownerResolved!==true){
      setMyInfoCharacterStatus_('등록된 본캐 연결 정보를 확인할 수 없습니다.',String(data.code||'OWNER_NOT_RESOLVED'));
      return;
    }
    const characters=Array.isArray(data.characters)?data.characters.filter(row=>Number(row?.characterId||0)>0):[];
    if(!characters.length){
      setMyInfoCharacterStatus_('연결된 캐릭터가 없습니다.','empty');
      return;
    }
    host.dataset.state='ready';
    host.innerHTML=characters.map(row=>{
      const characterId=Number(row.characterId||0);
      const serverId=Number(row.serverId||0);
      const characterName=String(row.characterName||'').trim();
      const isMain=row.isMain===true;
      const kind=isMain?'본캐':'부캐';
      return '<article class="kinojo-my-info-character-row '+(isMain?'is-main':'is-alt')+'" data-character-id="'+characterId+'" data-server-id="'+(Number.isFinite(serverId)?serverId:'')+'" data-character-name="'+escapeHtml(characterName)+'" aria-label="'+escapeHtml(characterName+' · '+kind)+'">'
        +'<span class="kinojo-my-info-character-kind">'+kind+'</span>'
        +'<strong class="kinojo-my-info-character-name">'+escapeHtml(characterName||'이름 없음')+'</strong>'
        +'</article>';
    }).join('');
  }
  async function loadMyInfoCharacters_(force=false){
    const token=myInfoSessionToken_();
    if(!token){resetMyInfoCharacters_();return null;}
    if(!force&&kinojoMyCharactersState.token===token&&kinojoMyCharactersState.data){
      renderMyInfoCharacters_(kinojoMyCharactersState.data);
      return kinojoMyCharactersState.data;
    }
    if(kinojoMyCharactersState.token!==token){
      if(kinojoMyCharactersState.retryTimer)clearTimeout(kinojoMyCharactersState.retryTimer);
      kinojoMyCharactersState.token=token;
      kinojoMyCharactersState.data=null;
      kinojoMyCharactersState.promise=null;
      kinojoMyCharactersState.retryTimer=0;
    }
    if(kinojoMyCharactersState.promise)return kinojoMyCharactersState.promise;
    const client=window.KinojoSupabaseClientCore;
    if(!client||typeof client.invokeEdgeFunction!=='function'){
      setMyInfoCharacterStatus_('서버 연결을 준비하는 중입니다.','waiting');
      if(kinojoMyCharactersState.retryTimer)clearTimeout(kinojoMyCharactersState.retryTimer);
      kinojoMyCharactersState.retryTimer=setTimeout(()=>{
        kinojoMyCharactersState.retryTimer=0;
        if(myInfoSessionToken_()===token)loadMyInfoCharacters_(force).catch(()=>{});
      },180);
      return null;
    }
    setMyInfoCharacterStatus_('캐릭터 불러오는 중','loading');
    kinojoMyCharactersState.promise=(async()=>{
      const data=await client.invokeEdgeFunction('kinojo-member-profile',{action:'characters',sessionToken:token});
      if(myInfoSessionToken_()!==token)return null;
      if(!data||data.ok!==true)throw new Error(data?.message||data?.code||'CHARACTER_LIST_FAILED');
      kinojoMyCharactersState.data=data;
      renderMyInfoCharacters_(data);
      return data;
    })().catch(error=>{
      if(myInfoSessionToken_()===token){
        kinojoMyCharactersState.data=null;
        setMyInfoCharacterStatus_('캐릭터 정보를 불러오지 못했습니다.',String(error?.message||'error').slice(0,80));
      }
      return null;
    }).finally(()=>{
      if(kinojoMyCharactersState.token===token)kinojoMyCharactersState.promise=null;
    });
    return kinojoMyCharactersState.promise;
  }
'''

          js=replace_once(
              js,
              '''    document.body.appendChild(layer);\n  }\n  function makeMyInfoModal(){''',
              '''    document.body.appendChild(layer);\n  }'''+insertion+'''  function makeMyInfoModal(){''',
              'my info loader insertion'
          )

          js=replace_once(
              js,
              '''    if(!loggedIn){closeMyInfoPanel();closeMyInfoModal();}\n  }''',
              '''    if(!loggedIn){resetMyInfoCharacters_();closeMyInfoPanel();closeMyInfoModal();}\n    else setTimeout(()=>loadMyInfoCharacters_().catch(()=>{}),0);\n  }''',
              'auth character preload'
          )

          js=replace_once(
              js,
              '''    document.body.classList.add('kinojo-my-info-open');\n    if(btn)btn.setAttribute('aria-expanded','true');\n  }''',
              '''    document.body.classList.add('kinojo-my-info-open');\n    if(btn)btn.setAttribute('aria-expanded','true');\n    loadMyInfoCharacters_().catch(()=>{});\n  }''',
              'panel character load'
          )

          js_path.write_text(js,encoding='utf-8')

          css_path=Path('ui/kinojo-my-info.css')
          css=css_path.read_text(encoding='utf-8')
          css=replace_once(css,'/* KINOJO My Info panel shell v20260819.04 */','/* KINOJO My Info panel shell v20260819.05 */','css version')

          replacement='''.kinojo-my-info-characters{margin-top:16px;padding-top:14px;border-top:1px solid rgba(122,146,180,.16)}
.kinojo-my-info-section-title{margin-bottom:8px;color:#17233a;font-size:12px;font-weight:1000}

/* 20260819_09: 2-D real member character rows; names/main-alt only */
.kinojo-my-info-character-list{display:grid;gap:8px}
.kinojo-my-info-character-status{min-height:58px;display:grid;place-items:center;padding:10px;border:1px dashed rgba(122,146,180,.24);border-radius:12px;background:#f8fafc;color:#64748b;text-align:center;font-size:10px;font-weight:900;line-height:1.45}
.kinojo-my-info-character-row{min-width:0;min-height:52px;display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid rgba(122,146,180,.18);border-radius:12px;background:#fff;box-sizing:border-box}
.kinojo-my-info-character-row.is-main{border-left:3px solid #2563eb;background:linear-gradient(90deg,#f7fbff,#fff 28%)}
.kinojo-my-info-character-row.is-alt{border-left:3px solid #cbd5e1}
.kinojo-my-info-character-kind{flex:0 0 auto;min-width:34px;padding:4px 7px;border-radius:999px;background:#f1f5f9;color:#64748b;text-align:center;font-size:8px;font-weight:1000;line-height:1}
.kinojo-my-info-character-row.is-main .kinojo-my-info-character-kind{background:#eaf2ff;color:#2563eb}
.kinojo-my-info-character-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#17233a;font-size:12px;font-weight:950;line-height:1.25}

'''
          pattern=r"\.kinojo-my-info-characters\{.*?\n\n/\* 20260819_04:"
          match=re.search(pattern,css,flags=re.S)
          if not match:
              raise SystemExit('character preview css block not found')
          css=css[:match.start()]+replacement+'/* 20260819_04:'+css[match.end():]
          css=replace_once(css,'.kinojo-my-info-character-pending{padding-left:0;padding-right:0}','.kinojo-my-info-character-row{padding-left:10px;padding-right:10px}','mobile character row')
          css_path.write_text(css,encoding='utf-8')
          PY

      - name: Validate 2-D contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/kinojo-common-ui.js
          grep -q "invokeEdgeFunction('kinojo-member-profile',{action:'characters',sessionToken:token})" ui/kinojo-common-ui.js
          grep -q 'id="kinojoMyInfoCharacterList"' ui/kinojo-common-ui.js
          ! grep -q '캐릭터 연동 준비 중' ui/kinojo-common-ui.js
          grep -q '2-D real member character rows' ui/kinojo-my-info.css
          ! grep -q '1-E character row preview' ui/kinojo-my-info.css
          python3 <<'PY'
          from pathlib import Path
          css=Path('ui/kinojo-my-info.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace mismatch')
          js=Path('ui/kinojo-common-ui.js').read_text(encoding='utf-8')
          if 'memberId:' in js[js.index("invokeEdgeFunction('kinojo-member-profile'")-400:js.index("invokeEdgeFunction('kinojo-member-profile'")+500]:
              raise SystemExit('client member selector leaked into My Info request')
          PY
          node tests/web-shell-auth-contract.test.js
          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f ui/.my-info-2d-trigger
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add ui/kinojo-common-ui.js ui/kinojo-my-info.css
          git add -u ui/.my-info-2d-trigger || true
          git commit -m "Connect My Info character list"
          git push origin main

      - name: Upload exact final source
        uses: actions/upload-artifact@v4
        with:
          name: kinojo-my-info-2d-source
          path: |
            ui/kinojo-common-ui.js
            ui/kinojo-my-info.css
          if-no-files-found: error
          retention-days: 1
