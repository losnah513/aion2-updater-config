name: Temporary PASS KEY 1-C-7 raw consumer audit

on:
  push:
    branches:
      - agent/passkey-1c7-raw-consumer-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passkey-1c7-raw-consumer-audit
      - name: Audit raw PASS KEY consumers
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          from collections import defaultdict

          tracked = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          files=[]
          for raw in tracked:
              if not raw: continue
              path=Path(raw.decode())
              if path.as_posix()=='.github/workflows/tmp-passkey-1c7-raw-consumer-audit.yml':
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except Exception:
                  continue
              files.append((path.as_posix(),text))

          patterns={
            'currentPassKey_call': re.compile(r'\bcurrentPassKey\s*\('),
            'currentPassKey_any': re.compile(r'\bcurrentPassKey\b'),
            'currentAdminSessionCredential_call': re.compile(r'\bcurrentAdminSessionCredential\s*\('),
            'currentServerSessionCredential_call': re.compile(r'\bcurrentServerSessionCredential\s*\('),
            'passKey_prop': re.compile(r'\bpassKey\b'),
            'pass_key_prop': re.compile(r'\bpass_key\b'),
            'passCode_prop': re.compile(r'\bpassCode\b'),
            'pass_code_prop': re.compile(r'\bpass_code\b'),
            'kinojo_pass_literal': re.compile(r'kinojo[^\n\r\"\']{0,40}pass|pass[^\n\r\"\']{0,40}kinojo',re.I),
            'localStorage_any': re.compile(r'\blocalStorage\b'),
            'sessionStorage_any': re.compile(r'\bsessionStorage\b'),
          }

          hits=defaultdict(list)
          for name,pat in patterns.items():
              for file,text in files:
                  for ln,line in enumerate(text.splitlines(),1):
                      if pat.search(line): hits[name].append((file,ln,line.strip()))

          print('=== PASSKEY AUDIT SUMMARY ===')
          for name in patterns:
              rows=hits[name]
              print(f'{name}: occurrences={len(rows)} files={len(set(r[0] for r in rows))}')

          print('\n=== currentPassKey CALLS ===')
          for row in hits['currentPassKey_call']: print(f'{row[0]}:{row[1]}:{row[2]}')

          print('\n=== SESSION CREDENTIAL CALLS ===')
          for key in ['currentAdminSessionCredential_call','currentServerSessionCredential_call']:
              print(f'-- {key}')
              for row in hits[key]: print(f'{row[0]}:{row[1]}:{row[2]}')

          print('\n=== PASS IDENTIFIER HITS IN RUNTIME FILES ===')
          runtime_ext={'.js','.html','.mjs','.ts'}
          seen=set()
          for key in ['passKey_prop','pass_key_prop','passCode_prop','pass_code_prop']:
              for file,ln,line in hits[key]:
                  if Path(file).suffix not in runtime_ext or file.startswith('tests/') or file.startswith('.github/'):
                      continue
                  tup=(file,ln,line)
                  if tup in seen: continue
                  seen.add(tup)
                  print(f'{file}:{ln}:{line}')

          print('\n=== STORAGE LINES WITH PASS/AUTH/SESSION CONTEXT ===')
          for file,text in files:
              if Path(file).suffix not in runtime_ext: continue
              for ln,line in enumerate(text.splitlines(),1):
                  low=line.lower()
                  if ('localstorage' in low or 'sessionstorage' in low) and any(k in low for k in ['pass','auth','session','credential','token']):
                      print(f'{file}:{ln}:{line.strip()}')

          print('\n=== KEY LITERAL CANDIDATES ===')
          literal_re=re.compile(r"['\"]([^'\"]*(?:pass|auth|session|credential|token)[^'\"]*)['\"]",re.I)
          literals=defaultdict(set)
          for file,text in files:
              if Path(file).suffix not in runtime_ext: continue
              for ln,line in enumerate(text.splitlines(),1):
                  for m in literal_re.finditer(line):
                      s=m.group(1)
                      if len(s)<=120:
                          literals[s].add(file)
          for s in sorted(literals, key=str.lower):
              if any(k in s.lower() for k in ['pass','auth','session','credential','token']):
                  print(f'{s} :: {", ".join(sorted(literals[s]))}')
          PY
