<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sanctuary Management Fixed Draft E2E</title>
  <link rel="stylesheet" href="../ui/kinojo-common-ui.css">
  <link rel="stylesheet" href="../ui/kinojo-components.css">
  <link rel="stylesheet" href="../sanctuary-management/css/sanctuary-management.css">
  <link rel="stylesheet" href="../sanctuary-management/css/sanctuary-management-draft.css">
  <link rel="stylesheet" href="../sanctuary-management/css/sanctuary-management-support.css">
</head>
<body class="kinojo-sanctuary-management-page">
  <main class="sanctuary-management-wrap">
    <header class="sanctuary-management-hero"><div class="sanctuary-management-hero-info"><h1>고정 팀 DRAFT</h1><div class="sanctuary-management-info-copy"><p class="sanctuary-management-kicker">E2E HARNESS</p><p class="sanctuary-management-hero-description">실제 제품 CSS·JS와 mock Server 어댑터를 사용하는 레이아웃 검수 화면</p></div></div><div id="sanctuaryManagementContract" class="sanctuary-management-contract"></div></header>
    <section id="sanctuaryManagementAccess" class="sanctuary-management-access" aria-live="polite"><span class="sanctuary-management-access-icon">S</span><div><strong id="sanctuaryManagementAccessTitle"></strong><p id="sanctuaryManagementAccessMessage"></p></div><button id="sanctuaryManagementAccessAction" type="button" hidden></button></section>
    <section class="sanctuary-management-page-bar"><div class="sanctuary-management-page-bar-shell"><div class="sanctuary-management-scope-shell" id="sanctuaryManagementScopeShell" hidden><div class="sanctuary-management-scope" id="sanctuaryManagementScope" role="group" aria-label="관리할 성역 선택"></div></div></div></section>
    <div id="sanctuaryManagementContent" class="sanctuary-management-content" hidden>
      <section class="sanctuary-management-summary"><article><strong id="sanctuaryManagementSource"></strong><div class="sanctuary-management-info-copy"><span>데이터 원본</span><small>Mock Server</small></div></article><article><strong id="sanctuaryManagementReadState"></strong><div class="sanctuary-management-info-copy"><span>팀 읽기</span><small>Server 기능 플래그</small></div></article><article><strong id="sanctuaryManagementWriteState"></strong><div class="sanctuary-management-info-copy"><span>팀 쓰기</span><small id="sanctuaryManagementWriteMeta">Server 기능 플래그</small></div></article><article><strong id="sanctuaryManagementSelectedName"></strong><div class="sanctuary-management-info-copy"><span>선택 성역</span><small id="sanctuaryManagementSelectedMeta"></small></div></article></section>
      <div class="sanctuary-management-layout">
        <section class="sanctuary-management-team-panel"><header class="sanctuary-management-section-head"><div class="sanctuary-management-section-info"><h2>운영 팀</h2><div class="sanctuary-management-info-copy"><p>TEAM WORKSPACE</p><span id="sanctuaryManagementTeamStatus"></span></div></div><button class="kinojo-btn" id="sanctuaryManagementAddTeam" type="button" disabled>팀 추가하기</button></header><div id="sanctuaryManagementTeamList" class="sanctuary-management-team-list"></div></section>
        <aside class="sanctuary-management-side" aria-label="성역 팀 보조 정보">
          <section><header class="sanctuary-management-side-head"><h2>일정 요약</h2><div class="sanctuary-management-info-copy"><p>SCHEDULE</p><span>월 단위 · 수요일 시작</span></div></header><div class="sanctuary-management-placeholder" id="sanctuaryManagementScheduleState"></div></section>
          <section><header class="sanctuary-management-side-head"><h2>모집·지원</h2><div class="sanctuary-management-info-copy"><p>RECRUITMENT</p><span>포스별 지원 현황</span></div></header><div class="sanctuary-management-placeholder" id="sanctuaryManagementRecruitmentState"></div></section>
          <section><header class="sanctuary-management-side-head"><h2>관리</h2><div class="sanctuary-management-info-copy"><p>ADMINISTRATION</p><span>편집 · 승인 · 팀 해산</span></div></header><div class="sanctuary-management-placeholder" id="sanctuaryManagementAdminState"></div></section>
        </aside>
      </div>
    </div>
  </main>
  <script>
    (()=>{
      const pilotApproved=new URLSearchParams(location.search).get('pilot')!=='0';
      let forceSequence=100;
      let partySequence=200;
      let slotSequence=300;
      const creatorCandidates=[
        {characterId:501,serverId:2,serverName:'지켈',characterName:'테스트본캐',className:'검성',profileImageUrl:'',isMain:true,relation:'MAIN',mainCharacterId:501},
        {characterId:502,serverId:2,serverName:'지켈',characterName:'테스트부캐',className:'살성',profileImageUrl:'',isMain:false,relation:'ALT',mainCharacterId:501}
      ];
      const searchableCharacters=[
        {characterId:601,serverId:2,serverName:'지켈',characterName:'테스트검색',className:'궁성',legionName:'깡',profileImageUrl:'',raceId:1,isOperationalLegion:true,ownerMemberId:9,relation:'MAIN',mainCharacterId:601}
      ];
      const officialCandidates={
        외부게스트:{candidateId:'official-guest-701',characterName:'외부게스트',serverId:2,serverName:'지켈',className:'마도성',legionName:'외부레기온',profileImageUrl:'',raceId:1,isOperationalLegion:false,allowedRelations:['GUEST']},
        운영부캐:{candidateId:'official-alt-702',characterName:'운영부캐',serverId:2,serverName:'지켈',className:'치유성',legionName:'밤',profileImageUrl:'',raceId:1,isOperationalLegion:true,allowedRelations:['MAIN','ALT']}
      };
      const character={characterId:501,name:'테스트본캐',serverName:'지켈',className:'검성',profileImageUrl:'',relation:'MAIN'};
      function makeForce(forceNo,withCharacter=false){
        const forceId=forceSequence++;
        const parties=[1,2].map(partyNo=>{
          const partyId=partySequence++;
          const slots=Array.from({length:5},(_,index)=>({slotId:slotSequence++,slotNo:index+1,occupied:withCharacter&&partyNo===1&&index===0,revision:1,character:withCharacter&&partyNo===1&&index===0?character:null}));
          const occupiedCount=slots.filter(slot=>slot.occupied).length;
          return {partyId,partyNo,capacity:5,occupiedCount,vacancyCount:5-occupiedCount,slots};
        });
        const occupiedCount=parties.reduce((sum,party)=>sum+party.occupiedCount,0);
        return {forceId,forceNo,capacity:10,status:occupiedCount===10?'FULL':'OPEN',revision:1,occupiedCount,vacancyCount:10-occupiedCount,creatorMemberId:7,creatorOwnerResolved:true,creatorAlreadyAssigned:withCharacter,creatorCandidateCode:withCharacter?'CREATOR_ALREADY_ASSIGNED':'READY',creatorCandidateCount:withCharacter?0:creatorCandidates.length,creatorCandidates:withCharacter?[]:structuredClone(creatorCandidates),parties};
      }
      function syncTeam(team){
        team.forceCount=team.forces.length;
        team.slotCount=team.forces.length*10;
        team.occupiedCount=team.forces.reduce((sum,force)=>sum+force.occupiedCount,0);
        team.vacancyCount=team.slotCount-team.occupiedCount;
        team.canEdit=true;
        team.canArchive=true;
        team.scheduleEditScopes=team.schedule?.kind==='WEEKLY'?['OCCURRENCE','FUTURE','ALL']:['OCCURRENCE','ALL'];
        team.supportCharacters=team.supportCharacters||{ownerResolved:true,code:'NOT_OPEN',candidateCount:0,characters:[]};
        team.supportBatches=team.supportBatches||[];
        return team;
      }
      const participationForce=makeForce(1,true);
      Object.assign(participationForce,{viewerAlreadyAssigned:false,viewerPending:false,canSupport:true,supportDisabledCode:'',supportDisabledMessage:''});
      let teams=[{
        teamId:77,sanctuaryId:1,title:'1팀 목요일 21시',activity:'성역1 진행',mode:'FIXED',joinPolicy:'INSTANT',status:'DRAFT',revision:4,
        schedule:{scheduleId:91,kind:'WEEKLY',startsOn:'2026-08-27',weekdays:[4],startsAt:'21:00',durationMinutes:60,status:'ACTIVE',revision:2},
        forces:[makeForce(1)]
      },{
        teamId:78,sanctuaryId:1,title:'2팀 토요일 22시',activity:'성역1 참여 모집',mode:'PARTICIPATION',joinPolicy:'APPROVAL',status:'ACTIVE',revision:2,canEdit:true,
        schedule:{scheduleId:92,kind:'WEEKLY',startsOn:'2026-08-29',weekdays:[6],startsAt:'22:00',durationMinutes:90,status:'ACTIVE',revision:1},
        forces:[participationForce],
        supportCharacters:{ownerResolved:true,code:'READY',candidateCount:1,characters:[{characterId:801,mainCharacterId:801,serverId:2,characterName:'지원본캐',serverName:'지켈',className:'치유성',profileImageUrl:'',relation:'MAIN',isMain:true,availableForceIds:[participationForce.forceId],disabledCode:'',disabledMessage:'',conflicts:[]}]},
        supportBatches:[]
      }].map(syncTeam);
      const sanctuaries=[
        {id:1,code:'rudra',name:'심연의 재련: 루드라',shortName:'루드라팟',displayOrder:1,releaseStatus:'OPEN'},
        {id:2,code:'bagot',name:'침식의 정화소',shortName:'바고트팟',displayOrder:2,releaseStatus:'OPEN'},
        {id:3,code:'kaldrix',name:'무스펠의 성배',shortName:'칼드릭스팟',displayOrder:3,releaseStatus:'OPEN'},
        {id:4,code:'sanctuary4',name:'성역4',shortName:'성역4',displayOrder:4,availableFrom:'2026-09-09',releaseStatus:'UPCOMING',releaseLabel:'9월 9일 추가 예정'}
      ];
      window.KinojoAuth={getSession:()=>({token:'kws_'+('A'.repeat(40))}),getAccount:()=>({level:3,permissions:['sanctuary_edit']})};
      window.KinojoPermissions={canEditSanctuary:()=>true};
      window.KinojoToast={show:message=>{document.body.dataset.toast=message;},success:message=>{document.body.dataset.toast=message;}};
      window.KinojoSupabase={
        async getSanctuaryManagementBootstrap(){return {apiVersion:1.6,schemaVersion:439,serverTime:new Date().toISOString(),readEnabled:true,writeEnabled:pilotApproved,globalWriteEnabled:true,rollout:{mode:'PILOT',globalWriteEnabled:true,effectiveWriteEnabled:pilotApproved,pilotApproved,pilotApprovedAt:pilotApproved?new Date().toISOString():'',pilotExpiresAt:'',reasonCode:pilotApproved?'PILOT_APPROVED':'PILOT_NOT_APPROVED',message:pilotApproved?'시험 사용자 쓰기가 활성화되었습니다.':'승인된 시험 사용자만 신규 성역 관리 쓰기를 사용할 수 있습니다.'},actor:{memberId:7,canManageAll:true},sanctuaries,teams:structuredClone(teams)};},
        async getSanctuaryManagementMonth(month){return {ok:true,apiVersion:1.6,schemaVersion:439,month,weekStartsOn:'WEDNESDAY',rangeStart:'2026-07-29',rangeEnd:'2026-09-01',weekStarts:['2026-07-29','2026-08-05','2026-08-12','2026-08-19','2026-08-26'],occurrences:[{occurrenceKey:'sm-78-20260829-2200',scheduleId:92,scheduleRevision:1,teamId:78,teamTitle:'2팀 토요일 22시',sanctuaryId:1,teamMode:'PARTICIPATION',joinPolicy:'APPROVAL',occurrenceDate:'2026-08-29',weekStart:'2026-08-26',startAt:'2026-08-29T13:00:00Z',endAt:'2026-08-29T14:30:00Z',durationMinutes:90,sourceScope:'RULE',canEdit:true}]};},
        async getSanctuaryManagementArchivePreview(teamId){const team=teams.find(item=>item.teamId===Number(teamId));return {ok:true,schemaVersion:439,teamId:team.teamId,teamTitle:team.title,revision:team.revision,canArchive:true,futureOccurrenceCount:52,futureWindowDays:366,recurringSchedule:true,pendingSupportCount:1,historyPreserved:true,message:'팀 편성·감사 이력은 보존하고 이후 일정과 승인 대기 지원을 종료합니다.'};},
        async runSanctuaryManagementLease(){return {ok:true,lease:{status:'ACTIVE'}};},
        async searchSanctuaryManagementCharacter(teamId,query){
          const normalized=String(query||'').trim().replace(/\[지켈\]$/,'');
          const character=searchableCharacters.find(item=>item.characterName===normalized);
          if(character)return {ok:true,apiVersion:1.6,schemaVersion:439,source:'CHARACTER_MASTER',teamId,character:structuredClone(character)};
          const candidate=officialCandidates[normalized];
          if(candidate)return {ok:true,apiVersion:1.6,schemaVersion:439,source:'OFFICIAL',teamId,candidate:structuredClone(candidate)};
          throw new Error('정확히 일치하는 캐릭터를 찾지 못했습니다.');
        },
        async registerSanctuaryManagementCharacter(teamId,candidateId,relationType,mainCharacterId){
          const candidate=Object.values(officialCandidates).find(item=>item.candidateId===candidateId);
          if(!candidate)throw new Error('공식 조회 후보를 다시 선택해 주세요.');
          const character={characterId:700+searchableCharacters.length,serverId:candidate.serverId,serverName:candidate.serverName,characterName:candidate.characterName,className:candidate.className,legionName:candidate.legionName,profileImageUrl:candidate.profileImageUrl,raceId:candidate.raceId,isOperationalLegion:candidate.isOperationalLegion,ownerMemberId:relationType==='GUEST'?0:7,relation:relationType,mainCharacterId:relationType==='ALT'?mainCharacterId:700+searchableCharacters.length};
          searchableCharacters.push(character);
          return {ok:true,apiVersion:1.6,schemaVersion:439,teamId,character:structuredClone(character)};
        },
        async runSanctuaryManagementCommand(command,payload,expectedRevision){
          if(command==='CREATE_TEAM'){
            const teamId=88;teams.unshift(syncTeam({teamId,sanctuaryId:sanctuaries.find(item=>item.code===payload.sanctuaryCode).id,title:payload.title,activity:payload.activity,mode:'FIXED',joinPolicy:'INSTANT',status:'DRAFT',revision:1,schedule:Object.assign({scheduleId:92,status:'ACTIVE',revision:1},payload.schedule),forces:[makeForce(1)]}));
            return {ok:true,action:command,teamId,revision:1};
          }
          const team=teams.find(item=>item.teamId===payload.teamId);
          if(!team||team.revision!==expectedRevision)throw new Error('다른 사용자가 먼저 팀 초안을 수정했습니다.');
          if(command==='EDIT_SCHEDULE'){team.schedule=Object.assign({},team.schedule,payload.schedule,{revision:team.schedule.revision+1,status:payload.operation==='UPDATE'?'ACTIVE':'STOPPED'});team.revision+=1;return {ok:true,action:command,teamId:team.teamId,revision:team.revision,schemaVersion:439};}
          if(command==='ARCHIVE_TEAM'){team.status='ARCHIVED';team.revision+=1;teams=teams.filter(item=>item.teamId!==team.teamId);return {ok:true,action:command,teamId:team.teamId,revision:team.revision,schemaVersion:439,historyPreserved:true};}
          if(command==='ADD_FORCE'){
            if(team.forces.length>=9)throw new Error('팀당 포스는 최대 9개까지 만들 수 있습니다.');
            const force=makeForce(team.forces.length+1);team.forces.push(force);team.revision+=1;syncTeam(team);
            return {ok:true,action:command,teamId:team.teamId,forceId:force.forceId,forceNo:force.forceNo,revision:team.revision};
          }
          if(command==='SET_SLOT'){
            const force=team.forces.find(item=>item.forceId===payload.forceId);
            const party=force?.parties.find(item=>item.partyNo===payload.partyNo);
            const slot=party?.slots.find(item=>item.slotNo===payload.slotNo);
            const candidate=force?.creatorCandidates.find(item=>item.characterId===payload.characterId)||searchableCharacters.find(item=>item.characterId===payload.characterId);
            if(!force||!slot||slot.occupied||!candidate)throw new Error('생성자 캐릭터 후보와 슬롯을 다시 선택해 주세요.');
            slot.occupied=true;slot.revision+=1;slot.character={characterId:candidate.characterId,name:candidate.characterName,serverName:candidate.serverName,className:candidate.className,profileImageUrl:candidate.profileImageUrl,relation:candidate.relation};
            party.occupiedCount+=1;party.vacancyCount-=1;force.occupiedCount+=1;force.vacancyCount-=1;force.revision+=1;force.creatorAlreadyAssigned=true;force.creatorCandidateCode='CREATOR_ALREADY_ASSIGNED';force.creatorCandidateCount=0;force.creatorCandidates=[];team.revision+=1;syncTeam(team);
            return {ok:true,action:command,teamId:team.teamId,slotId:slot.slotId,revision:team.revision};
          }
          team.title=payload.title;team.activity=payload.activity;team.sanctuaryId=sanctuaries.find(item=>item.code===payload.sanctuaryCode).id;team.schedule=Object.assign({},team.schedule,payload.schedule,{revision:team.schedule.revision+1});team.revision+=1;
          return {ok:true,action:command,teamId:team.teamId,revision:team.revision};
        }
      };
    })();
  </script>
  <script src="../sanctuary-management/js/sanctuary-management.js"></script>
  <script src="../sanctuary-management/js/sanctuary-management-draft.js"></script>
  <script src="../sanctuary-management/js/sanctuary-management-support.js"></script>
</body>
</html>
