<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="KINOJO INFO" property="og:title"/>
<meta content="전투력과 성장 기록으로 선정된 최고의 모험가들" property="og:description"/>
<meta content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-banner-v2.png?v=1c202" property="og:image"/>
<title>KINOJO INFO</title>
<link href="css/hall.css?cache=26060700" rel="stylesheet"/>
<link href="../ui/kinojo-layout.css?v=1.c2.04-ui-fix" rel="stylesheet"/>
<link href="../ui/kinojo-components.css?v=1.c2.04-ui-fix" rel="stylesheet"/>
<link href="../ui/kinojo-common-ui.css?cache=26060700" rel="stylesheet"/>
<link href="../ui/kinojo-card-guards.css?v=1.c2.04-ui-fix" rel="stylesheet"/>
<link href="../ui/kinojo-animations.css?v=1.c2.04-ui-fix" rel="stylesheet"/>
</head>
<body>
<main class="wrap">
<section class="banner"><img alt="Kinojo Hall of Fame" src="assets/hall-banner-v2.png?v=1c202"/></section>
<section class="chick-card" id="chickCard"><button aria-label="신입 병아리 접기" class="chick-close" id="chickCloseBtn" type="button">🐥</button><div class="chick-line"><div class="chick-head"><div class="chick-icon">🐥</div><div><div class="chick-title" id="chickTitle">신입 병아리</div><div class="chick-sub" id="chickSub">새로운 모험가들을 환영합니다!</div></div></div><div class="chick-tags" id="chickTags"></div></div></section>
<section class="section" id="suggestionBox" style="display:none;margin-bottom:12px"><div class="section-head"><h2>💡 아이디어 제안 및 건의</h2><span class="section-note">운영자 검토 후 반영</span></div><div class="list"><input class="search" id="suggestTitle" placeholder="항목 이름"/><input class="search" id="suggestProposer" placeholder="제안자"/><textarea class="search" id="suggestMemo" placeholder="기준 설명" rows="3"></textarea><div class="suggest-actions"><button class="btn" id="submitSuggestBtn">제안 보내기</button><button class="btn" id="cancelSuggestBtn" type="button">취소</button></div></div></section>
<div class="loading" id="app"><div><div class="loader-ring"></div><div id="loaderText">명예의 전당 데이터를 불러오는 중...</div></div></div>
<section aria-hidden="true" class="reaction-popover" id="reactionPopover">
<div class="reaction-popover-head">
<span id="reactionModalTitle">캐릭터 반응 남기기</span>
<button aria-label="닫기" class="reaction-close" id="reactionCloseBtn" type="button">×</button>
</div>
<div class="reaction-popover-body">
<div class="reaction-choice">
<button id="reactionLikeBtn" type="button"><span aria-hidden="true" class="reaction-icon like-icon"></span><span>좋아요</span></button>
<button id="reactionDislikeBtn" type="button"><span aria-hidden="true" class="reaction-icon dislike-icon"></span><span>싫어요</span></button>
</div>
<div class="reaction-input-row">
<input class="reaction-comment" id="reactionComment" maxlength="20" placeholder="전하고 싶은 말을 남겨주세요"/>
<button aria-label="코멘트 전달" class="send-btn" id="reactionSubmitBtn" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24"><path d="M3.3 11.4 20.1 3.7c.8-.4 1.6.4 1.2 1.2l-7.7 16.8c-.3.7-1.3.6-1.5-.1l-1.7-6.4-6.4-1.7c-.7-.2-.8-1.2-.1-1.5Zm7.8 2.2 1.3 4.8 5.4-11.7-11.7 5.4 4.8 1.3 3.6-3.6 1.2 1.2-3.6 3.6Z"></path></svg>
</button>
</div>
<div class="reaction-status" id="reactionStatus"></div>
</div>
</section>
<footer class="footer common-footer"><div class="footer-links"><a href="../pages/about.html">사이트 소개</a><a href="../pages/terms.html">이용약관</a><a href="../pages/privacy.html">개인정보처리방침</a><button id="footerSuggestBtn" type="button">아이디어 제안 및 건의</button></div><div class="footer-powered">Powered by AION2 · 깡 레기온 지원</div></footer>
<section aria-hidden="true" class="construction-notice" id="constructionNotice">
<div aria-labelledby="constructionTitle" aria-modal="false" class="construction-card" role="dialog">
<button aria-label="닫기" class="construction-close" id="constructionCloseBtn" type="button">×</button>
<div class="construction-kicker">KINOJO INFO</div>
<h2 id="constructionTitle">페이지 인테리어 공사중입니다~</h2>
<p id="constructionMessage">조금만 기다려 주세요. 곧 더 깔끔한 성역팟 페이지로 열어둘게요.</p>
<button class="construction-ok" id="constructionOkBtn" type="button">확인</button>
</div>
</section>
</main>
<script src="../ui/kinojo-common-ui.js?cache=26060700"></script>
<script src="js/hall-state.js?cache=26061602"></script>
<script src="js/hall-render.js?cache=26061602"></script>
<script src="js/hall-admin.js?cache=26061602"></script>
<script src="js/hall-reactions.js?cache=26061602"></script>
<script src="js/hall-suggestions.js?cache=26061602"></script>
<script src="js/hall-construction.js?cache=26061602"></script>
<script src="js/app.js?cache=26061602"></script>
</body>
</html>
