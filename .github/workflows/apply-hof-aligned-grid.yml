name: Apply HOF aligned grid

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-hof-aligned-grid.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply scoped HOF redesign
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          helper=base64.b64decode('').decode()
          top=base64.b64decode('').decode()
          css_override=base64.b64decode('').decode()

          js_path=Path('hof/js/hall-render.js')
          js=js_path.read_text(encoding='utf-8')
          a=js.index('function hofPowerInfo(item,name,server){')
          b=js.index('function hofTop3Card(item,index,metric){')
          js=js[:a]+helper+js[b:]
          a=js.index('function hofTop3Card(item,index,metric){')
          b=js.index('function hofWidePanel(title,note,list,metric){')
          js=js[:a]+top+js[b:]
          old="    + '<span class=\"hof-v2-god-portrait\">'+hofRankPortrait(safeItem,1,'large')+(hasItem?hofRankMedal(1):'')+'</span>'\n    + '<strong>'+escapeHtml(name)+'</strong>'\n    + '<span>'+escapeHtml(meta||'지켈')+'</span>'\n"
          new="    + '<span class=\"hof-v2-god-portrait\">'+hofRankPortrait(safeItem,1,'large')+'</span>'\n    + '<span class=\"hof-v2-god-server\">'+escapeHtml(hofServerName(safeItem)||'지켈')+'</span>'\n    + '<strong>'+escapeHtml(name)+'</strong>'\n    + '<span class=\"hof-v2-god-class\">'+hofClassIcon(safeItem)+'<span>'+escapeHtml(hofClassName(safeItem)||'클래스 정보 없음')+'</span></span>'\n"
          if js.count(old)!=1: raise SystemExit('god markup contract mismatch')
          js=js.replace(old,new,1)
          js_path.write_text(js,encoding='utf-8')

          css_path=Path('hof/css/hall.css')
          css=css_path.read_text(encoding='utf-8')
          marker='KINOJO HOF 20260802 - aligned TOP3 grid redesign'
          if marker in css: raise SystemExit('redesign override already exists')
          css_path.write_text(css+'\n\n'+css_override,encoding='utf-8')

          for path in (Path('hof/index.html'),Path('m/hof/index.html')):
              html=path.read_text(encoding='utf-8')
              if 'cache=2026080202' not in html: raise SystemExit(f'{path}: cache contract mismatch')
              path.write_text(html.replace('cache=2026080202','cache=2026080203'),encoding='utf-8')
          PY
          node --check hof/js/hall-render.js
          grep -q 'grid-template-columns:26px' hof/css/hall.css
          grep -q 'cache=2026080203' hof/index.html
          grep -q 'cache=2026080203' m/hof/index.html
      - name: Commit scoped files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hof/js/hall-render.js hof/css/hall.css hof/index.html m/hof/index.html
          git commit -m "fix: 명예의 전당 TOP3 고정 열 정렬"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
