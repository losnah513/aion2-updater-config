name: Verify Banner Admin

on:
  pull_request:
    branches: [main]
    paths:
      - "admin/index.html"
      - "m/admin/index.html"
      - "admin/css/admin.css"
      - "admin/js/admin.js"
      - "admin/js/admin-shared.js"
      - "admin/js/admin-bootstrap.js"
      - "admin/js/admin-images.js"
      - "admin/js/admin-side-banners.js"
      - "admin/js/admin-banner-event-workflow.js"
      - "admin/js/admin-banner-events.js"
      - "admin/js/admin-banner-tabs.js"
      - "admin/js/admin-banner-library.js"
      - "admin/js/admin-banner-quality.js"
      - "tests/banner-admin-main-ui-contract.test.js"
      - "tests/banner-admin-side-ui-contract.test.js"
      - "tests/banner-admin-quality-contract.test.js"
      - "tests/banner-event-stage2-ui-contract.test.js"
      - "tests/banner-asset-metadata-v403-contract.test.js"
      - "tests/banner-event-stage3-ui-contract.test.js"
      - "tests/banner-event-phase2-stage1-shell-contract.test.js"
      - "tests/banner-event-phase2-stage3-preview-order-contract.test.js"
      - "tests/banner-event-phase2-stage4-page-selection-contract.test.js"
      - "tests/banner-event-phase2-stage5-editor-contract.test.js"
      - "tests/banner-event-phase2-stage6-library-contract.test.js"
      - "tests/banner-event-stage4-ui-contract.test.js"
      - "tests/banner-event-stage5-ui-contract.test.js"
      - "tests/banner-content-overlay-v396-contract.test.js"
      - "tests/banner-event-manager-v398-contract.test.js"
      - "tests/banner-legacy-lookbook-groups-v399-contract.test.js"
      - "supabase/functions/kinojo-banner-media/index.ts"
      - "supabase/migrations/20260826020948_banner_asset_titles_tags_v403.sql"
      - "supabase/migrations/20260826045246_banner_event_page_targets_v404.sql"
      - "supabase/migrations/20260826054751_banner_overlay_name_uniqueness_v405.sql"
      - "supabase/migrations/20260826065731_banner_asset_library_v406.sql"
      - "supabase/migrations/20260824143000_banner_event_manager_v398.sql"
      - "supabase/migrations/20260824232500_attach_legacy_lookbooks_v399.sql"
      - "tests/banner-admin-chrome-e2e.html"
      - ".github/workflows/verify-banner-admin.yml"
  push:
    branches: [main]
    paths:
      - "admin/index.html"
      - "m/admin/index.html"
      - "admin/css/admin.css"
      - "admin/js/admin.js"
      - "admin/js/admin-shared.js"
      - "admin/js/admin-bootstrap.js"
      - "admin/js/admin-images.js"
      - "admin/js/admin-side-banners.js"
      - "admin/js/admin-banner-event-workflow.js"
      - "admin/js/admin-banner-events.js"
      - "admin/js/admin-banner-tabs.js"
      - "admin/js/admin-banner-library.js"
      - "admin/js/admin-banner-quality.js"
      - "tests/banner-admin-main-ui-contract.test.js"
      - "tests/banner-admin-side-ui-contract.test.js"
      - "tests/banner-admin-quality-contract.test.js"
      - "tests/banner-event-stage2-ui-contract.test.js"
      - "tests/banner-asset-metadata-v403-contract.test.js"
      - "tests/banner-event-stage3-ui-contract.test.js"
      - "tests/banner-event-phase2-stage1-shell-contract.test.js"
      - "tests/banner-event-phase2-stage3-preview-order-contract.test.js"
      - "tests/banner-event-phase2-stage4-page-selection-contract.test.js"
      - "tests/banner-event-phase2-stage5-editor-contract.test.js"
      - "tests/banner-event-phase2-stage6-library-contract.test.js"
      - "tests/banner-event-stage4-ui-contract.test.js"
      - "tests/banner-event-stage5-ui-contract.test.js"
      - "tests/banner-content-overlay-v396-contract.test.js"
      - "tests/banner-event-manager-v398-contract.test.js"
      - "tests/banner-legacy-lookbook-groups-v399-contract.test.js"
      - "supabase/functions/kinojo-banner-media/index.ts"
      - "supabase/migrations/20260826020948_banner_asset_titles_tags_v403.sql"
      - "supabase/migrations/20260826045246_banner_event_page_targets_v404.sql"
      - "supabase/migrations/20260826054751_banner_overlay_name_uniqueness_v405.sql"
      - "supabase/migrations/20260826065731_banner_asset_library_v406.sql"
      - "supabase/migrations/20260824143000_banner_event_manager_v398.sql"
      - "supabase/migrations/20260824232500_attach_legacy_lookbooks_v399.sql"
      - "tests/banner-admin-chrome-e2e.html"
      - ".github/workflows/verify-banner-admin.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-banner-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify banner admin contracts
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            admin/js/admin.js \
            admin/js/admin-shared.js \
            admin/js/admin-bootstrap.js \
            admin/js/admin-images.js \
            admin/js/admin-side-banners.js \
            admin/js/admin-banner-event-workflow.js \
            admin/js/admin-banner-events.js \
            admin/js/admin-banner-tabs.js \
            admin/js/admin-banner-library.js \
            admin/js/admin-banner-quality.js; do
            node --check "$path"
          done
          node tests/banner-admin-main-ui-contract.test.js
          node tests/banner-admin-side-ui-contract.test.js
          node tests/banner-admin-quality-contract.test.js
          node tests/banner-event-stage2-ui-contract.test.js
          node tests/banner-asset-metadata-v403-contract.test.js
          node tests/banner-event-stage3-ui-contract.test.js
          node tests/banner-event-phase2-stage1-shell-contract.test.js
          node tests/banner-event-phase2-stage3-preview-order-contract.test.js
          node tests/banner-event-phase2-stage4-page-selection-contract.test.js
          node tests/banner-event-phase2-stage5-editor-contract.test.js
          node tests/banner-event-phase2-stage6-library-contract.test.js
          node tests/banner-event-stage4-ui-contract.test.js
          node tests/banner-event-stage5-ui-contract.test.js
          node tests/banner-content-overlay-v396-contract.test.js
          node tests/banner-event-manager-v398-contract.test.js
          node tests/banner-legacy-lookbook-groups-v399-contract.test.js
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo "Chrome/Chromium is required for banner admin tab E2E." >&2
            exit 1
          fi
          "$chrome" --headless --no-sandbox --disable-gpu --allow-file-access-from-files \
            --virtual-time-budget=30000 --dump-dom "file://$PWD/tests/banner-admin-chrome-e2e.html#images" \
            > /tmp/banner-admin-chrome-e2e.html
          if ! grep -F 'data-e2e-result="PASS"' /tmp/banner-admin-chrome-e2e.html; then
            grep -o '<pre id="e2eResult">[^<]*' /tmp/banner-admin-chrome-e2e.html || true
            exit 1
          fi

  verify-live-readback:
    if: github.event_name == 'push'
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_BASE: https://kinojo.info
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish live readback pending status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: pending
          STATUS_DESCRIPTION: 배너 관리자 운영 파일 확인 중
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-admin-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "context": "kinojo/banner-admin-live-readback",
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-admin-status.json >/dev/null

      - name: Verify banner admin files on custom domain
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "admin/index.html"
            "m/admin/index.html"
            "admin/css/admin.css"
            "admin/js/admin.js"
            "admin/js/admin-shared.js"
            "admin/js/admin-bootstrap.js"
            "admin/js/admin-images.js"
            "admin/js/admin-side-banners.js"
            "admin/js/admin-banner-event-workflow.js"
            "admin/js/admin-banner-events.js"
            "admin/js/admin-banner-tabs.js"
            "admin/js/admin-banner-library.js"
            "admin/js/admin-banner-quality.js"
          )
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          verify_key="${GITHUB_SHA:0:12}-$(date -u +%s)"

          for attempt in $(seq 1 15); do
            mismatch=0
            for path in "${files[@]}"; do
              live_file="$tmp_dir/$(echo "$path" | tr '/' '_')"
              url="$LIVE_BASE/$path?verify=$verify_key-$attempt"
              if ! curl --fail --silent --show-error --location --compressed \
                --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' "$url" -o "$live_file"; then
                echo "FETCH_FAIL $path"
                mismatch=1
                continue
              fi
              if cmp -s "$path" "$live_file"; then
                echo "MATCH $path"
              else
                echo "MISMATCH $path"
                mismatch=1
              fi
            done
            if [[ "$mismatch" -eq 0 ]]; then
              exit 0
            fi
            [[ "$attempt" -lt 15 ]] && sleep 20
          done
          echo "Banner admin live readback did not converge to main source." >&2
          exit 1

      - name: Publish live readback success status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: success
          STATUS_DESCRIPTION: 배너 관리자 운영 파일이 main과 일치
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-admin-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "context": "kinojo/banner-admin-live-readback",
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-admin-status.json >/dev/null

      - name: Publish live readback failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: failure
          STATUS_DESCRIPTION: 배너 관리자 운영 파일 readback 실패
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/banner-admin-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "context": "kinojo/banner-admin-live-readback",
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/banner-admin-status.json >/dev/null
