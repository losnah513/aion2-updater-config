<body class="kinojo-page-legion-tree">
  <section class="hof-filter-bar legion-tree-subbar kinojo-standard-subbar" aria-label="레기온 구성원 도구">
    <div class="legion-tree-subbar-fields">
      <input class="kinojo-input legion-tree-subbar-field" id="legionTreeMainName" type="text" maxlength="180" placeholder="본캐이름[서버]" autocomplete="off" aria-label="본캐 이름과 서버" aria-describedby="legionTreeStatus"/>
      <input class="kinojo-input legion-tree-subbar-field" id="legionTreeAltName" type="text" maxlength="180" placeholder="부캐이름[서버]" autocomplete="off" aria-label="부캐 이름과 서버" aria-describedby="legionTreeStatus"/>
    </div>
    <div class="legion-tree-subbar-actions">
      <button class="kinojo-btn" id="legionTreeSearchBtn" type="button" disabled>조회</button>
      <button class="kinojo-btn secondary" id="legionTreeEditBtn" type="button" disabled>조직도 편집</button>
    </div>
    <div class="legion-tree-subbar-feedback">
      <span class="legion-tree-subbar-status" id="legionTreeStatus" aria-live="polite">레기온 데이터를 불러오는 중…</span>
      <ol class="legion-tree-add-progress" id="legionTreeAddProgress" aria-label="캐릭터 추가 진행 상태" aria-busy="false" hidden></ol>
    </div>
  </section>
  <section class="legion-tree-search-results" id="legionTreeSearchResults" role="dialog" aria-modal="false" aria-label="캐릭터 조회 결과" hidden>
    <div class="legion-tree-search-groups">
      <section aria-labelledby="legionTreeMainResultsTitle"><h2 id="legionTreeMainResultsTitle">본캐 후보</h2><div class="legion-tree-search-cards" id="legionTreeMainResults"></div></section>
      <section id="legionTreeAltResultsGroup" aria-labelledby="legionTreeAltResultsTitle" hidden><h2 id="legionTreeAltResultsTitle">부캐 후보</h2><div class="legion-tree-search-cards" id="legionTreeAltResults"></div></section>
    </div>
    <div class="legion-tree-search-actions">
      <button class="kinojo-btn" id="legionTreeAddBtn" type="button" disabled>추가</button>
      <button class="kinojo-btn secondary" id="legionTreeSearchCloseBtn" type="button">닫기</button>
      <button class="kinojo-btn secondary" id="legionTreeResetBtn" type="button">초기화</button>
    </div>
  </section>

<main class="legion-tree-wrap kinojo-pc-banner-host kinojo-pc-standard-host">
  <aside class="kinojo-pc-banner-slot is-left" data-kinojo-pc-banner aria-hidden="true"></aside>
  <aside class="kinojo-pc-banner-slot is-right" data-kinojo-pc-banner aria-hidden="true"></aside>
  <section class="legion-tree-data-list" id="legionTreeRoot" aria-live="polite" aria-busy="true">
    <div class="legion-tree-load-state">Server 레기온 데이터를 불러오는 중…</div>
