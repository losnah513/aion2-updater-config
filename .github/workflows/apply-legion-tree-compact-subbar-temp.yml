name: Apply Legion Tree Compact Subbar Temp

on:
  push:
    branches: [fix/legion-tree-subbar-compact-controls-20260820]
    paths:
      - ".github/workflows/apply-legion-tree-compact-subbar-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legion-tree-subbar-compact-controls-20260820
          fetch-depth: 2
      - name: Patch compact Legion Tree subbar only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          for p in [Path('legion-tree/index.html'), Path('m/legion-tree/index.html')]:
              s=p.read_text(encoding='utf-8')
              if s.count('legion-tree.css?cache=2026082004') != 1:
                  raise SystemExit(f'{p}: cache marker mismatch')
              s=s.replace('legion-tree.css?cache=2026082004','legion-tree.css?cache=2026082005',1)
              p.write_text(s,encoding='utf-8')

          p=Path('legion-tree/css/legion-tree.css')
          s=p.read_text(encoding='utf-8')
          old='''  -webkit-backdrop-filter:blur(18px);\n}\n.legion-tree-kicker'''
          new='''  -webkit-backdrop-filter:blur(18px);\n  justify-content:flex-start;\n  align-items:flex-end;\n  gap:8px;\n  flex-wrap:wrap;\n}\n.legion-tree-kicker'''
          if s.count(old)!=1: raise SystemExit('subbar outer marker mismatch')
          s=s.replace(old,new,1)

          old='.legion-tree-subbar-fields{flex:1 1 760px;display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr) 116px 132px;gap:8px;align-items:end;min-width:0}'
          new='.legion-tree-subbar-fields{flex:0 0 auto;display:grid;grid-template-columns:110px 110px 116px 132px;gap:8px;align-items:end;min-width:0}'
          if s.count(old)!=1: raise SystemExit('desktop field grid marker mismatch')
          s=s.replace(old,new,1)

          old='.legion-tree-subbar-actions{flex:0 1 auto;display:flex;align-items:flex-end;justify-content:flex-end;gap:7px;flex-wrap:wrap}'
          new='.legion-tree-subbar-actions{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:flex-start;gap:7px;flex-wrap:wrap}'
          if s.count(old)!=1: raise SystemExit('desktop action marker mismatch')
          s=s.replace(old,new,1)

          old='@media(max-width:900px){body.kinojo-page-legion-tree>.legion-tree-subbar{padding-inline:12px}.legion-tree-subbar-fields{grid-template-columns:1fr 1fr 110px 128px;flex-basis:100%}.legion-tree-subbar-actions{flex:1 1 100%;justify-content:flex-end}'
          new='@media(max-width:900px){body.kinojo-page-legion-tree>.legion-tree-subbar{padding-inline:12px}.legion-tree-subbar-fields{grid-template-columns:110px 110px 110px 128px;flex:0 0 auto}.legion-tree-subbar-actions{flex:0 0 auto;justify-content:flex-start}'
          if s.count(old)!=1: raise SystemExit('tablet subbar marker mismatch')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          python3 <<'PY'
          from pathlib import Path
          c=Path('legion-tree/css/legion-tree.css').read_text(encoding='utf-8')
          pc=Path('legion-tree/index.html').read_text(encoding='utf-8')
          mob=Path('m/legion-tree/index.html').read_text(encoding='utf-8')
          assert 'grid-template-columns:110px 110px 116px 132px' in c
          assert 'justify-content:flex-start' in c
          assert 'legion-tree.css?cache=2026082005' in pc
          assert 'legion-tree.css?cache=2026082005' in mob
          assert 'id="legionTreeServer"' in pc and 'id="legionTreeAddBtn"' in pc
          assert pc.index('id="legionTreeServer"') < pc.index('id="legionTreeAddBtn"')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legion-tree/index.html m/legion-tree/index.html legion-tree/css/legion-tree.css
          git commit -m "Compact Legion Tree subbar controls"
          git push origin HEAD:fix/legion-tree-subbar-compact-controls-20260820
