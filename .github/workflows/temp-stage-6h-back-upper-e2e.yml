name: Temp Stage 6-H BACK UPPER_BODY E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-stage-6h-back-upper-e2e.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify BACK and UPPER_BODY reuse common reference flow
        shell: bash
        env:
          SUPABASE_URL: "https://josvoltpktvwysrasffq.supabase.co"
          PUBLISHABLE_KEY: "sb_publishable__v26JGbKRFKGbU0SseU5Iw_qwIoHUAC"
        run: |
          set -euo pipefail
          SESSION_TOKEN=$(python - <<'PY'
          import hashlib
          print('kws_'+hashlib.sha256(b'stage_6h_back_upper_e2e').hexdigest())
          PY
          )
          python - <<'PY'
          import base64
          open('/tmp/reference.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Zl1sAAAAASUVORK5CYII='))
          PY
          SIZE=$(wc -c </tmp/reference.png | tr -d ' ')
          ENDPOINT="$SUPABASE_URL/functions/v1/kinojo-member-profile"

          for SLOT in BACK UPPER_BODY; do
            PREP=$(curl --fail-with-body -sS "$ENDPOINT" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "{\"action\":\"reference-upload-prepare\",\"sessionToken\":\"$SESSION_TOKEN\",\"characterId\":111,\"slot\":\"$SLOT\",\"mimeType\":\"image/png\",\"sizeBytes\":$SIZE}")
            echo "$PREP" >"/tmp/prep-$SLOT.json"
            SLOT="$SLOT" python - <<'PY'
          import json,os
          s=os.environ['SLOT']; d=json.load(open('/tmp/prep-'+s+'.json'))
          assert d.get('ok') is True,d
          assert d['reference']['slot']==s,d
          u=d['upload']
          assert u['bucket']=='kinojo-member-reference',u
          assert u['upsert'] is False,u
          assert '/'+s+'/' in u['objectPath'],u
          open('/tmp/url-'+s,'w').write(u['uploadUrl'])
          open('/tmp/path-'+s,'w').write(u['objectPath'])
          print(s,'PREP_OK',u['objectPath'])
          PY
            U=$(cat "/tmp/url-$SLOT")
            P=$(cat "/tmp/path-$SLOT")
            curl --fail-with-body -sS -X PUT "$U" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PUBLISHABLE_KEY" \
              -H 'x-upsert: false' \
              -F 'cacheControl=3600' \
              -F '=@/tmp/reference.png;type=image/png' >"/tmp/upload-$SLOT.json"

            HTTP=$(curl -sS -o "/tmp/complete-$SLOT.json" -w '%{http_code}' "$ENDPOINT" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "{\"action\":\"reference-upload-complete\",\"sessionToken\":\"$SESSION_TOKEN\",\"characterId\":111,\"slot\":\"$SLOT\",\"objectPath\":\"$P\",\"mimeType\":\"image/png\",\"sizeBytes\":$SIZE}")
            test "$HTTP" = "200"
            SLOT="$SLOT" python - <<'PY'
          import json,os,datetime
          s=os.environ['SLOT']; d=json.load(open('/tmp/complete-'+s+'.json'))
          assert d.get('ok') is True,d
          r=d['reference']
          assert r['slot']==s,r
          assert r['active'] is True,r
          assert r['retentionDays']==7,r
          assert d['upload']['storageVerified'] is True,d
          assert d['upload']['activated'] is True,d
          print(s,'COMPLETE_OK',r['objectPath'],r['uploadedAt'],r['expiresAt'])
          PY

            # Same complete retry must remain safe after SQL350.
            HTTP=$(curl -sS -o "/tmp/retry-$SLOT.json" -w '%{http_code}' "$ENDPOINT" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "{\"action\":\"reference-upload-complete\",\"sessionToken\":\"$SESSION_TOKEN\",\"characterId\":111,\"slot\":\"$SLOT\",\"objectPath\":\"$P\",\"mimeType\":\"image/png\",\"sizeBytes\":$SIZE}")
            test "$HTTP" = "200"

            # Controlled test cleanup: mismatch declared size deletes only this exact temporary object.
            BAD=$((SIZE+1))
            HTTP=$(curl -sS -o "/tmp/cleanup-$SLOT.json" -w '%{http_code}' "$ENDPOINT" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "{\"action\":\"reference-upload-complete\",\"sessionToken\":\"$SESSION_TOKEN\",\"characterId\":111,\"slot\":\"$SLOT\",\"objectPath\":\"$P\",\"mimeType\":\"image/png\",\"sizeBytes\":$BAD}")
            test "$HTTP" = "409"
            SLOT="$SLOT" python - <<'PY'
          import json,os
          s=os.environ['SLOT']; d=json.load(open('/tmp/cleanup-'+s+'.json'))
          assert d.get('code')=='REFERENCE_UPLOAD_SIZE_MISMATCH',d
          print(s,'OBJECT_CLEANUP_OK')
          PY
          done
