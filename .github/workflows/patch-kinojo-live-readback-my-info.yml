name: Patch KINOJO live readback for My Info

on:
  push:
    branches: [main]
    paths:
      - "ui/.patch-kinojo-live-readback-my-info"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add My Info CSS to official live readback
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/verify-kinojo-pages.yml')
          text=path.read_text(encoding='utf-8')
          old='''            "ui/kinojo-common-ui.js"\n            "ui/kinojo-public-shell.css"'''
          new='''            "ui/kinojo-common-ui.js"\n            "ui/kinojo-my-info.css"\n            "ui/kinojo-public-shell.css"'''
          if text.count(old) != 1:
              raise SystemExit(f'expected live files insertion point once, found {text.count(old)}')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          grep -q '"ui/kinojo-my-info.css"' .github/workflows/verify-kinojo-pages.yml
          git diff --check
      - name: Commit official verifier update and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-kinojo-live-readback-my-info.yml ui/.patch-kinojo-live-readback-my-info
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add .github/workflows/verify-kinojo-pages.yml
          git add -u .github/workflows/patch-kinojo-live-readback-my-info.yml ui/.patch-kinojo-live-readback-my-info || true
          git commit -m "Verify My Info CSS in KINOJO live readback"
          git push origin main
