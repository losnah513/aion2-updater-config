name: KINOJO temporary Stage 4-G push applicator

on:
  push:
    paths:
      - '.kinojo-stage4g-run'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply product patch
        run: python .kinojo-temp/stage4g_patch.py
      - name: Verify product source
        run: |
          node --check ui/kinojo-common-ui.js
          grep -q "profile-reset-official" ui/kinojo-common-ui.js
          grep -q "kinojoMyInfoProfileResetBtn" ui/kinojo-common-ui.js
          grep -q "공식 이미지로 복원" ui/kinojo-common-ui.js
      - name: Commit product and cleanup temporary files
        run: |
          git config user.name "kinojo-stage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- ui/kinojo-common-ui.js
          git rm -- .github/workflows/apply-stage-4g-profile-reset.yml .github/workflows/apply-stage-4g-push.yml .kinojo-temp/stage4g_patch.py .kinojo-stage4g-run
          git commit -m "Add official profile image reset"
          git push origin HEAD:main
