name: Export My Info Drive sync

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'codex/tmp-drive-sync-my-info-png-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: my-info-drive-sync
          if-no-files-found: error
          retention-days: 1
          path: |
            .github/workflows/verify-kinojo-pages.yml
            README.md
            docs/HANDOFF.md
            admin/index.html
            arcana/index.html
            hof/index.html
            home.html
            legion-tree/index.html
            m/admin/index.html
            m/arcana/index.html
            m/hof/index.html
            m/index.html
            m/legion-tree/index.html
            m/meter/index.html
            m/ranking/index.html
            m/sanctuary-schedule/index.html
            m/sanctuary/index.html
            meter/index.html
            ranking/index.html
            sanctuary-schedule/index.html
            sanctuary/index.html
            assets/images/my-info/guides/front-2x3.png
            assets/images/my-info/guides/back-2x3.png
            assets/images/my-info/guides/upper-body-4x5.png
            tests/my-info-guide-assets.test.js
            tests/my-info-image-contract.test.js
            tests/my-info-admin-image-layout-contract.test.js
            tests/web-shell-auth-contract.test.js
            ui/kinojo-common-ui.js
            ui/kinojo-my-info-image-contract.js
