name: KINOJO Stage 5-C character modal profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kinojo-stage-5c.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Stage 5-C patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ui/kinojo-character-reaction.js)" = "f725640dc3e3af9e592b8dfecea965d76edf7f81"
          test "$(git hash-object ui/kinojo-common-ui.js)" = "5ef77e866a357fe7a5fa6611f42fddb80b602abc"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui/kinojo-character-reaction.js')
          s=p.read_text(encoding='utf-8')
          old="""  function characterImageCandidates(target){
            const item = target || {};
            const serverId = String(item.serverId || item.server_id || '').trim();
            const charKey = String(item.charKey || item.char_key || '').trim();
            const derivedProfile = /^\\d+$/.test(serverId) && /^\\d{10,}$/.test(charKey)
              ? 'https://profileimg.plaync.com/game_profile_images/aion2/images?gameServerKey=' + encodeURIComponent(serverId) + '&charKey=' + encodeURIComponent(charKey)
              : '';
          """
          new="""  function characterImageCandidates(target){
            const item = target || {};
            const serverId = String(item.serverId || item.server_id || '').trim();
            const charKey = String(item.charKey || item.char_key || '').trim();
            const effectiveResolved = ['USER_OVERRIDE','OFFICIAL'].includes(String(item.profileImageSource || '').trim().toUpperCase());
            const derivedProfile = !effectiveResolved && /^\\d+$/.test(serverId) && /^\\d{10,}$/.test(charKey)
              ? 'https://profileimg.plaync.com/game_profile_images/aion2/images?gameServerKey=' + encodeURIComponent(serverId) + '&charKey=' + encodeURIComponent(charKey)
              : '';
          """
          assert old in s
          s=s.replace(old,new,1)
          old="""  function mergeMasterRow(target, row){
            if(!row) return target;
            const pve = firstValue(row.latest_pve_combat_power, row.pve_power_total, row.pvePowerTotal, target.pvePower);
            const pvp = firstValue(row.latest_pvp_combat_power, row.pvp_power_total, row.pvpPowerTotal, target.pvpPower);
            const className = firstValue(row.class_name, row.className, target.className);
            const server = firstValue(row.server_name, row.serverName, target.server);
            const serverId = firstValue(row.server_id, row.serverId, target.serverId);
            const detailUrl = firstValue(row.detail_url, row.detailUrl, target.detailUrl);
            const profileImageUrl = firstValue(row.profile_image_url, row.profileImageUrl, target.profileImageUrl);
            const owner = firstValue(row.main_character_name, row.mainCharacterName, target.owner);
            return normalizeTarget(Object.assign({}, target, {
              className, server, serverId, owner, profileImageUrl, detailUrl,
              pvePower: numText(pve) || '',
              pvpPower: numText(pvp) || '',
              classIconUrl: firstValue(target.classIconUrl, classIconFor(className))
            }));
          }

          async function fetchCharacterMaster(target){
            const item = target || {};
            const name = characterMasterQueryName(item.name);
            if(!name || !window.KinojoSupabase || typeof window.KinojoSupabase.request !== 'function') return null;

            const select = 'select=character_name,main_character_name,server_id,server_name,class_name,profile_image_url,detail_url,latest_pve_combat_power,latest_pvp_combat_power';
            let query = select + '&character_name=eq.' + name;
            const serverId = String(item.serverId || '').trim();
            const serverName = String(item.server || '').trim();
            if(/^\\d+$/.test(serverId)){
              query += '&server_id=eq.' + encodeURIComponent(serverId);
            }else if(serverName && !serverName.includes('·')){
              query += '&server_name=eq.' + encodeURIComponent(serverName);
            }else{
              return null;
            }
            query += '&limit=1';
            const rows = await window.KinojoSupabase.request('character_master', { query });
            return Array.isArray(rows) ? rows[0] || null : null;
          }

          async function enrichTargetFromMaster(){
            const current = state.target;
            if(!current || !current.name) return;
            const identity = [current.name, current.serverId || current.server || ''].join('|');
            try{
              const row = await fetchCharacterMaster(current);
              const active = state.target;
              const activeIdentity = active ? [active.name, active.serverId || active.server || ''].join('|') : '';
              if(!row || !state.open || identity !== activeIdentity) return;
              state.target = mergeMasterRow(active, row);
              renderTarget();
              updateCompareVisibility();
              if(!state.live && !state.liveLoading) loadLiveOverview();
            }catch(_err){
              // 서버 상세 조회 실패 시 페이지 카드 데이터로 표시한다.
            }
          }
          """
          new="""  function mergeMasterRow(target, row){
            if(!row) return target;
            const pve = firstValue(row.latest_pve_combat_power, row.pve_power_total, row.pvePowerTotal, target.pvePower);
            const pvp = firstValue(row.latest_pvp_combat_power, row.pvp_power_total, row.pvpPowerTotal, target.pvpPower);
            const className = firstValue(row.class_name, row.className, target.className);
            const server = firstValue(row.server_name, row.serverName, target.server);
            const serverId = firstValue(row.server_id, row.serverId, target.serverId);
            const characterId = firstValue(row.id, row.character_id, row.characterId, target.characterId);
            const detailUrl = firstValue(row.detail_url, row.detailUrl, target.detailUrl);
            const officialProfileImageUrl = firstValue(row.profile_image_url, row.profileImageUrl, target.officialProfileImageUrl, target.profileImageUrl);
            const effectiveResolved = ['USER_OVERRIDE','OFFICIAL'].includes(String(target.profileImageSource || '').trim().toUpperCase());
            const profileImageUrl = effectiveResolved ? target.profileImageUrl : officialProfileImageUrl;
            const owner = firstValue(row.main_character_name, row.mainCharacterName, target.owner);
            return normalizeTarget(Object.assign({}, target, {
              className, server, serverId, characterId, owner, profileImageUrl, officialProfileImageUrl, detailUrl,
              pvePower: numText(pve) || '',
              pvpPower: numText(pvp) || '',
              classIconUrl: firstValue(target.classIconUrl, classIconFor(className))
            }));
          }

          async function fetchCharacterMaster(target){
            const item = target || {};
            const name = characterMasterQueryName(item.name);
            if(!name || !window.KinojoSupabase || typeof window.KinojoSupabase.request !== 'function') return null;

            const select = 'select=id,character_name,main_character_name,server_id,server_name,class_name,profile_image_url,detail_url,latest_pve_combat_power,latest_pvp_combat_power';
            let query = select + '&character_name=eq.' + name;
            const serverId = String(item.serverId || '').trim();
            const serverName = String(item.server || '').trim();
            if(/^\\d+$/.test(serverId)){
              query += '&server_id=eq.' + encodeURIComponent(serverId);
            }else if(serverName && !serverName.includes('·')){
              query += '&server_name=eq.' + encodeURIComponent(serverName);
            }else{
              return null;
            }
            query += '&limit=1';
            const rows = await window.KinojoSupabase.request('character_master', { query });
            return Array.isArray(rows) ? rows[0] || null : null;
          }

          async function fetchEffectiveProfile(characterId){
            const id = Number(characterId || 0);
            const rpc = window.KinojoSupabaseRpcCore;
            if(!Number.isInteger(id) || id <= 0 || !rpc || typeof rpc.rpc !== 'function') return null;
            const result = await rpc.rpc('kinojo_web_character_profile_effective_v342', { p_character_id:id });
            return result && typeof result === 'object' && !Array.isArray(result) ? result : null;
          }

          function mergeEffectiveProfile(target, result){
            if(!result || result.ok !== true) return target;
            const characterId = Number(target?.characterId || 0);
            if(!Number.isInteger(characterId) || Number(result.characterId || 0) !== characterId){
              throw new Error('EFFECTIVE_PROFILE_BINDING_MISMATCH');
            }
            const source = String(result.profileImageSource || '').trim().toUpperCase();
            if(!['USER_OVERRIDE','OFFICIAL'].includes(source)) throw new Error('EFFECTIVE_PROFILE_SOURCE_INVALID');
            return normalizeTarget(Object.assign({}, target, {
              profileImageUrl: normalizedImageUrl(result.profileImageUrl),
              profileImageSource: source,
              hasProfileOverride: result.hasOverride === true,
              effectiveProfileContract: String(result.databaseContract || '342').trim()
            }));
          }

          async function enrichTargetFromMaster(){
            const current = state.target;
            if(!current || !current.name) return;
            const identity = [current.name, current.serverId || current.server || ''].join('|');
            let enriched = current;
            try{
              const row = await fetchCharacterMaster(current);
              if(row) enriched = mergeMasterRow(enriched, row);
            }catch(_err){
              // 기존 상세 필드 조회가 실패해도 canonical characterId가 있으면 effective profile 조회는 계속 시도한다.
            }
            try{
              const result = await fetchEffectiveProfile(enriched.characterId);
              if(result?.ok === true) enriched = mergeEffectiveProfile(enriched, result);
            }catch(_err){
              // 공개 effective resolver가 실패하면 기존 페이지/공식 이미지 표시를 유지한다.
            }
            const active = state.target;
            const activeIdentity = active ? [active.name, active.serverId || active.server || ''].join('|') : '';
            if(!state.open || identity !== activeIdentity) return;
            state.target = enriched;
            renderTarget();
            updateCompareVisibility();
            if(!state.live && !state.liveLoading) loadLiveOverview();
          }
          """
          assert old in s
          s=s.replace(old,new,1)
          old="""    const owner = t.owner || t.mainCharacterName || '';
            const profileImageUrl = t.profileImageUrl || t.profileImage || t.profile || t.imageUrl || '';
            const detailUrl = t.detailUrl || t.url || '';
          """
          new="""    const owner = t.owner || t.mainCharacterName || '';
            const profileImageUrl = t.profileImageUrl || t.profileImage || t.profile || t.imageUrl || '';
            const officialProfileImageUrl = t.officialProfileImageUrl || t.official_profile_image_url || '';
            const profileImageSource = String(t.profileImageSource || t.profile_image_source || '').trim().toUpperCase();
            const hasProfileOverride = t.hasProfileOverride === true || t.hasOverride === true;
            const effectiveProfileContract = String(t.effectiveProfileContract || t.effective_profile_contract || '').trim();
            const detailUrl = t.detailUrl || t.url || '';
          """
          assert old in s
          s=s.replace(old,new,1)
          old="""    return { name, className, server, serverId, charKey, characterId, owner, profileImageUrl, detailUrl, classIconUrl, pvePower, pvpPower, level, legionName, titleName };
          """
          new="""    return { name, className, server, serverId, charKey, characterId, owner, profileImageUrl, officialProfileImageUrl, profileImageSource, hasProfileOverride, effectiveProfileContract, detailUrl, classIconUrl, pvePower, pvpPower, level, legionName, titleName };
          """
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('ui/kinojo-common-ui.js')
          b=p.read_bytes()
          old=b'/ui/kinojo-character-reaction.js?cache=2026081801'
          new=b'/ui/kinojo-character-reaction.js?cache=2026082001'
          assert b.count(old)==1
          p.write_bytes(b.replace(old,new,1))
          PY
          node --check ui/kinojo-character-reaction.js
          node --check ui/kinojo-common-ui.js
          grep -q "kinojo_web_character_profile_effective_v342" ui/kinojo-character-reaction.js
          grep -q "profileImageSource" ui/kinojo-character-reaction.js
          grep -q "kinojo-character-reaction.js?cache=2026082001" ui/kinojo-common-ui.js
          rm .github/workflows/kinojo-stage-5c.yml
          git config user.name 'kinojo-stage-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ui/kinojo-character-reaction.js ui/kinojo-common-ui.js .github/workflows/kinojo-stage-5c.yml
          git commit -m 'Use effective profile in character modal'
          git push origin HEAD:main
