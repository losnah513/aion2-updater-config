<html lang="ko">
<head>

<title>Kinojo 명예의 전당</title>
<style>
:root{color-scheme:light;--panel:rgba(255,255,255,.9);--line:rgba(120,145,180,.25);--text:#1e2f4a;--muted:#6d7f98;--gold:#c58b24;--shadow:0 14px 32px rgba(42,62,100,.13)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef4ff,#fbfdff 48%,#e9eff8);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{width:min(1180px,100%);margin:0 auto;padding:14px 12px 36px}.banner{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.92);box-shadow:0 16px 36px rgba(30,50,82,.24);background:#dce8fa;margin-bottom:12px}.banner img{width:100%;height:auto;display:block;object-fit:contain}.topbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:12px}.brand h1{margin:0;color:#263852;font-size:clamp(22px,4vw,34px);letter-spacing:-.8px}.subtitle{margin-top:4px;color:#6d7f98;font-size:13px}.sub-toggle{width:168px;height:48px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:#6b7280;position:relative;cursor:pointer;overflow:hidden;box-shadow:var(--shadow)}.sub-toggle.on{background:linear-gradient(135deg,#5d87da,#8b72df);color:#fff}.toggle-knob{position:absolute;top:5px;left:5px;width:36px;height:36px;border-radius:50%;background:#fff;transition:.28s ease;box-shadow:0 3px 10px rgba(0,0,0,.2)}.sub-toggle.on .toggle-knob{left:125px}.toggle-text{position:absolute;inset:0;display:grid;place-items:center;font-weight:1000;font-size:13px;padding-left:28px}.sub-toggle.on .toggle-text{padding-left:0;padding-right:28px}.visit-mini{min-width:280px;border:1px solid var(--line);border-radius:14px;padding:9px 12px;background:rgba(255,255,255,.88);box-shadow:var(--shadow);font-size:12px;line-height:1.45;color:#40526e}.visit-mini strong{color:#3865b0}.tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}.search,.btn{border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--text);border-radius:12px;padding:11px 12px;font-size:14px;outline:none;box-shadow:0 8px 18px rgba(38,57,88,.05)}.btn{cursor:pointer;font-weight:900;background:linear-gradient(135deg,#f9fcff,#e8f0fb)}.chick-card{display:none;margin-bottom:12px;border-radius:18px;padding:12px 14px;color:#1f2e46;background:radial-gradient(circle at 10% 18%,rgba(255,230,155,.42) 0 7px,transparent 8px),radial-gradient(circle at 62% 24%,rgba(196,181,253,.16) 0 6px,transparent 7px),linear-gradient(135deg,rgba(255,255,255,.98),rgba(240,247,255,.96));box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.92)}.chick-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.chick-head{display:flex;align-items:center;gap:12px;flex:0 0 auto}.chick-icon{font-size:46px}.chick-title{font-size:18px;font-weight:1000;color:#3b5b91}.chick-sub{margin-top:3px;color:#6b7c91;font-size:13px}.chick-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;flex:1}.chick-tag{border:1px solid rgba(89,117,160,.2);background:rgba(255,255,255,.82);border-radius:999px;padding:8px 12px;font-weight:1000;font-size:12px;color:#273a58;white-space:nowrap}.chick-more{cursor:pointer;color:#3865b0;background:#eaf2ff}.dashboard{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:stretch}.top-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;height:100%}.section,.overall,.classes,.mvp-card{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}.section{height:100%}.section-head,.overall-head,.mvp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(117,140,177,.16);background:linear-gradient(90deg,rgba(255,255,255,.86),rgba(232,241,254,.74))}.section h2,.overall h2,.mvp-card h2{margin:0;font-size:18px;color:#2b3c5c}.section-note{color:#7b8ba2;font-size:12px}.list{padding:10px;display:grid;gap:5px}.mini-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:6px;min-height:32px;padding:4px 6px;border-radius:10px}.mini-row:first-child{background:linear-gradient(90deg,rgba(255,231,157,.54),rgba(255,255,255,.22));box-shadow:inset 3px 0 0 rgba(197,139,36,.68)}.medal{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:16px}.name-wrap,.tag-name-wrap,.rank-name-cell{min-width:0;overflow:hidden;max-width:100%;display:block;white-space:nowrap}.name,.tag-name{font-size:13px;font-weight:1000;white-space:nowrap;display:inline-block}.meta{margin-top:0;color:var(--muted);font-size:10px}.score{font-weight:1000;color:#365f9b;white-space:nowrap;font-size:12px}.side-stack{display:grid;grid-template-rows:1fr 1fr;gap:12px}.tag-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px}.name-tag{padding:8px 6px;border:1px solid rgba(117,140,177,.18);border-radius:12px;background:rgba(255,255,255,.66);text-align:center;font-weight:1000;min-width:0}.tag-meta{margin-top:3px;color:var(--muted);font-size:10px}.mvp-card{margin-bottom:12px}.mvp-body{padding:18px;text-align:center;color:#6b7c91;font-size:13px;background:linear-gradient(135deg,rgba(255,255,255,.56),rgba(239,246,255,.74))}.mvp-title{font-size:24px;margin-bottom:5px;color:#9aa8ba}.overall,.classes{margin-top:12px}.overall-head{display:grid;grid-template-columns:1fr auto;gap:10px}.page-tools{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}.page-btn{border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer}.table-scroll{overflow-x:auto;width:100%}.rank-table{min-width:920px;width:100%;border-collapse:collapse;table-layout:fixed}.rank-table th,.rank-table td{border-bottom:1px solid rgba(117,140,177,.16);padding:8px 9px;text-align:left;font-size:13px}.rank-table th{color:#687b95;font-weight:800}.rank-table .num{width:52px;text-align:center}.rank-table .char-col{width:120px}.rank-table .server-col{width:72px}.rank-table .power-col{width:92px}.rank-table .review-col{width:auto}.rank-table .power{white-space:nowrap;font-weight:900;color:#365f9b}.reviews{color:#40526e;line-height:1.45;font-size:12px}.reviews div+div{margin-top:3px;color:#667892}.class-tabs{display:flex;flex-wrap:wrap;gap:7px;padding:10px 12px;border-bottom:1px solid rgba(117,140,177,.16)}.pill{border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--text);border-radius:10px;padding:8px 12px;font-weight:900;cursor:pointer}.pill.active{background:linear-gradient(135deg,#e7f0ff,#dcd3ff);border-color:rgba(73,117,188,.42)}.class-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px}.class-card{border:1px solid rgba(117,140,177,.18);border-radius:12px;background:rgba(255,255,255,.58);padding:8px}.class-title{font-weight:1000;color:#3b5b91;margin-bottom:5px}.empty{padding:18px;color:var(--muted);text-align:center;font-size:13px}.loading{min-height:260px;display:grid;place-items:center;color:#40526e;font-weight:900}.loader-ring{width:58px;height:58px;border-radius:50%;margin:0 auto 12px;background:conic-gradient(from 0deg,#77a7ef,#8c70df,#c58b24,#77a7ef);animation:spin 1.05s linear infinite;position:relative}.loader-ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#f7faff}.loader-ring:after{content:"🏆";position:absolute;inset:0;display:grid;place-items:center;animation:counterSpin 1.05s linear infinite;font-size:21px}.class-empty-message{min-height:38px;display:grid;place-items:center;text-align:center;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.76),rgba(235,242,255,.88));color:#4c607c;font-weight:900;line-height:1.45}.class-empty-rare{border:1px dashed rgba(197,139,36,.35)}.class-empty-unpopular{border:1px dashed rgba(93,135,218,.32)}.footer{margin-top:18px;text-align:center;color:#7b8ba2;font-size:12px;font-weight:800;letter-spacing:.2px}.admin-main{color:#976a13;text-shadow:0 0 8px rgba(255,219,105,.75),0 0 18px rgba(98,151,255,.28);position:relative}.admin-main:after{content:" ✦";color:#d4a331}.admin-alt{color:#315f9f;text-shadow:0 0 8px rgba(97,162,255,.38)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes counterSpin{to{transform:rotate(-360deg)}}@keyframes marquee{0%{transform:translateX(0)}8%{transform:translateX(0)}100%{transform:translateX(var(--marquee-shift,-40px))}}.marquee{display:inline-block;animation:marquee 6s linear infinite}@media(max-width:760px){.wrap{padding:10px 8px 30px}.topbar{grid-template-columns:1fr auto}.subtitle{display:none}.visit-mini{grid-column:1/-1;min-width:0}.sub-toggle{width:120px;height:40px}.toggle-knob{width:30px;height:30px}.sub-toggle.on .toggle-knob{left:83px}.toggle-text{font-size:11px;padding-left:20px}.sub-toggle.on .toggle-text{padding-right:20px}.tools{grid-template-columns:1fr auto auto}.btn{font-size:0;width:38px;padding:9px 0}#refreshBtn:before{content:"🔄";font-size:16px}#suggestBtn:before{content:"💬";font-size:16px}.chick-line{align-items:flex-start;flex-direction:column}.chick-tags{justify-content:flex-start;width:100%}.dashboard,.top-grid,.side-stack{grid-template-columns:1fr;display:grid}.side-stack{grid-template-rows:auto}.section h2{font-size:15px}.rank-table{min-width:860px}.class-grid{grid-template-columns:1fr}.class-card:not(.active-mobile){display:none}} 

/* 1.b7.10 Hall of Fame UI patch */
.admin-row-main,.admin-row-alt{position:relative}.admin-main{display:inline-block;color:#8a5200!important;font-weight:1000;text-shadow:0 0 7px rgba(255,220,80,.95),0 0 18px rgba(255,170,0,.55),0 0 26px rgba(89,146,255,.35);position:relative}.admin-main:before{content:"👑 ";filter:drop-shadow(0 0 4px rgba(255,192,50,.8))}.admin-main:after{content:" ✦";color:#e0a11a}.admin-alt{color:#174f9b!important;font-weight:1000;text-shadow:0 0 7px rgba(94,166,255,.72),0 0 18px rgba(94,166,255,.36)}.admin-alt:before{content:"✦ ";color:#4f8dea}.owner-line{margin-top:2px;color:#7b8ba2;font-size:10px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.admin-row-alt .owner-line,.admin-alt+.owner-line{color:#4775b3}.rank-table tr.admin-row-main td,.rank-table tr.admin-row-alt td{background:transparent}.class-tabs.rank-tabs{align-items:center}.pill.all-rank{padding-left:14px;padding-right:14px}.pill .tab-icon{width:18px;height:18px;vertical-align:-4px;margin-right:5px;object-fit:contain}.class-icon-cell{display:flex;align-items:center;gap:6px;font-weight:900;color:#40526e;white-space:nowrap}.class-icon{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(48,70,110,.18))}.rank-table .class-col{width:84px}.tag-list.swipe-list{display:flex;overflow-x:auto;gap:8px;padding:10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.tag-list.swipe-list .name-tag{flex:0 0 146px;scroll-snap-align:start}.tag-list.swipe-list::-webkit-scrollbar{height:7px}.tag-list.swipe-list::-webkit-scrollbar-thumb{background:rgba(117,140,177,.30);border-radius:999px}.tag-list.swipe-list::-webkit-scrollbar-track{background:rgba(255,255,255,.35);border-radius:999px}.rank-title-wrap{display:flex;align-items:center;gap:8px;min-width:0}.rank-title-icon{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(48,70,110,.18))}.rank-title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:760px){.rank-table{min-width:800px}.rank-table .char-col{width:132px}.rank-table .class-col{width:76px}.tag-list.swipe-list{display:flex;grid-template-columns:none}.tag-list.swipe-list .name-tag{flex-basis:138px}.class-tabs.rank-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.class-tabs.rank-tabs .pill{flex:0 0 auto}}

</style>

<body>
<main class="wrap">
<section class="banner"><img src="assets/hall-banner-v2.png" alt="Kinojo Hall of Fame"></section>
<section class="topbar"><div class="brand"><h1>KINOJO 명예의 전당</h1><div class="subtitle">전투력과 성장 기록으로 선정된 최고의 모험가들</div></div><button class="sub-toggle" id="subToggle"><span class="toggle-knob"></span><span class="toggle-text">부캐 포함 OFF</span></button><section class="visit-mini" id="visitCard">👀 방문자 통계를 불러오는 중...</section></section>
<section class="tools"><input class="search" id="searchInput" placeholder="캐릭터명 / 서버 / 직업 검색"><button class="btn" id="refreshBtn">새로고침</button><button class="btn" id="suggestBtn">항목 제안</button></section>
<section class="chick-card" id="chickCard"><div class="chick-line"><div class="chick-head"><div class="chick-icon">🐥</div><div><div class="chick-title" id="chickTitle">신입 병아리</div><div class="chick-sub" id="chickSub">새로운 모험가들을 환영합니다!</div></div></div><div class="chick-tags" id="chickTags"></div></div></section>
<section class="section" id="suggestionBox" style="display:none;margin-bottom:12px"><div class="section-head"><h2>➕ 새로운 항목 제안하기</h2><span class="section-note">운영자 검토 후 반영</span></div><div class="list"><input class="search" id="suggestTitle" placeholder="항목 이름"><input class="search" id="suggestProposer" placeholder="제안자"><textarea class="search" id="suggestMemo" rows="3" placeholder="기준 설명"></textarea><button class="btn" id="submitSuggestBtn">제안 보내기</button></div></section>
<div id="app" class="loading"><div><div class="loader-ring"></div><div>명예의 전당 데이터를 불러오는 중...</div></div></div>
<footer class="footer">Powered by AION2 × KINOJO</footer>
</main>
<script>
const WEB_APP_URL=new URLSearchParams(location.search).get("api")||"https://script.google.com/macros/s/AKfycbztXbGEbiId1yOfa3CVmErivNVi5IUi64qxIQRf8Sm_KduCPieeAKlNRMGyYkKL5iPaYg/exec";
const CLASS_ORDER=["검성","수호성","살성","궁성","정령성","마도성","치유성","호법성"];
const CLASS_ICONS={"검성":"assets/class_icon_gladiator.png","수호성":"assets/class_icon_templar.png","살성":"assets/class_icon_assassin.png","궁성":"assets/class_icon_ranger.png","정령성":"assets/class_icon_elementalist.png","마도성":"assets/class_icon_sorcerer.png","치유성":"assets/class_icon_cleric.png","호법성":"assets/class_icon_chanter.png"};
let hallData=null,keyword="",includeSubs=false,page=1,activeRankClass="전체",chicksExpanded=false,longPressTimer=null,longPressFired=false;
const PAGE_SIZE=10,app=document.getElementById("app");
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function rankIcon(i){return i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}
function currentOverall(){return includeSubs?(hallData.overallAll||[]):(hallData.overallMain||[])}
function currentDemon(){return includeSubs?(hallData.demonFamilyAll||hallData.demonFamily||[]):(hallData.demonFamily||[])}
function currentParty(){return includeSubs?(hallData.partyFriendAll||hallData.partyFriend||[]):(hallData.partyFriend||[])}
function match(item){if(!keyword)return true;return [item.name,item.owner,item.serverName,item.meta,item.className,item.pveReview,item.pvpReview].join(" ").toLowerCase().includes(keyword.toLowerCase())}
function nameClass(item){return item?.isAdminMain?"admin-main":(item?.isAdminAlt?"admin-alt":"")}
function itemClass(item){return ""}
function nameSpan(item,text){return '<span class="'+nameClass(item)+'">'+text+'</span>'}
function ownerLine(item){const owner=String(item?.owner||"").trim(),name=String(item?.name||"").trim();return owner&&owner!==name?'<div class="owner-line">본캐 '+escapeHtml(owner)+'</div>':''}
function flowText(text,item){return '<span class="flow-candidate">'+nameSpan(item,escapeHtml(text))+'</span>'}
function classIconHtml(cls,withText=false){const path=CLASS_ICONS[cls];if(!path)return withText?'<span class="class-icon-cell">'+escapeHtml(cls||"-")+'</span>':'-';return '<span class="class-icon-cell"><img class="class-icon" src="'+path+'" alt="'+escapeHtml(cls)+'">'+(withText?'<span>'+escapeHtml(cls)+'</span>':'')+'</span>'}
function classTabIcon(cls){const path=CLASS_ICONS[cls];return path?'<img class="tab-icon" src="'+path+'" alt="">':''}
function miniRow(item,i){return '<div class="mini-row '+itemClass(item)+'"><div class="medal">'+rankIcon(i)+'</div><div class="name-wrap"><div class="name">'+flowText(item.name,item)+'</div>'+ownerLine(item)+(item.meta?'<div class="meta">'+escapeHtml(item.meta)+'</div>':'')+'</div><div class="score">'+escapeHtml(item.label||"")+'</div></div>'}
function rankBox(title,note,list){const items=(list||[]).filter(match);return '<section class="section"><div class="section-head"><h2>'+title+'</h2><span class="section-note">'+(note||'')+'</span></div><div class="list">'+(items.length?items.map(miniRow).join(""):'<div class="empty">아직 데이터가 부족해요.</div>')+'</div></section>'}
function tagBox(title,note,list){const items=(list||[]).filter(match);return '<section class="section"><div class="section-head"><h2>'+title+'</h2><span class="section-note">'+(note||'')+'</span></div><div class="tag-list swipe-list">'+(items.length?items.map(item=>'<div class="name-tag '+itemClass(item)+'"><div class="tag-name-wrap"><div class="tag-name">'+flowText(item.name,item)+'</div></div>'+ownerLine(item)+(item.meta?'<div class="tag-meta">'+escapeHtml(item.meta)+'</div>':'')+'</div>').join(""):'<div class="empty">아직 데이터가 부족해요.</div>')+'</div></section>'}
function chickLabel(item){const server=item.meta?'['+item.meta.replace("천족 · ","")+']':'';const cls=item.className?' ('+item.className+')':'';const owner=item.owner&&item.owner!==item.name?' / 본캐 '+item.owner:'';return item.name+server+cls+owner}
function renderChicks(){const items=(hallData?.newChicks||[]).filter(match);const card=document.getElementById("chickCard");if(!items.length){card.style.display="none";return}card.style.display="block";document.getElementById("chickTitle").textContent="🐣 신입 병아리 "+items.length+"명 입장!";document.getElementById("chickSub").textContent=items.length>=5?"새로운 모험가들이 우르르 둥지에 들어왔어요!":"새로운 모험가들을 따뜻하게 환영합니다!";const shown=chicksExpanded?items:items.slice(0,5);document.getElementById("chickTags").innerHTML=shown.map(item=>'<span class="chick-tag">'+escapeHtml(chickLabel(item))+'</span>').join("")+(items.length>5?'<span class="chick-tag chick-more" id="chickMore">'+(chicksExpanded?"접기":"+"+(items.length-5)+"명 더 보기")+'</span>':'');const more=document.getElementById("chickMore");if(more)more.onclick=()=>{chicksExpanded=!chicksExpanded;renderChicks()}}
function renderVisits(stats){const today=Number(stats?.todayVisits||0).toLocaleString("ko-KR");const total=Number(stats?.totalVisits||0).toLocaleString("ko-KR");document.getElementById("visitCard").innerHTML="👀 오늘 <strong>"+today+"명</strong>이 둘러봤어요.<br>🏛 누적 <strong>"+total+"번</strong>의 발걸음 <small>(26년 6월 1일부터 집계)</small>"}
async function fetchVisitStats(mode="stats",boost=0){try{const url=WEB_APP_URL+(WEB_APP_URL.includes("?")?"&":"?")+"action=hallVisit&mode="+encodeURIComponent(mode)+"&boost="+encodeURIComponent(boost)+"&t="+Date.now();const res=await fetch(url,{cache:"no-store"});const data=await res.json();if(data?.ok&&data.stats)renderVisits(data.stats)}catch(e){}}
function recordDailyVisitOnce(){const key="kinojo_hof_visit_"+new Date().toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul"});if(localStorage.getItem(key)==="1"){fetchVisitStats();return}localStorage.setItem(key,"1");fetchVisitStats("visit",1)}
function mvpSection(){return '<section class="mvp-card"><div class="mvp-head"><h2>👑 시즌 MVP</h2><span class="section-note">준비중</span></div><div class="mvp-body"><div class="mvp-title">MVP 공석</div><div>현재 시즌 MVP는 아직 선정되지 않았습니다.</div></div></section>'}
function rankTabs(){return '<div class="class-tabs rank-tabs"><button class="pill all-rank '+(activeRankClass==="전체"?"active":"")+'" data-rank-class="전체">전체</button>'+CLASS_ORDER.map(cls=>'<button class="pill '+(activeRankClass===cls?"active":"")+'" data-rank-class="'+cls+'">'+classTabIcon(cls)+cls+'</button>').join("")+'</div>'}
function currentRankList(){
  const base=currentOverall().filter(match);
  return activeRankClass==="전체"?base:base.filter(item=>item.className===activeRankClass);
}

function randomFrom(list){
  if(!Array.isArray(list)||!list.length)return "";
  return list[Math.floor(Math.random()*list.length)];
}

function getClassEmptyMessage(emptyCount){
  const pool=hallData?.classEmptyMessagePool||{};
  const group=pool[String(emptyCount)]||pool[emptyCount];
  if(!group)return {tone:"rare",text:"귀한 직업의 빈자리가 조용히 주인을 기다리고 있습니다."};
  const tone=Math.random()<0.6?"rare":"unpopular";
  const text=randomFrom(group[tone])||randomFrom(group.rare)||randomFrom(group.unpopular)||"귀한 직업의 빈자리가 조용히 주인을 기다리고 있습니다.";
  return {tone,text};
}

function classEmptyRowHtml(emptyCount){
  if(activeRankClass==="전체"||emptyCount<=0)return "";
  const safeCount=Math.max(1,Math.min(9,emptyCount));
  const msg=getClassEmptyMessage(safeCount);
  const rowHeight=42*safeCount;
  return '<tr class="class-empty-row"><td colspan="6"><div class="class-empty-message class-empty-'+msg.tone+'" style="min-height:'+rowHeight+'px">💬 '+escapeHtml(msg.text)+'</div></td></tr>';
}
function overallTable(){
  const list=currentRankList();
  const totalPages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(page>totalPages)page=totalPages;

  const start=(page-1)*PAGE_SIZE;
  const slice=list.slice(start,start+PAGE_SIZE);
  const isClassMode=activeRankClass!=="전체";
  const emptyCount=isClassMode?Math.max(0,PAGE_SIZE-slice.length):0;
  const title=activeRankClass==="전체"
    ? '🏅 키노조 전체 순위'
    : '<span class="rank-title-wrap"><img class="rank-title-icon" src="'+CLASS_ICONS[activeRankClass]+'" alt=""><span class="rank-title-text">'+escapeHtml(activeRankClass)+' 순위</span></span>';

  const rows=slice.length
    ? slice.map((item,i)=>'<tr><td class="num">'+(start+i<3?rankIcon(start+i):start+i+1)+'</td><td><span class="rank-name-cell">'+flowText(item.name,item)+'</span>'+ownerLine(item)+'</td><td>'+classIconHtml(item.className,false)+'</td><td class="power">'+escapeHtml(item.pvePowerLabel||item.label||"")+'</td><td class="power">'+escapeHtml(item.pvpPowerLabel||"")+'</td><td class="reviews"><div>🐲 '+escapeHtml(item.pveReview||"")+'</div><div>⚔️ '+escapeHtml(item.pvpReview||"")+'</div></td></tr>').join("")
    : '';

  const emptyRow=slice.length
    ? classEmptyRowHtml(emptyCount)
    : '<tr><td colspan="6"><div class="empty">해당 조건의 순위 데이터가 없습니다.</div></td></tr>';

  return '<section class="overall"><div class="overall-head"><h2>'+title+'</h2><div class="page-tools"><span>'+page+' / '+totalPages+'</span><button class="page-btn" data-page="prev">‹</button><button class="page-btn" data-page="next">›</button></div></div>'+rankTabs()+'<div class="table-scroll"><table class="rank-table"><colgroup><col class="num"><col class="char-col"><col class="class-col"><col class="power-col"><col class="power-col"><col class="review-col"></colgroup><thead><tr><th class="num">순위</th><th>캐릭터명</th><th>클래스</th><th>PVE</th><th>PVP</th><th>AI 리뷰</th></tr></thead><tbody>'+rows+emptyRow+'</tbody></table></div></section>';
}
function render(){if(!hallData)return;renderChicks();app.className="";app.innerHTML=mvpSection()+'<div class="dashboard"><div><div class="top-grid">'+rankBox("⚔ PVE TOP 5","",hallData.pveTop)+rankBox("⚔ PVP TOP 5","",hallData.pvpTop)+'</div></div><div class="side-stack">'+tagBox("😈 같은 마족이면 가족이지","타서버 마족",currentDemon())+tagBox("🤝 같은 파티면 친구지","천족 서버",currentParty())+'</div></div>'+overallTable();bindDynamic();requestAnimationFrame(applyOverflowMarquee)}
function bindDynamic(){document.querySelectorAll("[data-page]").forEach(btn=>btn.onclick=()=>{const total=Math.max(1,Math.ceil(currentRankList().length/PAGE_SIZE));page+=btn.dataset.page==="next"?1:-1;if(page<1)page=1;if(page>total)page=total;render()});document.querySelectorAll("[data-rank-class]").forEach(btn=>btn.onclick=()=>{activeRankClass=btn.dataset.rankClass;page=1;render()})}
function applyOverflowMarquee(){document.querySelectorAll(".flow-candidate").forEach(el=>{el.classList.remove("marquee");el.style.removeProperty("--marquee-shift");const parent=el.parentElement;if(!parent)return;const overflow=el.scrollWidth-parent.clientWidth;if(overflow>2){el.style.setProperty("--marquee-shift","-"+(overflow+12)+"px");el.classList.add("marquee")}})}
async function load(){app.className="loading";app.innerHTML='<div><div class="loader-ring"></div><div>명예의 전당 데이터를 불러오는 중...</div></div>';try{const url=WEB_APP_URL+(WEB_APP_URL.includes("?")?"&":"?")+"action=hallOfFame&t="+Date.now();const res=await fetch(url,{cache:"no-store"});const text=await res.text();if(!res.ok)throw new Error("HTTP "+res.status+": "+text.slice(0,180));hallData=JSON.parse(text);if(hallData.visitStats){renderVisits(hallData.visitStats)}else{fetchVisitStats()}render()}catch(err){app.className="";app.innerHTML='<div class="empty">명예의 전당 데이터를 불러오지 못했습니다.<br>'+escapeHtml(err.message||err)+'</div>'}}
function boostPrompt(){const code=prompt("관리자 암호를 입력하세요.");if(!code)return;const m=String(code).trim().match(/^키노조화이팅(\d+)$/);if(!m)return alert("암호가 올바르지 않습니다.");const amount=Math.max(1,Math.min(9999,Number(m[1]||0)));fetchVisitStats("boost",amount);alert("방문자수 +"+amount+" 반영 완료!")}
const toggle=document.getElementById("subToggle");toggle.onclick=()=>{includeSubs=!includeSubs;page=1;toggle.classList.toggle("on",includeSubs);toggle.querySelector(".toggle-text").textContent=includeSubs?"부캐 포함 ON":"부캐 포함 OFF";render()};
document.getElementById("searchInput").oninput=e=>{keyword=e.target.value.trim();page=1;render()};
document.getElementById("refreshBtn").onclick=load;
window.addEventListener("resize",()=>requestAnimationFrame(applyOverflowMarquee));
const suggest=document.getElementById("suggestBtn");suggest.onmousedown=suggest.ontouchstart=()=>{longPressFired=false;longPressTimer=setTimeout(()=>{longPressFired=true;boostPrompt()},800)};suggest.onmouseup=suggest.onmouseleave=suggest.ontouchend=()=>{clearTimeout(longPressTimer)};suggest.onclick=()=>{if(longPressFired)return;const box=document.getElementById("suggestionBox");box.style.display=box.style.display==="none"?"block":"none"};
document.getElementById("submitSuggestBtn").onclick=async()=>{const title=document.getElementById("suggestTitle").value.trim(),proposer=document.getElementById("suggestProposer").value.trim(),memo=document.getElementById("suggestMemo").value.trim();if(!title)return alert("항목 이름을 입력해 주세요.");const res=await fetch(WEB_APP_URL,{method:"POST",body:JSON.stringify({action:"hallSuggestion",title,proposer,memo})});const data=await res.json();if(!data.ok)return alert(data.message||"전송 실패");alert("제안이 접수되었습니다.");load()};
recordDailyVisitOnce();load();
</script>
