name: Admin Cache Lineage Bootstrap

on:
  push:
    branches:
      - codex/admin-cache-lineage-20260824
    paths:
      - '.github/workflows/admin-cache-lineage-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/admin-cache-lineage-20260824
          fetch-depth: 0
      - name: Bump real admin entrypoint cache
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          old = 'admin.js?cache=2026082202'
          new = 'admin.js?cache=2026082402'
          for name in ['admin/index.html', 'm/admin/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one old admin cache reference, found {count}')
              text = text.replace(old, new)
              if text.count(new) != 1 or old in text:
                  raise SystemExit(f'{name}: cache replacement verification failed')
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'kinojo-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/index.html m/admin/index.html
          git commit -m 'Bump admin entrypoint cache for banner tabs'
          git push origin HEAD:codex/admin-cache-lineage-20260824
