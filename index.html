<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="KINOJO INFO">
<meta property="og:description" content="키노조 정보 허브 - 성역 파티 확인과 명예의 전당">
<meta property="og:image" content="https://losnah513.github.io/aion2-updater-config/hall-of-fame/assets/hall-banner-v2.png?v=1c101d">
<title>KINOJO INFO</title>
<style>
:root{--text:#263852;--muted:#6d7f98;--line:rgba(117,140,177,.24);--panel:rgba(255,255,255,.82);--shadow:0 14px 34px rgba(30,50,82,.16)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,rgba(130,173,255,.22),transparent 34%),linear-gradient(180deg,#eef4ff,#fbfdff 52%,#e9eff8)}
.wrap{width:min(980px,100%);margin:0 auto;padding:18px 14px 40px}.hero{padding:22px 16px 18px;text-align:center}.eyebrow{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.68);border-radius:999px;padding:7px 12px;color:#456286;font-size:12px;font-weight:900;box-shadow:var(--shadow)}
h1{margin:14px 0 6px;font-size:clamp(34px,7vw,58px);letter-spacing:-1.6px}.subtitle{margin:0 auto;color:var(--muted);font-size:15px;line-height:1.55;max-width:560px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.card{position:relative;display:block;min-height:152px;padding:18px;border:1px solid rgba(255,255,255,.86);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(234,242,255,.88));box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:inherit;transition:.18s ease}.card:before{content:"";position:absolute;inset:auto -40px -70px auto;width:180px;height:180px;border-radius:50%;background:rgba(93,135,218,.16)}.card:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(30,50,82,.22)}.card.disabled{opacity:.68;cursor:not-allowed}.card.disabled:hover{transform:none}.icon{font-size:38px;margin-bottom:10px}.card-title{font-size:24px;font-weight:1000;letter-spacing:-.6px}.card-sub{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.45}.badge{position:absolute;right:14px;top:14px;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:1000;background:#eaf2ff;color:#3865b0;border:1px solid rgba(93,135,218,.2)}.disabled .badge{background:#f2f4f7;color:#7b8ba2}.footer{margin-top:24px;text-align:center;color:#7b8ba2;font-size:12px;font-weight:800}
@media(max-width:620px){.wrap{padding:12px 10px 32px}.grid{grid-template-columns:1fr;gap:10px}.card{min-height:132px;border-radius:20px;padding:16px}.card-title{font-size:21px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">✨ AION2 · KINOJO PORTAL</div>
    <h1>KINOJO INFO</h1>
    <p class="subtitle">성역 파티 확인, 레기온 기록, 명예의 전당으로 이어지는 키노조 정보 허브입니다.</p>
  </section>
  <section class="grid" aria-label="Kinojo navigation">
    <div class="card disabled" role="button" aria-disabled="true"><span class="badge">준비중</span><div class="icon">🛡️</div><div class="card-title">성역 1</div><div class="card-sub">루드라팟 파티 확인</div></div>
    <div class="card disabled" role="button" aria-disabled="true"><span class="badge">준비중</span><div class="icon">⚔️</div><div class="card-title">성역 2</div><div class="card-sub">바고트팟 파티 확인</div></div>
    <div class="card disabled" role="button" aria-disabled="true"><span class="badge">준비중</span><div class="icon">🔮</div><div class="card-title">성역 3</div><div class="card-sub">칼드릭스팟 파티 확인</div></div>
    <a class="card" href="hall-of-fame/"><span class="badge">입장 가능</span><div class="icon">🏛️</div><div class="card-title">Hall of Fame</div><div class="card-sub">랭킹, MVP, 성장왕, 벌크업, 캐릭터 반응 보기</div></a>
  </section>
  <footer class="footer">Powered by AION2 × KINOJO</footer>
</main>
</body>
</html>
