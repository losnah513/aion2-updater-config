name: Fix My Info Startup Flash

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-my-info-fouc.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prevent My Info FOUC
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path=Path('ui/kinojo-common-ui.js')
          text=path.read_text(encoding='utf-8')
          old="""  function ensureMyInfoStyles(){
    if(document.querySelector('link[data-kinojo-my-info-styles]'))return;
    const link=document.createElement('link');
    link.rel='stylesheet';
    link.href='/ui/kinojo-my-info.css?cache=2026081901';
    link.dataset.kinojoMyInfoStyles='true';
    document.head.appendChild(link);
  }
"""
          new="""  function ensureMyInfoStyles(){
    const existing=document.querySelector('link[data-kinojo-my-info-styles]');
    if(existing)return;
    let guard=document.querySelector('style[data-kinojo-my-info-critical]');
    if(!guard){
      guard=document.createElement('style');
      guard.dataset.kinojoMyInfoCritical='true';
      guard.textContent='.kinojo-my-info-layer,.kinojo-my-info-modal{visibility:hidden!important;opacity:0!important;pointer-events:none!important}';
      document.head.appendChild(guard);
    }
    const link=document.createElement('link');
    link.rel='stylesheet';
    link.href='/ui/kinojo-my-info.css?cache=2026081901';
    link.dataset.kinojoMyInfoStyles='true';
    link.addEventListener('load',()=>guard?.remove(),{once:true});
    document.head.appendChild(link);
  }
"""
          if old not in text:
            raise SystemExit('expected ensureMyInfoStyles contract not found')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY

          node --check ui/kinojo-common-ui.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text=Path('ui/kinojo-common-ui.js').read_text(encoding='utf-8')
          assert "data-kinojo-my-info-critical" in text
          assert "guard.textContent='.kinojo-my-info-layer,.kinojo-my-info-modal{visibility:hidden!important" in text
          assert "link.addEventListener('load',()=>guard?.remove(),{once:true});" in text
          assert text.index("guard.textContent=") < text.index("document.body.appendChild(layer);")
          print('My Info startup flash guard: PASS')
          PY

      - name: Commit source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-my-info-fouc.yml
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add ui/kinojo-common-ui.js
          git add -u .github/workflows/fix-my-info-fouc.yml
          git commit -m "Prevent My Info panel startup flash"
          git push origin main
