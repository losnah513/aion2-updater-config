name: Apply My Info Standalone Modal Layout Fix v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-my-info-modal-layout-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused layout correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          js_path = Path('ui/kinojo-common-ui.js')
          css_path = Path('ui/kinojo-my-info.css')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          old = "    if(!loggedIn)closeMyInfoPanel();"
          new = "    if(!loggedIn){closeMyInfoPanel();closeMyInfoModal();}"
          if old not in js:
              raise SystemExit('syncAuthRequiredUi contract not found')
          js = js.replace(old, new, 1)

          panel_pattern = re.compile(
              r'''          <button class="kinojo-my-info-menu-btn is-active" id="kinojoMyInfoMenuBtn".*?</button>\n'''
              r'''          <section class="kinojo-my-info-view is-active" id="kinojoMyInfoProfileView".*?</section>\n''',
              re.S,
          )
          panel_button = '''          <button class="kinojo-my-info-menu-btn" id="kinojoMyInfoMenuBtn" type="button" aria-haspopup="dialog" aria-controls="kinojoMyInfoModal">\n            <span>내 정보</span><small>이미지 관리 Preview</small>\n          </button>\n'''
          js, count = panel_pattern.subn(panel_button, js, count=1)
          if count != 1:
              raise SystemExit(f'panel profile view replacement count={count}')

          activate_pattern = re.compile(
              r'''  function activateMyInfoView_\(target\)\{.*?\n  \}\n  function openMyInfoPanel\(\)\{''',
              re.S,
          )
          modal_functions = '''  function makeMyInfoModal(){
    const modal=document.createElement('section');
    modal.className='kinojo-my-info-modal';
    modal.id='kinojoMyInfoModal';
    modal.setAttribute('aria-hidden','true');
    modal.innerHTML=`
      <div class="kinojo-my-info-modal-backdrop" data-kinojo-my-info-modal-close></div>
      <div class="kinojo-my-info-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="kinojoMyInfoModalTitle" tabindex="-1">
        <button class="kinojo-my-info-modal-close" id="kinojoMyInfoModalCloseBtn" type="button" aria-label="내 정보 닫기" data-kinojo-my-info-modal-close>×</button>
        <div class="kinojo-my-info-preview-state">
          <span class="kinojo-my-info-preview-badge">PREVIEW</span>
          <strong id="kinojoMyInfoModalTitle">내 정보</strong>
          <p>프로필·캐릭터 이미지 관리 화면을 준비 중입니다.</p>
        </div>
      </div>`;
    document.body.appendChild(modal);
  }
  function openMyInfoModal(){
    const modal=q('#kinojoMyInfoModal');
    if(!modal||!window.KinojoAuth?.getSession?.())return;
    closeMyInfoPanel();
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    document.body.classList.add('kinojo-my-info-modal-open');
    const dialog=q('.kinojo-my-info-modal-dialog',modal);
    if(dialog)dialog.scrollTop=0;
    requestAnimationFrame(()=>{try{dialog?.focus({preventScroll:true});}catch(_err){dialog?.focus();}});
  }
  function closeMyInfoModal(){
    const modal=q('#kinojoMyInfoModal');
    if(modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');}
    document.body.classList.remove('kinojo-my-info-modal-open');
    if(window.KinojoAuth?.getSession?.()){
      const btn=q('#kinojoMyInfoBtn');
      try{btn?.focus({preventScroll:true});}catch(_err){btn?.focus();}
    }
  }
  function openMyInfoPanel(){'''
          js, count = activate_pattern.subn(modal_functions, js, count=1)
          if count != 1:
              raise SystemExit(f'activate function replacement count={count}')

          js = js.replace("    activateMyInfoView_('profile');\n", '', 1)

          old_bind = "    q('#kinojoMyInfoMenuBtn')?.addEventListener('click',e=>{e.preventDefault();activateMyInfoView_(e.currentTarget.dataset.myInfoTarget);});"
          new_bind = "    q('#kinojoMyInfoMenuBtn')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openMyInfoModal();});\n    q('#kinojoMyInfoModal')?.addEventListener('click',e=>{if(e.target instanceof Element&&e.target.closest('[data-kinojo-my-info-modal-close]')){e.preventDefault();e.stopPropagation();closeMyInfoModal();}});"
          if old_bind not in js:
              raise SystemExit('my info menu bind not found')
          js = js.replace(old_bind, new_bind, 1)

          old_escape = "    document.addEventListener('keydown',e=>{if(e.key==='Escape'){const myInfo=q('#kinojoMyInfoLayer');if(myInfo?.classList.contains('open'))return closeMyInfoPanel();const p=q('#drawerPagePanel');if(p?.classList.contains('open'))return closeDrawerPagePanel();const d=q('#sideDrawer');if(d?.classList.contains('open'))return closeSideDrawer();}});"
          new_escape = "    document.addEventListener('keydown',e=>{if(e.key==='Escape'){const myInfoModal=q('#kinojoMyInfoModal');if(myInfoModal?.classList.contains('open'))return closeMyInfoModal();const myInfo=q('#kinojoMyInfoLayer');if(myInfo?.classList.contains('open'))return closeMyInfoPanel();const p=q('#drawerPagePanel');if(p?.classList.contains('open'))return closeDrawerPagePanel();const d=q('#sideDrawer');if(d?.classList.contains('open'))return closeSideDrawer();}});"
          if old_escape not in js:
              raise SystemExit('escape contract not found')
          js = js.replace(old_escape, new_escape, 1)

          old_init = "  makeDrawer(info);\n  makeMyInfoPanel();\n"
          new_init = "  makeDrawer(info);\n  makeMyInfoPanel();\n  makeMyInfoModal();\n"
          if old_init not in js:
              raise SystemExit('my info init contract not found')
          js = js.replace(old_init, new_init, 1)

          old_selector = ".admin-panel-modal';"
          if old_selector in js:
              js = js.replace(old_selector, ".admin-panel-modal,.kinojo-my-info-modal';", 1)

          old_api = "openMyInfoPanel,closeMyInfoPanel,toggleAdminMenu"
          if old_api in js:
              js = js.replace(old_api, "openMyInfoPanel,closeMyInfoPanel,openMyInfoModal,closeMyInfoModal,toggleAdminMenu", 1)

          if 'kinojoMyInfoProfileView' in js or 'activateMyInfoView_' in js:
              raise SystemExit('legacy in-panel profile view remains')
          for token in ['makeMyInfoModal','openMyInfoModal','closeMyInfoModal','data-kinojo-my-info-modal-close']:
              if token not in js:
                  raise SystemExit(f'missing JS token: {token}')

          css = css.replace('/* KINOJO My Info panel shell v20260819.03 */','/* KINOJO My Info panel shell v20260819.04 */',1)
          marker = '/* 20260819_05: 1-F layout correction'
          if marker not in css:
              raise SystemExit('old 1-F layout correction marker not found')
          css = css[:css.index(marker)].rstrip() + '''\n\n/* 20260819_06: 1-F layout correction 2 — body-level modal, matching character detail modal behavior */
body.kinojo-my-info-modal-open{overflow:hidden}
.kinojo-my-info-modal{position:fixed;inset:0;z-index:12000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.34);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-sizing:border-box}
.kinojo-my-info-modal.open{display:flex}
.kinojo-my-info-modal-backdrop{position:absolute;inset:0}
.kinojo-my-info-modal-dialog{position:relative;width:min(760px,calc(100vw - 36px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior-y:auto;padding:26px 28px 30px;border:1px solid rgba(148,163,184,.3);border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.99),rgba(248,250,252,.99));box-shadow:0 24px 64px rgba(15,23,42,.22);color:#0f172a;transform:translateY(8px) scale(.985);opacity:0;animation:kinojoMyInfoModalIn .2s ease forwards;box-sizing:border-box;outline:none}
@keyframes kinojoMyInfoModalIn{to{transform:translateY(0) scale(1);opacity:1}}
.kinojo-my-info-modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:999px;background:rgba(15,23,42,.07);color:#334155;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:5}
.kinojo-my-info-modal-close:hover{background:rgba(15,23,42,.12)}
.kinojo-my-info-modal .kinojo-my-info-preview-state{margin:0;padding-top:18px}
.kinojo-my-info-menu-btn:focus-visible{outline:3px solid rgba(37,99,235,.24);outline-offset:2px}
@media(max-width:640px){
  .kinojo-my-info-modal{padding:12px}
  .kinojo-my-info-modal-dialog{width:min(430px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);padding:20px;border-radius:22px}
  .kinojo-my-info-modal-close{top:11px;right:11px;width:32px;height:32px;font-size:20px}
}
@media(max-width:370px){.kinojo-my-info-modal-dialog{padding:18px 16px}}
@media(prefers-reduced-motion:reduce){.kinojo-my-info-modal-dialog{animation:none;transform:none;opacity:1}}
'''

          if '#kinojoMyInfoMenuBtn:focus + #kinojoMyInfoProfileView' in css:
              raise SystemExit('legacy focus-in-panel modal CSS remains')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace mismatch')

          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

          node --check ui/kinojo-common-ui.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('ui/kinojo-common-ui.js').read_text(encoding='utf-8')
          css=Path('ui/kinojo-my-info.css').read_text(encoding='utf-8')
          assert 'kinojoMyInfoProfileView' not in js
          assert "closeMyInfoPanel();\n    modal.classList.add('open')" in js
          assert '.kinojo-my-info-modal{position:fixed;inset:0;z-index:12000' in css
          assert '#kinojoMyInfoMenuBtn:focus + #kinojoMyInfoProfileView' not in css
          print('My Info standalone modal layout: PASS')
          PY

      - name: Commit correction and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-my-info-modal-layout-fix.yml
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add ui/kinojo-common-ui.js ui/kinojo-my-info.css .github/workflows/apply-my-info-modal-layout-fix.yml
          git commit -m "Open my info as standalone modal"
          git push origin main
