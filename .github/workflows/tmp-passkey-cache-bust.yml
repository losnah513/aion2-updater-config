name: Temporary PASS KEY RPC cache bust

on:
  push:
    branches:
      - agent/passkey-1c2-cache-bust

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passkey-1c2-cache-bust
      - name: Update RPC cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [Path('admin/index.html'), Path('m/admin/index.html')]
          old = 'kinojo-supabase-rpc.js?cache=2026080205'
          new = 'kinojo-supabase-rpc.js?cache=2026081702'
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one old cache key, found {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html m/admin/index.html
          git diff --cached --check
          git commit -m 'Bust admin RPC cache for PASS KEY 1-C-2'
          git push origin HEAD:agent/passkey-1c2-cache-bust
