name: Apply My Info Layout Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-my-info-layout-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move image preview into modal
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('ui/kinojo-common-ui.js')
          s=p.read_text(encoding='utf-8')
          if 'kinojoMyInfoProfileModal' not in s:
              s=s.replace("link.href='/ui/kinojo-my-info.css?cache=2026081901';","link.href='/ui/kinojo-my-info.css?cache=2026081902';",1)
              old='''        <div class="kinojo-panel-body kinojo-my-info-body" id="kinojoMyInfoPanelBody">\n          <button class="kinojo-my-info-menu-btn is-active" id="kinojoMyInfoMenuBtn" type="button" data-my-info-target="profile" aria-controls="kinojoMyInfoProfileView" aria-current="page">\n            <span>내 정보</span><small>이미지 관리 Preview</small>\n          </button>\n          <section class="kinojo-my-info-view is-active" id="kinojoMyInfoProfileView" data-my-info-view="profile" aria-labelledby="kinojoMyInfoMenuBtn">\n            <div class="kinojo-my-info-preview-state">\n              <span class="kinojo-my-info-preview-badge">PREVIEW</span>\n              <strong>내 정보</strong>\n              <p>프로필·캐릭터 이미지 관리 화면을 준비 중입니다.</p>\n            </div>\n          </section>\n          <section class="kinojo-my-info-characters" aria-labelledby="kinojoMyCharactersTitle">\n            <div class="kinojo-my-info-section-title" id="kinojoMyCharactersTitle">내 캐릭터</div>\n            <div class="kinojo-my-info-character-pending" aria-live="polite">캐릭터 연동 준비 중</div>\n          </section>\n        </div>\n      </aside>`;\n    document.body.appendChild(layer);\n  }\n  function activateMyInfoView_(target){\n    const key=String(target||'profile');\n    document.querySelectorAll('[data-my-info-view]').forEach(view=>{\n      const active=view.dataset.myInfoView===key;\n      view.classList.toggle('is-active',active);\n      view.hidden=!active;\n    });\n    document.querySelectorAll('[data-my-info-target]').forEach(button=>{\n      const active=button.dataset.myInfoTarget===key;\n      button.classList.toggle('is-active',active);\n      if(active)button.setAttribute('aria-current','page');\n      else button.removeAttribute('aria-current');\n    });\n  }\n'''
              new='''        <div class="kinojo-panel-body kinojo-my-info-body" id="kinojoMyInfoPanelBody">\n          <button class="kinojo-my-info-menu-btn" id="kinojoMyInfoMenuBtn" type="button" aria-haspopup="dialog" aria-controls="kinojoMyInfoProfileModal" aria-expanded="false">\n            <span>내 정보</span><small>이미지 관리</small>\n          </button>\n          <section class="kinojo-my-info-characters" aria-labelledby="kinojoMyCharactersTitle">\n            <div class="kinojo-my-info-section-title" id="kinojoMyCharactersTitle">내 캐릭터</div>\n            <div class="kinojo-my-info-character-pending" aria-live="polite">캐릭터 연동 준비 중</div>\n          </section>\n        </div>\n      </aside>`;\n    document.body.appendChild(layer);\n\n    const modal=document.createElement('section');\n    modal.className='kinojo-my-info-modal';\n    modal.id='kinojoMyInfoProfileModal';\n    modal.setAttribute('aria-hidden','true');\n    modal.innerHTML=`\n      <div class="kinojo-my-info-modal-card" role="dialog" aria-modal="true" aria-labelledby="kinojoMyInfoModalTitle">\n        <div class="kinojo-my-info-modal-head">\n          <div><span class="kinojo-my-info-preview-badge">PREVIEW</span><strong id="kinojoMyInfoModalTitle">내 정보 · 이미지 관리</strong></div>\n          <button class="kinojo-common-close kinojo-panel-close" id="kinojoMyInfoModalCloseBtn" type="button" aria-label="이미지 관리 닫기">×</button>\n        </div>\n        <div class="kinojo-my-info-modal-body">\n          <div class="kinojo-my-info-preview-state">\n            <span class="kinojo-my-info-preview-badge">PREVIEW</span>\n            <strong>내 정보</strong>\n            <p>프로필·캐릭터 이미지 관리 화면을 준비 중입니다.</p>\n          </div>\n        </div>\n      </div>`;\n    document.body.appendChild(modal);\n  }\n  function openMyInfoModal(){\n    const modal=q('#kinojoMyInfoProfileModal');\n    const btn=q('#kinojoMyInfoMenuBtn');\n    if(!modal||!window.KinojoAuth?.getSession?.())return;\n    modal.classList.add('open');\n    modal.setAttribute('aria-hidden','false');\n    document.body.classList.add('kinojo-my-info-modal-open');\n    if(btn)btn.setAttribute('aria-expanded','true');\n    requestAnimationFrame(()=>q('#kinojoMyInfoModalCloseBtn')?.focus?.());\n  }\n  function closeMyInfoModal(){\n    const modal=q('#kinojoMyInfoProfileModal');\n    const btn=q('#kinojoMyInfoMenuBtn');\n    if(modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');}\n    document.body.classList.remove('kinojo-my-info-modal-open');\n    if(btn)btn.setAttribute('aria-expanded','false');\n  }\n'''
              if old not in s: raise SystemExit('my info panel block not found')
              s=s.replace(old,new,1)
              s=s.replace("    activateMyInfoView_('profile');\n", "    closeMyInfoModal();\n",1)
              s=s.replace("  function closeMyInfoPanel(){\n    const layer=q('#kinojoMyInfoLayer');", "  function closeMyInfoPanel(){\n    closeMyInfoModal();\n    const layer=q('#kinojoMyInfoLayer');",1)
              oldbind="    q('#kinojoMyInfoMenuBtn')?.addEventListener('click',e=>{e.preventDefault();activateMyInfoView_(e.currentTarget.dataset.myInfoTarget);});"
              newbind="    q('#kinojoMyInfoMenuBtn')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openMyInfoModal();});\n    q('#kinojoMyInfoModalCloseBtn')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();closeMyInfoModal();});\n    q('#kinojoMyInfoProfileModal')?.addEventListener('click',e=>{if(e.target.id==='kinojoMyInfoProfileModal')closeMyInfoModal();});"
              if oldbind not in s: raise SystemExit('my info bind block not found')
              s=s.replace(oldbind,newbind,1)
              oldesc="document.addEventListener('keydown',e=>{if(e.key==='Escape'){const myInfo=q('#kinojoMyInfoLayer');if(myInfo?.classList.contains('open'))return closeMyInfoPanel();const p=q('#drawerPagePanel');if(p?.classList.contains('open'))return closeDrawerPagePanel();const d=q('#sideDrawer');if(d?.classList.contains('open'))return closeSideDrawer();}});"
              newesc="document.addEventListener('keydown',e=>{if(e.key==='Escape'){const myInfoModal=q('#kinojoMyInfoProfileModal');if(myInfoModal?.classList.contains('open'))return closeMyInfoModal();const myInfo=q('#kinojoMyInfoLayer');if(myInfo?.classList.contains('open'))return closeMyInfoPanel();const p=q('#drawerPagePanel');if(p?.classList.contains('open'))return closeDrawerPagePanel();const d=q('#sideDrawer');if(d?.classList.contains('open'))return closeSideDrawer();}});"
              if oldesc not in s: raise SystemExit('escape block not found')
              s=s.replace(oldesc,newesc,1)
              p.write_text(s,encoding='utf-8',newline='\n')
          PY
          node --check ui/kinojo-common-ui.js
          grep -q 'id="kinojoMyInfoProfileModal"' ui/kinojo-common-ui.js
          grep -q "function openMyInfoModal" ui/kinojo-common-ui.js
          ! grep -q "activateMyInfoView_" ui/kinojo-common-ui.js

      - name: Commit focused correction and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kinojo-automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-my-info-layout-fix.yml
          git add ui/kinojo-common-ui.js
          git commit -m "Move my info image preview into modal"
          git push origin HEAD:main
