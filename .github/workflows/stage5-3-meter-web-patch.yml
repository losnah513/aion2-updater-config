# stage5-3 patch runner v5
name: Apply Meter Stage 5-3 Web Patch

on:
  push:
    branches:
      - agent/meter-stage5-3-web
    paths:
      - .github/workflows/stage5-3-meter-web-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meter-stage5-3-web
          fetch-depth: 0
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 tools/stage5_3_fix_mobile.py
          python3 -m py_compile tools/stage5_3_patch.py
          python3 tools/stage5_3_patch.py
          node --check meter/js/meter-app.js
          node --check core/kinojo-supabase-features.js
          node --check admin/js/admin-system.js
          node --check admin/js/admin-bootstrap.js
          node --check admin/js/admin.js
      - name: Commit patched product files
        run: |
          set -euo pipefail
          git rm .github/workflows/stage5-3-meter-web-patch.yml tools/stage5_3_patch.py tools/stage5_3_fix_mobile.py
          git config user.name "kinojo-bot"
          git config user.email "kinojo-bot@users.noreply.github.com"
          git add .github/workflows/verify-kinojo-pages.yml meter m/meter admin m/admin core/kinojo-supabase-features.js
          git commit -m "feat: connect meter combat stats control"
          git push origin HEAD:agent/meter-stage5-3-web
