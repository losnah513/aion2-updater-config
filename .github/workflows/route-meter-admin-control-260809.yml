name: Route Meter admin control Edge

'on':
  push:
    branches:
      - feature/admin-meter-launch-channel-260809
    paths:
      - '.github/workflows/route-meter-admin-control-260809.yml'

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Route Meter admin actions to dedicated Edge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('core/kinojo-supabase-features.js')
          t=p.read_text(encoding='utf-8')
          old="return invokeEdgeFunction('meter-ingest', Object.assign({"
          new="return invokeEdgeFunction('meter-admin-control', Object.assign({"
          if t.count(old)!=1: raise SystemExit('adminMeter Edge marker missing')
          p.write_text(t.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          node --check core/kinojo-supabase-features.js
      - name: Commit routing change
        shell: bash
        run: |
          git config user.name 'losnah513'
          git config user.email 'losnah513@gmail.com'
          git add core/kinojo-supabase-features.js
          git diff --cached --check
          git commit -m 'fix: route Meter admin controls through dedicated Edge'
          git push origin HEAD:feature/admin-meter-launch-channel-260809
