name: Temporary PASS KEY 1-C-7 final audit

on:
  push:
    branches:
      - agent/passkey-1c7-final-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passkey-1c7-final-audit
      - name: Audit browser raw credential consumers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime=[
            'core/kinojo-auth-session.js','core/kinojo-auth-service.js','core/kinojo-auth-ui.js','core/kinojo-supabase-features.js',
            'hof/js/hall-data.js','meter/js/meter-app.js','sanctuary/js/sanctuary.js','sanctuary-schedule/js/sanctuary-schedule.js',
            'ui/kinojo-common-ui.js','ui/kinojo-character-reaction.js'
          ]
          forbidden={
            'currentPassKey()': re.compile(r'\bcurrentPassKey\s*\('),
            'optionalPassKey()': re.compile(r'\boptionalPassKey\s*\('),
            'stored account.passKey': re.compile(r'\baccount\??\.passKey\b'),
            'stored account.passCode': re.compile(r'\baccount\??\.passCode\b'),
            'stored session.passKey': re.compile(r'\bsession\??\.passKey\b'),
            'stored session.passCode': re.compile(r'\bsession\??\.passCode\b'),
            'authPassKey payload assignment': re.compile(r'authPassKey\s*='),
          }
          failed=[]
          for name in runtime:
            text=Path(name).read_text(encoding='utf-8')
            hits=[]
            for label,pat in forbidden.items():
              if pat.search(text): hits.append(label)
            print(f'{name}: '+('PASS' if not hits else 'FAIL '+','.join(hits)))
            if hits: failed.append((name,hits))

          session=Path('core/kinojo-auth-session.js').read_text(encoding='utf-8')
          service=Path('core/kinojo-auth-service.js').read_text(encoding='utf-8')
          features=Path('core/kinojo-supabase-features.js').read_text(encoding='utf-8')
          hall=Path('hof/js/hall-data.js').read_text(encoding='utf-8')
          meter=Path('meter/js/meter-app.js').read_text(encoding='utf-8')
          checks={
            'schema-v6': 'supabase-passkey-v6-session-only-329-20260818' in session,
            'storage-strip': all(x in session for x in ['stripStoredCredentialFields',"'passKey'","'passCode'","'pass_key'","'pass_code'"]),
            'auth-service-no-copy': '.passKey=passKey' not in service and '.passCode=passKey' not in service,
            'pageview-v329': "kinojo_log_page_view_v329" in features and 'authCredential' in features,
            'hall-ranking-v329': 'kinojo_web_get_my_hof_ranking_v329' in hall,
            'hall-reaction-v329': 'kinojo_web_submit_hall_reaction_v329' in features,
            'meter-session-token': 'state.sessionToken' in meter and 'state.passKey' not in meter,
            'meter-cache-auth-bust': 'meter-app.js?cache=2026081502-50040&auth=2026081801' in Path('meter/index.html').read_text(encoding='utf-8'),
          }
          for k,v in checks.items(): print(f'{k}: {"PASS" if v else "FAIL"}')
          if failed or not all(checks.values()): raise SystemExit('PASS KEY 1-C-7 final audit failed')
          print('PASS KEY 1-C-7 FINAL BROWSER AUDIT: PASS')
          PY
