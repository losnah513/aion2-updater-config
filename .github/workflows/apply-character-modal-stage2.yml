name: Apply character modal stage2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feature/character-modal-stage2-305'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore stage2 sources
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import io
          import json
          import shutil
          import tarfile
          from pathlib import Path

          root = Path('.')
          parts = root / '.stage2parts'
          stage = root / '.stage2'

          def decode_base64(value):
              encoded = ''.join(str(value).split())
              encoded += '=' * (-len(encoded) % 4)
              return base64.b64decode(encoded)

          def read_parts(prefix):
              files = sorted(parts.glob(prefix + '.*.part'))
              if not files:
                  raise RuntimeError('missing parts: ' + prefix)
              return decode_base64(''.join(path.read_text(encoding='utf-8').strip() for path in files))

          (root / 'ui/kinojo-character-reaction.js').write_bytes(gzip.decompress(read_parts('reaction-js')))

          temp = root / '.stage2-extracted'
          temp.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(read_parts('bundle')), mode='r:gz') as archive:
              archive.extractall(temp)

          bundle_targets = {
              'kinojo-character-reaction.css': 'ui/kinojo-character-reaction.css',
              'kinojo-character-detail-refresh.js': 'ui/kinojo-character-detail-refresh.js',
          }
          for source_name, target_name in bundle_targets.items():
              matches = [path for path in temp.rglob(source_name) if path.is_file()]
              if len(matches) != 1:
                  raise RuntimeError(f'expected one {source_name}, found {len(matches)}: {matches}')
              target = root / target_name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(matches[0].read_bytes())

          detail_css_payload = (stage / 'kinojo-character-detail-refresh.css.gz.b64').read_text(encoding='utf-8')
          (root / 'ui/kinojo-character-detail-refresh.css').write_bytes(gzip.decompress(decode_base64(detail_css_payload)))

          html_payloads = json.loads((stage / 'html-payloads.json').read_text(encoding='utf-8'))
          html_targets = {
              'hof-index.html.gz.b64': 'hof/index.html',
              'm-hof-index.html.gz.b64': 'm/hof/index.html',
              'ranking-index.html.gz.b64': 'ranking/index.html',
              'm-ranking-index.html.gz.b64': 'm/ranking/index.html',
              'sanctuary-index.html.gz.b64': 'sanctuary/index.html',
              'm-sanctuary-index.html.gz.b64': 'm/sanctuary/index.html',
          }
          for payload_name, target_name in html_targets.items():
              if payload_name not in html_payloads:
                  raise RuntimeError('missing html payload: ' + payload_name)
              target = root / target_name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(decode_base64(html_payloads[payload_name])))

          shutil.rmtree(temp)
          shutil.rmtree(parts)
          shutil.rmtree(stage, ignore_errors=True)
          Path('.github/workflows/apply-character-modal-stage2.yml').unlink(missing_ok=True)
          PY

      - name: Validate stage2 sources
        shell: bash
        run: |
          node --check ui/kinojo-character-reaction.js
          node --check ui/kinojo-character-detail-refresh.js
          python - <<'PY'
          from pathlib import Path
          for path in [Path('ui/kinojo-character-reaction.css'),Path('ui/kinojo-character-detail-refresh.css')]:
              data = path.read_bytes()
              assert data.count(b'{') == data.count(b'}'), path
          for path in [Path('hof/index.html'),Path('m/hof/index.html'),Path('ranking/index.html'),Path('m/ranking/index.html'),Path('sanctuary/index.html'),Path('m/sanctuary/index.html')]:
              text = path.read_text(encoding='utf-8')
              assert 'kinojo-character-reaction.js?cache=2026080305' in text, path
              assert 'kinojo-character-detail-refresh.js?cache=2026080303' in text, path
              assert 'kinojo-character-detail-refresh.css?cache=2026080302' in text, path
          reaction = Path('ui/kinojo-character-reaction.js').read_text(encoding='utf-8')
          assert 'data-kinojo-character-tab="arcana"' in reaction
          assert 'data-equipment-category="weaponArmor"' in reaction
          assert 'data-equipment-category="accessory"' in reaction
          detail = Path('ui/kinojo-character-detail-refresh.js').read_text(encoding='utf-8')
          assert "API_VERSION = '305.1'" in detail
          PY

      - name: Commit restored sources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 캐릭터 모달 장비·아르카나 2단계 리디자인"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
