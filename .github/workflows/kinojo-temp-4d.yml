name: KINOJO temporary 4-D probe

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  probe:
    if: github.event.issue.title == 'KINOJO_MY_INFO_4D_PROBE_20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prove issue event
        run: |
          echo "probe-ok" > ui/.my-info-4d-probe-ok
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add ui/.my-info-4d-probe-ok
          git commit -m "Probe Stage 4-D issue event"
          git push origin main
