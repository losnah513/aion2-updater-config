name: Align admin cache

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/zz-fix-admin-cache.yml'
      - 'tools/zz_fix_admin_cache.py'

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Align cache references
        run: |
          set -euo pipefail
          python3 tools/zz_fix_admin_cache.py
          git diff --check
          grep -q 'admin.css?cache=2026082202' admin/index.html
          grep -q 'admin.css?cache=2026082202' m/admin/index.html
          grep -q 'admin.js?cache=2026082202' admin/index.html
          grep -q 'admin.js?cache=2026082202' m/admin/index.html
      - name: Commit aligned pages
        run: |
          set -euo pipefail
          git config user.name 'kinojo-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/index.html m/admin/index.html
          git commit -m 'fix: align admin asset cache references'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
