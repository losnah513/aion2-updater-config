name: Apply KINOJO 3-3 source

on:
  push:
    branches:
      - feat/character-modal-detail-state-3-3
    paths:
      - '_staging/**'
      - '.github/workflows/apply-kinojo-3-3.yml'

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/character-modal-detail-state-3-3
          fetch-depth: 0

      - name: Restore verified source files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d _staging/character-detail-refresh-3-3.js.gz.b64 | gzip -d > ui/kinojo-character-detail-refresh.js
          base64 -d _staging/character-detail-refresh-3-3.css.gz.b64 | gzip -d > ui/kinojo-character-detail-refresh.css
          node --check ui/kinojo-character-detail-refresh.js
          python - <<'PY'
          from pathlib import Path
          for name in ('ui/kinojo-character-detail-refresh.js', 'ui/kinojo-character-detail-refresh.css'):
              text = Path(name).read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'unbalanced braces: {name}')
          PY
          rm -rf _staging

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/kinojo-character-detail-refresh.js ui/kinojo-character-detail-refresh.css _staging
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '캐릭터 모달 상세 미갱신 상태 3-3'
          git push origin HEAD:feat/character-modal-detail-state-3-3
