name: Apply My Info 2-G

on:
  push:
    branches: [main]
    paths:
      - "ui/.my-info-2g-trigger"
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.issue.title == 'KINOJO_MY_INFO_2G_20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Connect My Info rows to existing character detail modal
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          js_path=Path('ui/kinojo-common-ui.js')
          css_path=Path('ui/kinojo-my-info.css')
          js=js_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')

          def rep(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old,new,1)

          js=rep(js,
              "link.href='/ui/kinojo-my-info.css?cache=2026081905';",
              "link.href='/ui/kinojo-my-info.css?cache=2026081906';",
              'my info cache')

          js=rep(js,
              '''      return '<article class="kinojo-my-info-character-row '+(isMain?'is-main':'is-alt')+'" data-character-id="'+characterId+'" data-server-id="'+(Number.isFinite(serverId)?serverId:'')+'" data-character-name="'+escapeHtml(characterName)+'" aria-label="'+escapeHtml(characterName+' · '+kind+' · '+statLabel)+'">'\n''',
              '''      return '<article class="kinojo-my-info-character-row '+(isMain?'is-main':'is-alt')+'" role="button" tabindex="0" data-character-id="'+characterId+'" data-server-id="'+(Number.isFinite(serverId)?serverId:'')+'" data-character-name="'+escapeHtml(characterName)+'" aria-label="'+escapeHtml(characterName+' · '+kind+' · '+statLabel+' · 상세 정보 보기')+'" title="캐릭터 상세 정보 보기">'\n''',
              'character row interaction semantics')

          insertion='''

  let kinojoCharacterDetailLoaderPromise=null;
  function ensureCharacterDetailStyle_(href,key){
    if(document.querySelector('link[data-kinojo-character-detail-style="'+key+'"],link[href*="'+href.split('/').pop().split('?')[0]+'"]'))return Promise.resolve(true);
    return new Promise((resolve,reject)=>{
      const link=document.createElement('link');
      link.rel='stylesheet';
      link.href=href;
      link.dataset.kinojoCharacterDetailStyle=key;
      link.addEventListener('load',()=>resolve(true),{once:true});
      link.addEventListener('error',()=>reject(new Error('CHARACTER_DETAIL_STYLE_LOAD_FAILED:'+key)),{once:true});
      document.head.appendChild(link);
    });
  }
  function ensureCharacterDetailScript_(src,key,ready){
    if(typeof ready==='function'&&ready())return Promise.resolve(true);
    const file=src.split('/').pop().split('?')[0];
    const existing=Array.from(document.scripts).find(script=>String(script.src||'').includes('/ui/'+file));
    if(existing){
      if(typeof ready!=='function')return Promise.resolve(true);
      return new Promise((resolve,reject)=>{
        if(typeof ready==='function'&&ready())return resolve(true);
        let settled=false;
        const finish=()=>{if(settled)return;settled=true;clearTimeout(timer);if(typeof ready!=='function'||ready())resolve(true);else reject(new Error('CHARACTER_DETAIL_SCRIPT_NOT_READY:'+key));};
        const fail=()=>{if(settled)return;settled=true;clearTimeout(timer);reject(new Error('CHARACTER_DETAIL_SCRIPT_LOAD_FAILED:'+key));};
        const timer=setTimeout(finish,1200);
        existing.addEventListener('load',finish,{once:true});
        existing.addEventListener('error',fail,{once:true});
      });
    }
    return new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src=src;
      script.async=false;
      script.dataset.kinojoCharacterDetailScript=key;
      script.addEventListener('load',()=>{
        if(typeof ready==='function'&&!ready())return reject(new Error('CHARACTER_DETAIL_SCRIPT_NOT_READY:'+key));
        resolve(true);
      },{once:true});
      script.addEventListener('error',()=>reject(new Error('CHARACTER_DETAIL_SCRIPT_LOAD_FAILED:'+key)),{once:true});
      document.head.appendChild(script);
    });
  }
  function ensureCharacterDetailModal_(){
    if(window.KinojoCharacterReaction?.open)return Promise.resolve(true);
    if(kinojoCharacterDetailLoaderPromise)return kinojoCharacterDetailLoaderPromise;
    kinojoCharacterDetailLoaderPromise=(async()=>{
      await Promise.all([
        ensureCharacterDetailStyle_('/ui/kinojo-character-reaction.css?cache=2026081003','reaction'),
        ensureCharacterDetailStyle_('/ui/kinojo-character-detail-refresh.css?cache=2026081003','detail-refresh'),
        ensureCharacterDetailStyle_('/ui/kinojo-character-skill.css?cache=2026081001','skill'),
        ensureCharacterDetailStyle_('/ui/kinojo-character-daevanion.css?cache=2026081002','daevanion')
      ]);
      await ensureCharacterDetailScript_('/ui/kinojo-character-reaction.js?cache=2026081801','reaction',()=>!!window.KinojoCharacterReaction?.open);
      await ensureCharacterDetailScript_('/ui/kinojo-character-detail-refresh.js?cache=2026081003','detail-refresh');
      await ensureCharacterDetailScript_('/ui/kinojo-character-skill-bridge.js?cache=2026081001','skill');
      await ensureCharacterDetailScript_('/ui/kinojo-character-daevanion-bridge.js?cache=2026081002','daevanion');
      if(!window.KinojoCharacterReaction?.open)throw new Error('CHARACTER_DETAIL_MODAL_UNAVAILABLE');
      return true;
    })().catch(error=>{kinojoCharacterDetailLoaderPromise=null;throw error;});
    return kinojoCharacterDetailLoaderPromise;
  }
  function myInfoCharacterRowData_(row){
    const characterId=Number(row?.dataset?.characterId||0);
    const characters=Array.isArray(kinojoMyCharactersState.data?.characters)?kinojoMyCharactersState.data.characters:[];
    return characters.find(item=>Number(item?.characterId||0)===characterId)||null;
  }
  async function openMyInfoCharacterDetail_(row){
    if(!row||!window.KinojoAuth?.getSession?.())return false;
    let item=myInfoCharacterRowData_(row);
    if(!item){
      await loadMyInfoCharacters_(true);
      item=myInfoCharacterRowData_(row);
    }
    if(!item)return false;
    closeMyInfoPanel();
    try{
      await ensureCharacterDetailModal_();
      const ownerName=item.isMain===true?String(item.characterName||''):String(kinojoMyCharactersState.data?.owner?.mainCharacterName||'');
      const classIcon=classIconFor_(item.className);
      window.KinojoCharacterReaction.open({
        source:'hall',
        context:'my-info',
        target:{
          name:String(item.characterName||''),
          owner:ownerName,
          className:String(item.className||''),
          server:String(item.serverName||''),
          serverId:item.serverId||'',
          pvePower:item.displayCombatPower??'',
          pvpPower:item.displayItemLevel??'',
          profileImageUrl:String(item.officialProfileImageUrl||''),
          classIconUrl:classIcon,
          detailUrl:String(item.detailUrl||'')
        }
      });
      return true;
    }catch(error){
      console.warn('KINOJO My Info character detail open failed:',error);
      toast('캐릭터 상세 정보를 불러오지 못했습니다.');
      return false;
    }
  }
'''
          js=rep(js,
              '''    return kinojoMyCharactersState.promise;\n  }\n  function makeMyInfoModal(){''',
              '''    return kinojoMyCharactersState.promise;\n  }'''+insertion+'''  function makeMyInfoModal(){''',
              'existing detail modal loader insertion')

          js=rep(js,
              '''    q('#kinojoMyInfoLayer')?.addEventListener('click',e=>{if(e.target.id==='kinojoMyInfoLayer')closeMyInfoPanel();});\n    q('#drawerToggleBtn')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openSideDrawer();});''',
              '''    q('#kinojoMyInfoLayer')?.addEventListener('click',e=>{if(e.target.id==='kinojoMyInfoLayer')closeMyInfoPanel();});\n    q('#kinojoMyInfoCharacterList')?.addEventListener('click',e=>{\n      const row=e.target instanceof Element?e.target.closest('.kinojo-my-info-character-row'):null;\n      if(!row)return;\n      e.preventDefault();e.stopPropagation();\n      openMyInfoCharacterDetail_(row);\n    });\n    q('#kinojoMyInfoCharacterList')?.addEventListener('keydown',e=>{\n      if(e.key!=='Enter'&&e.key!==' ')return;\n      const row=e.target instanceof Element?e.target.closest('.kinojo-my-info-character-row'):null;\n      if(!row)return;\n      e.preventDefault();e.stopPropagation();\n      openMyInfoCharacterDetail_(row);\n    });\n    q('#drawerToggleBtn')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openSideDrawer();});''',
              'character row events')

          css=rep(css,
              '/* KINOJO My Info panel shell v20260819.06 */',
              '/* KINOJO My Info panel shell v20260819.07 */',
              'css version')
          css=rep(css,
              '''.kinojo-my-info-character-stat-sep{width:1px;height:18px;background:rgba(122,146,180,.22)}\n''',
              '''.kinojo-my-info-character-stat-sep{width:1px;height:18px;background:rgba(122,146,180,.22)}\n\n/* 20260819_11: 2-G existing character detail modal trigger */\n.kinojo-my-info-character-row[role="button"]{cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease,background-color .16s ease}\n.kinojo-my-info-character-row[role="button"]:hover{border-color:rgba(37,99,235,.28);box-shadow:0 7px 18px rgba(15,23,42,.07);transform:translateY(-1px)}\n.kinojo-my-info-character-row[role="button"]:focus-visible{outline:2px solid rgba(37,99,235,.42);outline-offset:2px;border-color:rgba(37,99,235,.34)}\n.kinojo-my-info-character-row[role="button"]:active{transform:translateY(0);box-shadow:0 3px 10px rgba(15,23,42,.06)}\n''',
              'character row interaction css')

          js_path.write_text(js,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY

      - name: Validate 2-G contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/kinojo-common-ui.js
          grep -q "window.KinojoCharacterReaction.open" ui/kinojo-common-ui.js
          grep -q "openMyInfoCharacterDetail_" ui/kinojo-common-ui.js
          grep -q "role=\"button\"" ui/kinojo-common-ui.js
          grep -q "kinojo-character-reaction.js" ui/kinojo-common-ui.js
          grep -q "2-G existing character detail modal trigger" ui/kinojo-my-info.css
          test -f ui/kinojo-character-reaction.js
          test -f ui/kinojo-character-reaction.css
          test -f ui/kinojo-character-detail-refresh.js
          test -f ui/kinojo-character-skill-bridge.js
          test -f ui/kinojo-character-daevanion-bridge.js
          python3 <<'PY'
          from pathlib import Path
          css=Path('ui/kinojo-my-info.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace mismatch')
          js=Path('ui/kinojo-common-ui.js').read_text(encoding='utf-8')
          section=js[js.index('async function openMyInfoCharacterDetail_'):js.index('function makeMyInfoModal')]
          if 'document.createElement(\'section\')' in section or 'document.createElement("section")' in section:
              raise SystemExit('2-G must not create a new character detail modal')
          if 'characterId:' in section:
              raise SystemExit('DB character ID must not be forwarded as live game identity')
          PY
          node tests/web-shell-auth-contract.test.js
          git diff --check

      - name: Commit product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add ui/kinojo-common-ui.js ui/kinojo-my-info.css
          git commit -m "Open existing character detail from My Info"
          git push origin main
