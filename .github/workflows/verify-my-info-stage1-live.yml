name: Verify My Info Stage 1 Live

on:
  push:
    branches: [main]
    paths:
      - "ui/.verify-my-info-stage1-live"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify My Info live CSS and cache reference
        shell: bash
        run: |
          set -euo pipefail
          key="$(git rev-parse --short=12 HEAD)-$(date -u +%s)"
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error --location --compressed \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://kinojo.info/ui/kinojo-my-info.css?verify=$key-$attempt" \
              -o /tmp/live-my-info.css || true
            curl --fail --silent --show-error --location --compressed \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://kinojo.info/ui/kinojo-common-ui.js?verify=$key-$attempt" \
              -o /tmp/live-common.js || true
            if [[ -s /tmp/live-my-info.css && -s /tmp/live-common.js ]] \
              && cmp -s ui/kinojo-my-info.css /tmp/live-my-info.css \
              && cmp -s ui/kinojo-common-ui.js /tmp/live-common.js; then
              grep -q "kinojo-my-info.css?cache=2026081902" /tmp/live-common.js
              echo "My Info Stage 1 live CSS/common JS: MATCH"
              exit 0
            fi
            sleep 15
          done
          echo "My Info Stage 1 live readback mismatch" >&2
          sha256sum ui/kinojo-my-info.css /tmp/live-my-info.css ui/kinojo-common-ui.js /tmp/live-common.js || true
          exit 1
