name: KINOJO temporary 4-E apply

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == 'KINOJO_MY_INFO_4E_APPLY_20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Stage 4-E upload wiring and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          test "$(git hash-object ui/kinojo-common-ui.js)" = "bc43d7e02e1af6c3807a211ca567fba7d5c9e14c"
          test "$(git hash-object .kinojo-tmp/4e.patch)" = "2ad7d00d708c5601ef54b178f64ae883d56ec8ae"
          git apply --check .kinojo-tmp/4e.patch
          git apply .kinojo-tmp/4e.patch
          node --check ui/kinojo-common-ui.js
          git diff --check
          grep -q "profile-upload-prepare" ui/kinojo-common-ui.js
          grep -q "profile-upload-complete" ui/kinojo-common-ui.js
          grep -q "method:'PUT'" ui/kinojo-common-ui.js
          grep -q "body.append('cacheControl','3600')" ui/kinojo-common-ui.js
          grep -q "'x-upsert':'false'" ui/kinojo-common-ui.js
          ! grep -q "SUPABASE_SERVICE_ROLE_KEY" ui/kinojo-common-ui.js
          test "$(git hash-object ui/kinojo-common-ui.js)" = "ef13ae40101a40215c43c1208d7cb124052d6586"
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git rm -f .kinojo-tmp/4e.patch .github/workflows/kinojo-temp-4e.yml
          git add ui/kinojo-common-ui.js
          git commit -m "Upload selected profile image from My Info"
          git push origin HEAD:main
