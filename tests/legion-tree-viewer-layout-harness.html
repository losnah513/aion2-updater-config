<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Legion Tree viewer layout harness</title>
  <link rel="stylesheet" href="../legion-tree/css/legion-tree.css?cache=2026090105">
</head>
<body class="kinojo-page-legion-tree">
  <main class="legion-tree-wrap">
    <section class="legion-tree-viewer" id="legionTreeViewer" aria-label="레기온 조직도 뷰어">
      <button class="legion-tree-viewer-nav is-previous" id="legionTreePrevBtn" type="button" aria-controls="legionTreeRoot" aria-label="이전 레기온" disabled><span class="legion-tree-viewer-nav-icon" aria-hidden="true">‹</span><strong class="legion-tree-viewer-nav-name" id="legionTreePrevName" aria-hidden="true">이전 레기온</strong></button>
      <div class="legion-tree-viewer-card" id="legionTreeViewerCard">
        <section class="legion-tree-data-list" id="legionTreeRoot" aria-live="polite" aria-busy="true"><div class="legion-tree-load-state">테스트 조직도를 불러오는 중…</div></section>
        <div class="legion-tree-viewer-fade" id="legionTreeViewerFade" data-visible="false" aria-hidden="true"></div>
      </div>
      <button class="legion-tree-viewer-nav is-next" id="legionTreeNextBtn" type="button" aria-controls="legionTreeRoot" aria-label="다음 레기온" disabled><strong class="legion-tree-viewer-nav-name" id="legionTreeNextName" aria-hidden="true">다음 레기온</strong><span class="legion-tree-viewer-nav-icon" aria-hidden="true">›</span></button>
      <p class="legion-tree-viewer-status" id="legionTreeViewerStatus" aria-live="polite"></p>
    </section>
  </main>
  <span id="legionTreeStatus" hidden></span>
  <script>
  (()=>{
    const member=(characterId,characterName,className='검성')=>({characterId,characterName,className,isMain:true,mainCharacterId:characterId,mainCharacterName:characterName,serverId:2002,serverName:'지켈'});
    const names=['깡','낮','밤','키나노동조합'];
    const legion=(legionName,index)=>({
      legionName,legionOrder:index+1,revision:4,treeState:'CONFIGURED',fallbackApplied:false,organizationConfigured:true,stageCount:3,memberCount:index?1:13,
      stages:[
        {stageNo:1,stageName:'군단장',roles:[{roleKey:`${legionName}-leader`,roleName:'군단장',slotNo:1,maxMembers:1,groups:[{groupKey:`${legionName}-leader-group`,groupName:'군단장',sortOrder:1,members:[member(1000+index,`${legionName}대표`)]}]}]},
        {stageNo:2,stageName:'엘리트장교',roles:index?[{roleKey:`${legionName}-officer`,roleName:'엘리트장교',slotNo:1,maxMembers:null,groups:[]}]:[
          {roleKey:'planning',roleName:'기획부',slotNo:1,maxMembers:null,groups:[]},
          {roleKey:'operation',roleName:'운영부',slotNo:2,maxMembers:null,groups:[]}
        ]},
        {stageNo:3,stageName:'군단병',roles:[{roleKey:`${legionName}-soldier`,roleName:'군단병',slotNo:1,maxMembers:null,groups:index?[{groupKey:`${legionName}-default`,groupName:'군단병',sortOrder:1,members:[]}]:[
          {groupKey:'planning-members',groupName:'기획부',parentRoleKey:'planning',sortOrder:1,members:Array.from({length:7},(_,i)=>member(1100+i,`기획원${i+1}`))},
          {groupKey:'operation-members',groupName:'운영부',parentRoleKey:'operation',sortOrder:2,members:[member(1201,'운영원1','치유성'),member(1202,'운영원2','궁성')]},
          {groupKey:'unassigned-members',groupName:'군단병',parentRoleKey:'',sortOrder:3,members:[member(1301,'무소속원')]},
          {groupKey:'independent-members',groupName:'소속 외',parentRoleKey:`${legionName}-soldier`,sortOrder:4,members:[member(1401,'독립원','호법성')]}
        ]}]}
      ],unassignedMembers:[]
    });
    const payload={ok:true,contract:'web-legion-tree-v1',databaseContract:'460',generatedAt:new Date().toISOString(),legions:names.map(legion)};
    window.KinojoSupabase={rpc:async name=>name==='kinojo_web_get_legion_tree'?payload:{ok:true,contract:'web-legion-tree-server-reference-v1',servers:[{serverId:1001,raceId:1,serverName:'시엘',shortName:'시엘'},{serverId:2002,raceId:2,serverName:'지켈',shortName:'지켈'}]}};
  })();
  </script>
  <script src="../legion-tree/js/legion-tree.js?cache=2026090109"></script>
</body>
</html>
