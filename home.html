<script>
  (() => {
    const banner = document.getElementById('kinojo-main-banner-image');
    const bannerLink = banner?.closest('.kinojo-main-banner') || document.querySelector('.kinojo-main-banner');
    const runtime = window.KinojoBannerRuntime;
    if (!banner || !bannerLink) return;

    const revealBanner = () => {
      bannerLink.classList.remove('is-manifest-pending');
      bannerLink.removeAttribute('aria-busy');
    };
    if (!runtime?.mountBanner) {
      revealBanner();
      return;
    }

    const fallback = {
      src: banner.getAttribute('src') || '',
      alt: banner.getAttribute('alt') || 'KINOJO INFO 깡 레기온 대표 배너',
      href: bannerLink.getAttribute('href'),
      ariaLabel: bannerLink.getAttribute('aria-label') || 'KINOJO INFO 대표 배너'
    };
    const restoreFallback = () => {
      banner.setAttribute('src', fallback.src);
      banner.setAttribute('alt', fallback.alt);
      if (fallback.href) bannerLink.setAttribute('href', fallback.href);
      else bannerLink.removeAttribute('href');
      bannerLink.setAttribute('aria-label', fallback.ariaLabel);
      revealBanner();
    };

    runtime.mountBanner({
      pageCode: 'HOME',
      slotCode: 'MAIN',
      fallbackAlt: 'KINOJO INFO 깡 레기온 대표 배너',
      ensureElements: () => ({ host: bannerLink, image: banner }),
      deactivate: restoreFallback,
      onActive: revealBanner,
      onError: (error) => {
        revealBanner();
        console.warn('[KINOJO BANNER] HOME:MAIN Manifest 재생 중 오류가 발생해 현재 배너를 유지합니다.', error);
      }
    });
  })();
</script>
