<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin member image review browser contract</title>
  <link href="../admin/css/admin.css?cache=2026082804" rel="stylesheet" />
</head>
<body>
  <header class="admin-shellbar">
    <div class="admin-shellbar-main"><button class="admin-shell-control" id="adminBackBtn" type="button">←</button><div class="admin-shell-title"><span>관리자 페이지</span><strong id="adminCurrentLocation">[회원 관리]</strong></div><div class="admin-shell-account"><strong id="adminRoleLabel">Master</strong><button class="admin-shell-logout" id="adminLogoutBtn" type="button">로그아웃</button></div><button class="admin-shell-control close" id="adminCloseBtn" type="button">×</button></div>
    <nav class="admin-nav"><button class="active" data-admin-tab="members" type="button">👥 회원 관리 <span class="badge" id="adminMemberImageBadge" data-admin-master-only>0</span></button></nav>
    <div class="admin-top-subnav" id="adminTopSubnav"></div>
  </header>
  <main class="kinojo-admin-console"><section class="admin-main">
    <nav class="admin-mobile-launcher"></nav>
    <section class="admin-pane active" data-admin-pane="members">
      <nav class="admin-subnav" data-admin-subnav="members"><button data-admin-subtab="accounts" type="button">회원 목록</button><button class="active" data-admin-subtab="character-images" data-admin-master-only type="button">참고 이미지 요청 <span class="badge" id="adminMemberImageSubBadge">0</span></button></nav>
      <div class="admin-subpane" data-admin-subpane="accounts"></div>
      <div class="admin-subpane active" data-admin-subpane="character-images" data-admin-master-only><section class="admin-card admin-member-image-review-card"><div class="admin-card-head"><div><h2>참고 이미지 제작 요청 확인</h2><p>확인 완료 전인 참고 이미지 제작 요청만 알림 대상으로 표시합니다.</p></div><button class="admin-btn" id="memberImageReviewReloadBtn" type="button">새로고침</button></div><div class="admin-form-row admin-member-image-review-tools"><input class="admin-input grow" id="memberImageReviewSearch" placeholder="회원 또는 캐릭터명 검색"/><select class="admin-select" id="memberImageReviewStatus"><option value="PENDING">확인 필요</option><option value="ACKNOWLEDGED">확인 완료</option><option value="ALL">전체</option></select></div><div class="admin-member-image-review-summary" id="memberImageReviewSummary"><span>확인 필요 <strong>0</strong>건</span><span>확인 완료 <strong>0</strong>건</span><span>전체 요청 <strong>0</strong>건</span></div><div id="memberImageReviewStatusLine" class="admin-statusline"></div><div class="admin-member-image-review-list" id="memberImageReviewList"><div class="admin-empty">불러오는 중</div></div></section></div>
    </section>
  </section></main>
  <script>
    location.hash='#members/character-images';
    window.KinojoAuth={getSession:()=>({role:'MASTER',roleLabel:'Master',level:5,token:'kws_'+('a'.repeat(40))}),clearSession(){}};
    window.KinojoToast={show(){}};
    window.__requestAcknowledged=false;
    window.KinojoApi={async getAction(name){if(name==='notificationSummary')return{ok:true,codeRequestCount:0,supportRequestCount:0,memberImageRequestPendingCount:window.__requestAcknowledged?0:1};return{ok:true};}};
    window.KinojoSupabase={adminAccount:async()=>({ok:true,accounts:[]})};
    const mockRequest={itemType:'REFERENCE_IMAGE_REQUEST',memberId:9,mainCharacterName:'푸석사과',role:'SUB_MASTER',roleLabel:'Sub Master',level:4,isActive:true,characterId:127,characterName:'푸석사과',serverName:'시엘',className:'궁성',requestId:501,styleCode:'ANIMATION',submittedAt:'2026-08-26T02:10:00Z',activityAt:'2026-08-26T02:10:00Z',slots:['FRONT','BACK'],itemCount:2,availableImageCount:2};
    window.KinojoSupabaseClientCore={
      async invokeEdgeFunction(_name,payload){
        if(payload.action==='admin-image-work-queue-list'){
          const pending=!window.__requestAcknowledged;
          const request=Object.assign({},mockRequest,{pending,acknowledged:!pending,acknowledgedAt:pending?null:'2026-08-26T03:00:00Z'});
          const items=[];
          if(payload.filter==='ALL'||(payload.filter==='PENDING'&&pending)||(payload.filter==='ACKNOWLEDGED'&&!pending))items.push(request);
          return{ok:true,privacy:'NO_PRIVATE_OBJECT_PATHS_OR_SIGNED_URLS',filter:payload.filter,pendingRequestCount:pending?1:0,actionRequiredCount:pending?1:0,totalRequestCount:1,items};
        }
        if(payload.action==='admin-image-list')return{ok:true,privacy:'NO_PRIVATE_OBJECT_PATHS_OR_SIGNED_URLS',targetMember:{id:payload.memberId},ownerResolved:true,profileOverrideCount:0,referenceCount:3,characters:[{characterId:127,characterName:'푸석사과',serverName:'시엘',className:'궁성',isMain:true,profile:{hasOverride:false},references:[{slot:'FRONT',mimeType:'image/webp',sizeBytes:120000,uploadedAt:'2026-08-22T05:47:45Z',expiresAt:'2026-08-29T05:47:45Z',active:true}]}]};
        if(payload.action==='admin-image-request-list')return{ok:true,privacy:'NO_PRIVATE_OBJECT_PATHS_OR_SIGNED_URLS',targetMemberId:payload.memberId,characterId:payload.characterId,requests:[{requestId:501,styleCode:'ANIMATION',requestNote:'푸른 조명과 밝은 표정',pending:!window.__requestAcknowledged,acknowledged:window.__requestAcknowledged,acknowledgedAt:window.__requestAcknowledged?'2026-08-26T03:00:00Z':null,submittedAt:'2026-08-26T02:10:00Z',imageExpiresAt:'2026-09-02T02:10:00Z',slots:['FRONT','BACK'],itemCount:2,availableImageCount:2,imageAvailable:true}]};
        if(payload.action==='admin-image-request-detail')return{ok:true,privacy:'NO_PRIVATE_OBJECT_PATHS_OR_SIGNED_URLS',targetMemberId:payload.memberId,characterId:payload.characterId,requestId:payload.requestId,styleCode:'ANIMATION',requestNote:'푸른 조명과 밝은 표정',pending:!window.__requestAcknowledged,acknowledged:window.__requestAcknowledged,acknowledgedAt:window.__requestAcknowledged?'2026-08-26T03:00:00Z':null,submittedAt:'2026-08-26T02:10:00Z',imageExpiresAt:'2026-09-02T02:10:00Z',items:[{slot:'FRONT',mimeType:'image/webp',sizeBytes:123456,available:true},{slot:'BACK',mimeType:'image/webp',sizeBytes:142222,available:true}]};
        if(payload.action==='admin-image-request-ack'){window.__requestAcknowledged=true;return{ok:true,targetMemberId:payload.memberId,characterId:payload.characterId,requestId:payload.requestId,acknowledged:true,pending:false,acknowledgedAt:'2026-08-26T03:00:00Z'};}
        return{ok:false,code:'UNEXPECTED_ACTION'};
      },
      async ensureConfig(){return{url:'https://example.supabase.co'};}
    };
  </script>
  <script src="../admin/js/admin-shared.js?cache=2026082804"></script>
  <script src="../admin/js/admin-members.js?cache=2026082804"></script>
  <script src="../admin/js/admin-bootstrap.js?cache=2026082804"></script>
</body>
</html>
