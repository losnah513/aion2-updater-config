name: Verify Character Refresh Profile

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/index.html'
      - 'm/admin/index.html'
      - 'admin/css/admin.css'
      - 'admin/js/admin.js'
      - 'admin/js/admin-members.js'
      - 'admin/js/admin-member-image-download.js'
      - 'admin/js/admin-characters.js'
      - '.github/workflows/verify-character-refresh-profile.yml'
  push:
    branches: [main]
    paths:
      - 'admin/index.html'
      - 'm/admin/index.html'
      - 'admin/css/admin.css'
      - 'admin/js/admin.js'
      - 'admin/js/admin-members.js'
      - 'admin/js/admin-member-image-download.js'
      - 'admin/js/admin-characters.js'
      - '.github/workflows/verify-character-refresh-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify profile source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check admin/js/admin.js
          node --check admin/js/admin-members.js
          node --check admin/js/admin-member-image-download.js
          node --check admin/js/admin-characters.js
          python3 <<'PY'
          from pathlib import Path
          pages = [Path('admin/index.html'), Path('m/admin/index.html')]
          ids = [
              'characterLookupPerformancePanel',
              'characterLookupPerformanceState',
              'characterLookupPerformanceTotal',
              'characterLookupPerformanceBottleneck',
              'characterLookupPerformanceOfficial',
              'characterLookupPerformanceCache',
              'characterLookupPerformanceRetry',
              'characterLookupPerformanceSheet',
              'characterLookupPerformanceIntegrity',
              'characterLookupPerformanceStages',
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for item_id in ids:
                  count = text.count(f'id="{item_id}"')
                  if count != 1:
                      raise SystemExit(f'{page}: {item_id} count={count}')
              if 'admin.js?cache=2026082202' not in text:
                  raise SystemExit(f'{page}: stale admin cache')
          source = Path('admin/js/admin-characters.js').read_text(encoding='utf-8')
          for token in [
              "'22:00 · 04:00 · 10:00 · 16:00'",
              'performanceProfile:data?.performanceProfile||{}',
              'function renderLookupPerformance(profile)',
              'runtime_events_inferred',
              'characterLookupPerformanceIntegrity',
              '기존 Server Runtime Event 재사용 · 추가 처리량 0',
          ]:
              if token not in source:
                  raise SystemExit(f'profile contract missing {token}')
          members = Path('admin/js/admin-members.js').read_text(encoding='utf-8')
          for token in [
              'function memberImageSessionToken_()',
              'function renderMemberImageGroups_(data,selectedCharacterId',
              'function showAdminImagePreview_(button)',
              "action:'admin-image-preview'",
              'SIGNED_PREVIEW_URL_ONLY_NO_OBJECT_PATH',
              'INLINE_PREVIEW_ONLY',
              'data-admin-image-preview',
              '다운로드 기능은 7-F에서 별도로 처리합니다.',
              'function loadMemberImageGroups_(memberId,requestId)',
              "action:'admin-image-list'",
              'NO_PRIVATE_OBJECT_PATHS_OR_SIGNED_URLS',
              '등록된 사용자 프로필 이미지 없음',
              '등록된 참고 이미지 없음',
              'function ensureMemberImageModal()',
              'function openMemberImageModal(target)',
              'data-member-image-modal-close',
              'data-member-image-view',
              'data-admin-image-character-select',
              'data-admin-member-image-detail',
              'function selectMemberImageCharacter_(characterId)',
              '캐릭터 이미지 상태를 불러오는 중입니다.',
          ]:
              if token not in members:
                  raise SystemExit(f'admin member image modal shell missing {token}')
          for forbidden in ['objectPath','signedUrl','signedURL','uploadUrl']:
              if forbidden in members:
                  raise SystemExit(f'admin member image client leaked private storage field {forbidden}')
          admin_css = Path('admin/css/admin.css').read_text(encoding='utf-8')
          for token in [
              '#adminMemberImageModal .admin-event-preview-panel',
              '#adminMemberImageModal .admin-event-preview-head',
              '#adminMemberImageModal .admin-event-preview-body',
              '.admin-member-image-character-selector',
              'body.admin-member-image-modal-open{overflow:hidden}',
          ]:
              if token not in admin_css:
                  raise SystemExit(f'admin member image modal CSS missing {token}')
          download = Path('admin/js/admin-member-image-download.js').read_text(encoding='utf-8')
          for token in [
              'kinojo-member-image-download',
              "action:'admin-image-download'",
              'SIGNED_DOWNLOAD_URL_ONLY_NO_OBJECT_PATH',
              'EXPLICIT_DOWNLOAD_ONLY',
              'data-admin-image-download',
              "button.textContent='다운로드'",
              "url.searchParams.get('download')!==filename",
          ]:
              if token not in download:
                  raise SystemExit(f'admin member image download contract missing {token}')
          for forbidden in ['objectPath','passKey','passCode']:
              if forbidden in download:
                  raise SystemExit(f'admin member image download leaked forbidden field {forbidden}')
          loader = Path('admin/js/admin.js').read_text(encoding='utf-8')
          if 'v2026082202' not in loader or "name+'?cache=2026082202'" not in loader or "'admin-member-image-download.js'" not in loader:
              raise SystemExit('admin loader/download module contract missing')
          print('Character refresh profile source contracts: PASS')
          PY

  verify-live-readback:
    if: github.event_name == 'push'
    needs: verify-source
    runs-on: ubuntu-latest
    env:
      LIVE_BASE: https://kinojo.info
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed profile files
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          files=(admin/index.html m/admin/index.html admin/css/admin.css admin/js/admin.js admin/js/admin-members.js admin/js/admin-member-image-download.js admin/js/admin-characters.js)
          verify_key="${GITHUB_SHA:0:12}-$(date -u +%s)"
          for attempt in $(seq 1 15); do
            mismatch=0
            for path in "${files[@]}"; do
              live="$tmp_dir/$(echo "$path" | tr '/' '_')"
              if ! curl --fail --silent --show-error --location --compressed --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$LIVE_BASE/$path?verify=$verify_key-$attempt" -o "$live"; then
                mismatch=1
                continue
              fi
              cmp -s "$path" "$live" || mismatch=1
            done
            if [[ "$mismatch" -eq 0 ]]; then
              echo 'Character refresh profile live readback: PASS'
              exit 0
            fi
            [[ "$attempt" -lt 15 ]] && sleep 20
          done
          echo 'Character refresh profile live readback did not converge.' >&2
          exit 1
