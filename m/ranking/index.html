<main class="ranking-wrap">

    <div><p class="ranking-kicker">KINOJO LEGION RANKING</p><h1>레기온 전체 순위</h1><p>화면 너비에 맞춰 PVE / PVP 순위를 확인합니다.</p></div>
    <a class="kinojo-btn ranking-hof-link" href="../../m/hof/">명예의 전당</a>
  </section>
  <section class="ranking-mobile-mode-tabs" aria-label="전투력 기준 선택">
    <button class="is-active" data-mobile-mode="PVE" type="button">PVE</button>
    <button data-mobile-mode="PVP" type="button">PVP</button>
  </section>
  <section class="ranking-toolbar" aria-label="순위 검색 및 필터">
    <div class="ranking-mobile-filter-head"><span>검색 · 필터</span><button class="kinojo-btn secondary" id="rankingFilterToggleBtn" type="button" aria-expanded="false">필터</button></div>

    <div class="ranking-filter-box"><span class="ranking-filter-title">직업</span><div class="ranking-class-tabs" id="rankingClassTabs"></div></div>
    <div class="ranking-action-box"><label class="ranking-toggle"><input id="rankingIncludeSubs" type="checkbox"/> <span>부캐 포함</span></label><button class="kinojo-btn" id="rankingSearchBtn" type="button">조회</button><button class="kinojo-btn secondary" id="rankingResetBtn" type="button">초기화</button></div>
  </section>
  <section class="ranking-status" id="rankingStatus">데이터 준비 중...</section>
  <section class="ranking-board" id="rankingBoard" aria-live="polite"><div class="ranking-loading"><span class="kinojo-spinner"><span></span></span><span>레기온 전체 순위를 불러오는 중...</span></div></section>
  <section class="ranking-load-more" id="rankingLoadMore" aria-label="순위 더보기" hidden><button class="kinojo-btn secondary" id="rankingLoadMoreBtn" type="button">20명 더보기</button><span id="rankingLoadMoreInfo" aria-live="polite"></span></section>
