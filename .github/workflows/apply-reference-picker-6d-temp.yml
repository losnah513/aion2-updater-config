name: Apply Reference Picker 6-D Temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-reference-picker-6d-temp.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Patch reference picker only
        env:
          EXPECTED_PARENT: 8f9755d55ec3c2cf4ef10144bef23dd26a0d3e9c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 <<'PY'
          from pathlib import Path
          p=Path('ui/kinojo-common-ui.js')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {s.count(old)}')
              s=s.replace(old,new,1)

          once(
          "  const kinojoMyProfileUiState={token:'',selectedCharacterId:0,bootstrapByCharacter:Object.create(null),requestId:0,file:null,previewUrl:'',uploading:false};\n",
          "  const kinojoMyProfileUiState={token:'',selectedCharacterId:0,bootstrapByCharacter:Object.create(null),requestId:0,file:null,previewUrl:'',uploading:false};\n"
          "  const KINOJO_REFERENCE_IMAGE_SLOTS=['FRONT','BACK','UPPER_BODY'];\n"
          "  const kinojoMyReferencePickerState={characterId:0,activeSlot:'',filesBySlot:Object.create(null)};\n"
          "  function setMyInfoReferenceStatus_(message,state='info'){\n"
          "    const host=q('#kinojoMyInfoReferenceStatus');\n"
          "    if(!host)return;\n"
          "    host.dataset.state=state;\n"
          "    host.textContent=message||'';\n"
          "  }\n"
          "  function renderMyInfoReferencePicker_(){\n"
          "    const characterId=Number(kinojoMyProfileUiState.selectedCharacterId||0);\n"
          "    const ready=Number.isInteger(characterId)&&characterId>0&&!!myInfoSessionToken_()&&kinojoMyReferencePickerState.characterId===characterId;\n"
          "    const section=q('#kinojoMyInfoReferenceSection');\n"
          "    const head=q('#kinojoMyInfoReferenceHeadMeta');\n"
          "    if(section)section.setAttribute('aria-disabled',ready?'false':'true');\n"
          "    if(head)head.textContent=ready?'슬롯을 눌러 이미지 선택':'캐릭터 선택 후 슬롯 선택';\n"
          "    document.querySelectorAll('#kinojoMyInfoReferenceGrid [data-reference-slot]').forEach(button=>{\n"
          "      const slot=String(button.dataset.referenceSlot||'');\n"
          "      const file=kinojoMyReferencePickerState.filesBySlot[slot]||null;\n"
          "      button.disabled=!ready;\n"
          "      button.classList.toggle('is-selected',!!file);\n"
          "      button.setAttribute('aria-pressed',file?'true':'false');\n"
          "      button.title=file?String(file.name||slot+' 이미지 선택됨'):slot+' 이미지 선택';\n"
          "      const status=button.querySelector('[data-reference-file-status]');\n"
          "      if(status)status.textContent=file?'파일 선택됨':'이미지 선택';\n"
          "    });\n"
          "  }\n"
          "  function resetMyInfoReferencePicker_(characterId=0){\n"
          "    const id=Number(characterId||0);\n"
          "    kinojoMyReferencePickerState.characterId=Number.isInteger(id)&&id>0?id:0;\n"
          "    kinojoMyReferencePickerState.activeSlot='';\n"
          "    kinojoMyReferencePickerState.filesBySlot=Object.create(null);\n"
          "    const input=q('#kinojoMyInfoReferenceFileInput');\n"
          "    if(input)input.value='';\n"
          "    renderMyInfoReferencePicker_();\n"
          "    if(kinojoMyReferencePickerState.characterId>0){\n"
          "      const row=myInfoProfileCharacters_().find(item=>Number(item?.characterId||0)===kinojoMyReferencePickerState.characterId);\n"
          "      setMyInfoReferenceStatus_((row?.characterName?String(row.characterName)+' · ':'')+'FRONT / BACK / UPPER_BODY 슬롯을 눌러 이미지를 선택해 주세요.','ready');\n"
          "    }else setMyInfoReferenceStatus_('캐릭터를 선택하면 슬롯별 이미지를 고를 수 있습니다.','info');\n"
          "  }\n"
          "  function syncMyInfoReferenceCharacter_(characterId){\n"
          "    const id=Number(characterId||0);\n"
          "    if(!Number.isInteger(id)||id<=0){resetMyInfoReferencePicker_(0);return;}\n"
          "    if(kinojoMyReferencePickerState.characterId!==id){resetMyInfoReferencePicker_(id);return;}\n"
          "    renderMyInfoReferencePicker_();\n"
          "  }\n"
          "  function selectMyInfoReferenceSlot_(slot){\n"
          "    const key=String(slot||'').trim();\n"
          "    const characterId=Number(kinojoMyProfileUiState.selectedCharacterId||0);\n"
          "    if(!KINOJO_REFERENCE_IMAGE_SLOTS.includes(key)||!Number.isInteger(characterId)||characterId<=0||kinojoMyReferencePickerState.characterId!==characterId)return false;\n"
          "    const input=q('#kinojoMyInfoReferenceFileInput');\n"
          "    if(!input)return false;\n"
          "    kinojoMyReferencePickerState.activeSlot=key;\n"
          "    input.value='';\n"
          "    setMyInfoReferenceStatus_(key+' 슬롯에 넣을 이미지 파일을 선택해 주세요.','info');\n"
          "    input.click();\n"
          "    return true;\n"
          "  }\n"
          "  function handleMyInfoReferenceFile_(file){\n"
          "    const slot=String(kinojoMyReferencePickerState.activeSlot||'');\n"
          "    const characterId=Number(kinojoMyProfileUiState.selectedCharacterId||0);\n"
          "    if(!KINOJO_REFERENCE_IMAGE_SLOTS.includes(slot)||kinojoMyReferencePickerState.characterId!==characterId)return false;\n"
          "    if(!file){\n"
          "      setMyInfoReferenceStatus_(slot+' 이미지 선택을 취소했습니다.','info');\n"
          "      return false;\n"
          "    }\n"
          "    kinojoMyReferencePickerState.filesBySlot[slot]=file;\n"
          "    renderMyInfoReferencePicker_();\n"
          "    const name=String(file.name||'선택한 파일').slice(0,80);\n"
          "    setMyInfoReferenceStatus_(slot+' · '+name+' 파일을 선택했습니다. 파일 검증과 미리보기는 다음 단계에서 적용됩니다.','ready');\n"
          "    return true;\n"
          "  }\n",
          'insert reference picker state')

          once(
          "    renderMyInfoProfileCurrent_(null);\n  }\n  function myInfoProfileCharacters_(){",
          "    renderMyInfoProfileCurrent_(null);\n    resetMyInfoReferencePicker_(0);\n  }\n  function myInfoProfileCharacters_(){",
          'reset reference picker with profile ui')

          once(
          "      renderMyInfoProfileCurrent_(null);\n      setMyInfoProfileStatus_('연결된 캐릭터가 없습니다.','error');\n      return null;",
          "      renderMyInfoProfileCurrent_(null);\n      resetMyInfoReferencePicker_(0);\n      setMyInfoProfileStatus_('연결된 캐릭터가 없습니다.','error');\n      return null;",
          'empty character reference reset')

          once(
          "    kinojoMyProfileUiState.selectedCharacterId=Number(selected.characterId);\n    renderMyInfoProfileCharacterButtons_();",
          "    kinojoMyProfileUiState.selectedCharacterId=Number(selected.characterId);\n    syncMyInfoReferenceCharacter_(selected.characterId);\n    renderMyInfoProfileCharacterButtons_();",
          'prepare reference selected character')

          once(
          "    kinojoMyProfileUiState.selectedCharacterId=id;\n    clearMyInfoProfilePreview_();\n    renderMyInfoProfileCharacterButtons_();",
          "    kinojoMyProfileUiState.selectedCharacterId=id;\n    clearMyInfoProfilePreview_();\n    syncMyInfoReferenceCharacter_(id);\n    renderMyInfoProfileCharacterButtons_();",
          'switch reference character')

          old_section='''          <section class="kinojo-my-info-reference-preview" aria-disabled="true">\n            <div class="kinojo-my-info-manager-section-head">\n              <div><strong>참고 이미지</strong><span>관리자 확인용 비공개 자료</span></div>\n              <small>Stage 6에서 활성화</small>\n            </div>\n            <div class="kinojo-my-info-reference-preview-grid">\n              <article><b>FRONT</b><span>정면</span><small>준비 중</small></article>\n              <article><b>BACK</b><span>후면</span><small>준비 중</small></article>\n              <article><b>UPPER_BODY</b><span>얼굴이 잘 보이는 상반신</span><small>준비 중</small></article>\n            </div>\n          </section>'''
          new_section='''          <section class="kinojo-my-info-reference-preview" id="kinojoMyInfoReferenceSection" aria-disabled="true">\n            <div class="kinojo-my-info-manager-section-head">\n              <div><strong>참고 이미지</strong><span>관리자 확인용 비공개 자료</span></div>\n              <small id="kinojoMyInfoReferenceHeadMeta">캐릭터 선택 후 슬롯 선택</small>\n            </div>\n            <input id="kinojoMyInfoReferenceFileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>\n            <div class="kinojo-my-info-reference-preview-grid" id="kinojoMyInfoReferenceGrid">\n              <button class="kinojo-my-info-reference-slot" type="button" data-reference-slot="FRONT" aria-pressed="false" disabled><b>FRONT</b><span>정면</span><small data-reference-file-status>이미지 선택</small></button>\n              <button class="kinojo-my-info-reference-slot" type="button" data-reference-slot="BACK" aria-pressed="false" disabled><b>BACK</b><span>후면</span><small data-reference-file-status>이미지 선택</small></button>\n              <button class="kinojo-my-info-reference-slot" type="button" data-reference-slot="UPPER_BODY" aria-pressed="false" disabled><b>UPPER_BODY</b><span>얼굴이 잘 보이는 상반신</span><small data-reference-file-status>이미지 선택</small></button>\n            </div>\n            <div class="kinojo-my-info-reference-status" id="kinojoMyInfoReferenceStatus" data-state="info" aria-live="polite">캐릭터를 선택하면 슬롯별 이미지를 고를 수 있습니다.</div>\n          </section>'''
          once(old_section,new_section,'reference modal section')

          once(
          "    clearMyInfoProfilePreview_();\n    document.body.classList.remove('kinojo-my-info-modal-open');",
          "    clearMyInfoProfilePreview_();\n    resetMyInfoReferencePicker_(kinojoMyProfileUiState.selectedCharacterId);\n    document.body.classList.remove('kinojo-my-info-modal-open');",
          'clear reference picker on close')

          once(
          "      const characterButton=e.target.closest('[data-profile-character-id]');\n      if(characterButton){e.preventDefault();e.stopPropagation();selectMyInfoProfileCharacter_(characterButton.dataset.profileCharacterId);return;}\n      if(e.target.closest('#kinojoMyInfoProfileSelectBtn'))",
          "      const characterButton=e.target.closest('[data-profile-character-id]');\n      if(characterButton){e.preventDefault();e.stopPropagation();selectMyInfoProfileCharacter_(characterButton.dataset.profileCharacterId);return;}\n      const referenceSlot=e.target.closest('[data-reference-slot]');\n      if(referenceSlot){e.preventDefault();e.stopPropagation();selectMyInfoReferenceSlot_(referenceSlot.dataset.referenceSlot);return;}\n      if(e.target.closest('#kinojoMyInfoProfileSelectBtn'))",
          'bind reference slot click')

          once(
          "    q('#kinojoMyInfoProfileFileInput')?.addEventListener('change',e=>{handleMyInfoProfileFile_(e.target?.files?.[0]||null);});\n",
          "    q('#kinojoMyInfoProfileFileInput')?.addEventListener('change',e=>{handleMyInfoProfileFile_(e.target?.files?.[0]||null);});\n    q('#kinojoMyInfoReferenceFileInput')?.addEventListener('change',e=>{handleMyInfoReferenceFile_(e.target?.files?.[0]||null);});\n",
          'bind reference file input')

          p.write_text(s,encoding='utf-8')
          PY
          node --check ui/kinojo-common-ui.js
          python3 <<'PY'
          from pathlib import Path
          s=Path('ui/kinojo-common-ui.js').read_text(encoding='utf-8')
          required=[
            'const KINOJO_REFERENCE_IMAGE_SLOTS',
            'kinojoMyInfoReferenceFileInput',
            'data-reference-slot="FRONT"',
            'data-reference-slot="BACK"',
            'data-reference-slot="UPPER_BODY"',
            'handleMyInfoReferenceFile_',
            'selectMyInfoReferenceSlot_'
          ]
          for item in required:
              assert item in s,item
          start=s.index('function handleMyInfoReferenceFile_')
          end=s.index('function myInfoProfileFileSize_', start)
          block=s[start:end]
          assert 'invokeEdgeFunction' not in block
          assert 'URL.createObjectURL' not in block
          assert 'file.size' not in block
          assert 'file.type' not in block
          assert 'reference-upload-prepare' not in s
          assert 'reference-upload-complete' not in s
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/kinojo-common-ui.js
          git diff --cached --check
          git commit -m "Add reference image slot picker"
          git push origin HEAD:main
