            "m/pages/terms.html"
            "desktop/index.html"
            "desktop/arcana/index.html"
            "desktop/hall-of-fame/index.html"
            "desktop/sanctuary/index.html"
            "desktop/pages/about.html"
            "desktop/pages/contact.html"
            "desktop/pages/privacy.html"
            "desktop/pages/terms.html"
            "ui/kinojo-components.css"
            "ui/kinojo-common-ui.css"
            "ui/kinojo-common-ui.js"
            "ui/kinojo-sanctuary-navigation.css"
            "ui/kinojo-my-info.css"
            "ui/kinojo-my-info-image-contract.js"
            "ui/kinojo-my-info-image-editor.js"
            "ui/kinojo-my-info-image-upload.js"
            "ui/kinojo-my-info-image-request.js"
            "ui/kinojo-my-info-batch-bootstrap.js"
            "ui/kinojo-my-info-image-preloader.js"
            "ui/kinojo-range-control.js"
            "ui/kinojo-public-shell.css"
            "ui/kinojo-staged-loading.css"
            "ui/kinojo-staged-loading.js"
            "ui/kinojo-event-notice.css"
            "ui/kinojo-event-notice.js"
            "ui/kinojo-character-reaction.js"
            "ui/kinojo-character-reaction.css"
            "ui/kinojo-character-detail-refresh.js"
            "ui/kinojo-character-detail-refresh.css"
            "ui/kinojo-character-skill-bridge.js"
            "ui/kinojo-character-skill.css"
            "ui/kinojo-character-daevanion-bridge.js"
            "ui/kinojo-character-daevanion.css"
            "ui/kinojo-animations.css"
            "core/kinojo-supabase-client.js"
            "core/kinojo-supabase-rpc.js"
            "core/kinojo-supabase-features.js"
            "core/kinojo-supabase.js"
            "core/kinojo-auth-session.js"
            "core/kinojo-auth-service.js"
            "core/kinojo-auth-ui.js"
          )

          echo "Expected source: $expected_ref"
          echo "Live domain: $LIVE_BASE"

          http_code="$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "$LIVE_BASE/?verify=$verify_key")"
          if [[ "$http_code" != "200" ]]; then
            echo "Custom domain returned HTTP $http_code" >&2
            exit 1
          fi

          for attempt in $(seq 1 15); do
            mismatch=0
            : > "$tmp_dir/result.txt"

            for path in "${files[@]}"; do
              live_file="$tmp_dir/$(echo "$path" | tr '/' '_')"
              url="$LIVE_BASE/$path?verify=$verify_key-$attempt"

              if ! curl --fail --silent --show-error --location --compressed \
                --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' "$url" -o "$live_file"; then
                echo "FETCH_FAIL $path" >> "$tmp_dir/result.txt"
                mismatch=1
                continue
              fi

              if cmp -s "$path" "$live_file"; then
                echo "MATCH $path" >> "$tmp_dir/result.txt"
              else
                echo "MISMATCH $path" >> "$tmp_dir/result.txt"
                mismatch=1
              fi
            done

            cat "$tmp_dir/result.txt"

            if [[ "$mismatch" -eq 0 ]]; then
              {
                echo "## KINOJO Pages live readback"
                echo
                echo "- Domain: \`$LIVE_BASE\`"
                echo "- Expected source: \`$expected_ref\`"
                echo "- Verified files: \`${#files[@]}\`"
                echo "- Result: all live files match the repository source"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [[ "$attempt" -lt 15 ]]; then
              echo "Live files are not synchronized yet. Retrying..."
              sleep 20
            fi
          done

          echo "Live readback did not converge to repository source." >&2
          while read -r state path; do
            [[ "$state" == "MISMATCH" ]] || continue
            live_file="$tmp_dir/$(echo "$path" | tr '/' '_')"
            echo "--- $path" >&2
            echo "source sha256: $(sha256sum "$path" | awk '{print $1}')" >&2
            echo "live   sha256: $(sha256sum "$live_file" | awk '{print $1}')" >&2
            diff -u "$path" "$live_file" | head -120 >&2 || true
          done < "$tmp_dir/result.txt"
          exit 1

      - name: Publish live readback success status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: success
          STATUS_DESCRIPTION: KINOJO 운영 파일이 main과 일치
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/kinojo-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "context": "kinojo/live-readback",
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/kinojo-status.json >/dev/null

      - name: Publish live readback failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: failure
          STATUS_DESCRIPTION: KINOJO 운영 파일 readback 실패
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/kinojo-status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "context": "kinojo/live-readback",
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, ensure_ascii=False))
          PY
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/kinojo-status.json >/dev/null
