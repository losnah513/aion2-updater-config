name: Apply verified HOF card files

on:
  push:
    branches:
      - fix/hof-power-card-official-icons-20260802
    paths:
      - .github/workflows/apply-hof-card-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hof-power-card-official-icons-20260802
          fetch-depth: 0
      - name: Apply verified HOF card changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old,new,1)

          js_path=Path('hof/js/hall-render.js')
          js=js_path.read_text(encoding='utf-8')
          start=js.index('function hofClassBadge(item){')
          end=js.index('function hofWidePanel(title,note,list,metric){')
          js_block=base64.b64decode('').decode('utf-8')
          js=js[:start]+js_block+js[end:]
          js_path.write_text(js,encoding='utf-8')

          css_path=Path('hof/css/hall.css')
          css=css_path.read_text(encoding='utf-8')
          start_marker='.hof-v2-top3-info{display:grid!important;align-content:center!important;justify-items:start!important;gap:2px!important;min-width:0!important;line-height:1.1!important;}'
          start=css.index(start_marker)
          end=css.index('.hof-v2-empty-dot{',start)
          css_block=base64.b64decode('').decode('utf-8')
          css=css[:start]+css_block+css[end:]

          old_mobile='''  .is-compact-rank .hof-v2-top3-name{font-size:14px!important;}
          .hof-v2-badge-line{display:none!important;}
          .hof-v2-top3-score{font-size:14px!important;max-width:82px!important;}'''
          new_mobile='''  .is-compact-rank .hof-v2-top3-name{font-size:14px!important;}
          .hof-v2-server-badge{height:15px!important;padding:0 5px!important;font-size:8px!important;}
          .hof-v2-class-icon{width:15px!important;height:15px!important;min-width:15px!important;flex-basis:15px!important;}
          .hof-v2-top3-aside{grid-template-rows:15px minmax(0,1fr)!important;}
          .hof-v2-owner-slot{min-height:15px!important;}
          .hof-v2-owner-slot .hof-v2-owner-badge{height:14px!important;padding:0 4px!important;font-size:7.5px!important;}
          .hof-v2-badge-line{display:none!important;}
          .hof-v2-top3-score{font-size:14px!important;max-width:82px!important;}
          .hof-v2-top3-score.is-power{gap:3px!important;}
          .hof-v2-power-icon{width:16px!important;height:16px!important;min-width:16px!important;flex-basis:16px!important;}'''
          css=replace_once(css,old_mobile,new_mobile,'mobile power card rules')

          old_narrow='''  .hof-v2-top3-score{font-size:12px!important;max-width:68px!important;}
          .hof-v2-top3-meta{font-size:10px!important;}'''
          new_narrow='''  .hof-v2-top3-score{font-size:12px!important;max-width:68px!important;}
          .hof-v2-power-icon{width:14px!important;height:14px!important;min-width:14px!important;flex-basis:14px!important;}
          .hof-v2-top3-meta{font-size:10px!important;}'''
          css=replace_once(css,old_narrow,new_narrow,'narrow power icon rules')

          old_desktop='''  .hof-v2-wide .hof-v2-top3-meta{
            font-size:10px!important;
            line-height:1.05!important;
          }
          .hof-v2-badge-line{'''
          new_desktop='''  .hof-v2-wide .hof-v2-top3-meta{
            font-size:10px!important;
            line-height:1.05!important;
          }
          .hof-v2-wide .hof-v2-server-badge{
            height:15px!important;
            padding:0 5px!important;
            font-size:8.5px!important;
          }
          .hof-v2-wide .hof-v2-class-icon{
            width:16px!important;
            height:16px!important;
            min-width:16px!important;
            flex-basis:16px!important;
          }
          .hof-v2-wide .hof-v2-top3-aside{
            grid-template-rows:16px minmax(0,1fr)!important;
          }
          .hof-v2-wide .hof-v2-owner-slot{
            min-height:16px!important;
          }
          .hof-v2-wide .hof-v2-power-icon{
            width:18px!important;
            height:18px!important;
            min-width:18px!important;
            flex-basis:18px!important;
          }
          .hof-v2-badge-line{'''
          css=replace_once(css,old_desktop,new_desktop,'desktop power card rules')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace mismatch')
          if '..hof-v2-top3-item' in css:
              raise SystemExit('invalid double-dot selector')
          css_path.write_text(css,encoding='utf-8')

          pc=Path('hof/index.html')
          pc_text=pc.read_text(encoding='utf-8')
          pc_text=replace_once(pc_text,'./css/hall.css?cache=2026080101','./css/hall.css?cache=2026080202','pc hall css cache')
          pc_text=replace_once(pc_text,'./js/hall-render.js?cache=2026073101','./js/hall-render.js?cache=2026080202','pc hall renderer cache')
          pc.write_text(pc_text,encoding='utf-8')

          mobile=Path('m/hof/index.html')
          mobile_text=mobile.read_text(encoding='utf-8')
          mobile_text=replace_once(mobile_text,'../../hof/css/hall.css?cache=2026080101','../../hof/css/hall.css?cache=2026080202','mobile hall css cache')
          mobile_text=replace_once(mobile_text,'../../hof/js/hall-render.js?cache=2026072806','../../hof/js/hall-render.js?cache=2026080202','mobile hall renderer cache')
          mobile.write_text(mobile_text,encoding='utf-8')

          expected={'hof/js/hall-render.js': 'fedd61a4cc41d080222fe7c8652d1e26fade58b972cb66fe7e217742d576bf77', 'hof/css/hall.css': '835c2f3bb5053de52396eb84cea2331e3dde9ee947f9ca271f4f7d85fe0a7458', 'hof/index.html': 'd2e6e4b1f9ecb3a0cb604e122f5d9cf6d567fa83386682e17ba30a0fcbb85a31', 'm/hof/index.html': '2167b9a1a77947bd8e0bdec86478993172abc1556495b8eff1ceb34edceb8330'}
          for path,expected_hash in expected.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              print(path,actual)
              if actual != expected_hash:
                  raise SystemExit(f"hash mismatch for {path}: expected {expected_hash}, got {actual}")
          PY
          node --check hof/js/hall-render.js
          grep -q 'profile_power_icon_pc.png' hof/js/hall-render.js
          ! grep -q '>PVE 전투력<' hof/js/hall-render.js
          ! grep -q '>PVP 전투력<' hof/js/hall-render.js
      - name: Commit verified HOF files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hof/index.html m/hof/index.html hof/css/hall.css hof/js/hall-render.js
          git commit -m "fix: 명예의 전당 전투력 카드 정보 배치 정리"
          git push origin HEAD:fix/hof-power-card-official-icons-20260802
