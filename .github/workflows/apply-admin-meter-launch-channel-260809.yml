name: Apply Meter admin launch channel

'on':
  push:
    branches:
      - feature/admin-meter-launch-channel-260809
    paths:
      - '.github/workflows/apply-admin-meter-launch-channel-260809.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply deterministic WEB patch
        run: python scripts/apply-admin-meter-launch-channel-260809.py
      - name: Validate JavaScript syntax
        run: |
          node --check admin/js/admin-system.js
          node --check admin/js/admin-bootstrap.js
          node --check core/kinojo-supabase-features.js
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'losnah513'
          git config user.email 'losnah513@gmail.com'
          git add admin/index.html m/admin/index.html admin/js/admin-system.js admin/js/admin-bootstrap.js core/kinojo-supabase-features.js
          git diff --cached --check
          git commit -m 'feat: add channel-specific Meter launch controls'
          git push origin HEAD:feature/admin-meter-launch-channel-260809
