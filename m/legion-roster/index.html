<body class="kinojo-page-legion-roster kinojo-page-mobile">

  <section class="hof-filter-bar kinojo-standard-subbar roster-subbar" aria-label="명부 보기 및 캐릭터 추가">
    <div class="roster-subbar-inner">
    <label class="kinojo-filter-switch"><span id="rosterScopeLabel">레기온별</span><input id="rosterScope" type="checkbox" aria-label="전체 레기온 명부 보기"/><span class="kinojo-filter-switch-track" aria-hidden="true"><span class="kinojo-filter-switch-knob"></span></span></label>
    <div class="legion-tree-subbar-fields">
      <input class="kinojo-input legion-tree-subbar-field" id="legionTreeMainName" type="text" maxlength="180" placeholder="본캐이름[서버]" autocomplete="off" aria-label="본캐 이름과 서버" aria-describedby="legionTreeStatus"/>
      <input class="kinojo-input legion-tree-subbar-field" id="legionTreeAltName" type="text" maxlength="180" placeholder="부캐이름[서버]" autocomplete="off" aria-label="부캐 이름과 서버" aria-describedby="legionTreeStatus"/>
    </div>
    <div class="legion-tree-subbar-actions"><button class="kinojo-btn" id="legionTreeSearchBtn" type="button" disabled>조회</button></div>
    <div class="legion-tree-subbar-feedback">
      <span class="legion-tree-subbar-status" id="legionTreeStatus" aria-live="polite"></span>
      <ol class="legion-tree-add-progress" id="legionTreeAddProgress" aria-label="캐릭터 추가 진행 상태" aria-busy="false" hidden></ol>
    </div>
    </div>
  </section>
  <section class="legion-tree-search-results" id="legionTreeSearchResults" role="dialog" aria-modal="false" aria-label="캐릭터 조회 결과" hidden>
    <div class="legion-tree-search-groups">
      <section aria-labelledby="legionTreeMainResultsTitle"><h2 id="legionTreeMainResultsTitle">본캐 후보</h2><div class="legion-tree-search-cards" id="legionTreeMainResults"></div></section>
      <section id="legionTreeAltResultsGroup" aria-labelledby="legionTreeAltResultsTitle" hidden><h2 id="legionTreeAltResultsTitle">부캐 후보</h2><div class="legion-tree-search-cards" id="legionTreeAltResults"></div></section>
    </div>
    <div class="legion-tree-search-actions">
      <button class="kinojo-btn" id="legionTreeAddBtn" type="button" disabled>추가</button>
      <button class="kinojo-btn secondary" id="legionTreeSearchCloseBtn" type="button">닫기</button>
      <button class="kinojo-btn secondary" id="legionTreeResetBtn" type="button">초기화</button>
    </div>
  </section>

  <main class="roster-wrap kinojo-pc-banner-host kinojo-pc-standard-host">
    <aside class="kinojo-pc-banner-slot is-left" data-kinojo-pc-banner aria-hidden="true"></aside>
    <aside class="kinojo-pc-banner-slot is-right" data-kinojo-pc-banner aria-hidden="true"></aside>
    <section class="roster-viewer" aria-label="레기온 명부">
      <header class="roster-heading">
        <button class="roster-legion-nav" id="rosterPrev" aria-label="이전 레기온" type="button"><span aria-hidden="true">‹</span><span id="rosterPrevName">키나노동조합</span></button>
        <h1 id="rosterTitle">깡</h1>
        <button class="roster-legion-nav" id="rosterNext" aria-label="다음 레기온" type="button"><span id="rosterNextName">낮</span><span aria-hidden="true">›</span></button>
      </header>
      <div class="roster-body" id="rosterBody">
        <section class="roster-selector" id="rosterSelector" aria-label="캐릭터 명단 선택">
          <form class="roster-search" id="rosterSearch"><input class="kinojo-input" id="rosterName" placeholder="캐릭터 이름 조회" aria-label="캐릭터 이름 조회" autocomplete="off" maxlength="80"/><button class="kinojo-btn" type="submit">조회</button></form><div class="roster-results" id="rosterResults" aria-label="예시 카드 조회 결과"></div>
          <div class="roster-wheel-window"><div class="roster-wheel" id="rosterWheel" role="listbox" aria-label="캐릭터 명단" tabindex="0"></div></div>
          <p class="roster-status" id="rosterStatus" role="status">명단을 위아래로 넘겨 보세요.</p>
        </section>
        <section class="roster-detail" id="rosterDetail" aria-hidden="true" inert aria-label="선택 캐릭터의 본캐와 부캐">
          <div class="roster-detail-heading"><button type="button" id="rosterBack" class="roster-back">‹ 목록</button><span>선택 캐릭터</span><strong id="rosterSelected"></strong></div>
          <div class="roster-family" id="rosterFamily"></div>
          <p class="roster-detail-note" id="rosterDetailNote" role="status"></p>
        </section>
      </div>
    </section>
  </main>
