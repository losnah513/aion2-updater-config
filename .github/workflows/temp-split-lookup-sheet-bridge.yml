name: TEMP split lookup sheet bridge

on:
  push:
    branches:
      - agent/split-lookup-sheet-bridge-20260816

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore split bridge patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bridge-payload/part-* > /tmp/bridge-payload.b64
          base64 --decode /tmp/bridge-payload.b64 > /tmp/bridge-payload.tar.gz
          echo "fe758ccbcb81d65ec97f5c41972ee428b922fc91eae628b07ed3d0ab45136468  /tmp/bridge-payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/bridge-payload.tar.gz -C .

          python3 <<'PY'
          from pathlib import Path
          import re

          pages = [
              'home.html', 'm/index.html',
              'hof/index.html', 'm/hof/index.html',
              'ranking/index.html', 'm/ranking/index.html',
              'sanctuary/index.html', 'm/sanctuary/index.html',
              'sanctuary-schedule/index.html', 'm/sanctuary-schedule/index.html',
              'meter/index.html', 'm/meter/index.html',
              'arcana/index.html', 'm/arcana/index.html',
              'admin/index.html', 'm/admin/index.html',
          ]
          pattern = re.compile(r'kinojo-supabase-features\.js\?cache=\d+')
          new = 'kinojo-supabase-features.js?cache=2026081603'
          for value in pages:
              path = Path(value)
              text = path.read_text(encoding='utf-8')
              replaced, count = pattern.subn(new, text)
              if count != 1:
                  raise SystemExit(f'{value}: feature cache include count={count}, expected=1')
              path.write_text(replaced, encoding='utf-8', newline='\n')
          PY

          rm -rf .bridge-payload
          rm -f .github/workflows/temp-split-lookup-sheet-bridge.yml

      - name: Verify source and live Edge boundaries
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          node --check core/kinojo-supabase-features.js
          node --check tests/web-shell-auth-contract.test.js
          node tests/web-shell-auth-contract.test.js
          node tests/sanctuary-waitlist-contract.test.js
          git diff --check

      - name: Commit final bridge split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md core/kinojo-supabase-features.js tests/web-shell-auth-contract.test.js \
            home.html m/index.html hof/index.html m/hof/index.html \
            ranking/index.html m/ranking/index.html \
            sanctuary/index.html m/sanctuary/index.html \
            sanctuary-schedule/index.html m/sanctuary-schedule/index.html \
            meter/index.html m/meter/index.html arcana/index.html m/arcana/index.html \
            admin/index.html m/admin/index.html
          git add -u .bridge-payload .github/workflows/temp-split-lookup-sheet-bridge.yml
          git commit -m "Split lookup sheet bridge workloads"
          git push origin "HEAD:${GITHUB_REF_NAME}"
