name: Apply admin request notification patch

on:
  push:
    branches:
      - kinojo/admin-request-notifications-20260823

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kinojo/admin-request-notifications-20260823
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact product patch
        shell: bash
        env:
          BRIDGE_B64: 
          TEST_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          auth = Path('core/kinojo-auth-ui.js')
          text = auth.read_text()
          required = [
              'let codeRequestNoticeChecking = false;',
              'let sanctuaryRequestNoticeChecking = false;',
              'if(canManageAccounts(role)) setTimeout(checkPendingCodeRequests, 120);',
              'if(canOpenManage(role)) setTimeout(checkPendingSanctuaryRequests, 240);',
              '  function formatCodeRequestTime(value){',
              '  function accountAdminMarkup_(){',
              '        closeCodeRequestNotice();',
              '  window.KinojoAuth = {',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('auth patch precondition failed: ' + repr(missing))

          text = text.replace('  let codeRequestNoticeChecking = false;\n  let sanctuaryRequestNoticeChecking = false;\n', '')
          text = text.replace('      if(canManageAccounts(role)) setTimeout(checkPendingCodeRequests, 120);\n      if(canOpenManage(role)) setTimeout(checkPendingSanctuaryRequests, 240);\n', '')
          start = text.index('  function formatCodeRequestTime(value){')
          end = text.index('  function accountAdminMarkup_(){', start)
          text = text[:start] + text[end:]
          text = text.replace('        closeCodeRequestNotice();\n', '')

          loader = '''\n\n  function loadAdminNotificationBridge_(){\n    if(document.querySelector('script[data-kinojo-admin-notifications]')) return;\n    const authScript=Array.from(document.scripts).reverse().find(script=>/\\/core\\/kinojo-auth-ui\\.js(?:[?#]|$)/.test(String(script.src||'')));\n    if(!authScript?.src) return;\n    const bridge=document.createElement('script');\n    bridge.dataset.kinojoAdminNotifications='1';\n    bridge.src=new URL('../ui/kinojo-admin-notifications.js?cache=2026082301',authScript.src).toString();\n    bridge.defer=true;\n    document.head.appendChild(bridge);\n  }\n'''
          text = text.replace('  window.KinojoAuth = {\n', loader + '\n  window.KinojoAuth = {\n', 1)
          text = text.replace("  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);\n", "  loadAdminNotificationBridge_();\n  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);\n", 1)
          auth.write_text(text)

          Path('ui/kinojo-admin-notifications.js').write_bytes(base64.b64decode(__import__('os').environ['BRIDGE_B64']))
          Path('tests/admin-notification-contract.test.js').write_bytes(base64.b64decode(__import__('os').environ['TEST_B64']))

          old = 'kinojo-auth-ui.js?cache=2026081801'
          new = 'kinojo-auth-ui.js?cache=2026082301'
          changed=[]
          for page in Path('.').rglob('*.html'):
              page_text=page.read_text()
              if old in page_text:
                  page.write_text(page_text.replace(old,new))
                  changed.append(page.as_posix())
          if not changed:
              raise SystemExit('no HTML auth cache references updated')
          test_path=Path('tests/web-shell-auth-contract.test.js')
          test_text=test_path.read_text()
          if old not in test_text:
              raise SystemExit('web shell cache contract precondition failed')
          test_path.write_text(test_text.replace(old,new))
          print('updated HTML cache references:', len(changed))
          print('\n'.join(changed))
          PY
      - name: Verify patch
        shell: bash
        run: |
          node --check core/kinojo-auth-ui.js
          node --check ui/kinojo-admin-notifications.js
          node tests/admin-notification-contract.test.js
          node tests/web-shell-auth-contract.test.js
          if grep -R --include='*.html' -n 'kinojo-auth-ui.js?cache=2026081801' .; then
            echo 'stale auth cache reference remains'
            exit 1
          fi
          git diff --check
      - name: Commit product changes and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-admin-request-notification-patch.yml
          git add core/kinojo-auth-ui.js ui/kinojo-admin-notifications.js tests/admin-notification-contract.test.js tests/web-shell-auth-contract.test.js '*.html' 'm/**/*.html' '**/*.html'
          git add -u
          git commit -m 'Unify administrator request notifications'
          git push origin HEAD:kinojo/admin-request-notifications-20260823
