name: Run character modal stage1 source restore

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  restore-stage1:
    if: github.event.pull_request.head.ref == 'feature/character-modal-stage1-305'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/character-modal-stage1-305
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip when staged source is already restored
        id: staged
        run: |
          if [ -d .kinojo-stage1 ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore staged source files
        if: steps.staged.outputs.exists == 'true'
        shell: python
        run: |
          import base64
          import gzip
          import shutil
          from pathlib import Path

          files = {
              '.kinojo-stage1/kinojo-character-reaction.js.gz': 'ui/kinojo-character-reaction.js',
              '.kinojo-stage1/kinojo-character-reaction.css.gz': 'ui/kinojo-character-reaction.css',
              '.kinojo-stage1/hof-index.html.gz': 'hof/index.html',
              '.kinojo-stage1/m-hof-index.html.gz': 'm/hof/index.html',
              '.kinojo-stage1/ranking-index.html.gz': 'ranking/index.html',
              '.kinojo-stage1/m-ranking-index.html.gz': 'm/ranking/index.html',
              '.kinojo-stage1/sanctuary-index.html.gz': 'sanctuary/index.html',
              '.kinojo-stage1/m-sanctuary-index.html.gz': 'm/sanctuary/index.html',
          }
          for source, target in files.items():
              encoded = Path(source).read_text(encoding='utf-8').strip()
              Path(target).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          shutil.rmtree('.kinojo-stage1')
          Path('.github/workflows/apply-character-modal-stage1.yml').unlink(missing_ok=True)
      - name: Verify JavaScript and cache versions
        if: steps.staged.outputs.exists == 'true'
        run: |
          node --check ui/kinojo-character-reaction.js
          for f in hof/index.html m/hof/index.html ranking/index.html m/ranking/index.html sanctuary/index.html m/sanctuary/index.html; do
            grep -q 'kinojo-character-reaction.css?cache=2026080304' "$f"
            grep -q 'kinojo-character-reaction.js?cache=2026080304' "$f"
          done
          ! grep -q 'data-kinojo-character-tab="stats"' ui/kinojo-character-reaction.js
          grep -q 'kinojo-character-skill-icon' ui/kinojo-character-reaction.js
      - name: Commit stage1 source to feature branch
        if: steps.staged.outputs.exists == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: redesign character modal stats and skills stage1'
          git push origin HEAD:feature/character-modal-stage1-305
