name: tmp-fix-character-detail-loop-3022

on:
  push:
    branches:
      - fix/character-detail-modal-loop-3022

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-detail-modal-loop-3022
          fetch-depth: 0

      - name: Patch modal completion handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('ui/kinojo-character-detail-refresh.js')
          text = js_path.read_text(encoding='utf-8')

          old_version = "const API_VERSION = '302.1';"
          new_version = "const API_VERSION = '302.2';"
          if old_version not in text:
              raise SystemExit('API version marker not found')
          text = text.replace(old_version, new_version, 1)

          old_block = """    if(isTerminal(job) && job.id && state.lastTerminalJobId!==String(job.id)){
              state.lastTerminalJobId=String(job.id);
              if(job.status==='completed' || job.status==='partial_failed') refreshOpenModal();
            }
          """
          new_block = """    if(isTerminal(job) && job.id){
              // 완료 상태는 현재 모달에서 그대로 표시한다.
              // 강제 닫기/재열기는 동일 완료 작업을 반복 감지해 무한 재오픈을 일으킬 수 있다.
              state.lastTerminalJobId=String(job.id);
            }
          """
          if old_block not in text:
              raise SystemExit('terminal refresh block not found')
          text = text.replace(old_block, new_block, 1)
          js_path.write_text(text, encoding='utf-8')

          pages = [
              Path('hof/index.html'), Path('m/hof/index.html'),
              Path('ranking/index.html'), Path('m/ranking/index.html'),
              Path('sanctuary/index.html'), Path('m/sanctuary/index.html'),
          ]
          old_cache = 'kinojo-character-detail-refresh.js?cache=2026080301'
          new_cache = 'kinojo-character-detail-refresh.js?cache=2026080302'
          for page in pages:
              html = page.read_text(encoding='utf-8')
              if old_cache not in html:
                  raise SystemExit(f'cache marker not found: {page}')
              page.write_text(html.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

      - name: Validate fix
        shell: bash
        run: |
          node --check ui/kinojo-character-detail-refresh.js
          test "$(grep -R "kinojo-character-detail-refresh.js?cache=2026080302" -l hof/index.html m/hof/index.html ranking/index.html m/ranking/index.html sanctuary/index.html m/sanctuary/index.html | wc -l)" -eq 6
          ! grep -F "if(job.status==='completed' || job.status==='partial_failed') refreshOpenModal();" ui/kinojo-character-detail-refresh.js

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-character-detail-loop-3022.yml
          git config user.name kinojo-bot
          git config user.email kinojo-bot@users.noreply.github.com
          git add ui/kinojo-character-detail-refresh.js hof/index.html m/hof/index.html ranking/index.html m/ranking/index.html sanctuary/index.html m/sanctuary/index.html .github/workflows/tmp-fix-character-detail-loop-3022.yml
          git commit -m "fix: stop character detail modal reopen loop"
          git push origin HEAD:fix/character-detail-modal-loop-3022
