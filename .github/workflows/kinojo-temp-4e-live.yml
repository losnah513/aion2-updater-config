name: KINOJO temporary 4-E live readback

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.issue.title == 'KINOJO_MY_INFO_4E_LIVE_20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify Stage 4-E source and live bytes
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          node --check ui/kinojo-common-ui.js
          grep -q "profile-upload-prepare" ui/kinojo-common-ui.js
          grep -q "profile-upload-complete" ui/kinojo-common-ui.js
          grep -q "method:'PUT'" ui/kinojo-common-ui.js
          grep -q "body.append('cacheControl','3600')" ui/kinojo-common-ui.js
          grep -q "'x-upsert':'false'" ui/kinojo-common-ui.js
          grep -q "kinojoMyInfoProfileUploadBtn" ui/kinojo-common-ui.js
          ! grep -q "SUPABASE_SERVICE_ROLE_KEY" ui/kinojo-common-ui.js
          expected='ef13ae40101a40215c43c1208d7cb124052d6586'
          test "$(git hash-object ui/kinojo-common-ui.js)" = "$expected"
          ok=0
          for attempt in $(seq 1 18); do
            stamp="${{ github.run_id }}-${attempt}"
            if curl -fsSL --retry 2 --connect-timeout 10 "https://kinojo.info/ui/kinojo-common-ui.js?kinojo4e=${stamp}" -o /tmp/live.js; then
              live="$(git hash-object /tmp/live.js)"
              echo "attempt=${attempt} js=${live}"
              if [ "$live" = "$expected" ]; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1
          mkdir -p .kinojo-live
          printf 'PASS\nrun_id=%s\njs=%s\n' '${{ github.run_id }}' "$live" > .kinojo-live/4e.txt
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add .kinojo-live/4e.txt
          git commit -m "Record Stage 4-E live readback"
          git push origin HEAD:main
