name: Temporary PASS KEY 1-C-6 roster sheet session

on:
  push:
    branches:
      - agent/passkey-1c6-roster-sheet-session

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/passkey-1c6-roster-sheet-session
      - name: Patch roster and sheet session routing
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('core/kinojo-supabase-features.js')
          text=p.read_text(encoding='utf-8')

          start=text.index('  async function sanctuaryRosterAction(')
          end=text.index('\n\n\n  function getClientId', start)
          seg=text[start:end]
          if seg.count('const passKey=currentPassKey();') != 1 or seg.count('      passKey,') != 1:
              raise SystemExit('roster credential anchor mismatch')
          seg=seg.replace('const passKey=currentPassKey();','const sessionToken=currentServerSessionCredential();',1)
          seg=seg.replace('if(!passKey) throw new Error', 'if(!sessionToken) throw new Error',1)
          seg=seg.replace('      passKey,','      passKey:sessionToken,',1)
          text=text[:start]+seg+text[end:]

          start=text.index('  async function adminSanctuarySheetSync(')
          end=text.index('\n\n  async function adminSanctuaryProfileDiagnostic(', start)
          seg=text[start:end]
          if seg.count('const passKey=currentPassKey();') != 1 or seg.count('p_pass_key:passKey') != 1 or seg.count('passKey,') != 2:
              raise SystemExit('sheet sync credential anchor mismatch')
          seg=seg.replace('const passKey=currentPassKey();','const sessionToken=currentAdminSessionCredential();',1)
          seg=seg.replace('p_pass_key:passKey','p_pass_key:sessionToken',1)
          seg=seg.replace('passKey,','sessionToken,')
          text=text[:start]+seg+text[end:]
          p.write_text(text,encoding='utf-8',newline='')

          cache_files=[
            'admin/index.html','m/admin/index.html',
            'sanctuary/index.html','m/sanctuary/index.html',
            'sanctuary-schedule/index.html','m/sanctuary-schedule/index.html'
          ]
          for name in cache_files:
              path=Path(name); src=path.read_text(encoding='utf-8')
              old='kinojo-supabase-features.js?cache=2026081705'; new='kinojo-supabase-features.js?cache=2026081706'
              if src.count(old) != 1: raise SystemExit(f'{name}: cache anchor {src.count(old)}')
              path.write_text(src.replace(old,new,1),encoding='utf-8',newline='')

          for name in ['tests/sanctuary-waitlist-contract.test.js','tests/meter-presence-log-contract.test.js']:
              path=Path(name); src=path.read_text(encoding='utf-8')
              old='kinojo-supabase-features.js?cache=2026081705'; new='kinojo-supabase-features.js?cache=2026081706'
              if src.count(old) != 1: raise SystemExit(f'{name}: test cache anchor {src.count(old)}')
              path.write_text(src.replace(old,new,1),encoding='utf-8',newline='')
          PY
          node --check core/kinojo-supabase-features.js
          node tests/sanctuary-waitlist-contract.test.js
          node tests/meter-presence-log-contract.test.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/kinojo-supabase-features.js admin/index.html m/admin/index.html sanctuary/index.html m/sanctuary/index.html sanctuary-schedule/index.html m/sanctuary-schedule/index.html tests/sanctuary-waitlist-contract.test.js tests/meter-presence-log-contract.test.js
          git commit -m 'PASS KEY 1-C-6: route roster and sheet sync through server session'
          git push origin HEAD:agent/passkey-1c6-roster-sheet-session
