name: Run My Info Page Center Fix

on:
  push:
    branches: [main]
    paths:
      - "ui/.my-info-page-center-trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move My Info modal to page center
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          js_path = Path('ui/kinojo-common-ui.js')
          css_path = Path('ui/kinojo-my-info.css')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          for token in ['id="kinojoMyInfoMenuBtn"','id="kinojoMyInfoProfileView"','function activateMyInfoView_',"activateMyInfoView_('profile')"]:
              if token not in js:
                  raise SystemExit(f'expected current JS contract missing: {token}')
          if '#kinojoMyInfoMenuBtn:focus + #kinojoMyInfoProfileView' not in css:
              raise SystemExit('expected current in-panel modal CSS contract missing')

          js = js.replace('    if(!loggedIn)closeMyInfoPanel();','    if(!loggedIn){closeMyInfoPanel();closeMyInfoModal();}',1)

          panel = re.compile(
              r'''          <button class="kinojo-my-info-menu-btn is-active" id="kinojoMyInfoMenuBtn".*?</button>\n'''
              r'''          <section class="kinojo-my-info-view is-active" id="kinojoMyInfoProfileView".*?</section>\n''',
              re.S,
          )
          button = '''          <button class="kinojo-my-info-menu-btn" id="kinojoMyInfoMenuBtn" type="button" aria-haspopup="dialog" aria-controls="kinojoMyInfoModal">\n            <span>내 정보</span><small>이미지 관리 Preview</small>\n          </button>\n'''
          js,n = panel.subn(button,js,count=1)
          if n != 1: raise SystemExit(f'panel profile replacement={n}')

          activation = re.compile(r'''  function activateMyInfoView_\(target\)\{.*?\n  \}\n  function openMyInfoPanel\(\)\{''',re.S)
          modal = '''  function makeMyInfoModal(){
    const modal=document.createElement('section');
    modal.className='kinojo-my-info-modal';
    modal.id='kinojoMyInfoModal';
    modal.setAttribute('aria-hidden','true');
    modal.innerHTML=`
      <div class="kinojo-my-info-modal-backdrop" data-kinojo-my-info-modal-close></div>
      <div class="kinojo-my-info-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="kinojoMyInfoModalTitle" tabindex="-1">
        <button class="kinojo-my-info-modal-close" type="button" aria-label="내 정보 닫기" data-kinojo-my-info-modal-close>×</button>
        <div class="kinojo-my-info-preview-state">
          <span class="kinojo-my-info-preview-badge">PREVIEW</span>
          <strong id="kinojoMyInfoModalTitle">내 정보</strong>
          <p>프로필·캐릭터 이미지 관리 화면을 준비 중입니다.</p>
        </div>
      </div>`;
    document.body.appendChild(modal);
  }
  function openMyInfoModal(){
    const modal=q('#kinojoMyInfoModal');
    if(!modal||!window.KinojoAuth?.getSession?.())return;
    closeMyInfoPanel();
    const show=()=>{
      if(!window.KinojoAuth?.getSession?.())return;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden','false');
      document.body.classList.add('kinojo-my-info-modal-open');
      const dialog=q('.kinojo-my-info-modal-dialog',modal);
      if(dialog)dialog.scrollTop=0;
      requestAnimationFrame(()=>{try{dialog?.focus({preventScroll:true});}catch(_err){dialog?.focus();}});
    };
    if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)show();
    else setTimeout(show,300);
  }
  function closeMyInfoModal(){
    const modal=q('#kinojoMyInfoModal');
    if(modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');}
    document.body.classList.remove('kinojo-my-info-modal-open');
  }
  function openMyInfoPanel(){'''
          js,n = activation.subn(modal,js,count=1)
          if n != 1: raise SystemExit(f'activation replacement={n}')
          js = js.replace("    activateMyInfoView_('profile');\n",'',1)

          old = "    q('#kinojoMyInfoMenuBtn')?.addEventListener('click',e=>{e.preventDefault();activateMyInfoView_(e.currentTarget.dataset.myInfoTarget);});"
          new = "    q('#kinojoMyInfoMenuBtn')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openMyInfoModal();});\n    q('#kinojoMyInfoModal')?.addEventListener('click',e=>{if(e.target instanceof Element&&e.target.closest('[data-kinojo-my-info-modal-close]')){e.preventDefault();e.stopPropagation();closeMyInfoModal();}});"
          if old not in js: raise SystemExit('menu binding missing')
          js = js.replace(old,new,1)

          old = "    document.addEventListener('keydown',e=>{if(e.key==='Escape'){const myInfo=q('#kinojoMyInfoLayer');if(myInfo?.classList.contains('open'))return closeMyInfoPanel();const p=q('#drawerPagePanel');if(p?.classList.contains('open'))return closeDrawerPagePanel();const d=q('#sideDrawer');if(d?.classList.contains('open'))return closeSideDrawer();}});"
          new = "    document.addEventListener('keydown',e=>{if(e.key==='Escape'){const myInfoModal=q('#kinojoMyInfoModal');if(myInfoModal?.classList.contains('open'))return closeMyInfoModal();const myInfo=q('#kinojoMyInfoLayer');if(myInfo?.classList.contains('open'))return closeMyInfoPanel();const p=q('#drawerPagePanel');if(p?.classList.contains('open'))return closeDrawerPagePanel();const d=q('#sideDrawer');if(d?.classList.contains('open'))return closeSideDrawer();}});"
          if old not in js: raise SystemExit('escape binding missing')
          js = js.replace(old,new,1)

          if '  makeDrawer(info);\n  makeMyInfoPanel();\n' not in js: raise SystemExit('init contract missing')
          js = js.replace('  makeDrawer(info);\n  makeMyInfoPanel();\n','  makeDrawer(info);\n  makeMyInfoPanel();\n  makeMyInfoModal();\n',1)
          js = js.replace(".admin-panel-modal';",".admin-panel-modal,.kinojo-my-info-modal';",1)
          js = js.replace('openMyInfoPanel,closeMyInfoPanel,toggleAdminMenu','openMyInfoPanel,closeMyInfoPanel,openMyInfoModal,closeMyInfoModal,toggleAdminMenu',1)

          if 'kinojoMyInfoProfileView' in js or 'activateMyInfoView_' in js: raise SystemExit('legacy in-panel profile view remains')
          if "closeMyInfoPanel();\n    const show=()=>" not in js: raise SystemExit('panel-close-before-page-modal contract missing')
          if 'document.body.appendChild(modal);' not in js: raise SystemExit('body modal append missing')

          marker='/* 20260819_05: 1-F layout correction'
          if marker not in css: raise SystemExit('old layout marker missing')
          css=css[:css.index(marker)].rstrip()
          css=css.replace('/* KINOJO My Info panel shell v20260819.03 */','/* KINOJO My Info panel shell v20260819.04 */',1)
          css += '''\n\n/* 20260819_06: 1-F layout correction 2 — page-centered body-level modal */
body.kinojo-my-info-modal-open{overflow:hidden}
.kinojo-my-info-modal{
  position:fixed!important;
  inset:0!important;
  z-index:12000!important;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  box-sizing:border-box;
  background:rgba(15,23,42,.34);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.kinojo-my-info-modal.open{display:flex}
.kinojo-my-info-modal-backdrop{position:absolute;inset:0}
.kinojo-my-info-modal-dialog{
  position:relative;
  z-index:1;
  width:min(760px,calc(100vw - 36px));
  max-height:calc(100vh - 32px);
  max-height:calc(100dvh - 32px);
  overflow-y:auto;
  overscroll-behavior-y:auto;
  padding:26px 28px 30px;
  border:1px solid rgba(148,163,184,.3);
  border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.99),rgba(248,250,252,.99));
  box-shadow:0 24px 64px rgba(15,23,42,.22);
  color:#0f172a;
  box-sizing:border-box;
  outline:none;
}
.kinojo-my-info-modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:999px;background:rgba(15,23,42,.07);color:#334155;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:5}
.kinojo-my-info-modal-close:hover{background:rgba(15,23,42,.12)}
.kinojo-my-info-modal .kinojo-my-info-preview-state{margin:0;padding-top:18px}
@media(max-width:640px){
  .kinojo-my-info-modal{padding:12px}
  .kinojo-my-info-modal-dialog{width:min(430px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);padding:20px;border-radius:22px}
  .kinojo-my-info-modal-close{top:11px;right:11px;width:32px;height:32px;font-size:20px}
}
@media(max-width:370px){.kinojo-my-info-modal-dialog{padding:18px 16px}}
'''
          if '#kinojoMyInfoMenuBtn:focus + #kinojoMyInfoProfileView' in css: raise SystemExit('legacy panel modal CSS remains')
          if css.count('{') != css.count('}'): raise SystemExit('CSS brace mismatch')

          js_path.write_text(js,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY

          node --check ui/kinojo-common-ui.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          js=Path('ui/kinojo-common-ui.js').read_text(encoding='utf-8')
          css=Path('ui/kinojo-my-info.css').read_text(encoding='utf-8')
          assert 'kinojoMyInfoProfileView' not in js
          assert "closeMyInfoPanel();\n    const show=()=>" in js
          assert 'document.body.appendChild(modal);' in js
          assert '.kinojo-my-info-modal{\n  position:fixed!important;\n  inset:0!important;' in css
          print('My Info body-level page center: PASS')
          PY

      - name: Commit final source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f ui/.my-info-page-center-trigger .github/workflows/fix-my-info-page-center.yml .github/workflows/run-my-info-page-center.yml
          git config user.name "losnah513"
          git config user.email "losnah513@gmail.com"
          git add ui/kinojo-common-ui.js ui/kinojo-my-info.css
          git add -u ui/.my-info-page-center-trigger .github/workflows/fix-my-info-page-center.yml .github/workflows/run-my-info-page-center.yml || true
          git commit -m "Center My Info modal on page"
          git push origin main
