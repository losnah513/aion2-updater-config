<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcana Skill Simulator ARC-0.1.00</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/simulator.css" />
  <link rel="stylesheet" href="css/modal.css" />
</head>
<body>
  <div class="arcana-page">
    <header class="arcana-header">
      <div>
        <p class="arcana-eyebrow">ARCANA SIMULATOR</p>
        <h1>아르카나 스킬 시뮬레이터</h1>
        <p class="arcana-subtitle">20레벨 목표 스킬과 보유 옵션을 한 화면에서 정리합니다.</p>
      </div>
      <div class="arcana-header-tools">
        <label class="arcana-class-select">
          <span>직업</span>
          <select id="arcanaClassSelect"></select>
        </label>
        <div class="arcana-version">ARC-0.1.00</div>
      </div>
    </header>

    <main class="arcana-layout">
      <div class="arcana-top-grid">
        <section class="arcana-panel arcana-target-panel" data-panel-key="targetSkills">
          <div class="arcana-panel-title">
            <h2>20레벨 목표 스킬 선택</h2>
            <span id="arcanaTargetCountText">총 7개 선택 가능 / 선택 중 0개</span>
          </div>
          <div id="arcanaTargetSkillList" class="arcana-skill-grid arcana-skill-grid-two"></div>
        </section>

        <section class="arcana-panel arcana-character-panel" data-panel-key="characterLevels">
          <div class="arcana-panel-title">
            <h2>현재 캐릭터 스킬 레벨</h2>
            <span>직접 입력 후 저장</span>
          </div>
          <div id="arcanaCharacterSkillEditor" class="arcana-level-grid"></div>
          <div class="arcana-panel-message" data-message-for="characterLevels"></div>
          <div class="arcana-actions arcana-actions-right">
            <button id="arcanaSaveCharacterLevels" class="arcana-btn arcana-btn-primary">스킬레벨 저장</button>
            <button id="arcanaClearCharacterLevels" class="arcana-btn arcana-btn-ghost">초기화</button>
          </div>
        </section>
      </div>

      <section class="arcana-panel arcana-equipment-panel" data-panel-key="equipmentOptions">
        <div class="arcana-panel-title arcana-panel-title-compact">
          <h2>장비 스킬 옵션</h2>
          <span>스킬레벨 1 고정 / 같은 장비 안 중복 불가</span>
        </div>
        <div class="arcana-equipment-toggle-row" id="arcanaEquipmentToggleRow"></div>
        <div id="arcanaEquipmentEditor" class="arcana-equipment-list"></div>
        <div class="arcana-panel-message" data-message-for="equipmentOptions"></div>
        <div class="arcana-actions arcana-actions-right">
          <button id="arcanaSaveEquipment" class="arcana-btn arcana-btn-primary">장비 옵션 저장</button>
          <button id="arcanaClearEquipment" class="arcana-btn arcana-btn-ghost">초기화</button>
        </div>
      </section>

      <section class="arcana-panel arcana-editor-panel" data-panel-key="arcanaCards">
        <div class="arcana-panel-title arcana-panel-title-compact">
          <h2>아르카나 카드 옵션</h2>
          <span>현재 아르카나 / 추천 아르카나 비교</span>
        </div>
        <div id="arcanaCardCompare" class="arcana-arcana-columns"></div>
        <div class="arcana-panel-message" data-message-for="arcanaCards"></div>
        <div class="arcana-actions arcana-actions-right">
          <button id="arcanaSaveOwnedCards" class="arcana-btn arcana-btn-primary">보유 아르카나 저장</button>
          <button id="arcanaClearOwnedCards" class="arcana-btn arcana-btn-ghost">초기화</button>
          <button id="arcanaRunSimulation" class="arcana-btn arcana-btn-primary">추천 계산</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/state.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/panelLock.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/recommendation.js"></script>
  <script src="js/cardEditor.js"></script>
  <script src="js/characterEditor.js"></script>
  <script src="js/equipmentEditor.js"></script>
  <script src="js/skillSelector.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
